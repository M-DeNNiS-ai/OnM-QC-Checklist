  try{ const ok=kind==='xlsx'?await exportExcel():await exportReport(); if(ok) $('#modal-root').innerHTML=''; }
  catch(e){ console.error(e); err.textContent=e.message||'The download could not be prepared.'; }
  finally{ if(btn.isConnected){ btn.innerHTML=old; document.querySelectorAll('.export-opt').forEach(b=>b.disabled=false); } }
}
/* =====================================================================
   BACKGROUND — LiFePO4 scene: olivine lattice (FeO6 octahedra, PO4
   tetrahedra) with Li+ ions hopping along the 1-D b-axis channels, and
   prismatic / cylindrical LFP cells drifting at the edges. Drawn on one
   canvas at ≤30 fps, paused when hidden, static for reduced motion.
   ===================================================================== */
function bgMotionOn(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return lsRead('bqc_motion',null)===1;
  return lsRead('bqc_motion',1)!==0;
}
const BG = (()=>{
  const TW=232, TH=168;             // lattice tile (CSS px)
  const CH=[42,126];                // Li channel rows inside a tile
  const SITE=29;                    // Li site spacing along a channel
  let cv, cx, dpr=1, W=0, H=0, tile=null, ion=null, col={}, raf=0, last=0, t0=performance.now(), ions=[], cells=[], running=false;

  function readCols(){
    const cs=getComputedStyle(document.documentElement), g=n=>cs.getPropertyValue(n).trim();
    const dark=matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.getAttribute('data-theme')!=='light'||document.documentElement.getAttribute('data-theme')==='dark';
    col={a:g('--accent')||'#1d6ff2', b:g('--accent-2')||'#0aa5b8', bg:g('--bg')||'#eef3f9', dark};
  }
  function rgba(c,a){ // accepts #rgb/#rrggbb
    let h=c.replace('#',''); if(h.length===3) h=h.split('').map(x=>x+x).join('');
    const n=parseInt(h.slice(0,6),16); if(isNaN(n)) return `rgba(29,111,242,${a})`;
    return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
  }
  function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=Math.ceil(w*dpr); c.height=Math.ceil(h*dpr); const x=c.getContext('2d'); x.scale(dpr,dpr); return [c,x]; }

  // one olivine tile: corner-sharing FeO6 octahedra in zig-zag rows, PO4 tetrahedra bridging them
  function buildTile(){
    const [c,x]=mkCanvas(TW,TH), k=col.dark?1.1:.85;
    const oct=(px,py,r,rot)=>{ x.save(); x.translate(px,py); x.rotate(rot);
      x.beginPath(); x.moveTo(0,-r); x.lineTo(r,0); x.lineTo(0,r); x.lineTo(-r,0); x.closePath();
      x.fillStyle=rgba(col.a,.045*k); x.fill(); x.strokeStyle=rgba(col.a,.16*k); x.lineWidth=1; x.stroke();
      x.beginPath(); x.moveTo(-r,0); x.lineTo(r,0); x.moveTo(0,-r); x.lineTo(0,r); x.strokeStyle=rgba(col.a,.07*k); x.stroke();
      x.beginPath(); x.arc(0,0,1.9,0,7); x.fillStyle=rgba(col.a,.32*k); x.fill(); x.restore(); };
    const tet=(px,py,r,up)=>{ x.save(); x.translate(px,py); if(!up) x.rotate(Math.PI);
      x.beginPath(); x.moveTo(0,-r); x.lineTo(r*.9,r*.6); x.lineTo(-r*.9,r*.6); x.closePath();
      x.fillStyle=rgba(col.b,.05*k); x.fill(); x.strokeStyle=rgba(col.b,.18*k); x.lineWidth=1; x.stroke();
      x.beginPath(); x.moveTo(0,-r); x.lineTo(0,r*.18); x.lineTo(r*.9,r*.6); x.moveTo(0,r*.18); x.lineTo(-r*.9,r*.6); x.strokeStyle=rgba(col.b,.09*k); x.stroke();
      x.restore(); };
    const bond=(a,b)=>{ x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.strokeStyle=rgba(col.a,.07*k); x.lineWidth=1; x.stroke(); };
    // Li channels (dashed guides)
    x.setLineDash([2,6]); x.strokeStyle=rgba(col.b,.12*k);
    CH.forEach(y=>{ x.beginPath(); x.moveTo(0,y); x.lineTo(TW,y); x.stroke(); });
    x.setLineDash([]);
    // Li sites
    CH.forEach(y=>{ for(let px=SITE/2;px<TW;px+=SITE){ x.beginPath(); x.arc(px,y,1.4,0,7); x.fillStyle=rgba(col.b,.18*k); x.fill(); } });
    // octahedra rows (zig-zag) between channels; tetrahedra bridging
    const rows=[[0,1],[84,-1],[168,1]];
    rows.forEach(([y,s])=>{
      for(let i=0;i<=4;i++){
        const px=i*58, py=y+s*10*(i%2?1:-1);
        const nx=(i+1)*58, ny=y+s*10*((i+1)%2?1:-1);
        bond([px,py],[nx,ny]);
        oct(px,py,13,(i%2?.18:-.18));
        const tx=px+29, ty=y+s*(i%2?-17:17)*-1;
        bond([px,py],[tx,ty]); bond([nx,ny],[tx,ty]);
        tet(tx,ty,8.5,(i%2)===(s>0?0:1));
      }
    });
    // tiny formula watermark
    x.font='600 8.5px "IBM Plex Mono",monospace'; x.fillStyle=rgba(col.a,.12*k); x.fillText('LiFePO₄',TW-62,TH/2+4);
    tile=c;
    // ion sprite
    const r=12, [ic,ix]=mkCanvas(r*2,r*2), g=ix.createRadialGradient(r,r,0,r,r,r);
    g.addColorStop(0,rgba(col.b,col.dark?.95:.85)); g.addColorStop(.22,rgba(col.b,col.dark?.55:.42)); g.addColorStop(1,rgba(col.b,0));
    ix.fillStyle=g; ix.fillRect(0,0,r*2,r*2); ion=ic;
  }

  function seed(){
    const rowsN=Math.ceil(H/TH)+2, n=Math.min(70,Math.round(W*H/26000));
    ions=[]; for(let i=0;i<n;i++){
      const tr=Math.floor(Math.random()*rowsN)-1, ch=CH[i%2];
      ions.push({y:tr*TH+ch, site:Math.floor(Math.random()*(W/SITE+8))-4, dir:Math.random()<.62?1:-1, phase:Math.random(), wait:Math.random()*2, speed:1.6+Math.random()*1.8});
    }
    const big=W>700;
    cells=[
      {kind:'prism', x:big?W-210:W-120, y:big?H*.58:H*.68, w:big?150:96, h:big?220:140, r:.06, f:.0, sp:.55},
      {kind:'cyl',   x:big?70:24,       y:big?H*.22:H*.1,  w:big?64:44,  h:big?190:130, r:-.1, f:2.1, sp:.42},
      {kind:'prism', x:big?W*.36:W*.5,  y:H+40,            w:big?120:0,  h:big?170:0,   r:-.04,f:4.2, sp:.35}
    ].filter(c=>c.w>0);
  }

  function rr(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
  function drawCell(c,t){
    const k=col.dark?1.2:1, bob=Math.sin(t*.25*c.sp+c.f)*10, soc=.35+.45*(.5+.5*Math.sin(t*.18+c.f));
    cx.save(); cx.translate(c.x+c.w/2,c.y+bob); cx.rotate(c.r+Math.sin(t*.12+c.f)*.015); cx.translate(-c.w/2,-c.h/2);
    const stroke=rgba(col.a,.20*k), soft=rgba(col.a,.05*k);
    if(c.kind==='prism'){
      // terminals
      [[.2,'−'],[.8,'+']].forEach(([p,s])=>{ rr(cx,c.w*p-9,-9,18,11,3); cx.fillStyle=soft; cx.fill(); cx.strokeStyle=stroke; cx.stroke(); });
      rr(cx,0,0,c.w,c.h,10); cx.fillStyle=rgba(col.a,.035*k); cx.fill(); cx.strokeStyle=stroke; cx.lineWidth=1.2; cx.stroke();
      // state-of-charge fill
      cx.save(); rr(cx,6,6,c.w-12,c.h-12,7); cx.clip();
      const fy=c.h-6-(c.h-12)*soc, g=cx.createLinearGradient(0,fy,0,c.h);
      g.addColorStop(0,rgba(col.b,.16*k)); g.addColorStop(1,rgba(col.a,.05*k)); cx.fillStyle=g; cx.fillRect(0,fy,c.w,c.h);
      cx.beginPath(); for(let i=0;i<=c.w;i+=6) cx.lineTo(i,fy+Math.sin(i*.09+t*1.4)*1.6); cx.strokeStyle=rgba(col.b,.28*k); cx.stroke();
      cx.restore();
      // vent + label
      cx.beginPath(); cx.ellipse(c.w/2,16,12,4.5,0,0,7); cx.strokeStyle=stroke; cx.stroke();
      cx.fillStyle=rgba(col.a,.30*k); cx.font=`700 ${Math.max(8,c.w*.075)}px "IBM Plex Mono",monospace`; cx.textAlign='center';
      cx.fillText('LiFePO₄',c.w/2,c.h*.42); cx.font=`600 ${Math.max(7,c.w*.06)}px "IBM Plex Mono",monospace`; cx.fillStyle=rgba(col.a,.22*k);
      cx.fillText('3.2 V · 280 Ah',c.w/2,c.h*.42+c.w*.1); cx.fillText(Math.round(soc*100)+'% SoC',c.w/2,c.h*.42+c.w*.19);
    } else {
      const rx=c.w/2, ry=c.w*.16;
      cx.fillStyle=rgba(col.a,.035*k); cx.fillRect(0,ry,c.w,c.h-2*ry);
      cx.beginPath(); cx.moveTo(0,ry); cx.lineTo(0,c.h-ry); cx.ellipse(rx,c.h-ry,rx,ry,0,Math.PI,0,true); cx.lineTo(c.w,ry); cx.strokeStyle=stroke; cx.lineWidth=1.2; cx.stroke();
      cx.beginPath(); cx.ellipse(rx,ry,rx,ry,0,0,7); cx.fillStyle=soft; cx.fill(); cx.stroke();
      cx.beginPath(); cx.ellipse(rx,ry-1,rx*.32,ry*.32,0,0,7); cx.stroke();
      // jelly-roll hint + band
      const fy=c.h-ry-(c.h-2*ry)*soc; cx.fillStyle=rgba(col.b,.10*k); cx.fillRect(2,fy,c.w-4,c.h-ry-fy);
      cx.strokeStyle=rgba(col.a,.10*k); for(let i=1;i<4;i++){ cx.beginPath(); cx.moveTo(c.w*i/4,ry*2); cx.lineTo(c.w*i/4,c.h-ry*2); cx.stroke(); }
      cx.save(); cx.translate(rx+4,c.h/2); cx.rotate(-Math.PI/2); cx.fillStyle=rgba(col.a,.28*k); cx.font='700 9px "IBM Plex Mono",monospace'; cx.textAlign='center'; cx.fillText('LFP 32140',0,0); cx.restore();
    }
    cx.restore();
  }

  function frame(now){
    if(!running) return;
    raf=requestAnimationFrame(frame);
    if(now-last<33) return; last=now;
    draw((now-t0)/1000);
  }
  function draw(t){
    cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,W,H);
    const ox=-((t*7)%TW), oy=-((t*2.2)%TH);
    // soft radial mask: lattice strongest toward edges, faint behind content centre
    for(let y=oy-TH;y<H+TH;y+=TH) for(let x=ox-TW;x<W+TW;x+=TW) cx.drawImage(tile,x,y,TW,TH);
    // Li+ hopping: rest on a site, then hop (ease) to the next one
    const shiftX=ox, shiftY=oy;
    for(const p of ions){
      const cyc=p.speed, u=((t/cyc)+p.phase)%1, hop=u>.7?(u-.7)/.3:0, e=hop<.5?2*hop*hop:1-Math.pow(-2*hop+2,2)/2;
      const steps=Math.floor(t/cyc+p.phase);
      let sx=(p.site+p.dir*(steps+e))*SITE+SITE/2;
      const span=(Math.ceil(W/TW)+3)*TW; sx=((sx%span)+span)%span-TW;
      const X=sx+shiftX, Y=p.y+shiftY;
      const yy=((Y%((Math.ceil(H/TH)+2)*TH))+((Math.ceil(H/TH)+2)*TH))%((Math.ceil(H/TH)+2)*TH)-TH;
      if(hop>0){ cx.globalAlpha=.35; cx.drawImage(ion,X-12-p.dir*6,yy-12,24,24); }
      cx.globalAlpha=hop>0?1:.75; cx.drawImage(ion,X-12,yy-12,24,24);
    }
    cx.globalAlpha=1;
    if(W>520||cells.length) for(const c of cells) drawCell(c,t);
    // centre fade so content stays readable
    const g=cx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.15,W/2,H*.45,Math.max(W,H)*.75);
    const bg=col.bg;
    g.addColorStop(0,rgba(bg,col.dark?.55:.6)); g.addColorStop(1,rgba(bg,0));
    cx.fillStyle=g; cx.fillRect(0,0,W,H);
  }
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,1.5);
    W=innerWidth; H=innerHeight; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);

  }
  function setRun(){
    const want=bgMotionOn()&&!document.hidden;
    if(want&&!running){ running=true; last=0; raf=requestAnimationFrame(frame); }
    else if(!want&&running){ running=false; cancelAnimationFrame(raf); draw(4); }
    else if(!want) draw(4);
  }
  return {
    start(){
      cv=document.getElementById('bg'); if(!cv||!cv.getContext) return; cx=cv.getContext('2d');
      readCols(); resize(); setRun();
      let rt=0; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(resize,150); });
      document.addEventListener('visibilitychange',setRun);
      if(window.matchMedia){ const m=matchMedia('(prefers-color-scheme: dark)'); m.addEventListener&&m.addEventListener('change',()=>BG.refresh()); }
    },
    refresh(){ if(!cx) return; requestAnimationFrame(()=>{ readCols(); buildTile(); setRun(); if(!running) draw(4); }); }
  };
})();

function myDay(s){
  const today=todayStr(), me=s.name, out={moved:0,intakes:0,passes:0,capa:0,holds:0,bsa:0};
  S.data.om.forEach(r=>{
    [1,2,3].forEach(k=>{ const st=r['stage'+k]||{}; if((st.completedBy===me||(k===1&&st.technician===me))&&st.completedAt&&dkey(st.completedAt)===today){ out.moved++; if(k===1) out.intakes++; if(k===3&&r.finalDisposition==='PASS'&&dkey(r.closedAt)===today) out.passes++; } });
    (r.capaLog||[]).forEach(c=>{ if(c.returnedBy===me&&dkey(c.returnedAt)===today) out.capa++; });
    [...(r.holdLog||[]),...(r.hold?[r.hold]:[])].forEach(h=>{ if((h.by===me&&dkey(h.since)===today)||(h.releasedBy===me&&dkey(h.releasedAt)===today)) out.holds++; });
  });
  out.bsa=S.data.bsa.filter(c=>dkey(c.updatedAt||c.createdAt)===today&&(c.updatedBy===me||c.flaggedBy===me||c.assignedEngineer===me||s.role==='bsa')).length;

}

  if(t.dataset.phys){ physInput(t); return; }
  if(t.dataset.bind){ setPath(S.f,t.dataset.bind,t.type==='checkbox'?t.checked:t.value); if(S.drawer&&S.drawer.type==='intake') scheduleDraft(); return; }
  if(t.dataset.idsfx){ idInput(t.dataset.idsfx); if(S.drawer&&S.drawer.type==='intake') scheduleDraft(); return; }
  if(t.dataset.filter&&t.tagName==='INPUT'){ const [g,k]=t.dataset.filter.split('.'); S[g][k]=t.value; S[g].page=1; clearTimeout(filterTimer); filterTimer=setTimeout(renderMain,160); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.bind){ setPath(S.f,t.dataset.bind,t.type==='checkbox'?t.checked:t.value); if(t.hasAttribute('data-rerender')) renderDrawer(true); return; }
  if(t.dataset.idplat){ idInput(t.dataset.idplat); return; }
  if(t.dataset.idsfx&&t.dataset.idsfx==='intake'){ renderDrawer(true); return; }
  if(t.dataset.filter&&t.tagName==='SELECT'){ const [g,k]=t.dataset.filter.split('.'); S[g][k]=t.value; S[g].page=1; renderMain(); return; }
  if(t.id==='auto-refresh'){ S.auto=+t.value; lsWrite('bqc_auto',S.auto); scheduleAuto(); toast(S.auto?`Auto refresh every ${S.auto>=60?S.auto/60+' min':S.auto+' s'}.`:'Auto refresh off.'); return; }
  if(t.id==='l-role'){ S.loginRole=t.value; render(); return; }
  if(t.id==='import-file'){ importBackup(t); }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target.dataset.form;
  if(f==='login') doLogin().catch(err=>{ $('#l-err').textContent=err.message; });
  if(f==='search'){
    const q=normId($('#g-search').value); if(!q) return;
    const all=batteryIndex(), exact=all.find(b=>b.id===q), hits=all.filter(b=>b.id.includes(q));
    if(exact||hits.length===1) openDrawer({type:'battery',id:(exact||hits[0]).id});
    else { S.view='batteries'; S.bat.q=q; S.bat.use='all'; S.bat.page=1; render(); toast(hits.length?`${hits.length} batteries match "${q}".`:`No battery matches "${q}".`); }
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(S.farewell&&!S.session){ S.farewell=null; render(); return; } const mo=$('.top.menu-open,.top.search-open'); if(mo){ mo.classList.remove('menu-open','search-open'); return; } if($('#modal-root').innerHTML){ stopScan(); return; } if(S.drawer) ACT.close(); } if(e.key==='/'&&S.session&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); const g=$('#g-search'); if(g){ const tp=$('.top'); if(tp) tp.classList.add('search-open'); g.focus(); } } });
let draftTimer=0;
function scheduleDraft(){ clearTimeout(draftTimer); draftTimer=setTimeout(()=>{ if(S.session&&S.f.intake) lsWrite(draftKey(),S.f.intake); },300); }
window.addEventListener('beforeunload',e=>{ if(!Cloud.demo&&pendingCount()>0&&!Cloud.localOnly){ e.preventDefault(); e.returnValue=''; } });

/* pointer sheen on glass surfaces (desktop only) */
if(!(window.matchMedia&&matchMedia('(pointer:coarse)').matches)){
  let sr=0,se=null;
  document.addEventListener('pointermove',e=>{ se=e; if(sr) return; sr=requestAnimationFrame(()=>{ sr=0; const el=se.target.closest&&se.target.closest('.card,.lane,.kpis,.login-card'); if(!el) return; const r=el.getBoundingClientRect(); el.style.setProperty('--mx',(se.clientX-r.left)+'px'); el.style.setProperty('--my',(se.clientY-r.top)+'px'); }); },{passive:true});
}

/* =====================================================================
   BOOT
   ===================================================================== */
(function boot(){
  const th=lsRead('bqc_theme',null); if(th) document.documentElement.setAttribute('data-theme',th);
  applyAccent(lsRead('bqc_accent','blue'));
  BG.start();
  const s=currentSession();
  if(s){ startSession(s); } else render();
})();
</script>

</body></html>

async function decodeAttachedWorkbook(b64){
 const bin=atob(b64), bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
 if(typeof DecompressionStream==="undefined") throw new Error("This browser does not support compressed workbook loading.");
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
 return JSON.parse(new TextDecoder().decode(await new Response(stream).arrayBuffer()));
}
async function ensureAttachedData(){
 if(STATE.importedData||STATE.importedLoading)return;
 STATE.importedLoading=true; STATE.importedError=null; render();
 try{const [incoming,warranty]=await Promise.all([decodeAttachedWorkbook(ATTACHED_WORKBOOKS.incoming),decodeAttachedWorkbook(ATTACHED_WORKBOOKS.warranty)]);STATE.importedData={incoming,warranty};}
 catch(e){STATE.importedError=e.message||"Could not load attached workbook data";}
 finally{STATE.importedLoading=false;render();}
}
function workbookSheets(kind){return STATE.importedData?.[kind]?.sheets||[]}
function getAttachedSheet(kind,name){return workbookSheets(kind).find(s=>s.name===name)||null}
function normalizeAttachedRows(sheet,kind){
 if(!sheet?.rows?.length)return {headers:[],rows:[]};
 let hi=kind==="incoming"&&sheet.name==="Inspection Log"?1:(sheet.name==="Master Log"?0:0);
 const headers=(sheet.rows[hi]||[]).map((v,i)=>String(v??`Column ${i+1}`).trim()||`Column ${i+1}`);
 const rows=sheet.rows.slice(hi+1).filter(r=>r.some(v=>v!==null&&v!==""&&v!=="\\xa0"));
 return {headers,rows};
}
function attachedCell(row,headers,name){const i=headers.indexOf(name);return i>=0?row[i]:""}
function attachedStatusClass(v){const s=String(v||"").toUpperCase();if(s.includes("PASS")||s==="RESOLVED"||s==="YES")return"pass";if(s.includes("FAIL")||s.includes("REJECT")||s.includes("QUARANTINE"))return"fail";if(s.includes("PENDING")||s.includes("WORK IN PROGRESS"))return"warn";return""}
function AttachedStat(label,value,sub=""){return el("div",{class:"glass-stat"},[el("div",{class:"glass-stat-label"},label),el("strong",{class:"glass-stat-value"},String(value)),sub?el("div",{class:"glass-stat-sub"},sub):null])}
function IncomingOverview(){
 const d=normalizeAttachedRows(getAttachedSheet("incoming","Inspection Log"),"incoming"),h=d.headers,r=d.rows;
 const ready=r.filter(x=>String(attachedCell(x,h,"Final Disposition")).includes("READY")).length;
 const q=r.filter(x=>String(attachedCell(x,h,"Final Disposition")).includes("QUARANTINE")).length;
 const rej=r.filter(x=>String(attachedCell(x,h,"Final Disposition")).includes("REJECT")).length;
 const fpy=r.filter(x=>String(attachedCell(x,h,"First Pass Yield Flag")).toUpperCase()==="YES").length;
 const c=el("div",{class:"glass-section"});
 c.appendChild(el("div",{class:"glass-section-head"},[el("div",{class:"eyebrow"},"INCOMING BATTERY QUALITY"),el("h2",{},"Inspection command center"),el("p",{class:"sub"},"Imported from the attached Incoming Battery Checklist. Every populated inspection row remains available below.")]));
 const st=el("div",{class:"glass-stat-grid"});[AttachedStat("Inspections",r.length,"populated rows"),AttachedStat("Ready",ready,"final disposition"),AttachedStat("Quarantine",q,"safety hold"),AttachedStat("Reject / Scrap",rej,"disposition"),AttachedStat("First-pass yield",fpy,"flagged YES")].forEach(x=>st.appendChild(x));c.appendChild(st);
 c.appendChild(el("div",{class:"glass-callout"},[el("strong",{},"Inspection gates retained"),el("span",{},"Safety & physical · ID & traceability · pack voltage · cell voltage · insulation resistance ≥550 MΩ · CAN wiring/communication · BMS ID/firmware · IoT/IMEI · BMS faults · temperature · connectors · functional readiness · disposition.")]));
 return c;
}
function WarrantyOverview(){
 const d=normalizeAttachedRows(getAttachedSheet("warranty","Master Log"),"warranty"),h=d.headers,r=d.rows;
 const count=k=>r.filter(x=>String(attachedCell(x,h,"Status")).toLowerCase()===k.toLowerCase()).length;
 const cat=k=>r.filter(x=>String(attachedCell(x,h,"Category")).toLowerCase()===k.toLowerCase()).length;
 const c=el("div",{class:"glass-section"});c.appendChild(el("div",{class:"glass-section-head"},[el("div",{class:"eyebrow"},"WARRANTY / SCRAP DATA"),el("h2",{},"Warranty intelligence"),el("p",{class:"sub"},"Imported Master Log and supporting workbook sheets are preserved as reference data.")]));
 const st=el("div",{class:"glass-stat-grid"});[AttachedStat("Master records",r.length),AttachedStat("Still in warranty",count("Still In Warranty")),AttachedStat("Resolved",count("Resolved")),AttachedStat("Work in progress",count("Work In Progress")),AttachedStat("Failed to resolve",count("Failed To Resolve")),AttachedStat("Vandalism / tampering",cat("Vandalism / Tampering"))].forEach(x=>st.appendChild(x));c.appendChild(st);return c;
}
function AttachedRowCard(headers,row,kind,index){
 const serial=attachedCell(row,headers,kind==="incoming"?"Battery Serial No.":"Battery Serial");
 const platform=attachedCell(row,headers,kind==="incoming"?"Battery Model":"Platform");
 const date=attachedCell(row,headers,"Date");
 const status=kind==="incoming"?attachedCell(row,headers,"Final Disposition"):attachedCell(row,headers,"Status");
 const card=el("details",{class:"attached-record glass-card"});
 card.appendChild(el("summary",{class:"attached-record-summary"},[el("div",{class:"record-main"},[el("strong",{},serial||`Record ${index+1}`),el("span",{class:"sub"},[platform,date].filter(Boolean).join(" · "))]),el("span",{class:"status-pill "+attachedStatusClass(status)},status||"Unspecified")]));
 const grid=el("div",{class:"attached-field-grid"});row.forEach((v,i)=>{if(v!==null&&v!==""&&v!=="\\xa0")grid.appendChild(el("div",{class:"attached-field"},[el("span",{},headers[i]||`Column ${i+1}`),el("strong",{},String(v))]))});

function AttachedRecords(kind,sheetName){
 const d=normalizeAttachedRows(getAttachedSheet(kind,sheetName),kind),h=d.headers;let rows=d.rows;
 const q=String(STATE.importedQuery||"").trim().toLowerCase();if(q)rows=rows.filter(r=>r.some(v=>String(v??"").toLowerCase().includes(q)));
 const ps=20,pages=Math.max(1,Math.ceil(rows.length/ps));STATE.importedPage=Math.min(Math.max(1,STATE.importedPage||1),pages);
 const start=(STATE.importedPage-1)*ps,box=el("div",{class:"attached-records"});
 const inp=el("input",{class:"attached-search",placeholder:"Search serial, issue, status, platform…",value:STATE.importedQuery,onInput:e=>{STATE.importedQuery=e.target.value;STATE.importedPage=1;render()}});
 box.appendChild(el("div",{class:"attached-toolbar"},[inp,el("span",{class:"sub"},`${rows.length} matching records`)]));
 const list=el("div");rows.slice(start,start+ps).forEach((r,i)=>list.appendChild(AttachedRowCard(h,r,kind,start+i)));box.appendChild(list);
 const pager=el("div",{class:"attached-pager"}),prev=el("button",{class:"btn-sm",disabled:STATE.importedPage<=1},"‹ Previous"),next=el("button",{class:"btn-sm",disabled:STATE.importedPage>=pages},"Next ›");
 prev.addEventListener("click",()=>{STATE.importedPage--;render()});next.addEventListener("click",()=>{STATE.importedPage++;render()});

function AttachedWorkbookView(){

 const root=el("div",{class:"view-fade"});root.appendChild(el("div",{class:"glass-section-head"},[el("div",{class:"eyebrow"},"ATTACHED WORKBOOKS"),el("h2",{},"Battery data library"),el("p",{class:"sub"},"All imported workbook sheets are preserved. Expand any record to see its stored fields.")]));
 const tabs=el("div",{class:"glass-tabs"});[["incoming","Incoming checklist"],["warranty","Warranty / scrap"]].forEach(([k,l])=>{const b=el("button",{class:"glass-tab "+(STATE.importedTab===k?"active":"")},l);b.addEventListener("click",()=>{STATE.importedTab=k;STATE.importedQuery="";STATE.importedPage=1;STATE.importedSheet=k==="incoming"?"Inspection Log":"Master Log";render()});tabs.appendChild(b)});root.appendChild(tabs);
 root.appendChild(STATE.importedTab==="incoming"?IncomingOverview():WarrantyOverview());
 const kind=STATE.importedTab,def=kind==="incoming"?"Inspection Log":"Master Log",sheets=workbookSheets(kind),name=STATE.importedSheet||def;
 const picker=el("div",{class:"glass-sheet-picker"},[el("label",{},"Workbook section")]),sel=el("select",{onChange:e=>{STATE.importedSheet=e.target.value;STATE.importedQuery="";STATE.importedPage=1;render()}});
 sheets.forEach(s=>{const o=el("option",{value:s.name},`${s.name} · ${s.rows.length} rows`);if(s.name===name)o.selected=true;sel.appendChild(o)});picker.appendChild(sel);root.appendChild(picker);

<script>
(function(){
  'use strict';

  /* ---------------------------------------------------------------
     1. Readability controls
     --------------------------------------------------------------- */
  const RI_KEY='bqc_readability_preferences';

  function riLoad(){
    try{return JSON.parse(localStorage.getItem(RI_KEY)||'{}')||{};}catch(e){return {};}
  }
  function riSave(p){
    try{localStorage.setItem(RI_KEY,JSON.stringify(p));}catch(e){}
  }

  function riApply(){
    const p=riLoad();
    document.body.classList.toggle('ri-readable',p.readable!==false);
    document.body.classList.toggle('ri-focus-mode',!!p.focus);
    document.documentElement.style.setProperty('--ri-text-size',String(p.scale||1));
    const bar=document.getElementById('ri-readability-bar');
    if(!bar)return;
    bar.querySelector('[data-ri="readable"]')?.classList.toggle('ri-active',p.readable!==false);
    bar.querySelector('[data-ri="focus"]')?.classList.toggle('ri-active',!!p.focus);
    const label=bar.querySelector('[data-ri-scale]');
    if(label)label.textContent=Math.round((p.scale||1)*100)+'%';
  }

  function riMakeBar(){
    if(document.getElementById('ri-readability-bar'))return;
    const root=document.querySelector('#root');
    if(!root)return;

    const bar=document.createElement('div');
    bar.id='ri-readability-bar';
    bar.innerHTML=
      '<span class="ri-title">Readable view</span>'+
      '<div class="ri-controls">'+
        '<button type="button" data-ri="minus" aria-label="Decrease text size">A−</button>'+
        '<button type="button" data-ri-scale aria-label="Current text size">100%</button>'+
        '<button type="button" data-ri="plus" aria-label="Increase text size">A+</button>'+
        '<button type="button" data-ri="readable">Readable</button>'+
        '<button type="button" data-ri="focus">Focus</button>'+
      '</div>';

    root.insertBefore(bar,root.firstChild);

    bar.addEventListener('click',function(e){
      const b=e.target.closest('button');
      if(!b)return;
      const p=riLoad();
      if(b.dataset.ri==='minus'){
        p.scale=Math.max(.9,Math.round(((p.scale||1)-.05)*100)/100);
      }else if(b.dataset.ri==='plus'){
        p.scale=Math.min(1.35,Math.round(((p.scale||1)+.05)*100)/100);
      }else if(b.dataset.ri==='readable'){
        p.readable=p.readable===false;
      }else if(b.dataset.ri==='focus'){
        p.focus=!p.focus;
      }else return;
      riSave(p);riApply();
    });

    riApply();
  }

  /* ---------------------------------------------------------------
     2. Universal chart upgrade
        - crosshair/readout
        - PNG export
        - CSV export
        - focus mode
        - reset
        - min/max readout
        - existing chart click handlers remain untouched
     --------------------------------------------------------------- */
  const enhanced=new WeakSet();

  function chartDataRows(chart){
    const labels=(chart?.data?.labels||[]).map(String);
    const sets=chart?.data?.datasets||[];
    const rows=[];
    const max=Math.max(labels.length,...sets.map(s=>(s.data||[]).length),0);
    for(let i=0;i<max;i++){
      const row=[labels[i]??String(i+1)];
      sets.forEach(ds=>{
        const v=ds.data?.[i];
        row.push(typeof v==='number'?v:(v==null?'':String(v)));
      });
      rows.push(row);
    }
    return {labels,sets,rows};
  }

  function csvEscape(v){
    const s=String(v??'');
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }

  function downloadText(name,text,type){
    const blob=new Blob([text],{type});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=name;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  }

  function exportCsv(chart){
    const {sets,rows}=chartDataRows(chart);
    const header=['Label',...sets.map(s=>s.label||'Series')];
    const csv=[header,...rows].map(r=>r.map(csvEscape).join(',')).join('\n');
    downloadText('battery-qc-chart.csv','\uFEFF'+csv,'text/csv;charset=utf-8');
  }

  function chartTitle(chart){
    const card=chart.canvas?.closest('.chart-card');
    return (card?.querySelector('h3,h2,.title')?.textContent||'Battery QC Chart').trim();
  }

  function showStats(chart,readout){
    const {sets}=chartDataRows(chart);
    const parts=[];
    sets.forEach(ds=>{
      const nums=(ds.data||[]).map(Number).filter(Number.isFinite);
      if(!nums.length)return;
      const min=Math.min(...nums),max=Math.max(...nums);
      const minAt=(ds.data||[]).findIndex(v=>Number(v)===min);
      const maxAt=(ds.data||[]).findIndex(v=>Number(v)===max);
      parts.push(
        (ds.label||'Series')+
        ': min '+min+' @ '+(chart.data.labels?.[minAt]??minAt)+
        ' · max '+max+' @ '+(chart.data.labels?.[maxAt]??maxAt)
      );
    });
    readout.textContent=parts.join('   |   ')||'Move the pointer over the chart for a synchronized readout.';
  }

  function enhanceChart(chart){
    if(!chart || !chart.canvas || enhanced.has(chart))return;
    enhanced.add(chart);

    const card=chart.canvas.closest('.chart-card');
    if(!card)return;
    card.classList.add('ri-enhanced');

    const oldWrap=chart.canvas.parentElement;
    if(!oldWrap)return;

    const stage=document.createElement('div');
    stage.className='ri-chart-stage';
    oldWrap.insertBefore(stage,chart.canvas);
    stage.appendChild(chart.canvas);

    const cross=document.createElement('div');
    cross.className='ri-chart-crosshair';
    const crossLabel=document.createElement('div');
    crossLabel.className='ri-chart-crosshair-label';
    stage.append(cross,crossLabel);

    const toolbar=document.createElement('div');
    toolbar.className='ri-chart-toolbar';
    const tools=document.createElement('div');
    tools.className='ri-chart-tools';

    const makeBtn=(text,fn,title)=>{
      const b=document.createElement('button');
      b.type='button';b.textContent=text;
      if(title)b.title=title;
      b.addEventListener('click',e=>{e.stopPropagation();fn();});
      tools.appendChild(b);
      return b;
    };

    makeBtn('PNG',()=>{
      try{
        const a=document.createElement('a');
        a.href=chart.toBase64Image('image/png',1);
        a.download=(chartTitle(chart).replace(/[^\w-]+/g,'-')||'battery-qc-chart')+'.png';
        a.click();
      }catch(e){console.warn('PNG export failed',e);}
    },'Export this chart as PNG');

    makeBtn('CSV',()=>exportCsv(chart),'Export chart data as CSV');

    makeBtn('Stats',()=>showStats(chart,readout),'Show minimum and maximum values');

    makeBtn('Focus',()=>{
      const p=riLoad();
      p.focus=true;riSave(p);
      document.body.classList.add('ri-focus-mode');
      document.querySelectorAll('.ri-focused').forEach(x=>x.classList.remove('ri-focused'));
      card.classList.add('ri-focused');
      riApply();
    },'Focus on this chart');

    makeBtn('Reset',()=>{
      try{
        chart.reset();
        chart.update('none');
      }catch(e){}
      cross.style.opacity='0';
      crossLabel.style.opacity='0';
      showStats(chart,readout);
    },'Reset chart state');

    const readout=document.createElement('div');
    readout.className='ri-chart-readout';
    toolbar.append(tools,readout);

    oldWrap.parentElement.insertBefore(toolbar,stage);
    showStats(chart,readout);

    function move(e){
      const r=stage.getBoundingClientRect();
      const x=Math.max(0,Math.min(r.width,e.clientX-r.left));
      const area=chart.chartArea;
      if(!area)return;
      const canvasRect=chart.canvas.getBoundingClientRect();
      const canvasX=e.clientX-canvasRect.left;
      if(canvasX<area.left||canvasX>area.right){
        cross.style.opacity='0';crossLabel.style.opacity='0';return;
      }

      const scaleX=area.width/(area.right-area.left);
      const px=area.left+(canvasX-area.left);
      const ratio=(px-area.left)/(area.right-area.left);
      const idx=Math.max(0,Math.min((chart.data.labels?.length||1)-1,
        Math.round(ratio*Math.max(0,(chart.data.labels?.length||1)-1))));
      const label=chart.data.labels?.[idx]??idx;

      cross.style.left=(px/chart.width*100)+'%';
      cross.style.opacity='1';
      crossLabel.style.left=(px/chart.width*100)+'%';
      crossLabel.textContent=String(label);
      crossLabel.style.opacity='1';

      const vals=(chart.data.datasets||[]).map(ds=>{
        const v=ds.data?.[idx];
        return ds.label+': '+(v==null?'—':v);
      });
      readout.textContent=String(label)+'  ·  '+vals.join('  |  ');
    }

    stage.addEventListener('pointermove',move,{passive:true});
    stage.addEventListener('pointerleave',()=>{
      cross.style.opacity='0';
      crossLabel.style.opacity='0';
      showStats(chart,readout);
    },{passive:true});

    stage.addEventListener('dblclick',()=>{
      try{chart.reset();chart.update('none');}catch(e){}
    });

    /* Preserve the application's existing click-to-details behaviour. */
  }

  function riScanCharts(){
    if(typeof Chart==='undefined')return;
    document.querySelectorAll('canvas').forEach(canvas=>{
      try{
        const c=Chart.getChart(canvas);
        if(c)enhanceChart(c);
      }catch(e){}
    });
  }

  /* Existing app loads Chart.js asynchronously, so observe the page rather
     than replacing its rendering path. */
  function riBoot(){
    riMakeBar();
    riApply();
    riScanCharts();

    const observer=new MutationObserver(()=>{
      riMakeBar();
      riScanCharts();
    });
    observer.observe(document.body,{childList:true,subtree:true});

    /* Keyboard shortcuts */
    document.addEventListener('keydown',e=>{
      if(e.target.matches('input,textarea,select,[contenteditable="true"]'))return;
      if(e.key==='+'||e.key==='='){
        const b=document.querySelector('#ri-readability-bar [data-ri="plus"]');
        if(b)b.click();
      }else if(e.key==='-'){
        const b=document.querySelector('#ri-readability-bar [data-ri="minus"]');
        if(b)b.click();
      }else if(e.key.toLowerCase()==='f'){
        const b=document.querySelector('#ri-readability-bar [data-ri="focus"]');
        if(b)b.click();
      }
    });
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',riBoot,{once:true});
  }else{
    riBoot();
  }
})();
</script>




<style id="large-adjustable-chart-upgrade">

<script id="large-adjustable-chart-upgrade-script">
(function () {
  "use strict";

  const STORAGE_KEY = "batteryQC.chartSizes.v1";

  function getStore() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
    catch (_) { return {}; }
  }

  function saveStore(store) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
    catch (_) {}
  }

  function chartKey(card, index) {
    const title = card.querySelector("h1,h2,h3,h4,h5,.chart-title,.card-title");
    const text = title ? title.textContent.trim() : "";
    const canvas = card.querySelector("canvas");
    return text || (canvas && canvas.id) || ("chart-" + index);
  }

  function resizeChartInstance(canvas) {
    try {
      if (window.Chart && typeof Chart.getChart === "function") {
        const chart = Chart.getChart(canvas);
        if (chart) {
          chart.resize();
          chart.update("none");
        }
      }
    } catch (_) {}
    try {
      window.dispatchEvent(new Event("resize"));
    } catch (_) {}
  }

  function setChartHeight(card, height) {
    const wrap = card.querySelector(".chart-wrap");
    if (!wrap) return;
    wrap.style.height = height + "px";
    wrap.style.minHeight = height + "px";

    const canvas = wrap.querySelector("canvas");
    if (canvas) {
      canvas.style.height = "100%";
      canvas.style.width = "100%";
      requestAnimationFrame(function () {
        resizeChartInstance(canvas);
      });
    }
  }

  function addControls(card, index) {
    if (card.querySelector(".chart-resize-controls")) return;

    const wrap = card.querySelector(".chart-wrap");
    const canvas = card.querySelector("canvas");
    if (!wrap || !canvas) return;

    const key = chartKey(card, index);
    const store = getStore();

    const controls = document.createElement("div");
    controls.className = "chart-resize-controls";
    controls.setAttribute("aria-label", "Chart size controls");

    const label = document.createElement("span");
    label.textContent = "Chart size";
    controls.appendChild(label);

    const sizes = [
      ["Compact", 360],
      ["Large", 520],
      ["XL", 680],
      ["Full height", Math.min(Math.max(window.innerHeight * 0.78, 620), 1000)]
    ];

    sizes.forEach(function (item) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = item[0];
      button.addEventListener("click", function () {
        setChartHeight(card, Math.round(item[1]));
        const current = getStore();
        current[key] = Math.round(item[1]);
        saveStore(current);
      });
      controls.appendChild(button);
    });

    const reset = document.createElement("button");
    reset.type = "button";
    reset.textContent = "Reset";
    reset.addEventListener("click", function () {
      const defaultHeight = window.innerWidth >= 1200 ? 600 : 500;
      setChartHeight(card, defaultHeight);
      const current = getStore();
      delete current[key];
      saveStore(current);
    });
    controls.appendChild(reset);

    const full = document.createElement("button");
    full.type = "button";
    full.textContent = "Use full width";
    full.addEventListener("click", function () {
      card.classList.toggle("chart-full-space");
      requestAnimationFrame(function () {
        resizeChartInstance(canvas);
      });
    });
    controls.appendChild(full);

    const sizeLabel = document.createElement("span");
    sizeLabel.className = "chart-size-label";
    sizeLabel.textContent = "Drag the chart's bottom edge for any custom height.";
    controls.appendChild(sizeLabel);

    wrap.parentNode.insertBefore(controls, wrap);

    /* Restore the user's last size for this chart. */
    if (Number.isFinite(store[key])) {
      setChartHeight(card, store[key]);
    }

    /* Persist manual resize using ResizeObserver. */
    if (window.ResizeObserver) {
      let timer = null;
      const ro = new ResizeObserver(function (entries) {
        if (!entries.length) return;
        clearTimeout(timer);
        timer = setTimeout(function () {
          const h = Math.round(entries[0].contentRect.height);
          if (h >= 250 && h <= 1400) {
            const current = getStore();
            current[key] = h;
            saveStore(current);
            sizeLabel.textContent = "Custom height: " + h + " px";
          }
        }, 250);
      });
      ro.observe(wrap);
    }
  }

  function init() {
    const cards = document.querySelectorAll(".chart-card");
    cards.forEach(addControls);

    /* Also catch charts created later by existing app code. */
    if (window.MutationObserver) {
      const observer = new MutationObserver(function () {
        document.querySelectorAll(".chart-card").forEach(addControls);
      });

<script id="readable-auto-chart-final-script">
(function () {
  "use strict";

  function clamp(n, min, max) {
    return Math.max(min, Math.min(max, n));
  }

  function getChart(canvas) {
    try {
      return window.Chart && Chart.getChart ? Chart.getChart(canvas) : null;
    } catch (_) {
      return null;
    }
  }

  function countUsefulLabels(chart) {
    try {
      const labels = chart.data && chart.data.labels;
      return Array.isArray(labels) ? labels.length : 0;
    } catch (_) {
      return 0;
    }
  }

  function automaticHeight(chart) {
    const labels = countUsefulLabels(chart);
    const datasets = chart && chart.data && Array.isArray(chart.data.datasets)
      ? chart.data.datasets.length : 1;

    /*
      Enough room for axes, legend, tooltips and labels, but deliberately
      capped so charts never become unnecessarily tall.
    */
    let h = 350;
    if (labels > 8) h += Math.min(120, (labels - 8) * 9);
    if (labels > 18) h += Math.min(60, (labels - 18) * 4);
    if (datasets > 2) h += Math.min(35, (datasets - 2) * 12);

    return clamp(h, 350, 520);
  }

  function improveAxes(chart) {
    if (!chart || !chart.options) return;

    const options = chart.options;
    options.responsive = true;
    options.maintainAspectRatio = false;

    options.layout = options.layout || {};
    options.layout.padding = options.layout.padding || {};
    options.layout.padding.left = Math.max(Number(options.layout.padding.left) || 0, 6);
    options.layout.padding.right = Math.max(Number(options.layout.padding.right) || 0, 10);
    options.layout.padding.top = Math.max(Number(options.layout.padding.top) || 0, 8);
    options.layout.padding.bottom = Math.max(Number(options.layout.padding.bottom) || 0, 8);

    options.plugins = options.plugins || {};
    options.plugins.legend = options.plugins.legend || {};
    options.plugins.legend.labels = options.plugins.legend.labels || {};
    options.plugins.legend.labels.font = Object.assign(
      {},
      options.plugins.legend.labels.font || {},
      { size: 12 }
    );
    options.plugins.legend.labels.padding = Math.max(
      Number(options.plugins.legend.labels.padding) || 0, 10
    );

    options.scales = options.scales || {};

    Object.keys(options.scales).forEach(function (axisKey) {
      const scale = options.scales[axisKey] || {};
      scale.ticks = scale.ticks || {};

      const isX = axisKey === "x" || scale.axis === "x";
      const isY = axisKey === "y" || scale.axis === "y";

      scale.ticks.font = Object.assign(
        {},
        scale.ticks.font || {},
        { size: 12, weight: 500 }
      );

      scale.ticks.padding = Math.max(Number(scale.ticks.padding) || 0, 6);

      if (isY) {
        scale.ticks.maxTicksLimit = Math.max(
          Number(scale.ticks.maxTicksLimit) || 0, 7
        );
      }

      if (isX) {
        const labelCount = countUsefulLabels(chart);

        /*
          Avoid unreadable X-axis labels:
          - few labels: show all
          - many labels: Chart.js can skip intelligently
          - long labels: rotate rather than overlap
        */
        scale.ticks.autoSkip = labelCount > 12;
        scale.ticks.maxTicksLimit = labelCount > 24 ? 12 : Math.min(
          Math.max(labelCount, 2), 18
        );
        scale.ticks.maxRotation = 45;
        scale.ticks.minRotation = labelCount > 8 ? 20 : 0;
      }

      options.scales[axisKey] = scale;
    });

    chart.options = options;
  }

  function configureCard(card) {
    const canvas = card.querySelector("canvas");
    const controls = card.querySelector(".chart-resize-controls");
    const wrap = card.querySelector(".chart-wrap");
    if (!canvas || !wrap) return;

    let expandButton = controls && controls.querySelector(".chart-expand-one");

    if (!expandButton) {
      if (!controls) return;

      expandButton = document.createElement("button");
      expandButton.type = "button";
      expandButton.className = "chart-expand-one";
      expandButton.setAttribute("aria-label", "Expand chart");
      controls.insertBefore(expandButton, controls.firstChild);

      expandButton.addEventListener("click", function () {
        const expanded = card.classList.toggle("chart-expanded-one");
        expandButton.setAttribute(
          "aria-label",
          expanded ? "Collapse chart" : "Expand chart"
        );

        const chart = getChart(canvas);
        requestAnimationFrame(function () {
          if (chart) {
            improveAxes(chart);
            chart.resize();
            chart.update("none");
          }
        });
      });
    }

    const chart = getChart(canvas);
    if (!chart) return;

    improveAxes(chart);

    /* Automatically choose a sensible, moderate height from chart content. */
    if (!card.classList.contains("chart-expanded-one")) {
      const h = automaticHeight(chart);
      wrap.style.height = h + "px";
      wrap.style.minHeight = h + "px";
      wrap.style.maxHeight = "560px";
    }

    requestAnimationFrame(function () {
      try {
        chart.resize();
        chart.update("none");
      } catch (_) {}
    });
  }

  function initAll() {
    document.querySelectorAll(".chart-card").forEach(configureCard);
  }

  /*
    Chart.js charts may be created after the page loads, so watch the app
    and reconfigure only when chart canvases/cards appear.
  */
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initAll);
  } else {
    initAll();
  }

  if (window.MutationObserver && document.body) {
    let timer = null;
    const observer = new MutationObserver(function () {
      clearTimeout(timer);
      timer = setTimeout(initAll, 120);
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  window.addEventListener("resize", function () {
    clearTimeout(window.__readableChartResizeTimer);
    window.__readableChartResizeTimer = setTimeout(initAll, 180);
  });
})();
</script>

<script id="world-class-chart-engine-js">
(function(){
  'use strict';

  const WCE = {
    enhanced: new WeakSet(),
    scheduled: false,

    css(name, fallback){
      try{
        const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        return v || fallback;
      }catch(e){ return fallback; }
    },

    numeric(v){
      if(v === null || v === undefined || v === '') return null;
      const n=Number(v);
      return Number.isFinite(n) ? n : null;
    },

    /* Make every dataset exactly correspond to the category labels by index.
       This prevents hidden/extra values from shifting the visual interpretation. */
    normalizeData(chart){
      if(!chart || !chart.data) return;
      const labels=Array.isArray(chart.data.labels) ? chart.data.labels.slice() : [];
      chart.data.labels=labels;

      (chart.data.datasets || []).forEach(ds=>{
        const original=Array.isArray(ds.data) ? ds.data : [];
        const aligned=new Array(labels.length);

        for(let i=0;i<labels.length;i++){
          const v=original[i];
          aligned[i]=(v === null || v === undefined || v === '') ? null : v;
        }

        /* Preserve the original array length only when there are no labels. */
        ds.data=labels.length ? aligned : original.slice();
      });
    },

    wrapLabel(value, maxChars){
      const s=String(value ?? '');
      if(s.length <= maxChars) return s;
      const words=s.split(/\s+/);
      const lines=[];
      let line='';
      words.forEach(word=>{
        const next=line ? line+' '+word : word;
        if(next.length > maxChars && line){
          lines.push(line);
          line=word;
        }else{
          line=next;
        }
      });
      if(line) lines.push(line);
      return lines.length ? lines.slice(0,3) : [s];
    },

    prepareLabels(chart){
      const labels=chart.data?.labels || [];
      const count=labels.length;
      const x=chart.options.scales?.x;
      if(!x) return;

      x.type='category';
      x.offset=true;

      x.ticks=Object.assign({},x.ticks||{},{
        autoSkip:false,
        maxRotation: count > 8 ? 45 : 0,
        minRotation: count > 8 ? 35 : 0,
        padding: count > 12 ? 5 : 7,
        color: WCE.css('--muted','#667085'),
        font:{size:11, weight:'500'}
      });

      /* Every displayed tick comes from the exact label at that index.
         No sampling that can make a label appear to belong to another point. */
      x.ticks.callback=function(value,index){
        const raw=labels[index];
        if(raw===undefined) return '';
        return WCE.wrapLabel(raw, count > 10 ? 14 : 20);
      };

      x.grid=Object.assign({},x.grid||{},{
        drawTicks:true,
        color:'rgba(120,130,145,.14)',
        tickLength:4
      });

      x.border=Object.assign({},x.border||{},{
        color:'rgba(120,130,145,.45)'
      });
    },

    prepareY(chart){
      const y=chart.options.scales?.y;
      if(!y) return;

      y.ticks=Object.assign({},y.ticks||{},{
        maxTicksLimit:7,
        padding:7,
        color:WCE.css('--muted','#667085'),
        font:{size:11, weight:'500'},
        callback:function(value){
          const n=Number(value);
          if(!Number.isFinite(n)) return value;
          if(Math.abs(n)>=1000000) return (n/1000000).toFixed(n%1000000 ? 1 : 0)+'M';
          if(Math.abs(n)>=1000) return (n/1000).toFixed(n%1000 ? 1 : 0)+'k';
          return Number.isInteger(n) ? String(n) : n.toFixed(1);
        }
      });

      y.grid=Object.assign({},y.grid||{},{
        color:'rgba(120,130,145,.16)',
        lineWidth:1,
        drawTicks:true
      });

      y.border=Object.assign({},y.border||{},{
        color:'rgba(120,130,145,.45)'
      });
    },

    prepareDatasets(chart){
      const type=String(chart.config?.type||'').toLowerCase();
      const labels=chart.data?.labels || [];
      const count=labels.length;
      const datasets=chart.data?.datasets || [];

      datasets.forEach((ds,di)=>{
        ds.data=Array.isArray(ds.data) ? ds.data.slice(0,count) : [];
        ds.label=ds.label || `Series ${di+1}`;

        if(type==='bar'){
          /* Compact, consistent bars. Chart.js determines exact category
             positions, so labels and bars remain index-locked. */
          ds.barPercentage=count > 12 ? 0.42 : 0.52;
          ds.categoryPercentage=count > 12 ? 0.66 : 0.72;
          ds.maxBarThickness=count > 12 ? 24 : 30;
          ds.borderWidth=ds.borderWidth ?? 1;
          ds.borderRadius=ds.borderRadius ?? 3;
          ds.borderSkipped=false;
        }

        if(type==='line'){
          ds.tension=ds.tension ?? 0.18;
          ds.borderWidth=ds.borderWidth ?? 2;
          ds.pointRadius=count > 30 ? 2 : 3;
          ds.pointHoverRadius=6;
          ds.pointHitRadius=12;
          ds.spanGaps=false;
        }
      });
    },

    setCanvasWidth(chart){
      const canvas=chart.canvas;
      const wrap=canvas.closest('.chart-wrap');
      if(!canvas || !wrap) return;

      const count=(chart.data?.labels||[]).length;
      const available=wrap.clientWidth || 700;

      /* Long category series get a controlled internal width. The wrapper
         scrolls instead of squeezing labels until they become unreadable. */
      const perCategory = count > 24 ? 54 : count > 16 ? 48 : count > 10 ? 42 : 0;
      const desired = perCategory ? Math.max(available, count*perCategory) : available;

      canvas.style.width=desired+'px';
      canvas.style.height='100%';
      canvas.width=canvas.width; /* let Chart.js recalculate from CSS size */
      return desired;
    },

    interaction(chart){
      chart.options.interaction=Object.assign({},chart.options.interaction||{},{
        mode:'index',
        intersect:false,
        axis:'x'
      });

      chart.options.plugins=chart.options.plugins||{};

      chart.options.plugins.tooltip=Object.assign({},chart.options.plugins.tooltip||{},{
        enabled:true,
        mode:'index',
        intersect:false,
        axis:'x',
        padding:10,
        titleFont:{size:12,weight:'700'},
        bodyFont:{size:12},
        displayColors:true,
        callbacks:{
          title:function(items){
            if(!items || !items.length) return '';
            return String(chart.data.labels[items[0].dataIndex] ?? '');
          },
          label:function(ctx){
            const value=ctx.raw;
            const n=WCE.numeric(value);
            const shown=n===null ? String(value ?? '') :
              (Math.abs(n)>=1000000 ? (n/1000000).toFixed(2)+'M' :
               Math.abs(n)>=1000 ? (n/1000).toFixed(2)+'k' :
               (Number.isInteger(n)?String(n):n.toFixed(2)));
            return `${ctx.dataset.label}: ${shown}`;
          }
        }
      });

      chart.options.plugins.legend=Object.assign({},chart.options.plugins.legend||{},{
        display:(chart.data?.datasets||[]).length > 1,
        position:'top',
        align:'start',
        labels:{
          usePointStyle:true,
          pointStyle:'circle',
          boxWidth:8,
          boxHeight:8,
          padding:14,
          font:{size:11,weight:'600'}
        }
      });
    },

    accessibility(chart){
      const canvas=chart.canvas;
      if(!canvas) return;

      canvas.setAttribute('role','img');
      const title=canvas.closest('.chart-card')?.querySelector('h3')?.textContent || 'Chart';
      canvas.setAttribute('aria-label',title);

      /* Keyboard focus gives the same high-quality tooltip interaction. */
      canvas.tabIndex=0;
      canvas.addEventListener('keydown',function(e){
        if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
        const labels=chart.data?.labels||[];
        if(!labels.length) return;
        const active=chart.getActiveElements?.() || [];
        let index=active.length ? active[0].index : 0;
        index += e.key==='ArrowRight' ? 1 : -1;
        index=Math.max(0,Math.min(labels.length-1,index));
        chart.setActiveElements(
          (chart.data.datasets||[]).map((_,di)=>({datasetIndex:di,index:index}))
        );
        chart.tooltip?.setActiveElements(
          [{datasetIndex:0,index:index}],
          {x:chart.scales.x?.getPixelForValue(index) || 0,y:chart.scales.y?.getPixelForValue(chart.data.datasets?.[0]?.data?.[index] || 0) || 0}
        );
        chart.update('none');
        e.preventDefault();
      });
    },

    enhance(chart){
      if(!chart || WCE.enhanced.has(chart)) return;
      WCE.enhanced.add(chart);

      try{
        WCE.normalizeData(chart);
        chart.options.responsive=true;
        chart.options.maintainAspectRatio=false;
        chart.options.animation=false;

        chart.options.layout=Object.assign({},chart.options.layout||{},{
          padding:{top:8,right:14,bottom:8,left:8}
        });

        WCE.prepareDatasets(chart);
        WCE.prepareLabels(chart);
        WCE.prepareY(chart);
        WCE.interaction(chart);
        WCE.setCanvasWidth(chart);
        WCE.accessibility(chart);

        chart.resize();
        chart.update('none');
      }catch(e){
        console.warn('World-class chart enhancement:',e);
      }
    },

    scan(){
      if(typeof Chart==='undefined') return;
      document.querySelectorAll('.chart-card canvas').forEach(canvas=>{
        try{
          const chart=Chart.getChart(canvas);
          if(chart) WCE.enhance(chart);
        }catch(e){}
      });
    },

    resize(){
      if(typeof Chart==='undefined') return;
      document.querySelectorAll('.chart-card canvas').forEach(canvas=>{
        try{
          const chart=Chart.getChart(canvas);
          if(!chart) return;
          WCE.setCanvasWidth(chart);
          chart.resize();
          chart.update('none');
        }catch(e){}
      });
    },

    start(){
      const run=()=>{
        WCE.scan();
        WCE.scheduled=false;
      };
      if(!WCE.scheduled){
        WCE.scheduled=true;
        requestAnimationFrame(run);
      }
    }
  };

  window.WorldClassCharts=WCE;

  /* Repeated scans are intentional because this application creates charts
     dynamically after view renders and after Chart.js loads. */
  const boot=()=>{
    WCE.start();
    setTimeout(()=>WCE.start(),300);
    setTimeout(()=>WCE.start(),900);
    setTimeout(()=>WCE.start(),1800);
  };

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',boot);
  }else boot();

  new MutationObserver(()=>WCE.start()).observe(document.documentElement,{
    childList:true,subtree:true
  });

  window.addEventListener('resize',()=>{
    clearTimeout(window.__wceResize);
    window.__wceResize=setTimeout(()=>WCE.resize(),120);
  });

})();
</script>

<script id="final-x-axis-scroll-js">
(function(){
  'use strict';

  function applyScrollableXAxis(chart){
    if(!chart || !chart.canvas || !chart.data) return;

    const wrap=chart.canvas.closest('.chart-wrap');
    if(!wrap) return;

    const labels=Array.isArray(chart.data.labels) ? chart.data.labels : [];
    const count=labels.length;

    /* Give every category a minimum amount of physical horizontal space.
       More categories => a wider internal canvas => user scrolls instead
       of getting unreadable compressed labels. */
    const minPerLabel =
      count >= 40 ? 72 :
      count >= 30 ? 68 :
      count >= 20 ? 64 :
      count >= 12 ? 58 :
      count >= 8  ? 52 : 0;

    const viewport=wrap.clientWidth || 760;
    const requiredWidth=minPerLabel
      ? Math.max(viewport, count * minPerLabel)
      : viewport;

    chart.canvas.style.width=requiredWidth+'px';
    chart.canvas.style.minWidth=requiredWidth+'px';
    chart.canvas.style.maxWidth='none';
    chart.canvas.style.height='100%';

    const x=chart.options.scales && chart.options.scales.x;
    if(x){
      x.type='category';
      x.offset=true;

      x.ticks=Object.assign({},x.ticks||{},{
        autoSkip:false,
        maxTicksLimit:undefined,
        maxRotation:35,
        minRotation:count > 8 ? 25 : 0,
        padding:8,
        align:'center',
        includeBounds:true
      });

      /* The callback uses the exact label index supplied by Chart.js. */
      x.ticks.callback=function(value,index){
        const label=labels[index];
        if(label===undefined || label===null) return '';

        const s=String(label);
        if(s.length<=22) return s;

        /* Wrap long labels rather than cutting them off. */
        const words=s.split(/\s+/);
        const lines=[];
        let line='';
        words.forEach(word=>{
          const next=line ? line+' '+word : word;
          if(next.length>18 && line){
            lines.push(line);
            line=word;
          }else{
            line=next;
          }
        });
        if(line) lines.push(line);
        return lines.slice(0,3);
      };
    }

    /* Keep bars narrow even though the plotting area becomes wider. */
    (chart.data.datasets||[]).forEach(ds=>{
      if(String(chart.config?.type||'').toLowerCase()==='bar'){
        ds.barPercentage=0.42;
        ds.categoryPercentage=0.62;
        ds.maxBarThickness=28;
      }
    });

    try{
      chart.resize();
      chart.update('none');
    }catch(e){}
  }

  function applyAll(){
    if(typeof Chart==='undefined') return;

    document.querySelectorAll('.chart-card canvas').forEach(canvas=>{
      try{
        const chart=Chart.getChart(canvas);
        if(chart) applyScrollableXAxis(chart);
      }catch(e){}
    });
  }

  function schedule(){
    clearTimeout(window.__xAxisScrollTimer);
    window.__xAxisScrollTimer=setTimeout(applyAll,80);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>{
      setTimeout(applyAll,100);
      setTimeout(applyAll,700);
      setTimeout(applyAll,1600);
    });
  }else{
    setTimeout(applyAll,100);
    setTimeout(applyAll,700);
    setTimeout(applyAll,1600);
  }

  new MutationObserver(schedule).observe(document.documentElement,{
    childList:true,
    subtree:true
  });

  window.addEventListener('resize',schedule);

  /* Expose a small utility so dynamically created charts can immediately
     receive the same treatment. */
  window.applyScrollableChartXAxis=applyAll;
})();
</script>

<script id="wide-expand-mode-js">

    const labels=Array.isArray(chart.data?.labels) ? chart.data.labels : [];

  function normalSize(chart){

    if(!wrap) return;

    const labels=Array.isArray(chart.data?.labels) ? chart.data.labels : [];

  function refresh(card){

  function hook(){

<script id="definitive-chart-scroll-stage-js">
(function(){
  'use strict';

  const FIX = {
    hooked: new WeakSet(),

    isDateLabel(v){
      return /^(\d{4})-(\d{2})-(\d{2})$/.test(String(v ?? ''));
    },

    dateLabel(v){
      const s=String(v ?? '');
      const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(!m) return null;
      const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
      if(Number.isNaN(d.getTime())) return s;
      return d.toLocaleDateString(undefined,{day:'2-digit',month:'short'});
    },

    displayLabel(v, count){
      const s=String(v ?? '');
      const date=this.dateLabel(s);
      if(date) return date;

      if(s.length<=18) return s;

      const words=s.split(/\s+/);
      const lines=[];
      let line='';
      words.forEach(word=>{
        const next=line ? line+' '+word : word;
        if(next.length>16 && line){
          lines.push(line);
          line=word;
        }else{
          line=next;
        }
      });
      if(line) lines.push(line);
      return lines.slice(0,3);
    },

    spacing(chart, expanded){
      const labels=Array.isArray(chart.data?.labels) ? chart.data.labels : [];
      const count=labels.length;
      const type=String(chart.config?.type || '').toLowerCase();

      /*
       * This is the important part:
       * the stage, not the canvas, becomes wide.
       * Every category gets a fixed minimum horizontal lane.
       */
      const px =
        expanded
          ? (count >= 50 ? 128 :
             count >= 40 ? 122 :
             count >= 30 ? 116 :
             count >= 20 ? 108 :
             count >= 12 ? 100 :
             count >= 8  ? 92 : 110)
          : (count >= 50 ? 82 :
             count >= 40 ? 78 :
             count >= 30 ? 76 :
             count >= 20 ? 72 :
             count >= 12 ? 68 :
             count >= 8  ? 62 : 0);

      const wrap=chart.canvas.closest('.chart-wrap');
      if(!wrap) return;

      const viewport=Math.max(360,wrap.clientWidth || 760);
      const stage=chart.canvas.parentElement;

      if(stage && stage.classList.contains('wce-scroll-stage')){
        const width=px ? Math.max(viewport, count*px) : viewport;
        stage.style.width=width+'px';
        stage.style.minWidth=width+'px';
        stage.style.maxWidth='none';
      }

      const x=chart.options.scales?.x;
      if(x){
        /*
         * Line/scatter: offset false means the first and last points sit
         * directly on their category ticks.
         * Bar: offset true gives each bar a centered category lane.
         */
        x.offset = type==='bar';

        x.ticks=Object.assign({},x.ticks||{},{
          autoSkip:false,
          maxTicksLimit:undefined,
          sampleSize:count,
          padding:10,
          maxRotation: count>6 ? 35 : 0,
          minRotation: count>6 ? 25 : 0,
          align:'center',
          color:(x.ticks||{}).color || '#667085',
          font:Object.assign({},(x.ticks||{}).font||{},{
            size:11,
            weight:'500'
          }),
          callback:function(value,index){
            const raw=labels[index];
            return raw===undefined ? '' : FIX.displayLabel(raw,count);
          }
        });

        x.grid=Object.assign({},x.grid||{},{
          offset:type==='bar',
          drawTicks:true
        });
      }

      /* Compact visual marks inside the wider category lanes. */
      if(type==='bar'){
        (chart.data.datasets||[]).forEach(ds=>{
          ds.barPercentage=0.34;
          ds.categoryPercentage=0.52;
          ds.maxBarThickness=28;
          ds.borderRadius=3;
        });
      }

      if(type==='line'){
        (chart.data.datasets||[]).forEach(ds=>{
          ds.pointRadius=count>40 ? 2.5 : 3.5;
          ds.pointHoverRadius=7;
          ds.pointHitRadius=14;
          ds.borderWidth=2.2;
        });
      }
    },

    buildStage(chart){
      const canvas=chart.canvas;
      const wrap=canvas.closest('.chart-wrap');
      if(!canvas || !wrap) return null;

      let stage=canvas.parentElement;
      if(!stage || !stage.classList.contains('wce-scroll-stage')){
        stage=document.createElement('div');
        stage.className='wce-scroll-stage';

        /* Move the existing chart canvas into the stage without recreating it. */
        wrap.insertBefore(stage,canvas);
        stage.appendChild(canvas);
      }

      if(!wrap.querySelector('.wce-scroll-hint')){
        const hint=document.createElement('div');
        hint.className='wce-scroll-hint';
        hint.textContent='Scroll horizontally to read all X-axis labels';
        wrap.appendChild(hint);
      }

      return stage;
    },

    configure(chart){
      if(!chart || !chart.canvas || !chart.data) return;

      const card=chart.canvas.closest('.chart-card');
      if(!card) return;

      const stage=this.buildStage(chart);
      if(!stage) return;

      chart.options.responsive=true;
      chart.options.maintainAspectRatio=false;
      chart.options.animation=false;

      const expanded=card.classList.contains('final-chart-expanded');
      this.spacing(chart,expanded);

      /*
       * Critical Chart.js behavior:
       * let the stage determine the responsive chart dimensions.
       * Do not repeatedly assign canvas.width/canvas.height ourselves.
       */
      chart.canvas.style.width='100%';
      chart.canvas.style.height='100%';
      chart.canvas.style.minWidth='0';
      chart.canvas.style.maxWidth='none';

      try{
        chart.resize();
        chart.update('none');
      }catch(e){}

      /* The stage may be resized by Chart.js one frame later. Re-apply once. */
      requestAnimationFrame(()=>{
        try{
          this.spacing(chart,expanded);
          chart.resize();
          chart.update('none');
        }catch(e){}
      });
    },

    hookCard(card){
      if(!card || this.hooked.has(card)) return;
      const canvas=card.querySelector('canvas');
      if(!canvas || typeof Chart==='undefined') return;

      let chart;
      try{ chart=Chart.getChart(canvas); }catch(e){ return; }
      if(!chart) return;

      this.hooked.add(card);

      const button=card.querySelector('.final-chart-expand');
      if(button){
        button.addEventListener('click',()=>{
          setTimeout(()=>this.configure(chart),60);
          setTimeout(()=>this.configure(chart),250);
          setTimeout(()=>this.configure(chart),700);
        });
      }

      this.configure(chart);

      /* Keep the chart's internal stage synchronized with card width. */
      if(typeof ResizeObserver!=='undefined'){
        const ro=new ResizeObserver(()=>{
          clearTimeout(card.__wceFinalResize);
          card.__wceFinalResize=setTimeout(()=>this.configure(chart),80);
        });
        ro.observe(card);
        card.__wceFinalRO=ro;
      }
    },

    scan(){
      if(typeof Chart==='undefined') return;
      document.querySelectorAll('.chart-card').forEach(card=>this.hookCard(card));
    }
  };

  window.DefinitiveChartScrollFix=FIX;

  function boot(){
    FIX.scan();
    setTimeout(()=>FIX.scan(),250);
    setTimeout(()=>FIX.scan(),800);
    setTimeout(()=>FIX.scan(),1600);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',boot);
  }else{
    boot();
  }

  new MutationObserver(()=>{
    clearTimeout(window.__definitiveChartScan);
    window.__definitiveChartScan=setTimeout(()=>FIX.scan(),100);
  }).observe(document.documentElement,{childList:true,subtree:true});

})();
</script>

<script id="final-world-class-chart-fix-js">
(function(){
  'use strict';

  const FINAL_CHARTS = {
    cards: new WeakSet(),
    timer: null,

    shortDate(value){
      const s=String(value ?? '');
      let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(!m) m=s.match(/^(\d{2})-(\w{3})-(\d{2,4})$/i);

      if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
        const d=new Date(Number(s.slice(0,4)),Number(s.slice(5,7))-1,Number(s.slice(8,10)));
        if(!Number.isNaN(d.getTime())){
          return [
            d.toLocaleDateString(undefined,{day:'2-digit'}),
            d.toLocaleDateString(undefined,{month:'short'})
          ];
        }
      }
      return null;
    },

    labelLines(value){
      const s=String(value ?? '');
      const date=this.shortDate(s);
      if(date) return date;

      /* Common ISO week labels remain compact but unambiguous. */
      if(/^\d{4}-W\d{1,2}$/i.test(s)){
        return [s.slice(0,4),s.slice(5)];
      }

      if(s.length<=14) return s;

      const words=s.split(/\s+/);
      const lines=[];
      let line='';
      words.forEach(word=>{
        const next=line ? line+' '+word : word;
        if(next.length>14 && line){
          lines.push(line);
          line=word;
        }else{
          line=next;
        }
      });
      if(line) lines.push(line);
      return lines.slice(0,3);
    },

    fullLabel(value){
      return String(value ?? '');
    },

    chartHeight(card){
      return card.classList.contains('final-chart-expanded') ? 400 : 340;
    },

    pixelsPerCategory(chart,expanded){
      const count=Array.isArray(chart.data?.labels) ? chart.data.labels.length : 0;
      if(count<=1) return 0;

      /* Deliberately generous spacing. The point is to READ the axis,
         not to make all 30 days fit into a 700px card. */
      if(expanded){
        if(count>=60) return 125;
        if(count>=45) return 120;
        if(count>=30) return 115;
        if(count>=20) return 110;
        if(count>=12) return 105;
        return 100;
      }

      if(count>=60) return 82;
      if(count>=45) return 78;
      if(count>=30) return 74;
      if(count>=20) return 70;
      if(count>=12) return 66;
      return 0;
    },

    setupContainer(chart){
      const canvas=chart.canvas;
      const wrap=canvas.closest('.chart-wrap');
      if(!canvas || !wrap) return null;

      let viewport=wrap.querySelector('.wc-final-viewport');
      let content=wrap.querySelector('.wc-final-content');

      if(!viewport){
        viewport=document.createElement('div');
        viewport.className='wc-final-viewport';

        content=document.createElement('div');
        content.className='wc-final-content';

        /* Preserve the actual canvas and its existing Chart.js listeners. */
        const parent=canvas.parentNode;
        parent.insertBefore(viewport,canvas);
        viewport.appendChild(content);
        content.appendChild(canvas);

        /* Remove any previous scroll-stage wrappers that may now be empty. */
        Array.from(wrap.children).forEach(el=>{
          if(el!==viewport && el.classList?.contains('wce-scroll-stage')){
            while(el.firstChild){
              content.appendChild(el.firstChild);
            }
            el.remove();
          }
        });
      }else if(!content){
        content=document.createElement('div');
        content.className='wc-final-content';
        viewport.appendChild(content);
        content.appendChild(canvas);
      }else if(canvas.parentElement!==content){
        content.appendChild(canvas);
      }

      let note=wrap.querySelector('.wc-final-scroll-note');
      if(!note){
        note=document.createElement('div');
        note.className='wc-final-scroll-note';
        note.textContent='Scroll horizontally to read every label';
        wrap.appendChild(note);
      }

      return {wrap,viewport,content,canvas};
    },

    configure(chart){
      if(!chart || !chart.canvas || !chart.data) return;

      const card=chart.canvas.closest('.chart-card');
      if(!card) return;

      const parts=this.setupContainer(chart);
      if(!parts) return;

      const {wrap,viewport,content,canvas}=parts;
      const labels=Array.isArray(chart.data.labels) ? chart.data.labels : [];
      const count=labels.length;
      const expanded=card.classList.contains('final-chart-expanded');
      const height=this.chartHeight(card);
      const per=this.pixelsPerCategory(chart,expanded);
      const viewportWidth=Math.max(360,viewport.clientWidth || wrap.clientWidth || 760);

      /* TRUE fixed-size Chart.js mode.
         This is the key correction: Chart.js is no longer allowed to
         squeeze the canvas to the card width. */
      chart.options.responsive=false;
      chart.options.maintainAspectRatio=false;
      chart.options.animation=false;

      const targetWidth=per
        ? Math.max(viewportWidth,Math.ceil(count*per))
        : viewportWidth;

      content.style.width=targetWidth+'px';
      content.style.minWidth=targetWidth+'px';
      content.style.maxWidth='none';
      content.style.height=height+'px';

      canvas.style.width=targetWidth+'px';
      canvas.style.height=height+'px';
      canvas.style.minWidth=targetWidth+'px';
      canvas.style.maxWidth='none';

      const x=chart.options.scales?.x;
      if(x){
        const type=String(chart.config?.type || '').toLowerCase();

        x.type='category';
        x.offset=(type==='bar');

        x.ticks=Object.assign({},x.ticks||{},{
          autoSkip:false,
          maxTicksLimit:undefined,
          sampleSize:count,
          includeBounds:true,
          padding:8,
          maxRotation:0,
          minRotation:0,
          align:'center',
          color:(x.ticks||{}).color || '#667085',
          font:Object.assign({},(x.ticks||{}).font||{},{
            size:11,
            weight:'500'
          }),
          callback:function(value,index){
            return FINAL_CHARTS.labelLines(labels[index]);
          }
        });

        x.grid=Object.assign({},x.grid||{},{
          offset:(type==='bar'),
          drawTicks:true,
          color:(x.grid||{}).color || 'rgba(100,115,135,.16)'
        });

        x.border=Object.assign({},x.border||{},{
          color:(x.border||{}).color || 'rgba(100,115,135,.40)'
        });
      }

      const y=chart.options.scales?.y;
      if(y){
        y.ticks=Object.assign({},y.ticks||{},{
          maxTicksLimit:7,
          padding:8,
          color:(y.ticks||{}).color || '#667085',
          font:Object.assign({},(y.ticks||{}).font||{},{
            size:11,
            weight:'500'
          })
        });
      }

      /* Keep visual marks compact inside the generous category spacing. */
      const type=String(chart.config?.type || '').toLowerCase();
      if(type==='bar'){
        (chart.data.datasets||[]).forEach(ds=>{
          ds.barPercentage=0.34;
          ds.categoryPercentage=0.50;
          ds.maxBarThickness=28;
          ds.borderRadius=3;
          ds.borderSkipped=false;
        });
      }

      if(type==='line'){
        (chart.data.datasets||[]).forEach(ds=>{
          ds.pointRadius=count>45 ? 2.5 : 3.5;
          ds.pointHoverRadius=7;
          ds.pointHitRadius=14;
          ds.borderWidth=2.2;
        });
      }

      try{
        /*
         * Chart.resize(width,height) is used explicitly. This makes the
         * category geometry, grid, labels and points all share the exact
         * same wide coordinate system.
         */
        chart.resize(targetWidth,height);
        chart.update('none');
      }catch(e){
        try{
          chart.canvas.width=targetWidth;
          chart.canvas.height=height;
          chart.update('none');
        }catch(ignore){}
      }

      /* Keep horizontal scroll position stable when a chart is re-rendered. */
      if(viewport.__finalScrollLeft!=null){
        viewport.scrollLeft=Math.min(
          viewport.__finalScrollLeft,
          Math.max(0,viewport.scrollWidth-viewport.clientWidth)
        );
      }
    },

    hook(card){
      const canvas=card.querySelector('canvas');
      if(!canvas || typeof Chart==='undefined') return;

      let chart;
      try{ chart=Chart.getChart(canvas); }catch(e){ return; }
      if(!chart) return;

      this.configure(chart);

      if(this.cards.has(card)) return;
      this.cards.add(card);

      const parts=this.setupContainer(chart);
      const viewport=parts?.viewport;

      if(viewport){
        viewport.addEventListener('scroll',()=>{
          viewport.__finalScrollLeft=viewport.scrollLeft;
        },{passive:true});
      }

      const button=card.querySelector('.final-chart-expand');
      if(button){
        button.addEventListener('click',()=>{
          setTimeout(()=>this.configure(chart),40);
          setTimeout(()=>this.configure(chart),180);
          setTimeout(()=>this.configure(chart),500);
        });
      }
    },

    scan(){
      if(typeof Chart==='undefined') return;
      document.querySelectorAll('.chart-card').forEach(card=>this.hook(card));
    }
  };

  window.FinalWorldClassCharts=FINAL_CHARTS;

  /* Neutralize the older width setters so they cannot immediately undo
     the fixed-width scroll model. */
  try{
    if(window.WorldClassCharts){
      window.WorldClassCharts.setCanvasWidth=function(){};
    }
    if(window.DefinitiveChartScrollFix){
      window.DefinitiveChartScrollFix.spacing=function(){};
    }
    window.applyScrollableChartXAxis=function(){};
  }catch(e){}

  function boot(){
    FINAL_CHARTS.scan();
    setTimeout(()=>FINAL_CHARTS.scan(),100);
    setTimeout(()=>FINAL_CHARTS.scan(),400);
    setTimeout(()=>FINAL_CHARTS.scan(),900);
    setTimeout(()=>FINAL_CHARTS.scan(),1800);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',boot);
  }else{
    boot();
  }

  new MutationObserver(()=>{
    clearTimeout(FINAL_CHARTS.timer);
    FINAL_CHARTS.timer=setTimeout(()=>FINAL_CHARTS.scan(),100);
  }).observe(document.documentElement,{childList:true,subtree:true});

  window.addEventListener('resize',()=>{
    clearTimeout(FINAL_CHARTS.timer);
    FINAL_CHARTS.timer=setTimeout(()=>FINAL_CHARTS.scan(),180);
  });

})();
</script>


<!-- ================================================================

       • no visible full-page refresh during ordinary updates

<style id="bqc-instant-render-stability">
/* Never let the application expose an empty root while a view is being rebuilt. */
#root{min-height:100vh;contain:layout style;}
body.bqc-rendering #root{min-height:100vh;}
/* A screen swap should feel like navigation, not a page reload. */
#root>.view-fade{animation:none!important;}
@media(prefers-reduced-motion:reduce){#root>.view-fade{animation:none!important;}}
</style>

<script id="bqc-usability-upgrade-js">
(function(){
  'use strict';

  /* ---------- Lightweight, non-rendering toast ---------- */
  const originalToast = window.toast;

  window.toast = function(message){
    const msg=String(message ?? '');
    let box=document.getElementById('bqc-live-toast');

    if(!box){
      box=document.createElement('div');
      box.id='bqc-live-toast';
      document.body.appendChild(box);
    }

    box.textContent=msg;
    box.classList.add('show');

    clearTimeout(window.__bqcToastTimer);
    window.__bqcToastTimer=setTimeout(()=>{
      box.classList.remove('show');
    },2800);
  };

  /* Keep the function binding used by the application pointed at the quiet
     implementation as well as window.toast. */
  try{ toast=window.toast; }catch(e){}

  /* ---------- Update-available bar ----------
     Background sync may change STATE, but it never forces the user's screen
     to rebuild. The user decides when the new data is painted. */
  function ensureUpdateBar(){
    let bar=document.getElementById('bqc-update-available');
    if(bar) return bar;

    bar=document.createElement('div');
    bar.id='bqc-update-available';
    bar.innerHTML=
      '<span class="bqc-update-text">New shared data is available.</span>'+
      '<button type="button" class="bqc-update-apply">Update</button>'+
      '<button type="button" class="bqc-update-later">Later</button>';

    document.body.appendChild(bar);

    bar.querySelector('.bqc-update-apply').addEventListener('click',()=>{
      bar.classList.remove('show');
      window.__bqcPendingUpdate=false;
      try{ render(); }catch(e){ console.error('Update render failed',e); }
    });

    bar.querySelector('.bqc-update-later').addEventListener('click',()=>{
      bar.classList.remove('show');
      window.__bqcPendingUpdate=false;
    });

    return bar;
  }

  window.markBqcUpdateAvailable=function(message){
    window.__bqcPendingUpdate=true;
    const bar=ensureUpdateBar();
    const text=bar.querySelector('.bqc-update-text');
    if(text) text.textContent=message || 'New shared data is available.';
    bar.classList.add('show');
  };

  /* ---------- Scroll / focus continuity ----------
     Every normal render keeps the user's current reading position.
     Navigation is the one intentional exception: it starts the destination
     at its natural top position. */
  let navigationResetPending=false;

  document.addEventListener('click',function(e){
    const nav=e.target.closest && e.target.closest('.nav-item');
    if(nav) navigationResetPending=true;
  },true);

  const originalRender=window.render;

  window.render=function(){
    const preserve=!navigationResetPending;
    navigationResetPending=false;

    const y=window.scrollY || document.documentElement.scrollTop || 0;

    const active=document.activeElement;
    const hadInput=active && document.getElementById('root')?.contains(active);
    const fkey=hadInput ? active.dataset?.fkey : null;
    const selStart=hadInput && typeof active.selectionStart==='number' ? active.selectionStart : null;
    const selEnd=hadInput && typeof active.selectionEnd==='number' ? active.selectionEnd : null;

    let nested=[];
    if(typeof captureBqcNestedScroll==='function'){
      try{ nested=captureBqcNestedScroll(); }catch(e){}
    }

    originalRender();

    if(!preserve) return;

    const restore=()=>{
      try{
        window.scrollTo({top:y,left:0,behavior:'auto'});
      }catch(e){
        window.scrollTo(0,y);
      }

      if(Array.isArray(nested)){
        nested.forEach(item=>{
          try{
            const nodes=document.querySelectorAll(item.selector||'');
            const node=nodes[item.index||0];
            if(node){
              node.scrollLeft=Number(item.left)||0;
              node.scrollTop=Number(item.top)||0;
            }
          }catch(e){}
        });
      }

      if(fkey){
        const safe=String(fkey).replace(/"/g,'');
        const node=document.querySelector('[data-fkey="'+safe+'"]');
        if(node){
          try{
            node.focus({preventScroll:true});
            if(selStart!=null && typeof node.setSelectionRange==='function'){
              node.setSelectionRange(selStart,selEnd);
            }
          }catch(e){}
        }
      }
    };

    /* Two passes handle charts/tables that settle their dimensions on the
       following frame without visibly moving the user's page. */
    requestAnimationFrame(restore);
    requestAnimationFrame(()=>requestAnimationFrame(restore));
  };

  try{ render=window.render; }catch(e){}

  /* ---------- Prevent accidental loss of active work ---------- */
  window.addEventListener('beforeunload',function(e){
    try{
      if(
        STATE &&
        STATE.role==='omtech' &&
        STATE.stage===1 &&
        typeof draftHasUserData==='function' &&
        draftHasUserData(STATE.intakeDraft)
      ){
        if(typeof saveIntakeDraftLocal==='function') saveIntakeDraftLocal(STATE.intakeDraft);
      }
    }catch(err){}
  });

  /* ---------- Replace explicit connection/import reloads with in-place updates ---------- */
  window.bqcFinishWithoutReload=function(message){
    try{
      if(message) window.toast(message);
      if(typeof scheduleBackgroundDataRefresh==='function'){
        scheduleBackgroundDataRefresh().catch(()=>{});
      }
      window.markBqcUpdateAvailable('Data changed. Update this screen when convenient.');
    }catch(e){}
  };

  /* ---------- Smooth section navigation without page-level motion ---------- */
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    const bar=document.getElementById('bqc-update-available');
    if(bar) bar.classList.remove('show');
  });

  /* ---------- Make background sync genuinely quiet ----------
     Existing autoRefreshDocket already skips active forms and open records.
     Its changed-data path was changed to markBqcUpdateAvailable instead of
     silently rebuilding the entire page. */
  window.addEventListener('online',()=>{
    if(typeof autoRefreshDocket==='function' && !document.hidden){
      setTimeout(()=>autoRefreshDocket(),500);
    }
  });

})();
</script>

 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Battery QC — Namanve | Operations Control Center</title>
<style>
:root {
  --bg: #f3f5f9;
  --bg-accent: #eef2ff;
  --panel: #ffffff;
  --panel2: #f6f7fb;
  --line: #e6e9f2;
  --line-dark: #d7dcec;
  --text: #10142a;
  --muted: #667085;
  --accent: #4f46e5;
  --accent-soft: #eef0ff;
  --accent2: #0ea5e9;
  --pass: #059669;
  --pass-bg: #ecfdf5;
  --fail: #dc2626;
  --fail-bg: #fef2f2;
  --warn: #d97706;
  --warn-bg: #fffbeb;
  --capa: #9333ea;
  --capa-bg: #faf5ff;
  --shadow-sm: 0 1px 2px rgba(16,20,42,.04), 0 1px 1px rgba(16,20,42,.03);
  --shadow-md: 0 4px 16px rgba(16,20,42,.08), 0 1px 3px rgba(16,20,42,.06);
  --shadow-lg: 0 12px 32px rgba(16,20,42,.14), 0 3px 8px rgba(16,20,42,.08);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}
 
[data-theme="dark"] {
  --bg: #0b1020;
  --bg-accent: #0f1530;
  --panel: #161c33;
  --panel2: #1f2745;
  --line: #2a3358;
  --line-dark: #3a4570;
  --text: #f1f3fb;
  --muted: #99a3c4;
  --accent: #818cf8;
  --accent-soft: rgba(129,140,248,.14);
  --accent2: #38bdf8;
  --pass: #4ade80;
  --pass-bg: rgba(74, 222, 128, 0.12);
  --fail: #f87171;
  --fail-bg: rgba(248, 113, 113, 0.12);
  --warn: #fb923c;
  --warn-bg: rgba(251, 146, 60, 0.12);
  --capa: #c4b5fd;
  --capa-bg: rgba(196, 181, 253, 0.14);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,.4);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
}
 
* { box-sizing: border-box; }
 
body {
  margin: 0;
  background: radial-gradient(1200px 800px at 10% -10%, var(--bg-accent), transparent 60%),
              radial-gradient(1000px 700px at 110% 10%, var(--bg-accent), transparent 55%),
              var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
 
.app { max-width: 1100px; margin: 0 auto; padding: 16px; }
 
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--panel); border: 1.5px solid var(--line-dark);
  border-radius: 10px; margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
  position: relative; overflow: hidden; box-shadow: var(--shadow-md);
}
.header::before{
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background: linear-gradient(90deg, var(--accent), var(--pass), var(--capa), var(--warn), var(--accent));
  background-size: 300% 100%;
  animation: gradientMove 7s ease infinite;
}
.brand h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: 0.2px; color: var(--text); }
.brand p { margin: 0; font-size: 11px; color: var(--muted); }
 
.user-info { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.badge {
  padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; background: var(--accent-soft); border: 1.5px solid var(--accent); color: var(--accent);
}
 
button {
  font-family: var(--font-sans); cursor: pointer; border: 1.5px solid var(--line-dark);
  background: var(--panel); color: var(--text); border-radius: 6px;
  padding: 6px 12px; font-size: 12px; font-weight: 600;
  transition: transform .14s cubic-bezier(.34,1.56,.64,1), box-shadow .16s ease, background-color .14s ease, opacity .12s ease, border-color .14s ease;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: var(--shadow-sm);
}
button:hover:not(:disabled) { background: var(--panel2); border-color: var(--accent); transform: translateY(-1.5px); box-shadow: var(--shadow-md); }
button:active:not(:disabled) { transform: translateY(0) scale(.96); box-shadow: var(--shadow-sm); }
button:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; box-shadow: var(--shadow-md); }
.btn-primary:hover:not(:disabled) { opacity: 0.94; filter: brightness(1.05); background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: var(--shadow-lg); }
.btn-danger { background: var(--fail-bg); border-color: var(--fail); color: var(--fail); }
.btn-danger:hover:not(:disabled) { background: var(--fail); color: #fff; border-color: var(--fail); }
.btn-capa { background: var(--capa-bg); border-color: var(--capa); color: var(--capa); }
.btn-capa:hover:not(:disabled) { background: var(--capa); color: #fff; border-color: var(--capa); }
.btn-sm { padding: 3px 8px; font-size: 11px; }
.btn-block { width: 100%; }
 
.spinner{
  width:11px; height:11px; border-radius:50%;
  border: 2px solid currentColor; border-right-color: transparent; border-bottom-color: transparent;
  display:inline-block; opacity:.85; animation: spin .6s linear infinite;
}
 
.theme-toggle select {
  padding: 3px 6px; font-size: 11px; border-radius: 3px; background: var(--panel);
  color: var(--text); border: 1px solid var(--line-dark); font-family: var(--font-sans);
}
 
.gate {
  max-width: 380px; margin: 10vh auto 0; padding: 24px;
  background: var(--panel); border: 1px solid var(--line-dark); border-radius: 4px;
  animation: fadeInUp .3s ease;
}
.gate h2 { margin-top: 0; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.gate p { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
.pin-hint { font-size: 10px; color: var(--muted); margin-top: 4px; }
 
.nav { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1.5px solid var(--line-dark); padding-bottom: 8px; flex-wrap: wrap; align-items: center; }
.nav button { background: transparent; color: var(--muted); border: none; box-shadow: none; border-radius: 6px; font-size: 12px; font-weight: 600; padding: 7px 13px; position: relative; transition: background-color .15s ease, color .15s ease, transform .1s ease; }
.nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav button.active::after {
  content:''; position:absolute; left:10%; right:10%; bottom:-9px; height:2.5px;
  background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px;
  animation: underlineGrow .25s cubic-bezier(.34,1.56,.64,1) both;
}
.nav button:hover:not(.active) { color: var(--text); background: var(--panel2); }
 
.card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  position: relative; overflow: hidden;
}
.card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  opacity: 0; transition: opacity .2s ease;
}
.card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); border-color: var(--accent); }
.card:hover::before { opacity: 1; }
.card h3 { margin: 0 0 2px; font-size: 13px; font-weight: 700; color: var(--text); }
.card .sub { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
 
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 12px; }
.grid.narrow { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
 
label { display: block; font-size: 10px; font-weight: 700; color: var(--muted); margin: 8px 0 4px; text-transform: uppercase; letter-spacing: 0.3px; }
input, select, textarea {
  width: 100%; padding: 7px 9px; background: var(--panel); color: var(--text);
  border: 1.5px solid var(--line-dark); border-radius: 6px; font-size: 12px; font-family: var(--font-sans);
  transition: border-color .15s ease, box-shadow .15s ease, transform .1s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
input:hover:not(:focus), select:hover:not(:focus), textarea:hover:not(:focus) { border-color: var(--accent2); }
textarea { resize: vertical; min-height: 50px; }
.id-textarea { min-height: 72px; font-size: 11px; }
.id-count { font-size: 10px; color: var(--muted); margin-top: 4px; font-weight: 600; }
.id-count.ok { color: var(--pass); }
.id-count.over { color: var(--warn); }
 
.banner {
  padding: 9px 13px; border-radius: 8px; font-size: 11px; margin-bottom: 12px;
  border: 1.5px solid var(--warn); background: var(--warn-bg); color: var(--warn); font-weight: 600;
  animation: toastIn .22s cubic-bezier(.34,1.56,.64,1);
  box-shadow: var(--shadow-sm);
}
.banner.ok { border-color: var(--pass); background: var(--pass-bg); color: var(--pass); }
.banner.capa { border-color: var(--capa); background: var(--capa-bg); color: var(--capa); }
.banner.err { border-color: var(--fail); background: var(--fail-bg); color: var(--fail); }
 
.check-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--line); border-radius: 4px; transition: background-color .12s ease; }
.check-row:hover { background: var(--panel2); }
.check-row:last-child { border-bottom: none; }
.check-row span { font-size: 12px; }
 
.seg { display: flex; border: 1.5px solid var(--line-dark); border-radius: 6px; overflow: hidden; }
.seg button { border-radius: 0; padding: 2px 8px; font-size: 10px; background: var(--panel); color: var(--muted); border: none; border-right: 1px solid var(--line-dark); box-shadow: none; }
.seg button:hover:not(:disabled){ transform:none; box-shadow:none; }
.seg button:last-child { border-right: none; }
.seg button.sel-pass { background: var(--pass-bg); color: var(--pass); font-weight: 700; animation: chipPop .22s ease both; }
.seg button.sel-fail { background: var(--fail-bg); color: var(--fail); font-weight: 700; animation: chipPop .22s ease both; }
.seg button.sel-na { background: var(--panel2); color: var(--text); }
 
.bool-row { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-bottom: 1px solid var(--line); border-radius: 4px; transition: background-color .12s ease; }
.bool-row:hover { background: var(--panel2); }
.bool-row input { width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: var(--accent); transition: transform .15s cubic-bezier(.34,1.56,.64,1); }
.bool-row input:checked { transform: scale(1.15); }
.bool-row label { margin: 0; color: var(--text); font-size: 12px; text-transform: none; font-weight: 400; cursor: pointer; }
 
.status-chip {
  display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase;
  animation: chipPop .28s cubic-bezier(.34,1.56,.64,1) both;
  letter-spacing: .2px;
}
.status-chip.PASS, .status-chip.CLOSED_PASS { background: var(--pass-bg); color: var(--pass); border: 1.5px solid var(--pass); }
.status-chip.FAIL, .status-chip.CLOSED_SCRAPPED { background: var(--fail-bg); color: var(--fail); border: 1.5px solid var(--fail); }
.status-chip.INCOMPLETE, .status-chip.NA, .status-chip.PENDING { background: var(--panel2); color: var(--muted); border: 1.5px solid var(--line-dark); }
.status-chip.CAPA { background: var(--capa-bg); color: var(--capa); border: 1.5px solid var(--capa); }
.status-chip.OPEN { background: var(--warn-bg); color: var(--warn); border: 1.5px solid var(--warn); }
.status-chip.CLOSED_TRANSFERRED_BSA { background: var(--capa-bg); color: var(--capa); border: 1.5px solid var(--capa); }
 
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
.stat { background: var(--panel); border: 1.5px solid var(--line-dark); border-left: 3px solid var(--accent); border-radius: 8px; padding: 12px; transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, border-color .18s ease; box-shadow: var(--shadow-sm); }
.stat:hover { transform: translateY(-3px) scale(1.02); box-shadow: var(--shadow-lg); border-color: var(--accent); }
.stat .n { font-size: 21px; font-weight: 800; color: var(--text); letter-spacing: -.3px; }
.stat .l { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
 
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 10px; background: var(--panel2); position: sticky; top: 0; border-bottom: 1.5px solid var(--line-dark); }
.table-wrap { overflow-x: auto; border: 1.5px solid var(--line-dark); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow-sm); }
tr { transition: background-color .12s ease; animation: fadeInUp .22s ease both; }
tr:hover td { background: var(--accent-soft); }
.mono { font-family: var(--font-mono); }
 
.footer-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; border-top: 1.5px solid var(--line-dark); align-items:center; }
.err { color: var(--fail); font-size: 11px; margin-top: 6px; }
.sop-box { background: var(--panel2); border: 1.5px solid var(--line-dark); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 11px; }
.docket-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 6px; border-bottom: 1px solid var(--line); border-radius: 6px; transition: background-color .12s ease; }
.docket-item:hover { background: var(--panel2); }
.docket-item:last-child { border-bottom: none; }
.docket-item .meta { font-size: 11px; color: var(--muted); }
.empty-note { padding: 12px 0; color: var(--muted); font-size: 12px; }
.sector-tag {
  display: inline-block; padding: 4px 9px; border-radius: 6px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 12px; border: 1.5px solid var(--accent);
  background: var(--accent-soft); color: var(--accent);
}
.chart-card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; animation: popIn .3s cubic-bezier(.34,1.56,.64,1) both; transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease; box-shadow: var(--shadow-sm); }
.chart-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); border-color: var(--accent2); }
.chart-card .chart-wrap { position: relative; height: 260px; }
.chart-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.sync-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; background: var(--pass); animation: pulseDot 2.4s ease-in-out infinite; }
.sync-dot.bad { background: var(--fail); animation: none; }
.sync-line { font-size: 10px; color: var(--muted); display:flex; align-items:center; }
.server-badge{font-size:10px;color:var(--muted);margin-top:3px;}
 
.boot-loader{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:9999; }
.boot-card{ text-align:center; }
.boot-spinner{ width:30px; height:30px; border-radius:50%; border:3px solid var(--line-dark); border-top-color:var(--accent); margin:0 auto 10px; animation: spin .7s linear infinite; }
.boot-text{ font-size:12px; color:var(--muted); }
 
@keyframes fadeInUp { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform:translateY(0);} }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulseDot { 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.5; transform:scale(1.3);} }
@keyframes toastIn { from{ opacity:0; transform:translateY(-6px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }
@keyframes gradientMove { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
@keyframes viewFade { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
@keyframes chipPop { 0%{ opacity:0; transform:scale(.6);} 60%{ transform:scale(1.12);} 100%{ opacity:1; transform:scale(1);} }
@keyframes underlineGrow { from{ transform:scaleX(0); opacity:0;} to{ transform:scaleX(1); opacity:1;} }
@keyframes softGlow { 0%,100%{ box-shadow: 0 0 0 0 var(--accent-soft);} 50%{ box-shadow: 0 0 0 6px var(--accent-soft);} }
@keyframes popIn { from{ opacity:0; transform: scale(.92) translateY(4px);} to{ opacity:1; transform: scale(1) translateY(0);} }

.view-fade { animation: viewFade .28s cubic-bezier(.2,.7,.3,1); }
.card, .chart-card, .stat { animation: popIn .3s cubic-bezier(.34,1.56,.64,1) both; }
tbody tr, .docket-item, .day-log-item { animation-delay: calc(var(--row-i, 0) * 30ms); }
input, select, textarea, button { transition: transform .1s ease, box-shadow .12s ease, background-color .12s ease, border-color .12s ease, opacity .12s ease; }
button:active:not(:disabled) { transform: scale(.97); }
.reminder-banner{
  padding:10px 12px; border-radius:4px; font-size:12px; font-weight:600; margin-bottom:12px;
  background: var(--warn-bg); color: var(--warn); border:1px solid var(--warn);
  display:flex; align-items:center; gap:8px; animation: fadeInUp .3s ease, pulseDot 2.6s ease-in-out infinite;
}
.day-log-item{ border:1px solid var(--line-dark); border-radius:4px; padding:10px 12px; margin-bottom:8px; }
.day-log-item.closed{ opacity:.7; }
.export-check-row{ display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); font-size:12px; }
.export-check-row input{ width:14px; height:14px; margin:0; accent-color:var(--accent); cursor:pointer; }
.export-check-row label{ margin:0; text-transform:none; font-weight:400; color:var(--text); font-size:12px; cursor:pointer; }
.preview-scroll{ max-height:220px; overflow:auto; border:1px solid var(--line-dark); border-radius:3px; }

.smart-id{display:flex;flex-direction:column;gap:6px;}
.smart-id-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.smart-id-platform{width:auto;min-width:112px;flex:0 0 auto;}
.id-prefix{display:inline-flex;align-items:center;padding:7px 9px;border:1.5px solid var(--accent);border-radius:6px;background:var(--accent-soft);color:var(--accent);font:700 11px var(--font-mono);white-space:nowrap;}
.id-suffix{font-family:var(--font-mono)!important;}
.smart-id-hint{font-size:10px;color:var(--muted);line-height:1.35;}
.smart-id-hint strong{color:var(--text);}
.id-count-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;}
.id-count-row .id-count{margin-top:0;}
.bulk-id-box{position:relative;}
.bulk-id-box textarea{min-height:96px;padding-right:12px;}
.id-token-preview{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;max-height:70px;overflow:auto;}
.id-token{font:600 9px var(--font-mono);padding:3px 5px;border:1px solid var(--line-dark);border-radius:4px;background:var(--panel2);}
.battery-link{border:none;background:transparent;color:var(--accent);font:700 11px var(--font-mono);padding:0;text-decoration:underline;text-decoration-style:dotted;box-shadow:none;cursor:pointer;}
.battery-link:hover{color:var(--accent2);transform:none;box-shadow:none;background:transparent;}
.chart-card .chart-wrap{cursor:pointer;}
.chart-card .chart-wrap::after{content:'Click a segment/bar for details';position:absolute;right:6px;bottom:2px;font-size:9px;color:var(--muted);opacity:.7;pointer-events:none;}
#battery-modal,#chart-modal{position:fixed;inset:0;z-index:9700;display:none;align-items:center;justify-content:center;background:rgba(10,14,30,.58);padding:16px;}
.modal-card{width:min(900px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1.5px solid var(--line-dark);border-radius:12px;box-shadow:var(--shadow-lg);}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1.5px solid var(--line);}
.modal-title{font-size:15px;font-weight:800;}
.modal-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.modal-body{padding:14px 16px 18px;}
.modal-close{border:none;background:transparent;color:var(--muted);font-size:18px;padding:2px 6px;box-shadow:none;}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:12px;}
.detail-kv{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);}
.detail-kv .k{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;}
.detail-kv .v{font-size:12px;font-weight:700;margin-top:2px;word-break:break-word;}
.detail-section{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;}
.detail-section h4{margin:0 0 6px;font-size:11px;}
.selection-list{display:grid;gap:5px;max-height:360px;overflow:auto;}
.selection-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);}
.selection-row .meta{font-size:10px;color:var(--muted);}

/* Silent background refresh: suppress entrance animations so polling never causes a visible
   "blink" when the underlying data hasn't meaningfully changed the layout. Only applied for the
   brief instant a background poll re-renders the page — normal user-driven renders keep their
   animations. */
body.silent-refresh .card,
body.silent-refresh .chart-card,
body.silent-refresh .stat,
body.silent-refresh tr,
body.silent-refresh .docket-item,
body.silent-refresh .day-log-item,
body.silent-refresh .status-chip,

body.silent-refresh .view-fade {

  transition: none !important;
}

/* ---- Calm stress-relief background ---- */
body{
  position:relative;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 18%, rgba(91,76,255,.045), transparent 30%),
    radial-gradient(circle at 84% 76%, rgba(37,180,120,.035), transparent 32%),
    var(--bg);
}
body::before,
body::after{
  content:"";
  position:fixed;
  inset:-28%;
  z-index:0;
  pointer-events:none;
  will-change:transform,opacity;
}
/* Slow, soft colour fields move like a gentle breathing pattern. */
body::before{
  opacity:.28;
  filter:blur(18px);
  background:
    radial-gradient(ellipse 32% 24% at 18% 28%, rgba(91,76,255,.13), transparent 72%),
    radial-gradient(ellipse 30% 26% at 78% 68%, rgba(37,180,120,.10), transparent 72%),
    radial-gradient(ellipse 24% 20% at 54% 42%, rgba(196,181,253,.07), transparent 75%);
  animation:bqcCalmBreath 42s ease-in-out infinite;
}
/* Very faint drifting points provide movement without visual noise. */
body::after{
  opacity:.16;
  background:
    radial-gradient(circle at 12% 24%, rgba(255,255,255,.20) 0 1px, transparent 1.8px),
    radial-gradient(circle at 68% 18%, rgba(255,255,255,.14) 0 1px, transparent 1.8px),
    radial-gradient(circle at 84% 74%, rgba(255,255,255,.16) 0 1px, transparent 1.8px),
    radial-gradient(circle at 34% 82%, rgba(255,255,255,.12) 0 1px, transparent 1.8px);
  background-size:210px 210px, 260px 260px, 230px 230px, 290px 290px;
  animation:bqcCalmDrift 70s ease-in-out infinite;
}
#root{position:relative;z-index:1;}
@keyframes bqcCalmBreath{
  0%,100%{transform:scale(1) translate3d(-1%,0,0);opacity:.24;}
  25%{transform:scale(1.035) translate3d(1.5%,-.8%,0);opacity:.29;}
  50%{transform:scale(1.06) translate3d(2%,1.2%,0);opacity:.27;}
  75%{transform:scale(1.03) translate3d(-1%,.7%,0);opacity:.30;}
}
@keyframes bqcCalmDrift{
  0%,100%{transform:translate3d(0,0,0);}
  50%{transform:translate3d(2.5%,-1.5%,0);}
}
@media (prefers-reduced-motion:reduce){
  body::before,body::after{animation:none;}
}

/* ==================== PREMIUM BATTERY MOTION BACKGROUND ==================== */
.ambient-scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;perspective:1200px}
#root{position:relative;z-index:1}
.motion-grid{position:absolute;inset:-10%;opacity:.16;background-image:linear-gradient(rgba(11,99,206,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(0,166,199,.12) 1px,transparent 1px);background-size:54px 54px;transform:perspective(700px) rotateX(58deg) translateY(18%);animation:gridDrift 26s linear infinite}

.battery-cell{position:absolute;width:76px;height:176px;transform-style:preserve-3d;filter:drop-shadow(0 18px 20px rgba(0,65,120,.16));animation:cellFloat 7s ease-in-out infinite}

.battery-cell.c2{left:145px;top:46px;transform:translateZ(-15px) rotateZ(5deg) scale(.94);animation-delay:-2s}
.battery-cell.c3{left:238px;top:105px;transform:translateZ(20px) rotateZ(9deg) scale(.88);animation-delay:-4s}
.cell-body{position:absolute;inset:10px 0 8px;border-radius:38px;background:linear-gradient(90deg,#063b7a 0%,#0b63ce 34%,#00a6c7 58%,#16865a 100%);box-shadow:inset -8px 0 15px rgba(0,0,0,.22),inset 8px 0 12px rgba(255,255,255,.15);transform:translateZ(0)}
.cell-body:after{content:'ION FLOW';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);font:800 8px/1 system-ui;color:rgba(255,255,255,.86);letter-spacing:1.25px;white-space:nowrap}
.cell-cap,.cell-bottom{position:absolute;left:7px;width:62px;height:20px;border-radius:50%;background:radial-gradient(circle at 45% 38%,#eef6fb,#a8b8c6 55%,#4e6679 100%);box-shadow:0 2px 6px rgba(0,0,0,.25);transform:translateZ(12px)}
.cell-cap{top:0}.cell-bottom{bottom:0;transform:translateZ(2px)}
.cell-cap:after{content:'';position:absolute;width:22px;height:8px;border-radius:50%;left:20px;top:5px;background:#7890a1;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.stress-relief{position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-50%) translateZ(-70px);transform-style:preserve-3d;opacity:.38}
.stress-relief .ring{position:absolute;inset:15px;border:1px solid rgba(0,166,199,.55);border-radius:50%;animation:stressSpin 12s linear infinite}
.stress-relief .ring:nth-child(2){inset:32px;border-color:rgba(11,99,206,.48);animation-duration:9s;animation-direction:reverse}
.stress-relief .ring:nth-child(3){inset:49px;border-color:rgba(22,134,90,.5);animation-duration:7s}
.stress-relief .core{position:absolute;left:50%;top:50%;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff 0 15%,#00a6c7 35%,rgba(0,166,199,0) 70%);animation:calmPulse 3.6s ease-in-out infinite}
.motion-label{position:absolute;right:18px;bottom:16px;padding:6px 10px;border:1px solid rgba(11,99,206,.16);border-radius:999px;background:rgba(255,255,255,.56);backdrop-filter:blur(8px);font:600 10px/1 system-ui;color:#0b63ce;letter-spacing:.8px;text-transform:uppercase}
@keyframes cellFloat{0%,100%{translate:0 0 0}50%{translate:0 -7px 5px}}
@keyframes stressSpin{to{transform:rotateZ(360deg) rotateX(18deg)}}
@keyframes calmPulse{0%,100%{scale:.75;opacity:.45}50%{scale:1.35;opacity:.9}}
@keyframes gridDrift{to{transform:perspective(700px) rotateX(58deg) translateY(22%) translateX(54px)}}
@media(max-width:800px){.battery-orbit{transform:translate(-50%,-50%) scale(.72) rotateX(calc(var(--py,0)*8deg)) rotateY(calc(var(--px,0)*14deg))}.motion-label{right:10px;bottom:10px;font-size:8px}}
@media(prefers-reduced-motion:reduce){.motion-grid,.battery-cell,.stress-relief .ring,.stress-relief .core{animation:none!important}}

/* ===== CALM LUXURY USER EXPERIENCE LAYER ===== */
:root{
  --calm-blue:#2563eb;
  --calm-cyan:#06b6d4;
  --calm-green:#10b981;
  --calm-mint:#dff8ef;
  --calm-sky:#e8f4ff;
  --calm-ink:#17324d;
  --calm-glow:rgba(37,99,235,.14);
}
html{scroll-behavior:smooth;}
body{
  background:
    radial-gradient(900px 520px at 8% -8%,rgba(37,99,235,.105),transparent 62%),
    radial-gradient(760px 480px at 96% 4%,rgba(16,185,129,.10),transparent 60%),
    linear-gradient(135deg,#f8fbff 0%,#f5fbfa 52%,#f8fcff 100%);
  color:var(--calm-ink);
}
body::before{
  content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 20% 35%,rgba(6,182,212,.055),transparent 18%),
    radial-gradient(circle at 76% 68%,rgba(16,185,129,.055),transparent 20%),
    radial-gradient(circle at 55% 10%,rgba(37,99,235,.045),transparent 22%);
  filter:blur(18px);animation:bqcCalmBreath 18s ease-in-out infinite;
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.28;
  background-image:radial-gradient(circle,rgba(37,99,235,.08) 0 1px,transparent 1.5px);
  background-size:46px 46px;mask-image:linear-gradient(to bottom,transparent,black 15%,black 85%,transparent);
  animation:bqcCalmDrift 55s ease-in-out infinite;
}
#root{position:relative;z-index:1;}
.card,.stat,.panel,.table-wrap,.sop-box,.boot-card,.modal-card{
  transition:box-shadow .45s ease,transform .45s cubic-bezier(.2,.8,.2,1),border-color .45s ease,background .45s ease;
}
.card:hover,.stat:hover,.panel:hover,.sop-box:hover{
  transform:translateY(-2px);
  border-color:rgba(37,99,235,.20)!important;
  box-shadow:0 18px 45px rgba(31,75,112,.10),0 0 0 1px rgba(6,182,212,.035);
}
button,.nav-item,.nav button{transition:transform .25s ease,box-shadow .3s ease,background .3s ease,border-color .3s ease;}
button:hover,.nav-item:hover,.nav button:hover{transform:translateY(-1px);}
button:active,.nav-item:active,.nav button:active{transform:translateY(0) scale(.985);}
:focus-visible{outline:2px solid rgba(6,182,212,.72)!important;outline-offset:3px;}

/* Calm status colors: never rely on color alone for meaning. */
.badge,.chip,.pill{transition:filter .35s ease,box-shadow .35s ease;}
.badge:hover,.chip:hover,.pill:hover{filter:saturate(1.08);box-shadow:0 5px 18px rgba(37,99,235,.10);}

/* Premium menu: visually rich, but intentionally quiet. */
.nav{
  background:linear-gradient(120deg,rgba(255,255,255,.94),rgba(239,249,255,.91) 48%,rgba(240,253,248,.92));
  box-shadow:0 20px 55px rgba(26,74,111,.10),inset 0 1px rgba(255,255,255,.98);
  border-color:rgba(37,99,235,.14);
}
.nav::after{
  content:"";position:absolute;left:7%;right:7%;top:0;height:2px;border-radius:99px;
  background:linear-gradient(90deg,transparent,var(--calm-blue),var(--calm-cyan),var(--calm-green),transparent);
  opacity:.72;animation:calmMenuGlow 6s ease-in-out infinite;
}
.nav-item.active,.nav button.active{
  box-shadow:0 10px 26px rgba(37,99,235,.14),inset 0 1px rgba(255,255,255,.7);
}

/* A slow ambient aura around the existing battery/stress-relief scene. */
.battery-orbit::before{
  content:"";position:absolute;inset:-48px;border-radius:50%;
  background:radial-gradient(circle,rgba(6,182,212,.10),rgba(37,99,235,.035) 42%,transparent 70%);
  filter:blur(9px);animation:calmAura 7s ease-in-out infinite;pointer-events:none;
}
.stress-relief{filter:drop-shadow(0 8px 24px rgba(6,182,212,.10));}
.stress-relief .ring{filter:drop-shadow(0 0 5px rgba(6,182,212,.10));}
.stress-relief .core{box-shadow:0 0 24px rgba(6,182,212,.18);}

/* Softer loading state: a breathing signal instead of a harsh spinner. */
.boot-spinner,.spinner,.sync-dot{animation-timing-function:ease-in-out!important;}
.sync-dot{box-shadow:0 0 0 0 rgba(16,185,129,.24);animation:calmSignal 3s infinite!important;}

@keyframes calmAura{0%,100%{transform:scale(.94);opacity:.55}50%{transform:scale(1.08);opacity:1}}
@keyframes calmMenuGlow{0%,100%{opacity:.42;transform:scaleX(.86)}50%{opacity:.82;transform:scaleX(1)}}
@keyframes calmSignal{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.12);opacity:.72}50%{box-shadow:0 0 0 7px rgba(16,185,129,.03);opacity:1}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  body::before,body::after,.nav::after,.battery-orbit::before,.sync-dot{animation:none!important;}
  .card,.stat,.panel,.sop-box,button,.nav-item,.nav button{transition:none!important;}
}

  .content,.view,.workspace,.main-content{width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box!important;}

/* ===== GLASSMORPHISM 2.0 · SMOOTH / FRIENDLY WORKSPACE ===== */
:root{

/* ==================== PHYSICS / MATHEMATICAL ORBIT ENGINE ====================
   Decorative background only. It does not touch application state, routing, forms,
   persistence, reports, imports, or operational logic. */
(function initPhysicsAmbience(){
  const canvas = document.getElementById('physics-ambience-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d', {alpha:true, desynchronized:true});
  if(!ctx) return;

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const TAU = Math.PI * 2;
  let W = 0, H = 0, DPR = 1, raf = 0, last = 0, running = true;
  let t = Math.random()*100;
  const pointer = {x:.5,y:.5, tx:.5, ty:.5};
  const palette = [
    [47,129,246],[34,211,238],[99,102,241],[167,139,250],[52,211,153],[251,191,36],[96,165,250]
  ];
  let count = coarse ? 125 : 260;
  const motes = [];
  const orbs = [];

  function resize(){
    const r = canvas.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, coarse ? 1.35 : 1.7);
    W = Math.max(1, Math.floor(r.width)); H = Math.max(1, Math.floor(r.height));
    canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    count = coarse ? Math.min(125, Math.max(60, Math.floor(W*H/7600))) : Math.min(260, Math.max(120, Math.floor(W*H/6200)));
    while(motes.length<count) motes.push(makeMote(motes.length));
    if(motes.length>count) motes.length=count;
    while(orbs.length<12) orbs.push(makeOrb(orbs.length));
  }

  function rnd(a,b){return a+Math.random()*(b-a)}
  function pick(){return palette[(Math.random()*palette.length)|0]}
  function rgb(c,a){return `rgba(${c[0]},${c[1]},${c[2]},${a})`}
  function makeMote(i){
    const c=pick(); return {u:Math.random(),v:Math.random(),spd:rnd(.00005,.00017)*(i%3===0?1.7:1),size:rnd(.5,2.2),phase:rnd(0,TAU),c,life:rnd(0,1)};
  }
  function makeOrb(i){
    return {rx:rnd(.10,.48),ry:rnd(.08,.42),a:rnd(0,TAU),w:rnd(.00015,.00045),tilt:rnd(-.9,.9),size:rnd(2.5,10),c:pick(),phase:rnd(0,TAU),depth:rnd(.2,1)};
  }

  function field(x,y,time,k){
    const nx=x/W-0.5, ny=y/H-0.5;
    const r=Math.hypot(nx,ny)+0.0001;
    const ang=Math.atan2(ny,nx);
    const swirl=0.0017*(Math.sin(time*0.00035+k)+Math.cos(r*22-time*0.00019));
    return {
      x: Math.sin(ny*8.5 + time*.00032 + k)*.9 + Math.cos(ang*3-time*.00021)*.55 - nx*swirl*50,
      y: Math.cos(nx*7.2 - time*.00027 + k*.8)*.7 + Math.sin(ang*4+time*.00016)*.5 - ny*swirl*50
    };
  }

  function drawGlowDot(x,y,r,c,a){
    const g=ctx.createRadialGradient(x,y,0,x,y,r*5);
    g.addColorStop(0,rgb(c,a)); g.addColorStop(.22,rgb(c,a*.62)); g.addColorStop(1,rgb(c,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*5,0,TAU); ctx.fill();
    ctx.fillStyle=rgb(c,Math.min(.95,a*1.35)); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  }

  function curvePoint(type,u,time,seed){
    const a=u*TAU, d=time*.00013+seed;
    const s1=Math.sin(a), c1=Math.cos(a);
    switch(type%18){
      case 0:{const r=.16+.12*Math.sin(3*a+d);return[c1*r,s1*r*.72];}                 // rosette
      case 1:return[Math.sin(3*a+d)*.33,Math.sin(4*a)*.23];                           // Lissajous 3:4
      case 2:{const r=.23+.095*Math.cos(5*a+d);return[c1*r,s1*r];}                     // epicyclic ring
      case 3:{const r=.025+.046*a;return[c1*Math.cos(a+d)*r,s1*Math.sin(a+d)*r];}      // expanding spiral
      case 4:{const r=.25*Math.cos(5*a+d);return[c1*r,s1*r];}                         // rose 5-petal
      case 5:{const q=.31+.075*Math.sin(7*a+d);return[q*Math.cos(2*a),q*.58*Math.sin(2*a)];}
      case 6:return[.29*Math.sin(2*a+d)*c1,.29*Math.sin(2*a+d)*s1];                   // lemniscate-like
      case 7:{const r=.17+.055*Math.cos(9*a+d);return[c1*r,s1*r];}                    // high harmonic ring
      case 8:{const r=.31*Math.exp(-.105*a);return[r*Math.cos(2*a+d),r*Math.sin(2*a+d)];}
      case 9:return[.31*Math.cos(a)+.075*Math.cos(11*a+d),.22*Math.sin(a)+.05*Math.sin(9*a+d)]; // Fourier blend
      case 10:return[.25*Math.sin(6*a+d),.24*Math.sin(7*a+.7*d)];                     // harmonograph
      case 11:{const r=.19+.04*Math.sin(12*a+d);return[r*Math.cos(3*a),r*Math.sin(3*a)];}
      case 12:{const r=.22*(1+Math.cos(a+d));return[r*c1,r*s1*.82];}                  // cardioid
      case 13:{const x=.24*Math.cos(a),y=.24*Math.sin(a);return[x+.065*Math.cos(13*a+d),y+.065*Math.sin(10*a-d)];}
      case 14:{const x=.25*c1, y=.25*s1*.82; return[x*(1+.25*Math.sin(8*a+d)),y*(1+.2*Math.cos(6*a-d))];}
      case 15:{const r=.20+.12*Math.abs(Math.sin(4*a+d)); return[r*c1,r*s1*.74];}      // clover/caustic
      case 16:{const r=.28*Math.tan(.17*Math.sin(3*a+d)); return[Math.max(-.42,Math.min(.42,r))*c1, Math.max(-.42,Math.min(.42,r))*s1];} // bounded tangent field
      case 17:return[.30*Math.sin(2*a+d)+.055*Math.sin(17*a), .22*Math.cos(3*a-d)+.05*Math.cos(13*a)];
      default:return[.3*c1,.2*s1];
    }
  }

  function drawMathCurve(type, cx, cy, scale, time, alpha, c, seed){
    ctx.beginPath();
    const steps=type===3||type===8?240:180;
    for(let i=0;i<=steps;i++){
      const u=i/steps, [px,py]=curvePoint(type,u,time,seed);
      const x=cx+px*scale, y=cy+py*scale;
      if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=rgb(c,alpha); ctx.lineWidth=.65+(type%3)*.18; ctx.stroke();
  }

  function drawFieldLines(time){
    const cx=W*(.50+((pointer.x-.5)*.06)), cy=H*(.48+((pointer.y-.5)*.045));
    for(let ring=0;ring<16;ring++){
      const rr=(.11+ring*.034)*Math.min(W,H);
      ctx.beginPath();
      for(let j=0;j<=220;j++){
        const a=j/220*TAU;
        const ripple=1+0.055*Math.sin(a*5+time*.00025+ring*.7)+0.025*Math.cos(a*11-time*.00031);
        const x=cx+Math.cos(a)*rr*ripple*(1.35+.15*Math.sin(time*.00012+ring));
        const y=cy+Math.sin(a)*rr*.56*ripple;
        if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.strokeStyle=rgb(palette[ring%palette.length],.045+(ring%4===0?.035:0));
      ctx.lineWidth=.55; ctx.stroke();
    }
  }

  function drawVectorTrails(time){
    const step=Math.max(2,Math.min(4,W/350));
    for(let i=0;i<22;i++){
      let x=W*(.08+(i%6)*.17)+Math.sin(time*.00017+i)*18;
      let y=H*(.12+Math.floor(i/6)*.34)+Math.cos(time*.00013+i*1.7)*15;
      ctx.beginPath(); ctx.moveTo(x,y);
      for(let j=0;j<25;j++){
        const f=field(x,y,time,i*.31); x+=f.x*step; y+=f.y*step;
        if(x<0||x>W||y<0||y>H) break; ctx.lineTo(x,y);
      }
      const c=palette[i%palette.length]; ctx.strokeStyle=rgb(c,.045); ctx.lineWidth=.8; ctx.stroke();
    }
  }

  function draw(time){
    ctx.clearRect(0,0,W,H);
    pointer.x += (pointer.tx-pointer.x)*.035; pointer.y += (pointer.ty-pointer.y)*.035;
    const dt=time-last; last=time; t += reduceMotion ? 0.15 : Math.min(3,Math.max(.25,dt/16.7));

    // 1–12 parametric families around the scene.
    const centerX=W*(.5+(pointer.x-.5)*.035), centerY=H*(.49+(pointer.y-.5)*.028);
    const scale=Math.min(W,H);
    for(let i=0;i<18;i++){
      drawMathCurve(i%18, centerX + Math.sin(t*.003+i)*W*.10, centerY + Math.cos(t*.0022+i*.7)*H*.08, scale*(.42-i*.012), time+i*117, .022+(i%4)*.004, palette[i%palette.length], i*.73);
    }
    drawFieldLines(time);
    drawVectorTrails(time);

    // Low-cost traveling wave ribbons: phase-shifted sine / cosine interference.
    for(let band=0; band<7; band++){
      const yy=H*(.12+band*.125);
      ctx.beginPath();
      for(let j=0;j<=150;j++){
        const xx=(j/150)*W;
        const y=yy + Math.sin(xx*.012 + time*.0011*(band%2?-.8:1) + band)*10
                     + Math.sin(xx*.026 - time*.00065 + band*1.7)*4;
        if(j===0)ctx.moveTo(xx,y);else ctx.lineTo(xx,y);
      }
      ctx.strokeStyle=rgb(palette[(band+3)%palette.length],.026);
      ctx.lineWidth=.65; ctx.stroke();
    }

    // Moving orbiting charge / energy orbs.
    for(let i=0;i<orbs.length;i++){
      const o=orbs[i]; o.a += reduceMotion ? .0002 : o.w*(coarse?1.2:1.0)*1e3*.016;
      const a=o.a + time*.00018*(i%2?1:-1);
      const wobble=1+.09*Math.sin(time*.00045+o.phase);
      let x=centerX+Math.cos(a)*W*o.rx*wobble;
      let y=centerY+Math.sin(a*(1.0+(i%3)*.12))*H*o.ry*wobble;
      const z=(Math.sin(a*1.7+o.phase)+1)/2;
      y -= z*20*o.depth;
      drawGlowDot(x,y,o.size*(.72+.5*z),o.c,.13+.08*z);
      ctx.beginPath();ctx.arc(centerX,centerY,Math.hypot(x-centerX,y-centerY),0,TAU);ctx.strokeStyle=rgb(o.c,.016);ctx.lineWidth=.5;ctx.stroke();
    }

    // Flowing micro-particles through a pseudo electric field.
    for(let i=0;i<motes.length;i++){
      const m=motes[i];
      const fx=Math.sin(time*m.spd+m.phase)*.00012, fy=Math.cos(time*m.spd*.8+m.phase)*.00008;
      m.u=(m.u+fx+0.000015) % 1; m.v=(m.v+fy+1.00001)%1;
      const baseX=m.u*W, baseY=m.v*H;
      const f=field(baseX,baseY,time,i*.09);
      const x=baseX+f.x*10, y=baseY+f.y*8;
      const a=.055+.03*Math.sin(time*.002+m.phase);
      ctx.fillStyle=rgb(m.c,a); ctx.beginPath(); ctx.arc(x,y,m.size,0,TAU); ctx.fill();
    }

    // A few bright “energy transfer” pulses.
    for(let i=0;i<5;i++){
      const a=time*.00035*(i%2?1:-1)+i*1.3;
      const rr=scale*(.10+i*.055);
      const x=centerX+Math.cos(a)*rr*1.6, y=centerY+Math.sin(a)*rr*.72;
      const c=palette[(i+2)%palette.length];
      ctx.globalCompositeOperation='lighter';
      drawGlowDot(x,y,1.5+(i%3),c,.16);
      ctx.globalCompositeOperation='source-over';
    }

    raf=requestAnimationFrame(draw);
  }

  function start(){ if(raf||!running) return; raf=requestAnimationFrame(draw); }
  function stop(){ if(raf){cancelAnimationFrame(raf);raf=0;} }
  canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();pointer.tx=(e.clientX-r.left)/r.width;pointer.ty=(e.clientY-r.top)/r.height;},{passive:true});
  window.addEventListener('resize',resize,{passive:true});
  document.addEventListener('visibilitychange',()=>{running=!document.hidden; if(running) start(); else stop();},{passive:true});
  resize();
  if(reduceMotion){ draw(0); stop(); } else { requestAnimationFrame(draw); }
})();

function lsRead(key, fallback){ try{ const v=localStorage.getItem(key); return v==null?fallback:JSON.parse(v); }catch(e){ return fallback; } }
function lsWrite(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ console.error('localStorage write failed', key, e); Cloud.storageFull=true; return false; } }
function clone(v){ return JSON.parse(JSON.stringify(v)); }
function stableStr(v){
  if(v===null||typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(stableStr).join(',')+']';
  return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stableStr(v[k])).join(',')+'}';
}

/* ---- Cache + outbox ---- */
const LAST_SERVED = {};
function cacheGet(store){ const v=lsRead(CACHE_PREFIX+store, []); return Array.isArray(v)?v:[]; }
function cacheSet(store, list){ return lsWrite(CACHE_PREFIX+store, list); }
function outbox(){ const v=lsRead(OUTBOX_KEY, []); return Array.isArray(v)?v:[]; }
function outboxSet(list){ lsWrite(OUTBOX_KEY, list); syncBadge(); }
function outboxPush(ops){ if(!ops.length) return; outboxSet(outbox().concat(ops)); }
function pendingCount(){ return outbox().length; }
function applyPending(store, rows){
  const ops = outbox().filter(o=>o.store===store);
  if(!ops.length) return rows;
  const map = new Map(rows.map(r=>[String(r.id), r]));
  ops.forEach(o=>{ if(o.type==='upsert') map.set(String(o.id), Object.assign({}, o.payload, {id:o.id})); else map.delete(String(o.id)); });
  return Array.from(map.values());
}

/* ---- Supabase REST ---- */
async function cloudReq(path, options={}){
  if(!cloudReady()) throw new Error('Cloud storage is not configured');
  const base = Cloud.cfg.url.replace(/\/+$/,'');
  const timeoutMs = Number.isFinite(options.timeoutMs) ? options.timeoutMs : 8000;
  const controller = typeof AbortController!=='undefined' ? new AbortController() : null;
  let timer = null;
  if(controller) timer=setTimeout(()=>controller.abort(), timeoutMs);
  const reqOptions = Object.assign({}, options);
  delete reqOptions.timeoutMs;
  if(controller) reqOptions.signal = reqOptions.signal || controller.signal;
  try{
    const res = await fetch(base+'/rest/v1/'+path, Object.assign({}, reqOptions, {
      headers: Object.assign({
        'apikey': Cloud.cfg.key,
        'Authorization': 'Bearer '+Cloud.cfg.key,
        'Content-Type': 'application/json'
      }, options.headers||{})
    }));
  if(!res.ok){
    let detail=''; try{ const b=await res.json(); detail=b.message||b.error||b.hint||''; }catch(e){}
    throw new Error(detail || ('Cloud error '+res.status));
  }
    if(res.status===204) return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }catch(e){
    if(e && e.name==='AbortError') throw new Error('Cloud request timed out');
    throw e;
  }finally{
    if(timer) clearTimeout(timer);
  }
}

async function cloudPull(store){
  const rows = await cloudReq(BQC_TABLE+'?store_key=eq.'+encodeURIComponent(store)+'&deleted=is.false&select=id,payload&order=created_at.asc');
  return (rows||[]).map(r=>Object.assign({}, r.payload||{}, {id:r.id}));
}

async function flushOutbox(){
  if(Cloud.localOnly || !cloudReady()) return false;
  const queued = outbox();
  if(!queued.length){ return true; }
  if(Cloud.flushing) return false;
  Cloud.flushing = true; syncBadge();
  const taken = queued.length;
  try{
    const upserts = new Map(), deletes = new Map();
    queued.forEach(op=>{
      const k = op.store+'|'+op.id;
      if(op.type==='upsert'){ upserts.set(k, op); deletes.delete(k); }
      else { deletes.set(k, op); upserts.delete(k); }
    });
    const who = (currentSession()||{}).name || '';
    const stamp = new Date().toISOString();
    const rows = Array.from(upserts.values()).map(op=>({
      id: String(op.id), store_key: op.store, payload: op.payload,
      deleted: false, updated_at: stamp, updated_by: op.by || who
    }));
    for(let i=0;i<rows.length;i+=50){
      await cloudReq(BQC_TABLE, { method:'POST', headers:{'Prefer':'resolution=merge-duplicates,return=minimal'}, body: JSON.stringify(rows.slice(i,i+50)) });
    }
    for(const op of deletes.values()){
      await cloudReq(BQC_TABLE+'?id=eq.'+encodeURIComponent(op.id)+'&store_key=eq.'+encodeURIComponent(op.store),
        { method:'PATCH', headers:{'Prefer':'return=minimal'}, body: JSON.stringify({deleted:true, updated_at:stamp, updated_by:op.by||who}) });
    }
    outboxSet(outbox().slice(taken));   /* keep anything queued during the flush */
    Cloud.lastError = null; Cloud.online = true;
    Cloud.lastSync = Date.now(); lsWrite('bqc_last_sync', Cloud.lastSync);
    return true;
  }catch(e){
    Cloud.lastError = e.message;
    if(!navigator.onLine) Cloud.online = false;
    console.error('Sync failed:', e);
    return false;
  }finally{
    Cloud.flushing = false; syncBadge();
  }
}

/* ---- Public store API (unchanged signatures) ---- */
async function loadStore(key){
  if(!BQC_STORES.includes(key)) return [];
  if(!Cloud.localOnly && cloudReady() && navigator.onLine){
    try{
      await flushOutbox();
      let rows = await cloudPull(key);
      rows = applyPending(key, rows);
      cacheSet(key, rows); LAST_SERVED[key] = rows;
      Cloud.lastError = null; Cloud.online = true;
      Cloud.lastSync = Date.now(); lsWrite('bqc_last_sync', Cloud.lastSync);
      syncBadge();
      return clone(rows);
    }catch(e){
      Cloud.lastError = e.message;
      if(!navigator.onLine) Cloud.online = false;
      console.error('loadStore fell back to local cache:', key, e);
      syncBadge();
    }
  }
  const cached = applyPending(key, cacheGet(key));
  LAST_SERVED[key] = cached;
  return clone(cached);
}


/* ---------- Traceability / accountability layer ---------- */
function sessionActor(){
  const s=currentSession();
  return {name:s?.name||'System',role:s?.role||'system',stage:s?.stage||null};

function batteryRefFromRecord(r){
  return String(r?.bmsId||r?.batteryId||r?.oemId||r?.id||'').trim().toUpperCase();
}
function auditDiffs(store, base, incoming, removed){
  const beforeMap=new Map((base||[]).map(r=>[String(r.id),r]));
  const out=[];
  (incoming||[]).forEach(rec=>{
    const prev=beforeMap.get(String(rec.id));
    if(!prev || stableStr(prev)!==stableStr(rec)){
      out.push({action:prev?'UPDATE':'CREATE',store,recordId:String(rec.id),bmsId:batteryRefFromRecord(rec),
        before:prev?clone(prev):null,after:clone(rec)});
    }
  });
  (removed||[]).forEach(id=>{
    const prev=beforeMap.get(String(id));
    if(prev) out.push({action:'DELETE',store,recordId:String(id),bmsId:batteryRefFromRecord(prev),
      before:clone(prev),after:null});
  });
  return out;
}

function deepMergeChanged(base, incoming, latest){
  /* Apply only changes made by this browser onto the newest shared record.
     This prevents a stale technician screen from overwriting fields changed by
     another technician while still preserving the existing full-record model. */
  if(base === undefined) return clone(incoming);
  if(incoming === undefined) return clone(latest);
  if(stableStr(base) === stableStr(incoming)) return clone(latest);
  if(incoming === null || typeof incoming !== 'object' || Array.isArray(incoming)) return clone(incoming);
  if(base === null || typeof base !== 'object' || Array.isArray(base) || latest === null || typeof latest !== 'object' || Array.isArray(latest)) return clone(incoming);
  const out=clone(latest);
  Object.keys(incoming).forEach(k=>{
    const b=base[k], inc=incoming[k], cur=latest[k];
    if(stableStr(b)===stableStr(inc)) return;
    if(inc && typeof inc==='object' && !Array.isArray(inc) && b && typeof b==='object' && !Array.isArray(b)) out[k]=deepMergeChanged(b,inc,cur);
    else out[k]=clone(inc);
  });
  return out;
}

async function saveStore(key, list, options={}){
  if(!BQC_STORES.includes(key)){ console.error('Unknown store', key); return false; }
  const session = currentSession();
  const internalAuditWrite = !!options.internalAuditWrite && key==='accountability_audit_records';
  if(!internalAuditWrite && session && !roleCanWrite(session.role, key)){
    console.error('Role '+session.role+' may not write '+key);
    alert('Your role does not have permission to change '+(STORE_LABEL[key]||key)+'.');
    return false;
  }
  const incoming = (Array.isArray(list)?list:[]).map(r=>{
    let rec = clone(r);
    if(!rec.id) rec.id = uid();
    rec.id = String(rec.id);
    return rec;
  });

  /* The critical shared-queue fix:
     LAST_SERVED/cache may be older than the cloud because another technician
     can register or advance a battery at the same time. For O&M, re-read the
     shared store immediately before constructing the write and merge only the
     differences made from this browser's base into that newest copy. */
  const callerBase = clone(LAST_SERVED[key] || cacheGet(key) || []);
  let latest = callerBase;
  if(key==='om_chain_records' && !Cloud.localOnly && cloudReady() && navigator.onLine){
    try{
      await flushOutbox();
      latest = clone(applyPending(key, await cloudPull(key)));
      cacheSet(key, latest); LAST_SERVED[key]=latest;
      Cloud.lastError=null; Cloud.online=true;
    }catch(e){
      console.warn('Fresh O&M read before save failed; retaining local base:', e);
    }
  }

  const baseMap = new Map(callerBase.map(r=>[String(r.id), r]));
  const latestMap = new Map(latest.map(r=>[String(r.id), r]));
  const incomingIds = new Set(incoming.map(r=>r.id));
  const removed = options.allowDeletes
    ? callerBase.map(r=>String(r.id)).filter(id=>!incomingIds.has(id))
    : [];

  if(removed.length >= 5 && removed.length >= callerBase.length*0.5){
    const ok = confirm('This save would remove '+removed.length+' of '+callerBase.length+' records from "'+(STORE_LABEL[key]||key)+'".\n\nIf you did not intend to delete them, click Cancel and refresh the page to reload the latest data.');
    if(!ok) return false;
  }

  const who = session ? session.name : '';
  const ops = [];
  const merged = new Map(latest.map(r=>[String(r.id),clone(r)]));

  incoming.forEach(rec=>{
    const id=String(rec.id), before=baseMap.get(id), current=latestMap.get(id);
    let finalRec;
    if(key==='om_chain_records' && before && current){
      finalRec=deepMergeChanged(before,rec,current);
    }else if(!current){
      finalRec=clone(rec);
    }else{
      finalRec=clone(rec);
    }
    finalRec.id=id;
    const prev=current;
    if(!prev || stableStr(prev)!==stableStr(finalRec)){
      const {id:omitId,...payload}=finalRec;
      ops.push({type:'upsert',store:key,id, payload, by:who, at:Date.now()});
      merged.set(id,finalRec);
    }
  });

  removed.forEach(id=>{
    ops.push({type:'delete',store:key,id,by:who,at:Date.now()});
    merged.delete(id);
  });

  const finalList=[...merged.values()];
  const cacheOk=cacheSet(key, finalList);
  if(cacheOk===false){ console.error('Local persistence failed for',key); return false; }
  LAST_SERVED[key]=finalList;
  outboxPush(ops);
  const cloudAttempted=!Cloud.localOnly && cloudReady() && navigator.onLine && ops.length>0;
  const cloudSaved=cloudAttempted ? await flushOutbox() : true;
  STATE.lastSaveStatus={store:key,localSaved:true,cloudAttempted,cloudSaved,pending:pendingCount(),at:Date.now()};
  if(key!=='accountability_audit_records' && !options.skipAudit){
    const changes=auditDiffs(key,latest,finalList,removed);
    if(changes.length) appendAccountabilityAudit(changes);
  }
  EXPORT_ROWS_CACHE.clear();
  return true;
}

/* ---------- Shared live-data loader ----------
   One mapping keeps every sector reading the same underlying stores.  Sector loaders and the
   background refresh use this same path so a change made in Plant, O&M, Quality, or BSA reaches
   every role that is allowed to see it without maintaining separate copy/paste load lists. */
const STORE_STATE_KEYS = {
  om_chain_records:'omRecords',
  plant_records:'plantRecords',
  plant_stock_records:'plantStockRecords',
  new_battery_records:'newBatteryRecords',
  inventory_adjustments:'adjustments',
  warranty_records:'warrantyRecords',
  daily_stock_records:'dailyStockRecords',
  iot_given_records:'iotGiven',
  iot_returned_records:'iotReturned',
  day_log_records:'dayLogRecords',
  bsa_records:'bsaRecords',
  quality_issue_records:'qualityIssueRecords',
  accountability_audit_records:'accountabilityAuditRecords',
  rca_records:'rcaRecords',
  takeover_request_records:'takeoverRequestRecords',
  plant_quality_checks:'plantQualityChecks',
};

async function loadStoresIntoState(keys=BQC_STORES, options={}){
  const session=currentSession();
  const readable=(keys||[]).filter(k=> !session || roleCanRead(session.role,k));
  const results=await Promise.allSettled(readable.map(async key=>[key,await loadStore(key)]));
  const failures=[];
  results.forEach(r=>{
    if(r.status==='fulfilled'){
      const [key,rows]=r.value;
      const stateKey=STORE_STATE_KEYS[key];
      if(stateKey) STATE[stateKey]=rows;
    }else failures.push(r.reason?.message || String(r.reason || 'Store load failed'));
  });
  if(failures.length) STATE.globalSyncError=failures.slice(0,3).join(' · ');
  if(options.ensureNamanve && readable.includes('daily_stock_records')){
    try{ STATE.dailyStockRecords=await ensureNamanvePlantData(); }catch(e){ STATE.globalSyncError=e.message||'Namanve stock refresh failed'; }
  }
  if(options.ensureQualityIssues && readable.includes('quality_issue_records')){
    try{ STATE.qualityIssueRecords=await ensureQualityIssueSeed(); }catch(e){ STATE.globalSyncError=e.message||'Quality issue refresh failed'; }
  }
  if(readable.includes('warranty_records')){
    STATE.warrantyRecords=(STATE.warrantyRecords||[]).map(w=>w.warehouse ? w : {...w,warehouse:'Kyebando Warehouse'});
  }
  return readable;
}

  const session=currentSession();
  return session ? BQC_STORES.filter(k=>roleCanRead(session.role,k)) : [];
}

/* ---- Lazy third-party libraries: charts and Excel are no longer on the critical boot path. ---- */
let CHART_LOAD_PROMISE=null;
let XLSX_LOAD_PROMISE=null;
function loadExternalScriptOnce(src, globalName){
  if(globalName && window[globalName]) return Promise.resolve(window[globalName]);
  if(globalName==='Chart' && CHART_LOAD_PROMISE) return CHART_LOAD_PROMISE;
  if(globalName==='XLSX' && XLSX_LOAD_PROMISE) return XLSX_LOAD_PROMISE;
  const p=new Promise((resolve,reject)=>{
    const existing=document.querySelector('script[data-bqc-lib="'+globalName+'"]');
    if(existing){ existing.addEventListener('load',()=>resolve(window[globalName]),{once:true}); existing.addEventListener('error',()=>reject(new Error(globalName+' library failed to load')),{once:true}); return; }
    const script=document.createElement('script');
    script.src=src; script.async=true; script.dataset.bqcLib=globalName;
    script.onload=()=>resolve(window[globalName]);
    script.onerror=()=>reject(new Error(globalName+' library failed to load'));
    document.head.appendChild(script);
  });
  if(globalName==='Chart') CHART_LOAD_PROMISE=p;
  if(globalName==='XLSX') XLSX_LOAD_PROMISE=p;
  return p;
}
function ensureChartLibrary(){
  return loadExternalScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js','Chart');
}
function ensureXlsxLibrary(){
  return loadExternalScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','XLSX');
}
let BACKGROUND_REFRESH_PROMISE=null;
function scheduleBackgroundDataRefresh(){
  if(STATE?.intakeSaving) return Promise.resolve(false);
  if(BACKGROUND_REFRESH_PROMISE) return BACKGROUND_REFRESH_PROMISE;
  const run=async()=>{
    try{
      const keys=visibleStoreKeys();
      if(!keys.length) return;
      const before={}; keys.forEach(k=>{const sk=STORE_STATE_KEYS[k]; before[k]=sk?STATE[sk]:undefined;});
      await loadStoresIntoState(keys,{ensureNamanve:false,ensureQualityIssues:false});
      const after={}; keys.forEach(k=>{const sk=STORE_STATE_KEYS[k]; after[k]=sk?STATE[sk]:undefined;});
      const changed=keys.some(k=>visibleStateChanged(before[k],after[k]));
      STATE.globalLastRefreshed=nowTime(); STATE.omLastRefreshed=nowTime();
      if(changed && !overlayIsOpen()) silentRender();
    }catch(e){ STATE.globalSyncError=e.message||'Background refresh failed'; }
    finally{ BACKGROUND_REFRESH_PROMISE=null; }
  };
  if('requestIdleCallback' in window) BACKGROUND_REFRESH_PROMISE=new Promise(resolve=>requestIdleCallback(()=>run().finally(resolve),{timeout:1200}));
  else BACKGROUND_REFRESH_PROMISE=new Promise(resolve=>setTimeout(()=>run().finally(resolve),60));
  return BACKGROUND_REFRESH_PROMISE;
}

function visibleStateChanged(before, after){
  try{ return stableStr(before)!==stableStr(after); }catch(e){ return true; }
}


/* =====================================================================
   SIGN-IN  —  PINs are checked in the browser now that there is no
   server. Change them here before you deploy. This gates the roles for
   your team; it is not a defence against someone reading the page source.
   ===================================================================== */
const ROLE_ACCOUNTS = {
  omadmin:  { pin:'5634', name:'O&M Manager' },
  plantinv: { pin:'9876', name:'Plant & Inventory' },
  quality:  { pin:'6396', name:'Quality Engineer' },
  bsa:      { pin:'7521', name:'BSA Engineer' }
};
const STAGE_PINS = { '1101':1, '1202':2, '1303':3 };
const SESSION_HOURS = 12;

function currentSession(){
  const s = lsRead(SESSION_KEY, null);
  if(!s || !s.issuedAt) return null;
  if(Date.now() - s.issuedAt > SESSION_HOURS*3600*1000){ localStorage.removeItem(SESSION_KEY); return null; }
  return s;
}
function signIn(mode, pin, name){
  pin = String(pin||'').trim();
  if(mode==='omtech'){
    const stage = STAGE_PINS[pin];
    if(!stage) throw new Error('Invalid PIN or role');
    const who = (name||'').trim();
    if(!who) throw new Error('Technician name is required for accountability.');
    const s = { role:'omtech', stage, name:who, issuedAt:Date.now() };
    lsWrite(SESSION_KEY, s); return s;
  }
  const acct = ROLE_ACCOUNTS[mode];
  if(!acct || pin !== acct.pin) throw new Error('Invalid PIN or role');
  const s = { role:mode, stage:null, name:acct.name, issuedAt:Date.now() };
  lsWrite(SESSION_KEY, s); return s;
}
function signOut(){ localStorage.removeItem(SESSION_KEY); }

/* The rest of the app still speaks to /api/... — this router answers those
   calls locally so nothing else had to change. */
async function apiFetch(path, options={}){
  const body = options.body ? JSON.parse(options.body) : {};
  if(path === '/api/auth/login'){
    const user = signIn(body.mode, body.pin, body.name);
    return { ok:true, user:{ role:user.role, stage:user.stage, name:user.name } };
  }
  if(path === '/api/auth/logout'){ signOut(); return { ok:true }; }
  if(path === '/api/auth/me'){
    const s = currentSession();
    return s ? { authenticated:true, user:{role:s.role, stage:s.stage, name:s.name} } : { authenticated:false };
  }
  if(path.startsWith('/api/data/')){
    const key = decodeURIComponent(path.replace('/api/data/',''));
    if(options.method === 'PUT') return { success: await saveStore(key, body.data||[]) };
    return { success:true, data: await loadStore(key) };
  }
  throw new Error('Unknown endpoint '+path);
}

function syncBadge(){
  const el = document.getElementById('sync-badge');
  if(!el) return;
  const pending = pendingCount();
  let cls='ok', text='Cloud synced';
  if(Cloud.localOnly){ cls='local'; text='This device only'; }
  else if(!cloudReady()){ cls='warn'; text='Cloud not connected'; }
  else if(Cloud.flushing){ cls='busy'; text='Saving…'; }
  else if(!navigator.onLine){ cls='warn'; text = pending ? 'Offline — '+pending+' waiting' : 'Offline'; }
  else if(pending){ cls='warn'; text = pending+' change'+(pending===1?'':'s')+' waiting'; }

async function connectCloud(){
  const url = (document.getElementById('cp-url').value||'').trim().replace(/\/+$/,'');
  const key = (document.getElementById('cp-key').value||'').trim();
  if(!/^https?:\/\//.test(url) || !key){ cpStatus('Enter a full https:// project URL and the anon key.'); return; }
  cpStatus('Testing connection…');
  const prev = Cloud.cfg;
  Cloud.cfg = {url, key};
  try{
    await cloudReq(BQC_TABLE+'?select=id&limit=1');
    Cloud.localOnly = false; lsWrite('bqc_local_only', false);
    lsWrite(CFG_KEY, Cloud.cfg);
    Cloud.lastError = null;
    cpStatus('Connected. Uploading anything held locally…');
    await flushOutbox();
    cpStatus('Connected and synced. No page reload needed.');
    try{ await scheduleBackgroundDataRefresh(); }catch(e){}
    closePanel();
    window.toast('✓ Connected and synced.');
    render();
  }catch(e){
    Cloud.cfg = prev;
    cpStatus('Could not connect: '+e.message+' — check the URL, the key, and that the SQL above has been run.');
  }
  syncBadge();
}

  Cloud.localOnly = true; lsWrite('bqc_local_only', true);

}
async function syncNow(){
  if(Cloud.localOnly){ cpStatus('This device is in local-only mode. Connect a project to sync.'); return; }
  if(!cloudReady()){ cpStatus('Connect a Supabase project first.'); return; }
  cpStatus('Syncing…');

}
function exportBackup(){
  const dump = { exportedAt:new Date().toISOString(), stores:{} };
  BQC_STORES.forEach(s=> dump.stores[s]=cacheGet(s));
  const blob = new Blob([JSON.stringify(dump,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'battery-qc-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importBackup(input){
  const file = input.files && input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const dump = JSON.parse(reader.result);
      const stores = dump.stores || dump;
      let added = 0;
      for(const key of BQC_STORES){
        const incoming = Array.isArray(stores[key]) ? stores[key] : null;
        if(!incoming || !incoming.length) continue;
        const existing = cacheGet(key);
        const byId = new Map(existing.map(r=>[String(r.id), r]));
        incoming.forEach(r=>{ const rec=clone(r); if(!rec.id) rec.id=uid(); if(!byId.has(String(rec.id))){ byId.set(String(rec.id), rec); added++; } });
        await saveStore(key, Array.from(byId.values()));
      }
      cpStatus('Imported '+added+' new record(s). Updating this screen without a reload…');
      closePanel();
      window.toast('✓ Imported '+added+' new record(s).');
      render();
    }catch(e){ cpStatus('Could not read that file: '+e.message); }
  };
  reader.readAsText(file);
}

/* ---------- Utilities ---------- */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowTime(){ return new Date().toTimeString().slice(0,5); }
function nowIso(){ return new Date().toISOString(); }
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function parseIdList(text){
  if(!text) return [];
  const parts = text.split(/[\n,]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);
  return Array.from(new Set(parts));
}
function prefixForPlatform(platform){
  const p = String(platform||'').trim().toUpperCase();
  const found = BMS_MODEL_PREFIXES.find(x=>x.model===p);
  return found ? found.prefix : '';
}
function platformForId(id){
  const clean = String(id||'').trim().toUpperCase();
  const found = BMS_MODEL_PREFIXES.find(x=>clean.startsWith(x.prefix));
  return found ? found.model : '';
}
function normalizeBatteryId(token, platform){
  const raw = String(token||'').trim().toUpperCase();
  if(!raw) return '';
  const detected = platformForId(raw);
  if(detected) return raw;
  const prefix = prefixForPlatform(platform);
  return prefix ? prefix + raw : raw;
}
function parseBatteryIdList(text, platform){
  return Array.from(new Set(parseIdList(text).map(x=>normalizeBatteryId(x, platform)).filter(Boolean)));
}
function idSuffix(id, platform){
  const clean = String(id||'').trim().toUpperCase();
  const detected = platformForId(clean);
  const prefix = prefixForPlatform(platform) || (detected ? prefixForPlatform(detected) : '');
  return prefix && clean.startsWith(prefix) ? clean.slice(prefix.length) : clean;
}
function smartIdHint(platform){
  const prefix = prefixForPlatform(platform);
  return prefix ? `Prefix <strong>${prefix}</strong> is added automatically. Paste a full ID or enter only the remaining characters.` : 'Select the battery platform; the standard prefix will be added automatically.';
}
 
function checklistResult(map, items){
  const vals = items.map(([k])=>map[k]);
  if(vals.some(v=>v==='FAIL')) return 'FAIL';
  if(vals.some(v=>!v)) return 'INCOMPLETE';
  return 'PASS';
}
function testsResult(d){
  const boolsOk = TEST_BOOLS.every(([k])=>d.testBools[k]===true);
  const ir = parseFloat(d.tests.irMeasured), thr = parseFloat(d.tests.irThreshold);
  const irOk = !isNaN(ir) && !isNaN(thr) ? ir>=thr : null;
  if(!boolsOk || irOk===false) return 'FAIL';
  if(irOk===null) return 'INCOMPLETE';
  return 'PASS';
}

function closedRecordsForBms(records, bmsId){
  const clean = (bmsId||'').trim().toUpperCase();
  if(!clean) return [];

}
function openRecordForBms(records, bmsId){
  const clean = (bmsId||'').trim().toUpperCase();
  if(!clean) return null;
  return records.find(r => r.bmsId.trim().toUpperCase()===clean && !r.status.startsWith('CLOSED')) || null;
}
/* A new intake counts as the "next visit" for a BMS ID. Two visits for the same battery are never
   allowed to land on the same calendar day — the most recent visit (open or closed) must have
   happened on a strictly earlier date than the new intake's date. */
function lastVisitDateForBms(records, bmsId){
  const clean = (bmsId||'').trim().toUpperCase();
  if(!clean) return null;
  const all = records.filter(r => r.bmsId.trim().toUpperCase()===clean);
  if(all.length===0) return null;
  const dates = all.map(r => (r.closedAt ? r.closedAt.slice(0,10) : r.dateReceived)).filter(Boolean).sort();
  return dates.length ? dates[dates.length-1] : null;
}
function sameDayVisitError(records, bmsId, newDate){
  const last = lastVisitDateForBms(records, bmsId);
  if(last && newDate && last === newDate){
    return 'This BMS ID already has a visit logged today. The next visit for the same battery must be on a different (later) day.';
  }
  return null;
}
function stageQueue(records, stage){
  return records.filter(r => r.stage===stage && !r.status.startsWith('CLOSED')).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
}
function findRecord(records, id){ return records.find(r=>r.id===id); }
function isDuplicateOpenBms(records, bmsId){
  const clean = (bmsId||'').trim().toUpperCase();
  if(!clean) return false;
  return records.filter(r => r.bmsId.trim().toUpperCase()===clean && !r.status.startsWith('CLOSED')).length > 1;
}
function DuplicateChip(records, bmsId){
  return isDuplicateOpenBms(records, bmsId) ? el('span',{class:'status-chip FAIL', title:'This BMS ID has more than one open record — flag for Data Integrity cleanup.'}, 'DUPLICATE') : null;

/* ---------- Plant bulk stock ledger model ---------- */
function emptyBulkStockDraft(){
  return {
    date: todayStr(),
    enteredBy: '',
    rows: PLATFORMS.map(p=>({
      platform: p, receivedQty:'', receivedIds:'', dispatchedQty:'', dispatchedIds:'',
      _existingReceivedIds:[], _existingDispatchedIds:[],
    })),
  };
}
function findStockRecord(records, date, platform){
  return records.find(r=> r.date===date && r.platform===platform) || null;
}
function buildStockRecordFromRow(existing, date, row, enteredBy, skipIdsSet){
  let newReceivedIds = parseBatteryIdList(row.receivedIds, row.platform);
  let newDispatchedIds = parseBatteryIdList(row.dispatchedIds, row.platform);
  let skippedCount = 0;
  if(skipIdsSet && skipIdsSet.size){
    const beforeR = newReceivedIds.length, beforeD = newDispatchedIds.length;
    newReceivedIds = newReceivedIds.filter(id=>!skipIdsSet.has(id));
    newDispatchedIds = newDispatchedIds.filter(id=>!skipIdsSet.has(id));
    skippedCount = (beforeR-newReceivedIds.length)+(beforeD-newDispatchedIds.length);
  }
  const mergedReceivedIds = existing ? Array.from(new Set([...(existing.receivedIds||[]), ...newReceivedIds])) : newReceivedIds;
  const mergedDispatchedIds = existing ? Array.from(new Set([...(existing.dispatchedIds||[]), ...newDispatchedIds])) : newDispatchedIds;
  const receivedQty = row.receivedQty!=='' ? (parseInt(row.receivedQty)||0) : (existing? existing.receivedQty : 0);
  const dispatchedQty = row.dispatchedQty!=='' ? (parseInt(row.dispatchedQty)||0) : (existing? existing.dispatchedQty : 0);
  const record = {
    id: existing? existing.id : uid(),
    date, platform: row.platform,
    receivedQty, dispatchedQty,
    receivedIds: mergedReceivedIds, dispatchedIds: mergedDispatchedIds,
    enteredBy: enteredBy||(existing?existing.enteredBy:''),
    createdAt: existing? existing.createdAt : nowIso(),
    updatedAt: nowIso(),
  };
  return { record, skippedCount };
}
function computeStockLedger(records){
  const dates = Array.from(new Set(records.map(r=>r.date))).sort();
  const running = {}; PLATFORMS.forEach(p=>running[p]=0);
  const table = [];
  dates.forEach(date=>{
    const rows = PLATFORMS.map(p=>{
      const rec = findStockRecord(records, date, p);
      const opening = running[p];
      const received = rec ? parseInt(rec.receivedQty)||0 : 0;
      const dispatched = rec ? parseInt(rec.dispatchedQty)||0 : 0;
      const closing = opening + received - dispatched;
      const shortage = Math.max(0,-closing);
      running[p] = closing;
      return { platform:p, opening, received, dispatched, closing, shortage, rec };
    });
    const totals = rows.reduce((acc,r)=>({
      opening: acc.opening+r.opening, received: acc.received+r.received,
      dispatched: acc.dispatched+r.dispatched, closing: acc.closing+r.closing,
      shortage: acc.shortage+r.shortage
    }), {opening:0, received:0, dispatched:0, closing:0, shortage:0});
    table.push({ date, rows, totals });
  });
  return table;
}
function oemLedgerDataIssueSummary(){
  const ledger=computeStockLedger(STATE.plantStockRecords||[]);
  const issues=[];

}

    if(excludeRecordId && r.id===excludeRecordId) return;
    (r.receivedIds||[]).forEach(id=>set.add(id));
    (r.dispatchedIds||[]).forEach(id=>set.add(id));
  });

}
function findDuplicateOpenOmGroups(records){
  const map = {};
  records.forEach(r=>{
    if(r.status.startsWith('CLOSED')) return;
    const key = r.bmsId.trim().toUpperCase();
    if(!map[key]) map[key]=[];
    map[key].push(r);
  });
  return Object.values(map).filter(list=>list.length>1).map(list=>list.slice().sort((a,b)=>a.createdAt.localeCompare(b.createdAt)));
}
function findDuplicateOemIdOccurrences(records){
  const byPlatform = {};
  PLATFORMS.forEach(p=> byPlatform[p] = { received:{}, dispatched:{} });
  records.forEach(r=>{
    (r.receivedIds||[]).forEach(id=>{
      byPlatform[r.platform].received[id] = byPlatform[r.platform].received[id]||[];
      byPlatform[r.platform].received[id].push({date:r.date, recordId:r.id});
    });
    (r.dispatchedIds||[]).forEach(id=>{
      byPlatform[r.platform].dispatched[id] = byPlatform[r.platform].dispatched[id]||[];
      byPlatform[r.platform].dispatched[id].push({date:r.date, recordId:r.id});
    });
  });
  const dups = [];
  PLATFORMS.forEach(p=>{
    ['received','dispatched'].forEach(dir=>{
      Object.entries(byPlatform[p][dir]).forEach(([id,occ])=>{
        if(occ.length>1) dups.push({ platform:p, direction:dir, id, occurrences: occ.slice().sort((a,b)=>a.date.localeCompare(b.date)) });
      });
    });
  });
  return dups;
}

async function ensureNamanvePlantData(){
  const existing=await loadDailyStock();
  const seed=namanveSeedDailyStock();
  const byKey=new Map(existing.map(r=>[`${r.date}|${r.plant||'Namanve Plant A'}`,r]));
  let changed=false;
  seed.forEach(s=>{
    const key=`${s.date}|${s.plant}`;
    const old=byKey.get(key);
    if(!old){
      byKey.set(key,s); changed=true; return;
    }
    /* Only refresh rows previously created by this app's imported reference seed.
       User-entered daily records are never overwritten. */
    if(String(old.id||'').startsWith('namanve-seed-') || old.enteredBy==='Imported Namanve daily stock sheet'){
      const merged={...old,...s,id:old.id||s.id,createdAt:old.createdAt||s.createdAt,updatedAt:nowIso()};
      if(stableStr(merged)!==stableStr(old)){ byKey.set(key,merged); changed=true; }
    }
  });
  if(!changed) return existing;
  const merged=[...byKey.values()].sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
  return (await saveDailyStock(merged)) ? merged : existing;
}

/* ---------- Reload-safe UI continuity ----------
   Keeps the user's working place across a full browser reload without touching operational
   records. sessionStorage is intentionally used so a separate browser tab does not inherit
   another tab's position, while the same tab survives refreshes. */
const BQC_UI_STATE_KEY = 'bqc_ui_continuity_v1';
let BQC_RESTORE_UI = null;
let BQC_SCROLL_SAVE_RAF = 0;

function readBqcUiState(){
  try{
    const raw=sessionStorage.getItem(BQC_UI_STATE_KEY);
    if(!raw) return null;
    const value=JSON.parse(raw);
    return value && typeof value==='object' ? value : null;
  }catch(e){ return null; }
}
function clearBqcUiState(){
  try{ sessionStorage.removeItem(BQC_UI_STATE_KEY); }catch(e){}
  BQC_RESTORE_UI=null;
}
function captureBqcNestedScroll(){
  const selectors=['.nav-rail','.glass-tabs','.table-wrap','.preview-scroll','.modal-body'];
  const out=[];
  selectors.forEach(selector=>{
    document.querySelectorAll(selector).forEach((node,index)=>{
      if(node.scrollTop || node.scrollLeft){
        out.push({selector,index,top:node.scrollTop||0,left:node.scrollLeft||0});
      }
    });
  });
  return out;
}
function saveBqcUiState(){
  if(!STATE || !STATE.role) return;
  try{
    const payload={
      v:1,
      role:STATE.role,
      techName:STATE.techName||'',
      stage:STATE.stage??null,
      view:STATE.view||'main',
      searchQuery:STATE.searchQuery||'',

      scrollY:window.scrollY||document.documentElement.scrollTop||0,
      nestedScroll:captureBqcNestedScroll(),
      savedAt:Date.now()
    };
    sessionStorage.setItem(BQC_UI_STATE_KEY,JSON.stringify(payload));
  }catch(e){ /* Storage may be unavailable; app continues normally. */ }
}
function scheduleBqcUiStateSave(){
  if(BQC_SCROLL_SAVE_RAF) return;
  BQC_SCROLL_SAVE_RAF=requestAnimationFrame(()=>{
    BQC_SCROLL_SAVE_RAF=0;

function restoreBqcUiPosition(){
  const saved=BQC_RESTORE_UI;
  if(!saved) return;
  const y=Math.max(0,Number(saved.scrollY)||0);
  try{
    window.scrollTo({top:y,left:0,behavior:'auto'});
  }catch(e){ window.scrollTo(0,y); }
  (saved.nestedScroll||[]).forEach(item=>{
    const nodes=document.querySelectorAll(item.selector||'');
    const node=nodes[item.index||0];
    if(!node) return;
    node.scrollLeft=Number(item.left)||0;
    node.scrollTop=Number(item.top)||0;
  });
}

function animateStatNumbers(){
  const nodes = root.querySelectorAll('.stat .n[data-target]');
  nodes.forEach(node=>{
    const target = parseFloat(node.dataset.target);
    if(isNaN(target)) return;
    const suffix = node.dataset.suffix || '';
    const isInt = Number.isInteger(target);
    const t0 = performance.now(); const duration = 480;
    function step(t){
      const p = Math.min(1, (t-t0)/duration);
      const eased = 1 - Math.pow(1-p, 3);
      const val = target*eased;
      node.textContent = (isInt ? String(Math.round(val)) : val.toFixed(1)) + suffix;
      if(p<1) requestAnimationFrame(step);
      else node.textContent = (isInt ? String(target) : target.toFixed(1)) + suffix;
    }
    requestAnimationFrame(step);
  });
}

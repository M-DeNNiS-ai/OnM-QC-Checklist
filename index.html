<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Battery QC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky control header + tab strip, one working column (max 1280px); detail and forms open in a right-hand sheet. */
:root{
  --bg:#f3f5f5; --panel:#ffffff; --panel-2:#eef2f2; --line:#dde4e4; --line-2:#c9d3d3;
  --ink:#0f1a1c; --ink-2:#47575a; --ink-3:#768588;
  --accent:#0b6b6b; --accent-ink:#ffffff; --accent-soft:#dff0ee;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --good:#0a8a0a; --good-bg:#e6f5e6; --warn:#a86b00; --warn-bg:#fdf3dc;
  --serious:#c4521f; --serious-bg:#fdeee6; --crit:#c43232; --crit-bg:#fbe9e9;
  --info:#1f62b3; --info-bg:#e5effb;
  --shadow:0 1px 2px rgba(15,26,28,.05),0 6px 24px rgba(15,26,28,.06);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1314; --panel:#151c1e; --panel-2:#1b2427; --line:#263236; --line-2:#34434a;
  --ink:#e8eeef; --ink-2:#a7b4b7; --ink-3:#7b898c;
  --accent:#3db3a8; --accent-ink:#06201e; --accent-soft:#143130;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good:#3fc03f; --good-bg:#14301a; --warn:#f0b43a; --warn-bg:#33280f;
  --serious:#ec835a; --serious-bg:#38200f; --crit:#f07070; --crit-bg:#3a1717;
  --info:#6aa8f0; --info-bg:#132840;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1314; --panel:#151c1e; --panel-2:#1b2427; --line:#263236; --line-2:#34434a;
  --ink:#e8eeef; --ink-2:#a7b4b7; --ink-3:#7b898c;
  --accent:#3db3a8; --accent-ink:#06201e; --accent-soft:#143130;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good:#3fc03f; --good-bg:#14301a; --warn:#f0b43a; --warn-bg:#33280f;
  --serious:#ec835a; --serious-bg:#38200f; --crit:#f07070; --crit-bg:#3a1717;
  --info:#6aa8f0; --info-bg:#132840;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .sub{color:var(--ink-2)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:22px;font-weight:700} h3{font-size:17px;font-weight:700} h4{font-size:14px;font-weight:700}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:none}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:700;display:block;line-height:1.1}
.brand small{display:block;color:var(--ink-3);font-size:12px;line-height:1.1}
.search{flex:1 1 220px;max-width:380px;position:relative;margin-left:auto}
.search input{width:100%;height:36px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);padding:0 12px 0 32px}
.search svg{position:absolute;left:10px;top:10px;color:var(--ink-3)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px 11px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 6px;color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.esc{background:var(--serious);border-color:var(--serious);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.icon-btn{width:36px;padding:0}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:0 12px;height:32px;font-weight:600;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line-2);background:var(--panel);font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.info{background:var(--info)}
select.inline{height:30px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:0 6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}

/* page */
main{padding-block:18px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:14px}
.page-head p{margin:4px 0 0;color:var(--ink-2);max-width:62ch}
.period{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.period-nav{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:8px;background:var(--panel)}
.period-nav button{border:0;background:none;height:32px;width:32px;cursor:pointer;color:var(--ink-2);font-size:16px}
.period-nav button:hover{color:var(--ink)}
.period-nav span{min-width:150px;text-align:center;font-weight:600;font-size:13px;padding:0 4px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--info-bg);color:var(--ink);margin-bottom:12px;font-size:13.5px}
.banner.warn{background:var(--warn-bg)} .banner.crit{background:var(--crit-bg)} .banner.good{background:var(--good-bg)}
.banner b{font-weight:700}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
@media (max-width:980px){.g2,.g3,.g-main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}
.section{margin-top:14px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);padding:14px 16px;min-width:0;border:0;text-align:left;color:inherit}
button.kpi{cursor:pointer} button.kpi:hover{background:var(--panel-2)}
.kpi .k-label{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .k-val{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .k-val small{font-size:15px;color:var(--ink-3);font-weight:600;margin-left:2px}
.kpi .k-foot{font-size:12px;color:var(--ink-3);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.delta{font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)} .delta.flat{color:var(--ink-3)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.serious{background:var(--serious-bg);color:var(--serious);border-color:transparent}
.chip.crit{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.chip i{font-style:normal;font-size:11px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fchip{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line-2);background:var(--panel);font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fchip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.fchip .n{opacity:.7;font-variant-numeric:tabular-nums}
.finput{height:32px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:0 10px;min-width:0}
.finput.grow{flex:1 1 200px;max-width:320px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--panel-2)}
td.r,th.r{text-align:right}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;color:var(--ink-3);font-size:12.5px;flex-wrap:wrap}
.idlink{font-family:var(--f-mono);font-weight:600;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-size:12.5px;text-align:left}
.idlink:hover{text-decoration:underline}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}

/* bar lists */
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar-track{height:14px;display:flex;gap:2px;border-radius:0 4px 4px 0;min-width:0}
.bar-seg{height:100%;min-width:2px}
.bar-seg:last-child{border-radius:0 4px 4px 0}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.line{height:2px;width:14px;border-radius:0}
.stackbar{display:flex;height:22px;gap:2px;border-radius:5px;overflow:hidden;margin:6px 0 10px}
.stackbar div{height:100%;min-width:3px}

/* chart */
[hidden]{display:none!important}
.chart{position:relative;min-height:170px}
.chart svg{display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis-l{stroke:var(--line-2);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover{fill:var(--ink);fill-opacity:.05}
.chart .sel{fill:var(--accent);fill-opacity:.09}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:var(--panel);padding:8px 10px;border-radius:7px;font-size:12.5px;line-height:1.45;max-width:260px;box-shadow:var(--shadow);opacity:0;transition:opacity .08s}
#tip.show{opacity:1}
#tip b{font-weight:700}
#tip .tr{display:flex;justify-content:space-between;gap:14px}
#tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* pipeline board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr)}}
.lane{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.lane-head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px}
.lane-head b{font-family:var(--f-display);font-size:16px}
.lane-head .n{font-family:var(--f-display);font-size:22px;font-weight:700}
.lane-list{min-width:0;display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto;padding-right:2px}
.jcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;text-align:left;width:100%;display:grid;gap:4px;border-left:3px solid var(--line-2)}
.jcard:hover{border-color:var(--line-2)}
.jcard.age-warn{border-left-color:var(--warn)} .jcard.age-crit{border-left-color:var(--crit)} .jcard.age-ok{border-left-color:var(--good)}
.jcard .row1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.jcard .row2{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);align-items:center}

/* drawer */
#drawer-root .scrim{position:fixed;inset:0;background:rgba(8,14,16,.42);z-index:60;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:61;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .18s ease-out;padding-top:env(safe-area-inset-top,0px)}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.drawer,#drawer-root .scrim{animation:none}.spin{animation:none}}
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px max(18px,env(safe-area-inset-right,0px)) 14px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.d-head h2{font-size:21px}
.d-body>*{flex-shrink:0}
.d-body{flex:1;overflow-y:auto;padding:16px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:14px}
.d-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 18px;background:var(--panel);border-top:1px solid var(--line)}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
label.f .req{color:var(--serious)}
.in,select.in,textarea.in{width:100%;height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:0 10px;font-weight:500;color:var(--ink);min-width:0}
textarea.in{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
.in.must{border-color:var(--warn)}
.idf{display:flex;gap:6px;align-items:stretch;min-width:0}
.idf select{width:auto;flex:none}
.idf-pre{display:flex;align-items:center;padding:0 8px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-size:12px;color:var(--ink-2);flex:none}
.idf input{flex:1;min-width:0}
.idf-hint{font-size:12px;color:var(--ink-3);margin-top:4px}
.ok{color:var(--good)} .bad{color:var(--crit)}
.checks{display:grid;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.check{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.check:last-child{border-bottom:0}
.tri{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;flex:none}
.tri button{border:0;background:var(--panel);height:28px;padding:0 10px;font-size:12px;font-weight:700;color:var(--ink-3);cursor:pointer;border-right:1px solid var(--line)}
.tri button:last-child{border-right:0}
.tri button.p{background:var(--good-bg);color:var(--good)}
.tri button.f{background:var(--crit-bg);color:var(--crit)}
.tri button.n{background:var(--panel-2);color:var(--ink)}
.issues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:560px){.issues{grid-template-columns:minmax(0,1fr)}}
.issue{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-size:13.5px}
.issue input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.issue small{margin-left:auto;font-size:11px;color:var(--ink-3)}
.issue.on{border-color:var(--accent);background:var(--accent-soft)}
.issue.bsa small{color:var(--serious);font-weight:600}
.block-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 8px}

/* battery detail */
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:560px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{background:var(--panel);padding:10px 12px}
.fact span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600}
.fact b{font-family:var(--f-display);font-size:20px}
.timeline{display:grid;gap:0;position:relative}
.tl{display:grid;grid-template-columns:92px 14px minmax(0,1fr);gap:10px;padding:6px 0}

<script>
'use strict';
/* =====================================================================
   Battery QC — O&M chain, BSA and Quality
   Single-file app. Data lives per-record in a Supabase table
   (bqc_records, same schema as before) with an offline cache + outbox in
   this browser. Plant stock, inventory, IoT and warranty stores are no
   longer read or written by this app (their cloud rows are untouched).
   ===================================================================== */

/* ---------- Domain constants ---------- */
const STAGE_LABEL = {1:'Stage 1 · Intake & pre-check',2:'Stage 2 · Repair & reassembly',3:'Stage 3 · Final test & QC'};
const STAGE_SHORT = {1:'Intake',2:'Repair',3:'Final QC'};
/* Corrective action (CAPA) reasons, parts and supplier holds */
const CAPA_REASONS = [['part','Needs part replacement'],['rework','Repair not effective · redo repair'],['test','Failed a test (IR, CAN, cell balance)'],['assembly','Assembly / workmanship issue'],['recheck','Needs re-inspection'],['other','Other reason']];
const CAPA_REASON_LABEL = Object.fromEntries(CAPA_REASONS);
const PARTS = ['Charging port','LED strip','BMS','Wiring harness','Connector','Cell / cell module','IoT module','SIM card','Casing / cover','Fuse','Fasteners / screws','Thermal pad / paste','Other part'];
const OTHER_ISSUE_CATS = ['Mechanical','Electrical','Firmware / software','IoT / connectivity','Cosmetic','Customer complaint','Other'];
/* Charge cycle count (read from the BMS) — required whenever a part is replaced */
function cyclesError(v){ const x=String(v??'').trim(); if(!x) return 'Enter the battery’s charge cycle count (read it from the BMS).'; if(!/^\d{1,6}$/.test(x)||+x>20000) return 'Cycle count must be a whole number between 0 and 20000.'; return ''; }
const cyclesField = (path,req) => `<label class="f"><span>Charge cycles (from BMS)${req?' <span class="req">*</span>':''}</span><input class="in mono ${req?'must':''}" id="b-${path.replace(/\./g,'-')}" data-bind="${path}" value="${esc(getPath(S.f,path)??'')}" type="number" inputmode="numeric" min="0" step="1" placeholder="e.g. 412"></label>`;

/* ---------- Battery ID helpers ---------- */
const prefixesForPlatform = p => BMS_MODEL_PREFIXES.filter(x=>x.model===String(p||'').toUpperCase()).map(x=>x.prefix);
const prefixForId = id => (BMS_MODEL_PREFIXES.find(x=>String(id||'').toUpperCase().startsWith(x.prefix))||{}).prefix || '';
const platformForId = id => (BMS_MODEL_PREFIXES.find(x=>String(id||'').trim().toUpperCase().startsWith(x.prefix))||{}).model || '';
function prefixForPlatform(p,preferred){ const l=prefixesForPlatform(p); return l.includes(preferred)?preferred:(l[0]||''); }
function idSuffix(id,platform){ const c=String(id||'').trim().toUpperCase(); const p=prefixForId(c)||prefixForPlatform(platform); return p&&c.startsWith(p)?c.slice(p.length):c; }
function normalizeBatteryId(token,platform,preferred){
  const raw=String(token||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!raw) return '';
  if(platformForId(raw)) return raw;
  const p=prefixForPlatform(platform,preferred);
  return (p && raw.length<18) ? p+raw : raw;
}
function batteryIdError(id,model){
  const c=String(id||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!c) return null;
  const m=platformForId(c)||String(model||'').trim().toUpperCase();
  if(c.length!==BATTERY_ID_LENGTH) return `Battery IDs are exactly ${BATTERY_ID_LENGTH} characters including the prefix (this one is ${c.length}).`;
  if(m && !prefixForPlatform(m)) return 'Pick a valid platform or enter a recognised full battery ID.';
  const allowed=prefixesForPlatform(m);
  if(m && !allowed.some(p=>c.startsWith(p))) return `${m} IDs start with ${allowed.join(' or ')}.`;
  return null;
}
const normId = v => String(v||'').trim().toUpperCase();

/* ---------- Date helpers (local calendar days) ---------- */
const pad = n => String(n).padStart(2,'0');
const localKey = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => localKey(new Date());
const nowTime = () => new Date().toTimeString().slice(0,5);
const nowIso = () => new Date().toISOString();
const uid = () => 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function dkey(v){ if(!v) return ''; const s=String(v); if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; const d=new Date(s); return isNaN(d)?s.slice(0,10):localKey(d); }
function parseKey(k){ const [y,m,d]=String(k).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return localKey(d); }
function daysBetween(a,b){ return Math.round((parseKey(b)-parseKey(a))/86400000); }
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtDay(k){ if(!k) return '—'; const d=parseKey(k); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; }
function fmtShort(k){ if(!k) return '—'; const d=parseKey(k); return `${d.getDate()} ${MON[d.getMonth()]}`; }
function fmtDT(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return String(iso); return `${d.getDate()} ${MON[d.getMonth()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function periodOf(k,gran){
  if(gran==='week'){ const d=parseKey(k); const dow=(d.getDay()+6)%7; const start=addDays(k,-dow); return {start,end:addDays(start,6),gran}; }
  if(gran==='month'){ const d=parseKey(k); const start=localKey(new Date(d.getFullYear(),d.getMonth(),1)); const end=localKey(new Date(d.getFullYear(),d.getMonth()+1,0)); return {start,end,gran}; }
  return {start:k,end:k,gran:'day'};
}
function shiftKey(k,gran,n){
  if(gran==='week') return addDays(k,7*n);
  if(gran==='month'){ const d=parseKey(k); return localKey(new Date(d.getFullYear(),d.getMonth()+n,1)); }
  return addDays(k,n);
}
function periodLabel(p,long){
  const s=parseKey(p.start);
  if(p.gran==='month') return long?`${['January','February','March','April','May','June','July','August','September','October','November','December'][s.getMonth()]} ${s.getFullYear()}`:`${MON[s.getMonth()]} ${String(s.getFullYear()).slice(2)}`;
  if(p.gran==='week'){ const e=parseKey(p.end); return long?`${s.getDate()} ${MON[s.getMonth()]} – ${e.getDate()} ${MON[e.getMonth()]} ${e.getFullYear()}`:`${s.getDate()} ${MON[s.getMonth()]}`; }
  return long?`${DOW[s.getDay()]} ${s.getDate()} ${MON[s.getMonth()]} ${s.getFullYear()}`:`${DOW[s.getDay()].slice(0,2)} ${s.getDate()}`;
}
const inP = (k,p) => !!k && k>=p.start && k<=p.end;
function bucketsEnding(anchor,gran,count){ const out=[]; for(let i=count-1;i>=0;i--) out.push(periodOf(shiftKey(periodOf(anchor,gran).start,gran,-i),gran)); return out; }

const DEFAULT_CLOUD = {url:'',key:''};   /* fill in to ship pre-connected */
const BQC_TABLE = 'bqc_records';
const BQC_STORES = ['om_chain_records','bsa_records','rca_records','quality_issue_records','accountability_audit_records'];

const CFG_KEY='bqc_cloud_cfg', CACHE_PREFIX='bqc_cache_', OUTBOX_KEY='bqc_outbox', SESSION_KEY='bqc_session';

const Cloud = {
  cfg: lsRead(CFG_KEY,null) || (DEFAULT_CLOUD.url?{...DEFAULT_CLOUD}:null),
  localOnly: lsRead('bqc_local_only',false), flushing:false, lastError:null,
  lastSync: lsRead('bqc_last_sync',null), storageFull:false, demo:false
};
const DEMO = {};   /* in-memory sample stores, never persisted */
const cloudReady = () => !!(Cloud.cfg && Cloud.cfg.url && Cloud.cfg.key);
const LAST_SERVED = {};
function cacheGet(s){ const v=lsRead(CACHE_PREFIX+s,[]); return Array.isArray(v)?v:[]; }
const cacheSet = (s,l) => lsWrite(CACHE_PREFIX+s,l);
function outbox(){ const v=lsRead(OUTBOX_KEY,[]); return Array.isArray(v)?v:[]; }
function outboxSet(l){ lsWrite(OUTBOX_KEY,l); }
const pendingCount = () => outbox().length;
function applyPending(store,rows){
  const ops=outbox().filter(o=>o.store===store); if(!ops.length) return rows;
  const m=new Map(rows.map(r=>[String(r.id),r]));
  ops.forEach(o=>{ if(o.type==='upsert') m.set(String(o.id),{...o.payload,id:o.id}); else m.delete(String(o.id)); });
  return [...m.values()];
}
async function cloudReq(path,options={}){
  if(!cloudReady()) throw new Error('Cloud storage is not connected');
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),options.timeoutMs||9000);
  try{
    const res=await fetch(Cloud.cfg.url.replace(/\/+$/,'')+'/rest/v1/'+path,{method:options.method||'GET',body:options.body,signal:ctl.signal,
      headers:{apikey:Cloud.cfg.key,Authorization:'Bearer '+Cloud.cfg.key,'Content-Type':'application/json',...(options.headers||{})}});
    if(!res.ok){ let d=''; try{ const b=await res.json(); d=b.message||b.error||b.hint||''; }catch(e){} throw new Error(d||('Cloud error '+res.status)); }
    if(res.status===204) return null; const txt=await res.text(); return txt?JSON.parse(txt):null;
  }catch(e){ if(e.name==='AbortError') throw new Error('Cloud request timed out'); throw e; }
  finally{ clearTimeout(t); }
}
async function cloudPull(store){
  const rows=await cloudReq(BQC_TABLE+'?store_key=eq.'+encodeURIComponent(store)+'&deleted=is.false&select=id,payload&order=created_at.asc');
  return (rows||[]).map(r=>({...(r.payload||{}),id:r.id}));
}
async function flushOutbox(){
  if(Cloud.demo||Cloud.localOnly||!cloudReady()) return false;
  const q=outbox(); if(!q.length) return true; if(Cloud.flushing) return false;
  Cloud.flushing=true; paintSync();
  try{
    const ups=new Map(), dels=new Map();
    q.forEach(op=>{ const k=op.store+'|'+op.id; if(op.type==='upsert'){ups.set(k,op);dels.delete(k);} else {dels.set(k,op);ups.delete(k);} });
    const who=(currentSession()||{}).name||'', stamp=nowIso();
    const rows=[...ups.values()].map(op=>({id:String(op.id),store_key:op.store,payload:op.payload,deleted:false,updated_at:stamp,updated_by:op.by||who}));
    for(let i=0;i<rows.length;i+=50) await cloudReq(BQC_TABLE,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows.slice(i,i+50))});
    for(const op of dels.values()) await cloudReq(BQC_TABLE+'?id=eq.'+encodeURIComponent(op.id)+'&store_key=eq.'+encodeURIComponent(op.store),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({deleted:true,updated_at:stamp,updated_by:op.by||who})});
    outboxSet(outbox().slice(q.length));
    Cloud.lastError=null; Cloud.lastSync=Date.now(); lsWrite('bqc_last_sync',Cloud.lastSync); return true;
  }catch(e){ Cloud.lastError=e.message; return false; }
  finally{ Cloud.flushing=false; paintSync(); }
}
async function loadStore(key){
  if(!BQC_STORES.includes(key)) return [];
  if(Cloud.demo){ const r=clone(DEMO[key]||[]); LAST_SERVED[key]=clone(r); return r; }
  if(!Cloud.localOnly && cloudReady() && navigator.onLine){
    try{
      await flushOutbox();
      const rows=applyPending(key,await cloudPull(key));
      cacheSet(key,rows); LAST_SERVED[key]=rows; Cloud.lastError=null; Cloud.lastSync=Date.now(); lsWrite('bqc_last_sync',Cloud.lastSync);
      return clone(rows);
    }catch(e){ Cloud.lastError=e.message; }
  }
  const cached=applyPending(key,cacheGet(key)); LAST_SERVED[key]=cached; return clone(cached);
}

/* Every signed-in role can read the O&M, BSA, RCA and quality stores so the dashboards are complete. */
function roleCanWrite(role,store,stage){

}

/* ---------- Saving (merge-safe, audited) ---------- */
function deepMergeChanged(base,incoming,latest){
  if(base===undefined) return clone(incoming);
  if(incoming===undefined) return clone(latest);
  if(stableStr(base)===stableStr(incoming)) return clone(latest);
  if(incoming===null||typeof incoming!=='object'||Array.isArray(incoming)) return clone(incoming);
  if(base===null||typeof base!=='object'||Array.isArray(base)||latest===null||typeof latest!=='object'||Array.isArray(latest)) return clone(incoming);
  const out=clone(latest);
  Object.keys(incoming).forEach(k=>{
    const b=base[k],inc=incoming[k];
    if(stableStr(b)===stableStr(inc)) return;
    out[k]=(inc&&typeof inc==='object'&&!Array.isArray(inc)&&b&&typeof b==='object'&&!Array.isArray(b))?deepMergeChanged(b,inc,latest[k]):clone(inc);
  });
  return out;
}
function stampActor(key,rec){
  const s=currentSession()||{}; const out=clone(rec);
  if(key==='om_chain_records'){ out.updatedBy=s.name; out.updatedRole=s.role; out.updatedStage=s.stage||null; out.updatedAt=nowIso(); }
  if(key==='bsa_records'||key==='rca_records'){ out.updatedBy=s.name; out.updatedRole=s.role; out.updatedAt=nowIso(); }
  return out;
}
async function saveStore(key,list,options={}){
  if(!BQC_STORES.includes(key)) return false;
  const s=currentSession();
  if(!options.internal && s && !roleCanWrite(s.role,key,s.stage)){ toast(`Your role can't change ${STORE_LABEL[key]}.`); return false; }
  const incoming=(Array.isArray(list)?list:[]).map(r=>{ const c=clone(r); c.id=String(c.id||uid()); return c; });
  if(Cloud.demo){
    const before=new Map((DEMO[key]||[]).map(r=>[r.id,r]));
    DEMO[key]=incoming.map(r=>{ const p=before.get(r.id); return (!p||stableStr(p)!==stableStr(r))?stampActor(key,r):r; });
    LAST_SERVED[key]=clone(DEMO[key]); S.lastSave={cloudAttempted:false}; return true;
  }
  const callerBase=clone(LAST_SERVED[key]||cacheGet(key)||[]);
  let latest=callerBase;
  if(key==='om_chain_records' && !Cloud.localOnly && cloudReady() && navigator.onLine){
    try{ await flushOutbox(); latest=clone(applyPending(key,await cloudPull(key))); cacheSet(key,latest); LAST_SERVED[key]=latest; }catch(e){}
  }
  const baseMap=new Map(callerBase.map(r=>[String(r.id),r])), latestMap=new Map(latest.map(r=>[String(r.id),r]));
  const ids=new Set(incoming.map(r=>r.id));
  const removed=options.allowDeletes?callerBase.map(r=>String(r.id)).filter(id=>!ids.has(id)):[];
  const who=s?s.name:'', ops=[], merged=new Map(latest.map(r=>[String(r.id),clone(r)]));
  incoming.forEach(rec=>{
    const before=baseMap.get(rec.id), cur=latestMap.get(rec.id);
    let fin=(key==='om_chain_records'&&before&&cur)?deepMergeChanged(before,rec,cur):clone(rec);
    fin.id=rec.id;
    if(!cur||stableStr(cur)!==stableStr(fin)){
      if(!options.internal) fin=stampActor(key,fin);
      const {id,...payload}=fin; ops.push({type:'upsert',store:key,id:rec.id,payload,by:who,at:Date.now()}); merged.set(rec.id,fin);
    }
  });
  removed.forEach(id=>{ ops.push({type:'delete',store:key,id,by:who,at:Date.now()}); merged.delete(id); });
  const finalList=[...merged.values()];
  if(cacheSet(key,finalList)===false){ toast('This browser\'s storage is full. Export a backup, then clear old data.'); return false; }
  LAST_SERVED[key]=finalList;
  if(ops.length) outboxSet(outbox().concat(ops));
  const attempted=!Cloud.localOnly&&cloudReady()&&navigator.onLine&&ops.length>0;
  const saved=attempted?await flushOutbox():true;
  S.lastSave={cloudAttempted:attempted,cloudSaved:saved};
  if(key!=='accountability_audit_records' && ops.length) appendAudit(key,latest,finalList,removed);
  paintSync();
  return true;
}

function deltaHtml(cur,prev,goodUp=true,fmt=v=>v,unit=''){
  if(cur==null||prev==null) return '<span class="delta flat">no comparison</span>';
  const d=cur-prev; if(Math.abs(d)<1e-9) return '<span class="delta flat">± 0 vs prev.</span>';
  const up=d>0, good=goodUp?up:!up;
  return `<span class="delta ${goodUp==null?'flat':good?'up':'down'}">${up?'▲':'▼'} ${fmt(Math.abs(d))}${unit}</span><span>vs prev.</span>`;
}
function kpi(label,val,foot,act,tone){
  const tag=act?'button':'div';
  return `<${tag} class="kpi" ${act||''}><div class="k-label">${tone?`<span class="dot ${tone}"></span>`:''}${label}</div><div class="k-val">${val}</div><div class="k-foot">${foot||''}</div></${tag}>`;
}
function simRecallStats(){
  const recs=S.data.om.filter(needsSim);
  const ids=new Set(recs.map(r=>normId(r.bmsId)));
  const replaced=new Set(recs.filter(r=>((r.stage2||{}).sim||{}).newNumber).map(r=>normId(r.bmsId)));
  const passed=new Set(recs.filter(r=>r.finalDisposition==='PASS'&&((r.stage3||{}).testBools||{})[SIM_TEST[0]]).map(r=>normId(r.bmsId)));
  const open=recs.filter(r=>!isClosed(r)).length, failed=recs.filter(r=>isClosed(r)&&r.finalDisposition!=='PASS').length;
  return {recs,total:ids.size,replaced:replaced.size,passed:passed.size,open,failed};
}
function SimRecallCard(){
  const x=simRecallStats(); if(!x.total) return '';
  const pct=Math.round(x.passed/x.total*100);
  return `<div class="card section" style="margin-bottom:14px"><div class="card-head"><div><h3>SIM card replacement recall</h3><p>AMPACE batteries called back to swap the ${esc(OLD_SIM_DEFAULT)} SIM. Counted per battery, all time.</p></div>

    <div class="recall"><div style="min-width:120px"><div class="muted" style="font-size:12px;font-weight:600">Completed</div><div style="font-size:34px;font-weight:800;letter-spacing:-.03em">${pct}<small style="font-size:16px;color:var(--ink-3)">%</small></div><div class="stackbar" style="height:8px;margin-top:6px"><div style="flex:${x.passed||0.0001};background:var(--good)"></div><div style="flex:${Math.max(x.replaced-x.passed,0)||0.0001};background:var(--info)"></div><div style="flex:${Math.max(x.total-x.replaced,0)||0.0001};background:var(--line-2)"></div></div></div>
    <div class="recall-steps"><div><b>${x.total}</b><small>batteries received</small></div><div><b>${x.replaced}</b><small>SIM replaced</small></div><div><b>${x.passed}</b><small>passed functional test</small></div><div><b>${x.open}</b><small>still in the chain${x.failed?` · ${x.failed} to BSA`:''}</small></div></div></div></div>`;
}

function chartSlot(spec){ CHARTS.push(spec); return `<div class="chart" data-chart="${CHARTS.length-1}"></div>`; }
function niceMax(v){ if(v<=4) return 4; const m=Math.pow(10,Math.floor(Math.log10(v))); const n=v/m; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*m; }
function cssv(n){ if(typeof CSSV_OVERRIDE!=='undefined'&&CSSV_OVERRIDE&&CSSV_OVERRIDE[n]) return CSSV_OVERRIDE[n]; return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888'; }
function labelTables(){
  document.querySelectorAll('.tbl-wrap table').forEach(t=>{ const th=[...t.querySelectorAll('thead th')].map(h=>h.textContent.trim()); if(!th.length) return; t.classList.add('rtable');
    t.querySelectorAll('tbody tr').forEach(r=>{ [...r.children].forEach((td,i)=>{ if(th[i]&&!td.hasAttribute('data-label')) td.setAttribute('data-label',th[i]); }); }); });
}
function drawCharts(){ labelTables();
  document.querySelectorAll('.chart[data-chart]').forEach(el=>{
    const spec=CHARTS[+el.dataset.chart]; if(!spec) return;
    const W=Math.max(260,el.clientWidth), H=spec.type==='line'?170:230;
    el.innerHTML=spec.type==='line'?lineSvg(spec,W,H):colSvg(spec,W,H);
  });
}
function colSvg(sp,W,H){
  const L=34,R=8,T=10,B=26, iw=W-L-R, ih=H-T-B, n=sp.labels.length;
  const totals=sp.labels.map((_,i)=>sp.grouped?Math.max(...sp.series.map(s=>s.values[i])):sum(sp.series.map(s=>s.values[i])));
  const max=niceMax(Math.max(1,...totals,...(sp.line?sp.line.values:[0])));
  const y=v=>T+ih-v/max*ih, bw=iw/n, gap=Math.max(3,bw*.22);
  let g='';
  for(let t=0;t<=4;t++){ const v=max/4*t, yy=y(v); g+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${Math.round(v*10)/10}</text>`; }
  const every=Math.ceil(n/(W<520?7:14));
  let marks='', hits='';
  sp.labels.forEach((lb,i)=>{
    const x0=L+i*bw;
    if(i===sp.sel) marks+=`<rect class="sel" x="${x0+1}" y="${T}" width="${bw-2}" height="${ih}" rx="4"/>`;
    if(sp.grouped){
      const k=sp.series.length, w=Math.min(18,(bw-gap)/k);
      const start=x0+(bw-w*k-(k-1)*2)/2;
      sp.series.forEach((s,j)=>{ const v=s.values[i]; if(!v) return; const h=ih*v/max; marks+=barPath(start+j*(w+2),y(v),w,h,cssv(s.color)); });
    } else {
      let acc=0; const w=Math.min(34,bw-gap), xx=x0+(bw-w)/2;
      const vis=sp.series.map((s,j)=>[s,j]).filter(([s])=>s.values[i]>0);
      vis.forEach(([s],idx)=>{ const v=s.values[i]; const top=idx===vis.length-1; const yy=y(acc+v), h=ih*v/max-(idx>0?2:0); marks+=top?barPath(xx,yy,w,Math.max(1,h),cssv(s.color)):`<rect x="${xx}" y="${yy}" width="${w}" height="${Math.max(1,h)}" fill="${cssv(s.color)}"/>`; acc+=v; });
    }
    if((i%every===0&&n-1-i>every/2)||i===n-1) marks+=`<text x="${x0+bw/2}" y="${H-8}" text-anchor="middle" ${i===sp.sel?'style="fill:var(--ink);font-weight:600"':''}>${esc(lb)}</text>`;
    const tip=`<b>${esc(sp.full[i])}</b>`+sp.series.map(s=>`<div class="tr"><span><i style="background:${cssv(s.color)}"></i>${esc(s.label)}</span><b>${s.values[i]}</b></div>`).join('')+(sp.line?`<div class="tr"><span><i style="background:${cssv('--ink-2')};height:2px"></i>${esc(sp.line.label)}</span><b>${sp.line.values[i]}</b></div>`:'')+(sp.act?'<div style="opacity:.7;margin-top:3px">Click to select</div>':'');
    hits+=`<rect class="hit" x="${x0}" y="${T}" width="${bw}" height="${ih}" data-tip="${esc(tip)}" ${sp.act?`data-act="${sp.act}" data-v="${sp.buckets[i]}"`:''}/>`;
  });
  let line='';
  if(sp.line){
    const pts=sp.line.values.map((v,i)=>[L+i*bw+bw/2,y(v)]);
    line=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${cssv('--ink-2')}" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 3"/>`+pts.map(([x,yy],i)=>`<circle cx="${x}" cy="${yy}" r="${i===sp.sel?4:2.5}" fill="${cssv('--panel')}" stroke="${cssv('--ink-2')}" stroke-width="2"/>`).join('');
  }
  return `<svg width="${W}" height="${H}" role="img" aria-label="Column chart">${g}<line class="axis-l" x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}"/>${marks}${line}${hits}</svg>`;
}
function barPath(x,y,w,h,fill){ const r=Math.min(4,w/2,h); return `<path d="M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z" fill="${fill}"/>`; }
function lineSvg(sp,W,H){
  const L=38,R=10,T=10,B=24, iw=W-L-R, ih=H-T-B, n=sp.labels.length, step=iw/Math.max(1,n);
  const y=v=>T+ih-v/100*ih, x=i=>L+i*step+step/2;
  let g='';
  [0,50,100].forEach(v=>{ g+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}%</text>`; });
  const col=cssv('--s1');
  let path='', seg=[], area='';
  const flush=()=>{ if(seg.length>1){ path+=`<polyline points="${seg.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`; area+=`<path d="M${seg[0][0]},${T+ih} L${seg.map(p=>p.join(',')).join(' L')} L${seg[seg.length-1][0]},${T+ih}Z" fill="${col}" fill-opacity=".09"/>`; } seg=[]; };
  sp.values.forEach((v,i)=>{ if(v==null) flush(); else seg.push([x(i),y(v)]); }); flush();
  let dots='', hits='', labels='';
  const every=Math.ceil(n/(W<520?6:12));
  sp.values.forEach((v,i)=>{
    if(v!=null) dots+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===sp.sel?4.5:3}" fill="${i===sp.sel?col:cssv('--panel')}" stroke="${col}" stroke-width="2"/>`;
    if((i%every===0&&n-1-i>every/2)||i===n-1) labels+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle" ${i===sp.sel?'style="fill:var(--ink);font-weight:600"':''}>${esc(sp.labels[i])}</text>`;
    hits+=`<rect class="hit" x="${L+i*step}" y="${T}" width="${step}" height="${ih}" data-tip="${esc(`<b>${sp.full[i]}</b><div class="tr"><span>${sp.label}</span><b>${v==null?'no closures':fmtPct(v)}</b></div>${sp.extra?`<div style="opacity:.75">${sp.extra[i]}</div>`:''}`)}" ${sp.act?`data-act="${sp.act}" data-v="${sp.buckets[i]}"`:''}/>`;
  });
  const last=sp.values[sp.sel];
  const endLabel=last!=null?`<text x="${Math.min(x(sp.sel)+8,W-R-30)}" y="${y(last)-8}" style="fill:var(--ink);font-weight:700">${fmtPct(last)}</text>`:'';
  return `<svg width="${W}" height="${H}" role="img" aria-label="First-pass yield line chart">${g}${area}${path}${dots}${endLabel}${labels}${hits}</svg>`;
}

    Object.assign(e.stage1,{technician:s.name,completedBy:s.name,completedAt:nowIso()});
    Object.assign(latest,{model:e.model,imei:e.imei,site:e.site,cycles:String(e.cycles??'').trim()===''?latest.cycles??null:+e.cycles,stage1:clone(e.stage1)});
    if(isBsaTriggerIssue(e.stage1)){
      Object.assign(latest,{status:'CLOSED_TRANSFERRED_BSA',finalDisposition:'TRANSFERRED_BSA',closedAt:nowIso()});
      bsaCase={bmsId:latest.bmsId,model:latest.model,flaggedBy:s.name,issueDescription:bsaIssueSummary(e.stage1),escalationCategory:bsaEscalationCategory(e.stage1),stage1IssueFlags:bsaTriggerLabels(e.stage1),escalatedFromStage:1,sopAttempted:'No applicable SOP after re-inspection — routed directly.',omRecordId:latest.id};
      msg=`${latest.bmsId} sent straight to BSA.`;
    } else { latest.stage=2; latest.status='STAGE2_OPEN'; msg=`${latest.bmsId} resent to Stage 2.`; }
  } else if(n===2){
    if(onHold(latest)) return fail('This battery is waiting for supplier material. Mark the part as arrived first.');
    if(String(e.stage2.partsReplaced||'').trim()){ const ce=cyclesError(e.cycles); if(ce) return fail('Parts were replaced, so the cycle count is required. '+ce); }
    if(String(e.cycles??'').trim()!==''){ const ce=cyclesError(e.cycles); if(ce) return fail(ce); latest.cycles=+e.cycles; }
    if(needsSim(latest)){ const sm=e.stage2.sim||{}, old=simDigits(((latest.stage1||{}).sim||{}).oldNumber);
      if(!String(sm.newType||'').trim()) return fail('New SIM type is required.');
      const se=simNumberError(sm.newNumber,'New SIM number'); if(se) return fail(se);
      if(old&&simDigits(sm.newNumber)===old) return fail('The new SIM number is the same as the old one. Check the card you fitted.');
      e.stage2.sim={newType:String(sm.newType).trim(),newNumber:simDigits(sm.newNumber),replacedBy:s.name,replacedAt:nowIso()}; }
    Object.assign(e.stage2,{technician:s.name,startedAt:e.stage2.startedAt||nowIso(),completedBy:s.name,completedAt:nowIso()});
    Object.assign(latest,{stage2:clone(e.stage2),stage:3,status:'STAGE3_OPEN'}); msg=`${latest.bmsId} sent to Stage 3.`;
  } else {
    const t=e.stage3, disp=t.qcPassed; if(!disp) return fail('Pick a final QC disposition first.');
    if(disp!=='PASS'&&!String(t.qcNote||'').trim()) return fail('Add a QC note explaining why it failed or is being escalated.');
    const cp=e._capa||{};
    if(disp==='FAIL'){ if(!cp.reasonCat) return fail('Pick the corrective-action reason.'); if(cp.reasonCat==='part'){ if(!cp.part) return fail('Say which part needs replacing.'); if(cp.part==='Other part'&&!String(cp.partNote||'').trim()) return fail('Name the part that needs replacing.'); const ce=cyclesError(e.cycles); if(ce) return fail('A part replacement needs the cycle count. '+ce); if(!cp.waitSupplier) return fail('Say whether the part is in stock or you are waiting for supplier material.'); latest.cycles=+e.cycles; } }
    if(disp==='PASS'&&needsSim(latest)&&!(t.testBools||{})[SIM_TEST[0]]) return fail('Run the functional test on the new SIM and tick it before passing this battery.');
    Object.assign(t,{technician:s.name,startedAt:t.startedAt||nowIso(),completedBy:s.name,completedAt:nowIso()});
    if(disp==='PASS'){ Object.assign(latest,{status:'CLOSED_PASS',finalDisposition:'PASS',closedAt:nowIso()}); msg=`${latest.bmsId} passed final QC and is closed.`; }
    else if(disp==='ESCALATE_BSA'){
      Object.assign(latest,{status:'CLOSED_TRANSFERRED_BSA',finalDisposition:'ESCALATED_BSA',closedAt:nowIso(),bsaEscalatedAt:nowIso(),bsaEscalatedBy:s.name});
      bsaCase={bmsId:latest.bmsId,model:latest.model||'',flaggedBy:s.name,issueDescription:t.qcNote||bsaIssueSummary(latest.stage1||{}),escalationCategory:'Final QC escalation',stage1IssueFlags:bsaTriggerLabels(latest.stage1||{}),escalatedFromStage:3,sopAttempted:(latest.stage2||{}).sopRef||'Stage 3 final QC could not be completed',omRecordId:latest.id};
      msg=`${latest.bmsId} escalated to BSA.`;
    } else {
      const to=parseInt(e._returnTo)||2;
      latest.capaCycles=(latest.capaCycles||0)+1; latest.isCorrectiveAction=true;
      const part=cp.reasonCat==='part'?(cp.part==='Other part'?String(cp.partNote||'').trim()||'Other part':cp.part):'', wait=cp.reasonCat==='part'&&cp.waitSupplier==='yes';
      latest.capaLog=[...(latest.capaLog||[]),{cycle:latest.capaCycles,returnedAt:nowIso(),returnedBy:s.name,reason:t.qcNote,reasonCat:cp.reasonCat,part,cycles:cp.reasonCat==='part'?+e.cycles:null,waitSupplier:wait,toStage:to}];
      if(wait) latest.hold={type:'supplier',part,note:t.qcNote,since:nowIso(),by:s.name,fromCapa:latest.capaCycles};
      latest.stage=to; latest.status=to===1?'STAGE1_OPEN':'STAGE2_OPEN'; t.qcPassed='';
      msg=`${latest.bmsId} returned to Stage ${to} for corrective action${wait?' and is waiting for supplier material':''}.`;
    }
    latest.stage3=clone(t);
  }
  if(bsaCase){
    const bsa=await loadStore('bsa_records');
    const dup=bsa.find(x=>x.omRecordId===latest.id||(normId(x.bmsId)===normId(latest.bmsId)&&bsaOpen(x)));
    if(!dup){
      const c={id:uid(),source:BSA_SOURCES[0],dateFlagged:todayStr(),assignedEngineer:'',status:BSA_STATUSES[0],rcaSummary:'',repairNotes:'',createdAt:nowIso(),...bsaCase};
      if(!await saveStore('bsa_records',[...bsa,c])) return fail('The BSA case could not be saved, so nothing was changed. Try again.');
      S.data.bsa=[...bsa,c];
    }
  }
  fresh[idx]=latest;
  if(!await saveStore('om_chain_records',fresh)) return fail('Could not save. Check the connection and try again.');
  S.data.om=fresh; bump(); S.saving=false; S.f.edit=null; closeDrawer(); render(); toast(msg);
}

      ${kv('Stage 1',(r.stage1||{}).technician)}${kv('Stage 2',(r.stage2||{}).technician)}${kv('Stage 3',(r.stage3||{}).technician)}
      ${kv('Procedure',(r.stage2||{}).sopRef)}${kv('Parts replaced',(r.stage2||{}).partsReplaced)}${kv('Repair notes',(r.stage2||{}).repairAction)}
      ${kv('Pack voltage',t.packVoltage?t.packVoltage+' V':'')}${kv('Cell min / max',t.minCell?`${t.minCell} / ${t.maxCell} V`:'')}${kv('Insulation',t.irMeasured?`${t.irMeasured} MΩ (min ${t.irThreshold})`:'')}
      ${kv('Tests',TEST_BOOLS.filter(([k])=>tb[k]).length+' of '+TEST_BOOLS.length+' confirmed')}${needsSim(r)?kv('SIM functional test',tb[SIM_TEST[0]]?'Passed':(r.stage3||{}).completedAt?'Not confirmed':'Pending'):''}${kv('QC notes',(r.stage3||{}).qcNote)}${kv('CAPA cycles',r.capaCycles||0)}${(r.capaLog||[]).map(c=>kv('CAPA '+c.cycle,capaText(c))).join('')}${(r.holdLog||[]).map(h=>kv('Supplier wait',`${h.part||'part'} · ${fmtShort(dkey(h.since))} → ${fmtShort(dkey(h.releasedAt))}`)).join('')}
      ${preFail.length?kv('Pre-check fails',preFail.join(', ')):''}${postFail.length?kv('Post-check fails',postFail.join(', ')):''}</div>
      ${canDelete()?`<div style="padding:0 14px 12px"><button class="btn sm danger" data-act="del" data-store="om_chain_records" data-id="${esc(r.id)}">Delete this visit</button></div>`:''}</details>`;

  const body=`<div class="facts"><div class="fact"><span>Visits</span><b>${b.visits.length}</b></div><div class="fact"><span>First pass</span><b>${b.closedCount?`${b.fp}/${b.closedCount}`:'—'}</b></div><div class="fact"><span>CAPA cycles</span><b>${b.capa}</b></div><div class="fact"><span>Days in repair</span><b>${Math.round(b.repairDays*10)/10}</b></div></div>

    ${bsaList?`<div><h4 style="margin-bottom:8px">BSA cases</h4><div style="display:grid;gap:6px">${bsaList}</div></div>`:''}
    <div><h4 style="margin-bottom:8px">Timeline</h4>${tl}</div>
    ${visits?`<div style="display:grid;gap:8px"><h4>Visit details</h4>${visits}</div>`:''}`;
  const open=b.openVisit&&canWork(b.openVisit)?`<button class="btn pri" data-act="open-om" data-id="${esc(b.openVisit.id)}">Work this visit</button>`:'';
  return sheet(`<span class="mono" style="font-size:.85em">${esc(b.id)}</span>`,`${esc(b.platform||'Unknown platform')} · first seen ${esc(fmtShort(b.first))} · last seen ${esc(fmtShort(b.last))}`,body,open,`Battery · ${chip(um[0],um[1],um[2])}`);

async function cpConnect(){
  const url=$('#cp-url').value.trim().replace(/\/+$/,''), key=$('#cp-key').value.trim(), st=$('#cp-status');
  if(!/^https?:\/\//.test(url)||!key){ st.textContent='Enter the full https:// project URL and the anon key.'; return; }
  st.textContent='Testing…'; const prev=Cloud.cfg; Cloud.cfg={url,key};
  try{ await cloudReq(BQC_TABLE+'?select=id&limit=1'); Cloud.localOnly=false; lsWrite('bqc_local_only',false); lsWrite(CFG_KEY,Cloud.cfg); Cloud.lastError=null; await flushOutbox(); closeDrawer(); await refresh(); toast('Connected and synced.'); }
  catch(e){ Cloud.cfg=prev; st.textContent='Could not connect: '+e.message+'. Check the URL, the key, and that the setup SQL has been run.'; }
}
function exportBackup(){
  const dump={exportedAt:nowIso(),stores:{}}; BQC_STORES.forEach(s=>dump.stores[s]=cacheGet(s));
  download(new Blob([JSON.stringify(dump,null,2)],{type:'application/json'}),'battery-qc-backup-'+todayStr()+'.json');
}
function importBackup(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=async()=>{ try{
    const dump=JSON.parse(rd.result), stores=dump.stores||dump; let added=0;
    for(const k of BQC_STORES){ if(k==='accountability_audit_records') continue; const inc=Array.isArray(stores[k])?stores[k]:null; if(!inc||!inc.length) continue;
      const ex=await loadStore(k), m=new Map(ex.map(r=>[String(r.id),r])); inc.forEach(r=>{ const c=clone(r); c.id=String(c.id||uid()); if(!m.has(c.id)){ m.set(c.id,c); added++; } });
      await saveStore(k,[...m.values()],{internal:true}); }
    closeDrawer(); await refresh(); toast(`Imported ${added} new record${added===1?'':'s'}.`);
  }catch(e){ toast('Could not read that file: '+e.message); } };
  rd.readAsText(file);
}
/* ---------- Scanner ---------- */
let SCAN={stream:null,raf:0};
function stopScan(){ cancelAnimationFrame(SCAN.raf); if(SCAN.stream) SCAN.stream.getTracks().forEach(t=>t.stop()); SCAN={stream:null,raf:0}; $('#modal-root').innerHTML=''; }
async function openScanner(form){
  const root=$('#modal-root');
  root.innerHTML=`<div class="scrim"><div class="modal"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Scan battery code</h3><button class="btn icon-btn ghost" id="scan-x" aria-label="Close">${ICON.close}</button></div><div class="sub" id="scan-st">Starting camera…</div><video id="scan-v" playsinline muted autoplay></video><div class="muted" style="font-size:12.5px">A USB or Bluetooth scanner also works: click the ID field and scan.</div></div></div>`;
  $('#scan-x').onclick=stopScan;
  const st=$('#scan-st');
  if(!('BarcodeDetector' in window)||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ st.textContent='This browser can\'t scan with the camera. Type the ID or use a hardware scanner.'; return; }
  try{
    const formats=(await BarcodeDetector.getSupportedFormats()).filter(f=>['qr_code','code_128','code_39','code_93','ean_13','ean_8','data_matrix','itf','codabar','upc_a','pdf417','aztec'].includes(f));
    const det=new BarcodeDetector({formats}); const v=$('#scan-v');
    SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}); v.srcObject=SCAN.stream; st.textContent='Hold the code steady in view.';
    const tick=async()=>{ if(!SCAN.stream) return; try{ if(v.readyState>=2){ const c=await det.detect(v); const hit=c.find(x=>String(x.rawValue||'').trim()); if(hit){ const val=hit.rawValue.trim().toUpperCase(); stopScan(); const sfx=$('#'+form+'-sfx'); if(sfx){ sfx.value=val; idInput(form); } return; } } }catch(e){} SCAN.raf=requestAnimationFrame(tick); };
    SCAN.raf=requestAnimationFrame(tick);
  }catch(e){ st.textContent='The camera could not be opened. Check the permission, or type the ID.'; }
}

   DOWNLOADS — formatted Excel workbook (with native charts) and a
   self-contained chart report. Both cover the period chosen on screen.
   ===================================================================== */
const LIB = {
  exceljs:'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
  jszip:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'
};
const LIB_P = {};
function loadLib(name,global){
  if(window[global]) return Promise.resolve(window[global]);
  return LIB_P[name] || (LIB_P[name]=new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=LIB[name]; s.async=true;
    s.onload=()=>res(window[global]); s.onerror=()=>{ LIB_P[name]=null; rej(new Error('Could not load the spreadsheet library. Check the internet connection.')); };
    document.head.appendChild(s);
  }));
}
let DL_CAP=null;
function downloadsCap(){
  if(!window.claude||typeof window.claude.use!=='function') return Promise.resolve(null);
  return DL_CAP || (DL_CAP=window.claude.use('downloads').catch(()=>null));
}
async function download(blob,name){
  const cap=await downloadsCap();
  if(cap){
    try{ await cap.save({filename:name,data:blob}); toast(`Saved ${name}`); return true; }
    catch(e){
      if(e&&e.code==='declined'){ toast('Download cancelled.'); return false; }
      if(e&&e.code==='rate_limited'){ toast('A save is already waiting for your answer.'); return false; }
      if(!e||!['unavailable','not_granted','capability_disabled','capability_removed'].includes(e.code)){ toast('Could not save: '+((e&&e.message)||'unknown error')); return false; }
    }
  }
  const a=document.createElement('a'), u=URL.createObjectURL(blob); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); },8000);
  toast(`Downloaded ${name}`); return true;
}

/* ---------- shared report data ---------- */
function reportData(){
  const p=periodOf(S.anchor,S.gran), prev=periodOf(shiftKey(p.start,S.gran,-1),S.gran);
  const buckets=bucketsEnding(S.anchor,S.gran,BUCKETS[S.gran]);
  const range={start:buckets[0].start,end:buckets[buckets.length-1].end,gran:S.gran};
  const st=periodStats(p), pv=periodStats(prev), bs=buckets.map(b=>({b,s:periodStats(b)}));
  const counts={}; st.intakeRows.forEach(r=>issuesOf(r).forEach(k=>counts[k]=(counts[k]||0)+1));
  const defects=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({k,label:ISSUE_LABEL[k],cat:issueCategory(k),v}));
  const plat={}; st.intakeRows.forEach(r=>{ const k=r.model||platformForId(r.bmsId)||'Unknown'; plat[k]=(plat[k]||0)+1; });
  const platforms=Object.entries(plat).sort((a,b)=>b[1]-a[1]);
  const techs=stageCompletions(p);
  const closedP=S.data.om.filter(r=>isClosed(r)&&inP(closedKey(r),p));
  const fpyPlat=fpyGroup(closedP,r=>r.model||platformForId(r.bmsId)||'Unknown');
  const bat=batteryIndex();
  const useCounts=USE_ORDER.map(k=>[USE_META[k][0],bat.filter(b=>b.use===k).length,k]);
  const visits=S.data.om.filter(r=>inP(r.dateReceived,range)||(isClosed(r)&&inP(closedKey(r),range))).sort((a,b)=>String(b.createdAt||b.dateReceived).localeCompare(String(a.createdAt||a.dateReceived)));
  const bsa=S.data.bsa.filter(r=>inP(r.dateFlagged,range)||bsaOpen(r)).sort((a,b)=>String(b.dateFlagged||'').localeCompare(String(a.dateFlagged||'')));
  const bsaStatus=BSA_TECH_STATUSES.concat(['Awaiting BSA receipt']).map(k=>[k,S.data.bsa.filter(r=>bsaTechStatus(r)===k).length]).filter(x=>x[1]);
  const open=S.data.om.filter(r=>!isClosed(r)).sort((a,b)=>ageDays(b)-ageDays(a));
  return {p,prev,st,pv,buckets,bs,range,defects,platforms,techs,fpyPlat,bat,useCounts,visits,bsa,bsaStatus,open,
    granWord:S.gran==='day'?'Daily':S.gran==='week'?'Weekly':'Monthly', unit:S.gran,
    who:S.session?S.session.name:'', at:new Date()};
}

const XC = {ink:'0E1B2C',ink2:'51657C',ink3:'7D90A6',line:'DDE4EE',zebra:'F5F8FC',head:'1D6FF2',head2:'0E4FB8',accent:'1D6FF2',
  s1:'2A78D6',s2:'EB6834',s3:'1BAF7A',s4:'EDA100',s5:'E87BA4',
  good:['E4F4EC','12945F'],warn:['FDF0DC','A35A00'],crit:['FBE6E6','C63434'],info:['E6EFFD','1D5FD0'],serious:['FCEADF','B5491A'],neutral:['EEF2F7','51657C']};
const toneOfUse = k => ({usable:'good',watch:'warn',repair:'info',bsa:'serious',scrapped:'crit'})[k];
const argb = h => 'FF'+h;
const colL = n => { let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; };
const toDate = k => k ? (()=>{ const d=parseKey(dkey(k)); return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); })() : null;

function xlTitle(ws,title,sub,width){
  ws.mergeCells(1,1,1,width); ws.mergeCells(2,1,2,width);
  const t=ws.getCell(1,1); t.value=title; t.font={name:'Calibri',size:18,bold:true,color:{argb:argb(XC.ink)}}; t.alignment={vertical:'middle'};
  const s=ws.getCell(2,1); s.value=sub; s.font={name:'Calibri',size:10.5,color:{argb:argb(XC.ink2)}}; s.alignment={vertical:'top',wrapText:true};
  ws.getRow(1).height=30; ws.getRow(2).height=30;
  for(let c=1;c<=width;c++){ ws.getCell(3,c).border={top:{style:'medium',color:{argb:argb(XC.accent)}}}; }
  ws.getRow(3).height=6;
}
function xlSection(ws,row,col,text,span){
  if(span>1) ws.mergeCells(row,col,row,col+span-1);
  const c=ws.getCell(row,col); c.value=text; c.font={name:'Calibri',size:12.5,bold:true,color:{argb:argb(XC.ink)}};
  ws.getRow(row).height=22;
}
/* Writes a formatted table; returns {r1 (header row), r2 (last data row), col} */
function xlTable(ws,row,col,cols,rows,opts={}){
  const hr=ws.getRow(row); hr.height=opts.headH||30;
  cols.forEach((c,i)=>{ const cell=ws.getCell(row,col+i); cell.value=c.h;
    cell.font={name:'Calibri',size:10.5,bold:true,color:{argb:'FFFFFFFF'}};
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:argb(opts.headColor||XC.head)}};
    cell.alignment={vertical:'middle',horizontal:c.align||'left',wrapText:true};
    cell.border={bottom:{style:'thin',color:{argb:argb(XC.head2)}}};
  });
  rows.forEach((r,ri)=>{
    const rr=row+1+ri;
    cols.forEach((c,i)=>{
      const cell=ws.getCell(rr,col+i); let v=r[i];
      if(v&&typeof v==='object'&&!(v instanceof Date)&&'v' in v){ if(v.tone){ const t=XC[v.tone]||XC.neutral; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:argb(t[0])}}; cell.font={name:'Calibri',size:10.5,bold:true,color:{argb:argb(t[1])}}; } if(v.bold) cell.font={...(cell.font||{name:'Calibri',size:10.5}),bold:true}; if(v.color) cell.font={...(cell.font||{name:'Calibri',size:10.5}),color:{argb:argb(v.color)}}; v=v.v; }
      cell.value=(v===undefined||v===''||v===null)?null:v;
      if(!cell.font) cell.font={name:'Calibri',size:10.5,color:{argb:argb(XC.ink)}};
      if(!cell.fill && ri%2===1) cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:argb(XC.zebra)}};
      if(c.fmt) cell.numFmt=c.fmt;
      cell.alignment={vertical:'middle',horizontal:c.align||'left',wrapText:!!c.wrap};
      cell.border={bottom:{style:'hair',color:{argb:argb(XC.line)}}};
    });
  });
  if(opts.total){ const tr=row+1+rows.length; cols.forEach((c,i)=>{ const cell=ws.getCell(tr,col+i); const v=opts.total[i]; cell.value=v==null?null:v; cell.font={name:'Calibri',size:10.5,bold:true,color:{argb:argb(XC.ink)}}; if(c.fmt) cell.numFmt=c.fmt; cell.alignment={horizontal:c.align||'left'}; cell.border={top:{style:'thin',color:{argb:argb(XC.ink2)}}}; }); }
  if(opts.filter&&rows.length) ws.autoFilter={from:{row,column:col},to:{row:row+rows.length,column:col+cols.length-1}};
  cols.forEach((c,i)=>{ if(c.w){ const colObj=ws.getColumn(col+i); if(!colObj.width||colObj.width<c.w) colObj.width=c.w; } });
  return {r1:row,r2:row+rows.length,col};
}
const ref = (sheet,col,r1,r2) => `'${sheet.replace(/'/g,"''")}'!$${colL(col)}$${r1}${r2!=null?`:$${colL(col)}$${r2}`:''}`;

/* ---------- native chart XML ---------- */
const xe = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const NS_C='http://schemas.openxmlformats.org/drawingml/2006/chart', NS_A='http://schemas.openxmlformats.org/drawingml/2006/main', NS_R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
function strCache(vals){ return `<c:strCache><c:ptCount val="${vals.length}"/>${vals.map((v,j)=>`<c:pt idx="${j}"><c:v>${xe(v)}</c:v></c:pt>`).join('')}</c:strCache>`; }
function numCache(vals,fmt){ return `<c:numCache><c:formatCode>${xe(fmt||'General')}</c:formatCode><c:ptCount val="${vals.length}"/>${vals.map((v,j)=>v==null||isNaN(v)?'':`<c:pt idx="${j}"><c:v>${v}</c:v></c:pt>`).join('')}</c:numCache>`; }
const fill = h => `<a:solidFill><a:srgbClr val="${h}"/></a:solidFill>`;
const txPr = (sz,col,b) => `<c:txPr><a:bodyPr/><a:lstStyle/><a:p><a:pPr><a:defRPr sz="${sz}" b="${b?1:0}">${fill(col)}<a:latin typeface="Calibri"/></a:defRPr></a:pPr><a:endParaRPr lang="en-US"/></a:p></c:txPr>`;
const dLbls = (pos,fmt,pct) => `<c:dLbls>${fmt?`<c:numFmt formatCode="${xe(fmt)}" sourceLinked="0"/>`:''}<c:spPr><a:noFill/><a:ln><a:noFill/></a:ln></c:spPr>${txPr(850,XC.ink,true)}${pos?`<c:dLblPos val="${pos}"/>`:''}<c:showLegendKey val="0"/><c:showVal val="${pct?0:1}"/><c:showCatName val="0"/><c:showSerName val="0"/><c:showPercent val="${pct?1:0}"/><c:showBubbleSize val="0"/></c:dLbls>`;
function serXml(s,i,cats,kind){
  const tx=s.nameRef?`<c:tx><c:strRef><c:f>${xe(s.nameRef)}</c:f>${strCache([s.name])}</c:strRef></c:tx>`:`<c:tx><c:v>${xe(s.name)}</c:v></c:tx>`;
  const cat=`<c:cat><c:strRef><c:f>${xe(cats.ref)}</c:f>${strCache(cats.vals)}</c:strRef></c:cat>`;
  const val=`<c:val><c:numRef><c:f>${xe(s.ref)}</c:f>${numCache(s.vals,s.fmt)}</c:numRef></c:val>`;
  if(kind==='line') return `<c:ser><c:idx val="${i}"/><c:order val="${i}"/>${tx}<c:spPr><a:ln w="28575" cap="rnd">${fill(s.color)}<a:round/></a:ln></c:spPr><c:marker><c:symbol val="circle"/><c:size val="6"/><c:spPr>${fill('FFFFFF')}<a:ln w="19050">${fill(s.color)}</a:ln></c:spPr></c:marker>${s.labels?dLbls('t',s.fmt):''}${cat}${val}<c:smooth val="0"/></c:ser>`;
  if(kind==='pie') return `<c:ser><c:idx val="${i}"/><c:order val="${i}"/>${tx}${s.colors.map((c,j)=>`<c:dPt><c:idx val="${j}"/><c:bubble3D val="0"/><c:spPr>${fill(c)}<a:ln w="19050">${fill('FFFFFF')}</a:ln></c:spPr></c:dPt>`).join('')}${dLbls('',null,false)}${cat}${val}</c:ser>`;
  return `<c:ser><c:idx val="${i}"/><c:order val="${i}"/>${tx}<c:spPr>${fill(s.color)}</c:spPr><c:invertIfNegative val="0"/>${s.labels?dLbls(s.labelPos||'',s.fmt):''}${cat}${val}</c:ser>`;
}
function axes(idC,idV,o){
  const grid=`<c:majorGridlines><c:spPr><a:ln w="6350">${fill('E3E8EF')}</a:ln></c:spPr></c:majorGridlines>`;
  const noLn=`<c:spPr><a:ln w="6350">${fill('C9D3DF')}</a:ln></c:spPr>`;
  return `<c:catAx><c:axId val="${idC}"/><c:scaling><c:orientation val="${o.reverse?'maxMin':'minMax'}"/></c:scaling><c:delete val="0"/><c:axPos val="${o.horizontal?'l':'b'}"/><c:numFmt formatCode="General" sourceLinked="0"/><c:majorTickMark val="none"/><c:minorTickMark val="none"/><c:tickLblPos val="nextTo"/>${noLn}${txPr(850,XC.ink2)}<c:crossAx val="${idV}"/><c:crosses val="autoZero"/><c:auto val="1"/><c:lblAlgn val="ctr"/><c:lblOffset val="100"/><c:noMultiLvlLbl val="0"/></c:catAx>`+
    `<c:valAx><c:axId val="${idV}"/><c:scaling><c:orientation val="minMax"/>${o.max!=null?`<c:max val="${o.max}"/>`:''}<c:min val="0"/></c:scaling><c:delete val="${o.hideVal?1:0}"/><c:axPos val="${o.horizontal?'b':'l'}"/>${o.hideVal?'':grid}<c:numFmt formatCode="${xe(o.valFmt||'General')}" sourceLinked="0"/><c:majorTickMark val="none"/><c:minorTickMark val="none"/><c:tickLblPos val="nextTo"/><c:spPr><a:ln><a:noFill/></a:ln></c:spPr>${txPr(850,XC.ink3)}<c:crossAx val="${idC}"/><c:crosses val="${o.reverse?'max':'autoZero'}"/><c:crossBetween val="between"/></c:valAx>`;
}
function chartXml(spec){
  const title=`<c:title><c:tx><c:rich><a:bodyPr/><a:lstStyle/><a:p><a:pPr><a:defRPr sz="1200" b="1">${fill(XC.ink)}</a:defRPr></a:pPr><a:r><a:rPr lang="en-US" sz="1200" b="1">${fill(XC.ink)}<a:latin typeface="Calibri"/></a:rPr><a:t>${xe(spec.title)}</a:t></a:r></a:p></c:rich></c:tx><c:overlay val="0"/></c:title><c:autoTitleDeleted val="0"/>`;
  let plot='';
  if(spec.type==='pie'){
    plot=`<c:doughnutChart><c:varyColors val="1"/>${serXml(spec.series[0],0,spec.cats,'pie')}<c:firstSliceAng val="0"/><c:holeSize val="55"/></c:doughnutChart>`;
  } else {
    const bars=spec.series.filter(s=>s.kind!=='line'), lines=spec.series.filter(s=>s.kind==='line');
    if(bars.length) plot+=`<c:barChart><c:barDir val="${spec.horizontal?'bar':'col'}"/><c:grouping val="${spec.stacked?'stacked':'clustered'}"/><c:varyColors val="0"/>${bars.map((s,i)=>serXml(s,i,spec.cats,'bar')).join('')}<c:gapWidth val="${spec.gap||60}"/>${spec.stacked?'<c:overlap val="100"/>':'<c:overlap val="-10"/>'}<c:axId val="5001"/><c:axId val="5002"/></c:barChart>`;
    if(lines.length) plot+=`<c:lineChart><c:grouping val="standard"/><c:varyColors val="0"/>${lines.map((s,i)=>serXml(s,bars.length+i,spec.cats,'line')).join('')}<c:marker val="1"/><c:axId val="5001"/><c:axId val="5002"/></c:lineChart>`;
    plot+=axes(5001,5002,{horizontal:spec.horizontal,reverse:spec.horizontal,max:spec.max,valFmt:spec.valFmt,hideVal:spec.hideVal});
  }
  const legend=spec.legend===false?'':`<c:legend><c:legendPos val="${spec.legendPos||'b'}"/><c:overlay val="0"/>${txPr(900,XC.ink2)}</c:legend>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<c:chartSpace xmlns:c="${NS_C}" xmlns:a="${NS_A}" xmlns:r="${NS_R}"><c:roundedCorners val="0"/><c:chart>${title}<c:plotArea><c:layout/>${plot}<c:spPr><a:noFill/><a:ln><a:noFill/></a:ln></c:spPr></c:plotArea>${legend}<c:plotVisOnly val="1"/><c:dispBlanksAs val="gap"/></c:chart><c:spPr>${fill('FFFFFF')}<a:ln w="9525">${fill('DDE4EE')}</a:ln></c:spPr>${txPr(900,XC.ink2)}</c:chartSpace>`;

  const csStart=Math.max(BS.r2+4,18)+3;
  xlSection(wb5,csStart-1,1,`Cases · ${d.bsa.length}`,3);
  xlTable(wb5,csStart,1,[{h:'Flagged',fmt:'d mmm yyyy',w:13},{h:'BMS ID',w:23},{h:'Platform',w:11},{h:'Status',w:24},{h:'Reason',w:26},{h:'Source',w:26},{h:'Issue',wrap:true,w:36},{h:'Engineer',w:14},{h:'Received',fmt:'d mmm yyyy',w:13},{h:'Closed',fmt:'d mmm yyyy',w:13},{h:'Age (days)',align:'right',w:10},{h:'Root cause',wrap:true,w:30},{h:'Repair notes',wrap:true,w:30}],
    d.bsa.length?d.bsa.map(r=>{ const t=bsaTechStatus(r); return [toDate(r.dateFlagged),r.bmsId,r.model,{v:t,tone:(BSA_TONE[t]||['neutral'])[0]},r.escalationCategory,r.source,r.issueDescription,r.assignedEngineer,toDate(r.bsaReceivedAt),toDate(r.dateClosed),bsaOpen(r)?daysBetween(r.dateFlagged||todayStr(),todayStr()):(r.dateClosed?daysBetween(r.dateFlagged,dkey(r.dateClosed)):null),r.rcaSummary,r.repairNotes]; }):[[null,'No cases']],{filter:true});
  wb5.views=[{showGridLines:false,state:'frozen',ySplit:csStart}];

  xlTable(wb6,5,1,[{h:'BMS ID',w:23},{h:'Platform',w:11},{h:'Stage',w:20},{h:'Claimed by',w:16},{h:'Received',fmt:'d mmm yyyy',w:13},{h:'Days in chain',align:'right',w:12},{h:'CAPA cycles',align:'right',w:11},{h:'Issues',wrap:true,w:40},{h:'Waiting for',wrap:true,w:24}],
    d.open.length?d.open.map(r=>{ const a=ageDays(r); return [r.bmsId,r.model,`Stage ${r.stage} · ${STAGE_SHORT[r.stage]}`,(r['stage'+r.stage]||{}).technician||'Unclaimed',toDate(r.dateReceived),{v:a,tone:a>=5?'crit':a>=3?'warn':null},r.capaCycles||0,issuesOf(r).map(k=>ISSUE_LABEL[k]).join(', '),onHold(r)?{v:`Supplier · ${r.hold.part||'part'} (${fmtHours(hoursSince(r.hold.since))})`,tone:'serious'}:((r['stage'+r.stage]||{}).technician?'':{v:'Not claimed',tone:'warn'})]; }):[['Nothing open']],{filter:true});
  wb6.views=[{showGridLines:false,state:'frozen',ySplit:5}];

  /* 7 · RCA */
  const wb7=sheet('RCA register','7C4DD6');
  xlTitle(wb7,'Root-cause analyses','All RCAs on record. Red due dates are overdue.',9);
  xlTable(wb7,5,1,[{h:'Opened',fmt:'d mmm yyyy',w:13},{h:'BMS ID',w:23},{h:'Status',w:22},{h:'Owner',w:14},{h:'Due',fmt:'d mmm yyyy',w:13},{h:'Problem',wrap:true,w:36},{h:'Root cause',wrap:true,w:36},{h:'Corrective action',wrap:true,w:30},{h:'Preventive action',wrap:true,w:30}],
    S.data.rca.length?S.data.rca.slice().sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||''))).map(r=>{ const od=r.status!=='VERIFIED CLOSED'&&r.dueDate&&r.dueDate<todayStr(); return [toDate(r.dateOpened||r.createdAt),r.bmsId,{v:(r.status||'RCA IN PROGRESS').toLowerCase(),tone:r.status==='VERIFIED CLOSED'?'good':'warn'},r.owner,od?{v:toDate(r.dueDate),tone:'crit'}:toDate(r.dueDate),r.problemStatement,r.rootCause,r.correctiveAction,r.preventiveAction]; }):[[null,'No RCAs']],{filter:true});
  wb7.views=[{showGridLines:false,state:'frozen',ySplit:5}];

  wb8.columns=[{width:28},{width:90}];
  xlTable(wb8,5,1,[{h:'Term',w:28},{h:'Meaning',wrap:true,w:90}],[
    ['First-pass yield (FPY)','Batteries closed as PASS with no corrective-action cycle, divided by all batteries closed in the period (including those sent to BSA).'],
    ['CAPA return','Final QC failed the battery and sent it back to Stage 1 or 2. It is the same visit, not a new failure.'],
    ['PPM','Non-conforming closures (had CAPA, or scrapped) per million closures.'],
    ['Supplier-related defect','BMS fault, cell imbalance, cell failure, insulation failure, CAN fail, IoT mismatch, low capacity.'],
    ['Handling / field defect','No power, charge or discharge failure, swelling, tampering, physical damage, moisture, connector damage, missing parts, other.'],
    ['Usable','Last O&M visit closed with a pass, or BSA returned the battery.'],
    ['Usable · watch','Usable now, but 3 or more visits or 2 or more CAPA cycles on record.'],
    ['In O&M repair / With BSA','Has an open visit in the chain / an open BSA case.'],
    ['Scrapped','BSA scrapped the battery.'],
    ['SIM card replacement (recall)','A planned recall, not a defect: it is left out of supplier and handling defect counts. The old SIM is recorded at intake, the new SIM at Stage 2, and Stage 3 cannot pass the battery until the functional test on the new SIM is ticked.'],
    ['CAPA reason','Final QC picks why a battery goes back: needs part replacement (with the part), repair not effective, failed a test, assembly issue, re-inspection or other.'],
    ['Waiting for supplier material','The visit is on hold at Stage 2 until the part arrives. Stage 2 marks the part as arrived to resume repair; every wait is kept in the history.'],
    ['Alerts','Unclaimed 2 h (urgent 8 h); claimed but not submitted 1 day (urgent 3 days); waiting for supplier 3 days (urgent 7).'],
    ['Periods','Days are calendar days; weeks run Monday to Sunday; months are calendar months.']
  ]);

  const raw=await wb.xlsx.writeBuffer();
  const blob=await injectCharts(raw,charts);
  return download(blob,`battery-qc-report_${fileStamp(d)}.xlsx`);
}

    return download(new Blob([html],{type:'text/html'}),`battery-qc-report_${fileStamp(d)}.html`);

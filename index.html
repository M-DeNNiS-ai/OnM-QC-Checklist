<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spiro Battery Quality Control & Fleet Telemetry System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090e;
  --panel: #0d1117;
  --panel2: #141b24;
  --panel3: #1c2633;
  --line: #212e3e;
  --line-light: #31445b;
  --text: #e6edf3;
  --muted: #7d8f9d;
  --cyan: #00f0ff;
  --cyan-dim: rgba(0, 240, 255, 0.1);
  --cyan-border: rgba(0, 240, 255, 0.3);
  --amp: #10b981;
  --amp-dim: rgba(16, 185, 129, 0.12);
  --volt: #38bdf8;
  --volt-dim: rgba(56, 189, 248, 0.12);
  --warn: #f59e0b;
  --fail: #ef4444;
  --fail-dim: rgba(239, 68, 68, 0.12);
  --purple: #a855f7;
  --purple-dim: rgba(168, 85, 247, 0.12);
  --font-display: 'Chakra Petch', sans-serif;
  --font-sans: 'Plus Jakarta Sans', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

[data-theme="light"] {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --panel2: #eef2f6;
  --panel3: #e2e8f0;
  --line: #cbd5e1;
  --line-light: #94a3b8;
  --text: #0f172a;
  --muted: #64748b;
  --cyan: #0284c7;
  --cyan-dim: #e0f2fe;
  --cyan-border: #bae6fd;
  --amp: #059669;
  --amp-dim: #d1fae5;
  --volt: #0284c7;
  --volt-dim: #e0f2fe;
  --warn: #d97706;
  --fail: #dc2626;
  --fail-dim: #fee2e2;
  --purple: #7e22ce;
  --purple-dim: #f3e8ff;
}

[data-theme="industrial"] {
  --bg: #111418;
  --panel: #1a1f26;
  --panel2: #222933;
  --panel3: #2d3644;
  --line: #3b4759;
  --line-light: #52637a;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --cyan: #eab308;
  --cyan-dim: rgba(234, 179, 8, 0.12);
  --cyan-border: rgba(234, 179, 8, 0.3);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.app { max-width: 1280px; margin: 0 auto; padding: 20px 24px 80px; }

/* Aerospace Topbar */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); margin-bottom: 20px; gap: 16px; flex-wrap: wrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.brand { display: flex; align-items: center; gap: 16px; }
.brand .mark {
  width: 44px; height: 44px; border-radius: 6px;
  background: linear-gradient(135deg, #090d14, #141f2e);
  border: 1px solid var(--cyan);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; color: var(--cyan); font-size: 22px;
  box-shadow: 0 0 15px var(--cyan-dim);
}
.brand h1 { font-family: var(--font-display); font-size: 20px; margin: 0; letter-spacing: 1px; color: var(--text); text-transform: uppercase; }
.brand p { margin: 0; font-size: 11px; font-family: var(--mono); color: var(--muted); letter-spacing: 0.5px; }

.who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.who b { color: var(--text); font-weight: 600; font-family: var(--mono); }

.pill {
  padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700;
  font-family: var(--mono); letter-spacing: 0.8px; text-transform: uppercase;
  background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
}
.pill.admin { background: var(--cyan-dim); color: var(--cyan); border-color: var(--cyan-border); }
.pill.tech { background: var(--amp-dim); color: var(--amp); border-color: var(--amp); }
.pill.quality { background: var(--purple-dim); color: var(--purple); border-color: var(--purple); }

.side-badge {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: 700;
  font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; border: 1px solid transparent;
}
.side-badge.om { background: var(--cyan-dim); color: var(--cyan); border-color: var(--cyan-border); }
.side-badge.plantside { background: var(--volt-dim); color: var(--volt); border-color: var(--line-light); }
.side-badge.inv { background: var(--amp-dim); color: var(--amp); border-color: var(--amp); }
.side-badge.warranty { background: var(--purple-dim); color: var(--purple); border-color: var(--purple); }

button {
  font-family: var(--font-sans); cursor: pointer; border: none; border-radius: 6px;
  padding: 8px 16px; font-size: 13px; font-weight: 600; transition: all 0.15s ease;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
button:active { transform: translateY(1px); }
.btn-primary { background: var(--cyan); color: #000; font-weight: 700; font-family: var(--font-display); letter-spacing: 0.5px; text-transform: uppercase; }
.btn-primary:hover { filter: brightness(1.15); box-shadow: 0 0 12px var(--cyan-dim); }
.btn-ghost { background: var(--panel2); border: 1px solid var(--line); color: var(--text); }
.btn-ghost:hover { border-color: var(--line-light); background: var(--panel3); }
.btn-danger { background: var(--fail-dim); border: 1px solid var(--fail); color: var(--fail); }
.btn-danger:hover { background: var(--fail); color: #fff; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

.theme-select {
  display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 11px; font-family: var(--mono); color: var(--muted);
}
.theme-select select {
  padding: 4px 8px; font-size: 11px; font-family: var(--mono); border-radius: 4px; width: auto; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
}

.gate {
  max-width: 440px; margin: 12vh auto 0; padding: 32px;
  background: var(--panel); border: 1px solid var(--line-light); border-radius: 8px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
}
.gate h2 { margin-top: 0; font-family: var(--font-display); font-size: 22px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; }
.gate p { color: var(--muted); font-size: 13px; margin-bottom: 24px; font-family: var(--mono); }

label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.8px; font-family: var(--mono); }
input, select, textarea {
  width: 100%; padding: 10px 12px; background: var(--panel2); color: var(--text);
  border: 1px solid var(--line); border-radius: 4px; font-size: 13.5px; font-family: var(--font-sans);
  transition: all 0.15s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan-dim); }
textarea { resize: vertical; min-height: 70px; }

.nav { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; align-items: center; }
.nav button { background: transparent; color: var(--muted); border: 1px solid transparent; border-radius: 4px; font-size: 12.5px; font-family: var(--font-display); letter-spacing: 0.5px; text-transform: uppercase; padding: 7px 14px; }
.nav button.active { background: var(--panel2); color: var(--cyan); border-color: var(--cyan-border); font-weight: 700; }
.nav button:hover:not(.active) { color: var(--text); background: var(--panel3); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
.card h3 { margin: 0 0 4px; font-family: var(--font-display); font-size: 16px; color: var(--text); letter-spacing: 0.5px; text-transform: uppercase; }
.card .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; font-family: var(--mono); }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; }
.grid.narrow { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }

.banner {
  padding: 12px 16px; border-radius: 6px; font-size: 13px; font-family: var(--mono); margin-bottom: 18px;
  border: 1px solid var(--warn); background: rgba(245, 158, 11, 0.1); color: var(--warn); display: flex; align-items: center; gap: 10px;
}
.banner.ok { border-color: var(--amp); background: var(--amp-dim); color: var(--amp); }

.check-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid var(--line);
}
.check-row:last-child { border-bottom: none; }
.check-row span { font-size: 13px; }

.seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; flex: none; }
.seg button { border-radius: 0; padding: 4px 10px; font-size: 11px; font-family: var(--mono); background: var(--panel2); color: var(--muted); border: none; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: none; }
.seg button.sel-pass { background: var(--amp-dim); color: var(--amp); font-weight: 700; }
.seg button.sel-fail { background: var(--fail-dim); color: var(--fail); font-weight: 700; }
.seg button.sel-na { background: var(--panel3); color: var(--text); }

.bool-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.bool-row input { width: auto; accent-color: var(--cyan); cursor: pointer; width: 16px; height: 16px; }
.bool-row label { margin: 0; color: var(--text); font-size: 13px; flex: 1; text-transform: none; font-weight: 400; cursor: pointer; font-family: var(--font-sans); }

.result-chip {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10.5px; font-weight: 700;
  font-family: var(--mono); letter-spacing: 0.8px; text-transform: uppercase;
}
.result-chip.PASS { background: var(--amp-dim); color: var(--amp); border: 1px solid var(--amp); }
.result-chip.FAIL { background: var(--fail-dim); color: var(--fail); border: 1px solid var(--fail); }
.result-chip.INCOMPLETE, .result-chip.NA { background: var(--panel3); color: var(--muted); border: 1px solid var(--line); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.stat .n { font-size: 26px; font-weight: 700; font-family: var(--mono); color: var(--cyan); }
.stat .l { font-size: 10.5px; font-weight: 700; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 4px; }

.chart-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; margin-bottom: 20px; height: 300px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 10.5px; font-family: var(--mono); letter-spacing: 0.8px; position: sticky; top: 0; background: var(--panel2); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
tr:hover td { background: var(--panel2); }
.mono { font-family: var(--mono); }

.footer-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; position: sticky; bottom: 0; background: var(--bg); padding: 14px 0 8px; z-index: 10; border-top: 1px solid var(--line); }
.err { color: var(--fail); font-size: 12px; font-family: var(--mono); margin-top: 8px; }

/* SOP Reference Box */
.sop-box {
  background: var(--panel2); border: 1px dashed var(--line-light); padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 12px;
}
.sop-box ul { margin: 4px 0 0 18px; padding: 0; color: var(--muted); }
</style>

<body>
<div id="root"></div>

<script>
/* Theme Handling */
let currentTheme = localStorage.getItem('app_theme') || 'dark';
document.documentElement.setAttribute('data-theme', currentTheme);

function setTheme(theme) {
  currentTheme = theme;
  localStorage.setItem('app_theme', theme);
  document.documentElement.setAttribute('data-theme', theme);
  render();
}

function ThemeSelector() {
  const container = el('div', { class: 'theme-select' });
  container.appendChild(el('span', {}, 'STYLE: '));
  const select = el('select', { onChange: (e) => setTheme(e.target.value) });
  [['dark', 'NASA/SpaceX Dark'], ['light', 'Laboratory Light'], ['industrial', 'Siemens Industrial']].forEach(([val, label]) => {
    const opt = el('option', { value: val }, label);
    if (val === currentTheme) opt.setAttribute('selected', 'true');
    select.appendChild(opt);
  });
  container.appendChild(select);
  return container;
}

/* Operational Standard Operating Procedures */
const STANDARD_SOPS = [
  "SOP-BAT-01: Disassembly & Housing Opening Protocol",
  "SOP-BAT-02: Cell Group Voltage Balancing & Module Diagnostics",
  "SOP-BAT-03: BMS Replacement & Firmware Mismatch Resolution",
  "SOP-BAT-04: Insulation Resistance & Hi-Pot Safety Testing",
  "SOP-BAT-05: IoT Harness Rewiring & IMEI Flashing Procedure",
  "SOP-BAT-06: Charging Port Connector Thermal Servicing"
];

/* Model Prefix Mapping (Regex-backed Prefix Rules) */
const BMS_MODEL_PREFIXES = [
  { prefix: 'C7245AC2AA', model: 'CBAK' },
  { prefix: 'U7245AU1G1', model: 'UNIQUE' },
  { prefix: 'A7246AX1A1', model: 'AMPACE' },
  { prefix: 'D72451LWK', model: 'GREENWAY' }
];

function detectModelFromBMS(bmsId) {
  if (!bmsId) return '';
  const cleanId = bmsId.trim().toUpperCase();
  const match = BMS_MODEL_PREFIXES.find(p => cleanId.startsWith(p.prefix));
  return match ? match.model : '';
}

/* Checklist Items */
const CHECK_ITEMS = [
  ['foreignObjects','No Foreign Objects / Cables'],
  ['looseComponents','No Loose Components / Connectors'],
  ['wiring','Internal Wiring Intact'],
  ['cells','All Cells Physically Intact'],
  ['corrosion','No Moisture / Corrosion'],
  ['bmsMount','BMS Board Securely Mounted'],
  ['internalDamage','No Internal Damage / Vandalism'],
];
const POST_ITEMS = [
  ['foreignObjects','No Foreign Objects Left Inside'],
  ['looseComponents','No Loose Components / Connectors'],
  ['wiring','Wiring Reconnected Properly'],
  ['cells','All Cells Secure'],
  ['bmsMount','BMS Board Securely Mounted'],
  ['seal','Casing Seal / Gasket Intact'],
  ['fasteners','All Screws / Fasteners Reinstalled'],
];
const ISSUE_ITEMS = [
  ['noPower','No Power / Dead Battery (Offline)'],
  ['lowCapacity','Low Capacity / Poor Range'],
  ['cellImbalance','Cell Imbalance'],
  ['bmsFault','BMS Fault / Error Code (BMS Mismatch)'],
  ['canFail','CAN Communication Failure'],
  ['chargeFail','Charging Failure / Port Damage'],
  ['dischargeFail','Discharge Failure'],
  ['swelling','Swelling / Physical Damage'],
  ['irFail','Insulation Resistance Failure'],
  ['iotFault','IoT / IMEI Fault (IoT Mismatch)'],
  ['tampered','Vandalism / Foreign Wiring / Water Ingress'],
  ['connectorDamage','Connector / Wiring Damage'],
  ['other','Other Issue (see remarks)'],
];
const TEST_BOOLS = [
  ['canEstablished','CAN Communication Established'],
  ['bmsFaultCleared','BMS Fault Cleared (No Active Fault)'],
  ['chargeVerified','Charge Function Verified'],
  ['dischargeVerified','Discharge Function Verified'],
  ['noAbnormal','No Abnormal Behavior Observed'],
];

const DEFAULT_OM_PIN = '1234';
const DEFAULT_PLANT_PIN = '2345';
const DEFAULT_QUALITY_PIN = '9999';

const PLATFORMS = ['CBAK','Ampace','Unique','Greenway'];
const BATTERY_CONDITIONS = ['New','Refurbished','Returned - Unopened'];

/* Asset Baseline (As of 1st Sept 2026 COB) */
const INVENTORY_BASELINE = {
  warehouse: { CBAK: 2259, UNIQUE: 8, AMPACE: 1, GREENWAY: 1 },
  installedInBikes: { CBAK: 22, GREENWAY: 3, AMPACE: 0, UNIQUE: 0 },
  palletedCbak: 1440
};

/* Storage Helpers */
async function loadRecords(){ try { const r = await window.storage.get('records', true); return r ? JSON.parse(r.value) : []; } catch(e){ return []; } }
async function saveRecords(list){ await window.storage.set('records', JSON.stringify(list), true); }
async function loadWarrantyRecords(){ try { const r = await window.storage.get('warranty_records', true); return r ? JSON.parse(r.value) : []; } catch(e){ return []; } }
async function saveWarrantyRecords(list){ await window.storage.set('warranty_records', JSON.stringify(list), true); }

async function loadSettings(){
  let s;
  try{ const r = await window.storage.get('settings', true); s = r ? JSON.parse(r.value) : {}; }catch(e){ s = {}; }
  if(!s.omAdminPin) s.omAdminPin = DEFAULT_OM_PIN;
  if(!s.qualityPin) s.qualityPin = DEFAULT_QUALITY_PIN;
  return s;
}

/* App State */
let STATE = {
  role: null,
  techName: '',
  records: [],
  warrantyRecords: [],
  settings: null,
  view: 'entry',
  draft: emptyDraft(),
  warrantyDraft: emptyWarrantyDraft(),
  serialWarning: null,
  toast: null,
};

function emptyDraft(){
  return {
    dateReceived: todayStr(), timeReceived: nowTime(), serial:'', model:'', bmsId:'', imei:'',
    site:'', receivedBy:'',
    pre: {}, post: {},
    issues: {}, otherNote:'',
    sopRef: STANDARD_SOPS[0], repairAction:'', partsReplaced:'', technician:'', repairDate: todayStr(),
    tests: { packVoltage:'', minCell:'', maxCell:'', irMeasured:'', irThreshold:550 },
    testBools: {},
    resolved: {},
    qcPassed:'', handoverDate:'', qcVerifiedBy:'', omReceivedBy:'',
    observations:'', remarks:'',
  };
}

function emptyWarrantyDraft(){
  return {
    dateEscalated: todayStr(), bmsId:'', model:'', serial:'',
    failureCategory: 'Charging Port Failure',
    status: 'Waiting for Spare Parts from Supplier',
    comments: '', technician: ''
  };
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowTime(){ return new Date().toTimeString().slice(0,5); }
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function isImeiRequired(draft) {
  return !!(draft.issues.noPower || draft.issues.bmsFault || draft.issues.iotFault);
}

function isSwapStationRequired(draft) {
  return !!(draft.issues.tampered || draft.issues.swelling || draft.pre.foreignObjects==='FAIL' || d.pre.corrosion==='FAIL');
}

function checklistResult(map, items){
  const vals = items.map(([k])=>map[k]);
  if(vals.some(v=>v==='FAIL')) return 'FAIL';
  if(vals.some(v=>!v)) return 'INCOMPLETE';
  return 'PASS';
}
function testsResult(d){
  const boolsOk = TEST_BOOLS.every(([k])=>d.testBools[k]===true);
  const ir = parseFloat(d.tests.irMeasured), thr = parseFloat(d.tests.irThreshold);
  const irOk = !isNaN(ir) && !isNaN(thr) ? ir>=thr : null;
  if(!boolsOk || irOk===false) return 'FAIL';
  if(irOk===null) return 'INCOMPLETE';
  return 'PASS';
}
function priorAttempts(records, serial){
  if (!serial) return [];
  return records.filter(r=>r.serial.trim().toUpperCase()===serial.trim().toUpperCase());
}

/* Render Root */
const root = document.getElementById('root');
function render(){ root.innerHTML=''; root.appendChild(View()); }

function View(){
  if(!STATE.role) return LoginView();
  const wrap = el('div',{class:'app'});
  wrap.appendChild(TopBar());
  if(STATE.toast) wrap.appendChild(Toast());

  if(STATE.role==='tech'){
    wrap.appendChild(Nav(['entry','myrecords'], {entry:'Log Repair Intake', myrecords:'My Logged Work'}));
    wrap.appendChild(STATE.view==='myrecords' ? MyRecordsView() : EntryView());
  } else if(STATE.role==='omadmin'){
    wrap.appendChild(Nav(['dashboard','history','entry'], {dashboard:'O&M Dashboard', history:'All Intake Records', entry:'Log Repair Intake'}));
    if(STATE.view==='dashboard') wrap.appendChild(DashboardView());
    else if(STATE.view==='history') wrap.appendChild(HistoryView());
    else wrap.appendChild(EntryView());
  } else if(STATE.role==='quality'){
    wrap.appendChild(Nav(
      ['warranty','om_dashboard','om_history','inventory'],
      {warranty:'QC Warranty & Escalations', om_dashboard:'O&M Performance Dashboard', om_history:'O&M Master Logs', inventory:'Fleet Inventory Baseline'}
    ));
    if(STATE.view==='warranty') wrap.appendChild(withSideBadge('warranty', WarrantyView()));
    else if(STATE.view==='om_dashboard') wrap.appendChild(withSideBadge('om', DashboardView()));
    else if(STATE.view==='om_history') wrap.appendChild(withSideBadge('om', HistoryView()));
    else wrap.appendChild(withSideBadge('inv', InventoryView()));
  }
  return wrap;
}

const SIDE_BADGE_LABEL = { om:'O&M Repair Oversight', inv:'Plant & Fleet Inventory', warranty:'QC Data Coordinator Escalations' };
function withSideBadge(kind, node){
  const w = el('div');
  w.appendChild(el('div',{class:'side-badge '+kind}, [el('span',{style:'font-size:14px;'}, '•'), SIDE_BADGE_LABEL[kind] || kind]));
  w.appendChild(node);
  return w;
}

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  });
  return e;
}

function LoginView(){
  const gate = el('div',{class:'gate'});
  gate.appendChild(el('h2',{},'SPIRO BATTERY TELEMETRY'));
  gate.appendChild(el('p',{},'Enterprise O&M Repair, Plant Quality Control & Telemetry Suite'));

  let mode = 'tech';
  const modeSel = el('select',{style:'margin-bottom:20px;font-family:var(--mono);'});
  [
    ['tech','Technician (O&M Repair Entry)'],
    ['omadmin','O&M Quality Administrator'],
    ['quality','QC Data Coordinator (Warranty & Fleet Access)']
  ].forEach(([v,l])=>{ modeSel.appendChild(el('option',{value:v},l)); });
  gate.appendChild(modeSel);

  const body = el('div');
  gate.appendChild(body);

  function renderBody(){
    body.innerHTML='';
    if(mode==='tech'){
      body.appendChild(el('label',{},'Technician Full Name'));
      const inp = el('input',{placeholder:'e.g. Mugambwa Dennis'});
      body.appendChild(inp);
      const go = el('button',{class:'btn-primary',style:'margin-top:20px;width:100%'},'AUTHENTICATE SESSION');
      go.addEventListener('click', async ()=>{
        if(!inp.value.trim()){ inp.style.borderColor='var(--fail)'; return; }
        STATE.techName = inp.value.trim();
        STATE.role='tech'; STATE.view='entry';
        STATE.records = await loadRecords();
        STATE.draft.technician = STATE.techName;
        STATE.draft.receivedBy = STATE.techName;
        render();
      });
      body.appendChild(go);
    } else {
      const roleLabel = mode==='omadmin' ? 'O&M Admin' : 'QC Coordinator';
      body.appendChild(el('label',{}, roleLabel+' Access Security PIN'));
      const inp = el('input',{type:'password',placeholder:'••••'});
      body.appendChild(inp);
      const errBox = el('div',{class:'err'});
      body.appendChild(errBox);
      const go = el('button',{class:'btn-primary',style:'margin-top:20px;width:100%'},'AUTHORIZE SYSTEM ACCESS');
      go.addEventListener('click', async ()=>{
        const s = await loadSettings();
        const pinField = mode==='omadmin' ? 'omAdminPin' : 'qualityPin';
        if(inp.value === s[pinField]){
          STATE.role = mode; STATE.settings = s;
          STATE.records = await loadRecords();
          STATE.warrantyRecords = await loadWarrantyRecords();
          STATE.view = mode==='quality' ? 'warranty' : 'dashboard';
          render();
        } else {
          errBox.textContent = 'SECURITY ERROR: Invalid PIN Credential.';
        }
      });
      body.appendChild(go);
    }
  }
  modeSel.addEventListener('change', ()=>{ mode=modeSel.value; renderBody(); });
  renderBody();
  return gate;
}

function field(label, inputEl){

function textInput(value, onChange, opts={}){
  const i = el('input',{type:opts.type||'text', value: value||''});
  if(opts.mono) i.style.fontFamily='var(--mono)';
  if(opts.placeholder) i.setAttribute('placeholder', opts.placeholder);
  i.addEventListener('input', ()=>onChange(i.value));
  if(value!==undefined) i.value = value;
  return i;
}
function textareaInput(value, onChange){
  const t = el('textarea',{});
  t.value = value||'';
  t.addEventListener('input', ()=>onChange(t.value));
  return t;
}

function ChecklistCard(title, sub, map, items, onSet){
  const card = el('div',{class:'card'});

  card.appendChild(subRow);
  items.forEach(([key,label])=>{
    const row = el('div',{class:'check-row'});
    row.appendChild(el('span',{},label));
    const seg = el('div',{class:'seg'});
    ['PASS','FAIL','NA'].forEach(v=>{
      const cur = map[key];
      const b = el('button',{class: cur===v ? 'sel-'+v.toLowerCase() : ''}, v==='NA'?'N/A':v);
      b.addEventListener('click', ()=>{ onSet(key, cur===v ? undefined : v); render(); });
      seg.appendChild(b);
    });
    row.appendChild(seg);
    card.appendChild(row);
  });
  return card;
}

function EntryView(){
  const d = STATE.draft;
  const container = el('div');

  if(STATE.serialWarning){
    container.appendChild(el('div',{class:'banner'}, STATE.serialWarning));
  }

  const intake = el('div',{class:'card'});
  intake.appendChild(el('h3',{},'Battery Intake & Telemetry Identification'));
  intake.appendChild(el('div',{class:'sub'},'Scan BMS ID Barcode/QR Code. System detects platform model automatically.'));

  const g1 = el('div',{class:'grid'});
  g1.appendChild(field('Date Received', textInput(d.dateReceived, v=>d.dateReceived=v, {type:'date'})));
  g1.appendChild(field('Time Received', textInput(d.timeReceived, v=>d.timeReceived=v, {type:'time'})));

  // BMS ID Entry with Barcode Scanning Support
  const bmsInput = textInput(d.bmsId, v => {
    d.bmsId = v;
    d.serial = v.trim(); 
    const detected = detectModelFromBMS(v);
    if (detected) d.model = detected;
  }, {mono:true, placeholder:'Scan BMS ID Barcode (e.g. C7245AC...)'});

  bmsInput.addEventListener('blur', () => {
    const searchSerial = (d.bmsId || d.serial).trim();
    const prior = priorAttempts(STATE.records, searchSerial);
    if(searchSerial && prior.length > 0){
      const last = prior[prior.length-1];
      STATE.serialWarning = `ALERT: Battery ${searchSerial} has ${prior.length} prior O&M record(s). Last repair date: ${last.dateReceived}. Logging service visit #${prior.length+1}.`;
    } else {
      STATE.serialWarning = null;
    }
    render();
  });

  g1.appendChild(field('Scan BMS ID (Barcode / QR)', bmsInput));

  const modelInput = textInput(d.model, v => d.model = v, { placeholder: 'Auto-detected Platform' });
  g1.appendChild(field('Detected Battery Platform', modelInput));

  // Conditional IMEI input handling
  const imeiRequired = isImeiRequired(d);
  const imeiLabel = imeiRequired ? 'IMEI Number (Mandatory for Offline/Fault)' : 'IMEI Number (Optional)';
  const imeiInput = textInput(d.imei, v => d.imei = v, { mono: true, placeholder: imeiRequired ? 'REQUIRED' : 'Optional' });
  if (imeiRequired) imeiInput.style.borderColor = 'var(--warn)';
  g1.appendChild(field(imeiLabel, imeiInput));

  // Conditional Swap Station input handling
  const swapRequired = isSwapStationRequired(d);
  const swapLabel = swapRequired ? 'Swap Station Origin (Mandatory for Water/Damage)' : 'Swap Station Origin (Optional)';
  const swapInput = textInput(d.site, v => d.site = v, { placeholder: swapRequired ? 'Station Location Required' : 'Optional location' });
  if (swapRequired) swapInput.style.borderColor = 'var(--warn)';
  g1.appendChild(field(swapLabel, swapInput));

  g1.appendChild(field('Received By Technician', textInput(d.receivedBy, v=>d.receivedBy=v)));
  intake.appendChild(g1);
  container.appendChild(intake);

  container.appendChild(ChecklistCard('Pre-Opening Visual Inspection','Physical inspection before casing disassembly.', d.pre, CHECK_ITEMS, (k,v)=>d.pre[k]=v));
  container.appendChild(IssuesCard(d));

  const repair = el('div',{class:'card'});
  repair.appendChild(el('h3',{},'Repair Execution & Work Instructions'));
  
  // Standard Operating Procedure Quick-Selector
  const sopBox = el('div',{class:'sop-box'});
  sopBox.appendChild(el('div',{style:'font-weight:700;color:var(--cyan);font-family:var(--mono);margin-bottom:6px;'},'ACTIVE O&M STANDARD OPERATING PROCEDURES (SOP)'));
  const sopSel = el('select',{style:'font-size:12px;font-family:var(--mono);'});
  STANDARD_SOPS.forEach(sop => {
    const opt = el('option',{value:sop}, sop);
    if(d.sopRef === sop) opt.setAttribute('selected','true');
    sopSel.appendChild(opt);
  });
  sopSel.addEventListener('change', () => d.sopRef = sopSel.value);
  sopBox.appendChild(sopSel);
  repair.appendChild(sopBox);

  const g2 = el('div',{class:'grid'});
  g2.appendChild(field('Components / Parts Replaced', textInput(d.partsReplaced, v=>d.partsReplaced=v, {placeholder:'e.g. BMS, Harness, Connector'})));
  g2.appendChild(field('Assigned Technician', textInput(d.technician, v=>d.technician=v)));
  g2.appendChild(field('Date Completed', textInput(d.repairDate, v=>d.repairDate=v, {type:'date'})));
  repair.appendChild(g2);
  repair.appendChild(field('Summary of Repair Actions Taken', textareaInput(d.repairAction, v=>d.repairAction=v)));
  container.appendChild(repair);

  container.appendChild(ChecklistCard('Post-Service Housing Assembly','Quality confirmation prior to pack sealing.', d.post, POST_ITEMS, (k,v)=>d.post[k]=v));
  container.appendChild(TestsCard(d));

  const disp = el('div',{class:'card'});
  disp.appendChild(el('h3',{},'QC Sign-Off & Handover Authorization'));
  const g3 = el('div',{class:'grid'});
  const qcSel = el('select',{});
  ['','PASS','FAIL'].forEach(v=>{
    const o = el('option',{value:v}, v===''?'— Select Final Disposition —':v);
    if(d.qcPassed===v) o.setAttribute('selected','true');
    qcSel.appendChild(o);
  });
  qcSel.addEventListener('change', ()=>d.qcPassed=qcSel.value);
  g3.appendChild(field('Final QC Disposition', qcSel));
  g3.appendChild(field('Sign-over Date', textInput(d.handoverDate, v=>d.handoverDate=v, {type:'date'})));
  g3.appendChild(field('QC Verifier', textInput(d.qcVerifiedBy, v=>d.qcVerifiedBy=v)));
  g3.appendChild(field('O&M Representative', textInput(d.omReceivedBy, v=>d.omReceivedBy=v)));
  disp.appendChild(g3);
  container.appendChild(disp);

  const actions = el('div',{class:'footer-actions'});
  const clearBtn = el('button',{class:'btn-ghost'},'Reset Form');
  clearBtn.addEventListener('click', ()=>{
    const keepTech = d.technician;
    STATE.draft = emptyDraft();
    STATE.draft.technician = keepTech;
    STATE.serialWarning = null;
    render();
  });
  const saveBtn = el('button',{class:'btn-primary'},'SAVE & LOG REPAIR');
  saveBtn.addEventListener('click', async ()=>{
    const activeSerial = (d.bmsId || d.serial).trim();
    if(!activeSerial || !d.dateReceived){ toast('ERROR: BMS ID and intake date are required.'); return; }

    if (isImeiRequired(d) && !d.imei.trim()) {
      toast('ERROR: IMEI is required for Offline, BMS Fault, or IoT Fault issues.');
      return;
    }
    if (isSwapStationRequired(d) && !d.site.trim()) {
      toast('ERROR: Swap Station Location is required for damaged, tampered, or flooded packs.');
      return;
    }

    d.serial = activeSerial;
    const prior = priorAttempts(STATE.records, d.serial);
    const attemptNumber = prior.length + 1;
    const preResult = checklistResult(d.pre, CHECK_ITEMS);
    const postResult = checklistResult(d.post, POST_ITEMS);
    const tResult = testsResult(d);

    const record = {
      id: uid(), createdAt: new Date().toISOString(),
      ...JSON.parse(JSON.stringify(d)),
      attemptNumber, preResult, postResult, testsResult: tResult,
      submittedBy: STATE.techName || d.technician,
    };
    const updated = [...STATE.records, record];
    await saveRecords(updated);
    STATE.records = updated;
    const keepTech = d.technician;
    STATE.draft = emptyDraft();
    STATE.draft.technician = keepTech;
    STATE.serialWarning = null;
    toast(`Record Saved: BMS ID ${record.serial} logged (Attempt #${attemptNumber}).`);
  });
  actions.appendChild(clearBtn); actions.appendChild(saveBtn);
  container.appendChild(actions);

  return container;
}

function RecordsTable(list, title){

  }

  const wrap = el('div',{class:'table-wrap'});
  const tbl = el('table');
  tbl.innerHTML = `
    <thead>
      <tr>
        <th>Date</th>
        <th>BMS ID</th>
        <th>Platform</th>
        <th>Visit #</th>
        <th>SOP Used</th>
        <th>Pre Check</th>
        <th>Tests</th>

      <td class="mono" style="font-weight:700;color:var(--cyan);">${r.bmsId || r.serial}</td>

  return card;

      tr.innerHTML = `
        <td class="mono">${w.dateEscalated}</td>
        <td class="mono" style="font-weight:700;color:var(--cyan);">${w.bmsId}</td>
        <td><span class="pill">${w.model}</span></td>
        <td style="font-size:12px;">${w.failureCategory}</td>
        <td><span class="pill quality">${w.status}</span></td>
        <td></td>
      `;
      const actionTd = tr.querySelector('td:last-child');
      if(w.status !== 'Scrapped by QC'){
        const scrapBtn = el('button',{class:'btn-danger btn-sm'},'SCRAP PACK');
        scrapBtn.addEventListener('click', async () => {
          w.status = 'Scrapped by QC';
          await saveWarrantyRecords(STATE.warrantyRecords);
          toast(`Pack ${w.bmsId} officially SCRAPPED.`);
        });
        actionTd.appendChild(scrapBtn);
      } else {
        actionTd.appendChild(el('span',{class:'result-chip FAIL'},'SCRAPPED'));
      }
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    listCard.appendChild(wrap);
  }

  container.appendChild(listCard);
  return container;
}

/* Settings View */
function SettingsView(){
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{},'System Security Pin Settings'));
  const s = STATE.settings;
  const g = el('div',{class:'grid'});
  g.appendChild(field('O&M Admin PIN', textInput(s.omAdminPin, v=>s.omAdminPin=v, {type:'password'})));
  g.appendChild(field('QC Data Coordinator PIN', textInput(s.qualityPin, v=>s.qualityPin=v, {type:'password'})));
  card.appendChild(g);
  const saveBtn = el('button',{class:'btn-primary', style:'margin-top:16px;'},'SAVE SECURITY PINS');
  saveBtn.addEventListener('click', async () => {
    await saveSettings(s);
    toast('Security PINs updated successfully.');
  });
  card.appendChild(saveBtn);
  return card;
}

/* App Initialization */
render();
</script>
</body>
</html>

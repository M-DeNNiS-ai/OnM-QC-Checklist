<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spiro Quality Control & Fleet Telemetry System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f8f9fa;
  --panel: #ffffff;
  --panel2: #f1f3f5;
  --line: #e9ecef;
  --line-dark: #ced4da;
  --text: #111827;
  --muted: #6b7280;
  --accent: #0f172a;
  --pass: #15803d;
  --pass-bg: #f0fdf4;
  --fail: #b91c1c;
  --fail-bg: #fef2f2;
  --warn: #c2410c;
  --warn-bg: #fff7ed;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

[data-theme="dark"] {
  --bg: #0f172a;
  --panel: #1e293b;
  --panel2: #334155;
  --line: #334155;
  --line-dark: #475569;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --pass: #4ade80;
  --pass-bg: rgba(74, 222, 128, 0.1);
  --fail: #f87171;
  --fail-bg: rgba(248, 113, 113, 0.1);
  --warn: #fb923c;
  --warn-bg: rgba(251, 146, 60, 0.1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

.app { max-width: 1100px; margin: 0 auto; padding: 16px; }

/* Top Header */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--panel); border: 1px solid var(--line-dark);
  border-radius: 4px; margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
}
.brand h1 { font-size: 15px; font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text); }
.brand p { margin: 0; font-size: 11px; color: var(--muted); }

.user-info { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.badge {
  padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; background: var(--panel2); border: 1px solid var(--line-dark); color: var(--text);
}

button {
  font-family: var(--font-sans); cursor: pointer; border: 1px solid var(--line-dark);
  background: var(--panel); color: var(--text); border-radius: 3px;
  padding: 6px 12px; font-size: 12px; font-weight: 600; transition: all 0.1s ease;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
button:hover { background: var(--panel2); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { opacity: 0.9; background: var(--accent); }
.btn-danger { background: var(--fail-bg); border-color: var(--fail); color: var(--fail); }
.btn-danger:hover { background: var(--fail); color: #fff; }
.btn-sm { padding: 3px 8px; font-size: 11px; }

.theme-toggle select {
  padding: 3px 6px; font-size: 11px; border-radius: 3px; background: var(--panel);
  color: var(--text); border: 1px solid var(--line-dark); font-family: var(--font-sans);
}

/* Authentication Gate */
.gate {
  max-width: 360px; margin: 15vh auto 0; padding: 24px;
  background: var(--panel); border: 1px solid var(--line-dark); border-radius: 4px;
}
.gate h2 { margin-top: 0; font-size: 16px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
.gate p { color: var(--muted); font-size: 12px; margin-bottom: 16px; }

/* Navigation */
.nav { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line-dark); padding-bottom: 8px; }
.nav button { background: transparent; color: var(--muted); border: none; border-radius: 3px; font-size: 12px; font-weight: 600; padding: 6px 12px; }
.nav button.active { background: var(--panel2); color: var(--text); font-weight: 700; }
.nav button:hover:not(.active) { color: var(--text); }

/* Layout Cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; margin-bottom: 12px; }
.card h3 { margin: 0 0 2px; font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--text); }
.card .sub { color: var(--muted); font-size: 11px; margin-bottom: 12px; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 12px; }
.grid.narrow { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }

label { display: block; font-size: 10px; font-weight: 700; color: var(--muted); margin: 8px 0 4px; text-transform: uppercase; letter-spacing: 0.3px; }
input, select, textarea {
  width: 100%; padding: 6px 8px; background: var(--panel); color: var(--text);
  border: 1px solid var(--line-dark); border-radius: 3px; font-size: 12px; font-family: var(--font-sans);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--text); }
textarea { resize: vertical; min-height: 50px; }

.banner {
  padding: 8px 12px; border-radius: 3px; font-size: 11px; margin-bottom: 12px;
  border: 1px solid var(--warn); background: var(--warn-bg); color: var(--warn); font-weight: 600;
}
.banner.ok { border-color: var(--pass); background: var(--pass-bg); color: var(--pass); }

/* Checklists & Forms */
.check-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.check-row:last-child { border-bottom: none; }
.check-row span { font-size: 12px; }

.seg { display: flex; border: 1px solid var(--line-dark); border-radius: 3px; overflow: hidden; }
.seg button { border-radius: 0; padding: 2px 8px; font-size: 10px; background: var(--panel); color: var(--muted); border: none; border-right: 1px solid var(--line-dark); }
.seg button:last-child { border-right: none; }
.seg button.sel-pass { background: var(--pass-bg); color: var(--pass); font-weight: 700; }
.seg button.sel-fail { background: var(--fail-bg); color: var(--fail); font-weight: 700; }
.seg button.sel-na { background: var(--panel2); color: var(--text); }

.bool-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.bool-row input { width: 14px; height: 14px; margin: 0; cursor: pointer; accent-color: var(--accent); }
.bool-row label { margin: 0; color: var(--text); font-size: 12px; text-transform: none; font-weight: 400; cursor: pointer; }

.status-chip {
  display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 700; text-transform: uppercase;
}
.status-chip.PASS { background: var(--pass-bg); color: var(--pass); border: 1px solid var(--pass); }
.status-chip.FAIL { background: var(--fail-bg); color: var(--fail); border: 1px solid var(--fail); }
.status-chip.INCOMPLETE, .status-chip.NA { background: var(--panel2); color: var(--muted); border: 1px solid var(--line-dark); }

/* KPI Stats Grid */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
.stat { background: var(--panel); border: 1px solid var(--line-dark); border-radius: 4px; padding: 12px; }
.stat .n { font-size: 20px; font-weight: 700; color: var(--text); }
.stat .l { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

/* Data Tables */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 10px; background: var(--panel2); position: sticky; top: 0; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line-dark); border-radius: 3px; background: var(--panel); }
tr:hover td { background: var(--panel2); }
.mono { font-family: var(--font-mono); }

.footer-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; border-top: 1px solid var(--line-dark); }
.err { color: var(--fail); font-size: 11px; margin-top: 6px; }

.sop-box { background: var(--panel2); border: 1px solid var(--line-dark); padding: 8px 12px; border-radius: 3px; margin-bottom: 12px; font-size: 11px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
let currentTheme = localStorage.getItem('app_theme') || 'light';
document.documentElement.setAttribute('data-theme', currentTheme);

function setTheme(theme) {
  currentTheme = theme;
  localStorage.setItem('app_theme', theme);
  document.documentElement.setAttribute('data-theme', theme);
  render();
}

const STANDARD_SOPS = [
  "SOP-BAT-01: Housing Opening Protocol",
  "SOP-BAT-02: Cell Balancing & Diagnostics",
  "SOP-BAT-03: BMS Replacement & Firmware Sync",
  "SOP-BAT-04: Insulation Safety Testing",
  "SOP-BAT-05: IoT Rewiring & Flashing",
  "SOP-BAT-06: Charge Port Thermal Servicing"
];

const BMS_MODEL_PREFIXES = [
  { prefix: 'C7245AC2AA', model: 'CBAK' },
  { prefix: 'U7245AU1G1', model: 'UNIQUE' },
  { prefix: 'A7246AX1A1', model: 'AMPACE' },
  { prefix: 'D72451LWK', model: 'GREENWAY' }
];

function detectModelFromBMS(bmsId) {
  if (!bmsId) return '';
  const cleanId = bmsId.trim().toUpperCase();
  const match = BMS_MODEL_PREFIXES.find(p => cleanId.startsWith(p.prefix));
  return match ? match.model : '';
}

const CHECK_ITEMS = [
  ['foreignObjects','No Foreign Objects / Cables'],
  ['looseComponents','No Loose Components'],
  ['wiring','Internal Wiring Intact'],
  ['cells','Cells Intact'],
  ['corrosion','No Moisture / Corrosion'],
  ['bmsMount','BMS Board Secure'],
  ['internalDamage','No Internal Damage'],
];
const POST_ITEMS = [
  ['foreignObjects','No Foreign Objects Left Inside'],
  ['looseComponents','No Loose Components'],
  ['wiring','Wiring Reconnected Properly'],
  ['cells','Cells Secure'],
  ['bmsMount','BMS Board Secure'],
  ['seal','Casing Seal Intact'],
  ['fasteners','Fasteners Reinstalled'],
];
const ISSUE_ITEMS = [
  ['noPower','No Power / Offline'],
  ['lowCapacity','Low Capacity / Range'],
  ['cellImbalance','Cell Imbalance'],
  ['bmsFault','BMS Fault / Mismatch'],
  ['canFail','CAN Fail'],
  ['chargeFail','Charge Failure'],
  ['dischargeFail','Discharge Failure'],
  ['swelling','Swelling / Damage'],
  ['irFail','Insulation Failure'],
  ['iotFault','IoT / IMEI Mismatch'],
  ['tampered','Vandalism / Water Ingress'],
  ['connectorDamage','Connector Damage'],
  ['other','Other Issue'],
];
const TEST_BOOLS = [
  ['canEstablished','CAN Established'],
  ['bmsFaultCleared','BMS Fault Cleared'],
  ['chargeVerified','Charge Verified'],
  ['dischargeVerified','Discharge Verified'],
  ['noAbnormal','No Abnormal Behavior'],
];

const DEFAULT_OM_PIN = '1234';
const DEFAULT_QUALITY_PIN = '9999';

async function loadRecords(){ try { const r = await window.storage.get('records', true); return r ? JSON.parse(r.value) : []; } catch(e){ return []; } }
async function saveRecords(list){ await window.storage.set('records', JSON.stringify(list), true); }
async function loadWarrantyRecords(){ try { const r = await window.storage.get('warranty_records', true); return r ? JSON.parse(r.value) : []; } catch(e){ return []; } }
async function saveWarrantyRecords(list){ await window.storage.set('warranty_records', JSON.stringify(list), true); }

let STATE = {
  role: null,
  techName: '',
  records: [],
  warrantyRecords: [],
  view: 'entry',
  draft: emptyDraft(),
  warrantyDraft: emptyWarrantyDraft(),
  serialWarning: null,
  toast: null,
};

function emptyDraft(){
  return {
    dateReceived: todayStr(), timeReceived: nowTime(), serial:'', model:'', bmsId:'', imei:'',
    site:'', receivedBy:'',
    pre: {}, post: {}, issues: {}, otherNote:'',
    sopRef: STANDARD_SOPS[0], repairAction:'', partsReplaced:'', technician:'', repairDate: todayStr(),
    tests: { packVoltage:'', minCell:'', maxCell:'', irMeasured:'', irThreshold:550 },
    testBools: {}, resolved: {},
    qcPassed:'', handoverDate:'', qcVerifiedBy:'', omReceivedBy:'',
  };
}

function emptyWarrantyDraft(){
  return {
    dateEscalated: todayStr(), bmsId:'', model:'', serial:'',
    failureCategory: 'Charging Port Failure',
    status: 'Waiting for Spare Parts',
    comments: '', technician: ''
  };
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowTime(){ return new Date().toTimeString().slice(0,5); }
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function isImeiRequired(draft) { return !!(draft.issues.noPower || draft.issues.bmsFault || draft.issues.iotFault); }
function isSwapStationRequired(draft) { return !!(draft.issues.tampered || draft.issues.swelling || draft.pre.foreignObjects==='FAIL' || draft.pre.corrosion==='FAIL'); }

function checklistResult(map, items){
  const vals = items.map(([k])=>map[k]);
  if(vals.some(v=>v==='FAIL')) return 'FAIL';
  if(vals.some(v=>!v)) return 'INCOMPLETE';
  return 'PASS';
}
function testsResult(d){
  const boolsOk = TEST_BOOLS.every(([k])=>d.testBools[k]===true);
  const ir = parseFloat(d.tests.irMeasured), thr = parseFloat(d.tests.irThreshold);
  const irOk = !isNaN(ir) && !isNaN(thr) ? ir>=thr : null;
  if(!boolsOk || irOk===false) return 'FAIL';
  if(irOk===null) return 'INCOMPLETE';
  return 'PASS';
}
function priorAttempts(records, serial){
  if (!serial) return [];
  return records.filter(r=>r.serial.trim().toUpperCase()===serial.trim().toUpperCase());
}

const root = document.getElementById('root');
function render(){ root.innerHTML=''; root.appendChild(View()); }

function View(){
  if(!STATE.role) return LoginView();
  const wrap = el('div',{class:'app'});
  wrap.appendChild(Header());
  if(STATE.toast) wrap.appendChild(Toast());

  if(STATE.role==='tech'){
    wrap.appendChild(Nav(['entry','myrecords'], {entry:'Log Intake', myrecords:'My Logged Work'}));
    wrap.appendChild(STATE.view==='myrecords' ? MyRecordsView() : EntryView());
  } else if(STATE.role==='omadmin'){
    wrap.appendChild(Nav(['dashboard','history','entry'], {dashboard:'Dashboard', history:'All Logs', entry:'Log Intake'}));
    if(STATE.view==='dashboard') wrap.appendChild(DashboardView());
    else if(STATE.view==='history') wrap.appendChild(HistoryView());
    else wrap.appendChild(EntryView());
  } else if(STATE.role==='quality'){
    wrap.appendChild(Nav(['warranty','om_dashboard','inventory'], {warranty:'Warranty & Escalations', om_dashboard:'O&M Performance', inventory:'Inventory Baseline'}));
    if(STATE.view==='warranty') wrap.appendChild(WarrantyView());
    else if(STATE.view==='om_dashboard') wrap.appendChild(DashboardView());
    else wrap.appendChild(InventoryView());
  }
  return wrap;
}

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  });
  return e;
}

function toast(msg){ STATE.toast = msg; render(); setTimeout(()=>{ STATE.toast=null; render(); }, 2800); }
function Toast(){ return el('div',{class:'banner ok'},[STATE.toast]); }

function LoginView(){
  const gate = el('div',{class:'gate'});
  gate.appendChild(el('h2',{},'Spiro Telemetry'));
  gate.appendChild(el('p',{},'Select user role to access system'));

  let mode = 'tech';
  const modeSel = el('select',{style:'margin-bottom:12px;'});
  [['tech','Technician'], ['omadmin','O&M Administrator'], ['quality','QC Data Coordinator']].forEach(([v,l])=>{
    modeSel.appendChild(el('option',{value:v},l));
  });
  gate.appendChild(modeSel);

  const body = el('div');
  gate.appendChild(body);

  function renderBody(){
    body.innerHTML='';
    if(mode==='tech'){
      body.appendChild(el('label',{},'Technician Name'));
      const inp = el('input',{placeholder:'Name'});
      body.appendChild(inp);
      const go = el('button',{class:'btn-primary',style:'margin-top:12px;width:100%'},'Continue');
      go.addEventListener('click', async ()=>{
        if(!inp.value.trim()) return;
        STATE.techName = inp.value.trim();
        STATE.role='tech'; STATE.view='entry';
        STATE.records = await loadRecords();
        STATE.draft.technician = STATE.techName;
        STATE.draft.receivedBy = STATE.techName;
        render();
      });
      body.appendChild(go);
    } else {
      body.appendChild(el('label',{},'Access PIN'));
      const inp = el('input',{type:'password',placeholder:'••••'});
      body.appendChild(inp);
      const errBox = el('div',{class:'err'});
      body.appendChild(errBox);
      const go = el('button',{class:'btn-primary',style:'margin-top:12px;width:100%'},'Authenticate');
      go.addEventListener('click', async ()=>{
        const reqPin = mode==='omadmin' ? DEFAULT_OM_PIN : DEFAULT_QUALITY_PIN;
        if(inp.value === reqPin){
          STATE.role = mode;
          STATE.records = await loadRecords();
          STATE.warrantyRecords = await loadWarrantyRecords();
          STATE.view = mode==='quality' ? 'warranty' : 'dashboard';
          render();
        } else {
          errBox.textContent = 'Invalid PIN.';
        }
      });
      body.appendChild(go);
    }
  }
  modeSel.addEventListener('change', ()=>{ mode=modeSel.value; renderBody(); });
  renderBody();
  return gate;
}

function Header(){
  const head = el('div',{class:'header'});
  const brand = el('div',{class:'brand'},[
    el('h1',{},'Spiro Battery Telemetry & QC'),
    el('p',{},'Plant Operations & Quality Logs')
  ]);
  const user = el('div',{class:'user-info'},[
    el('span',{class:'badge'}, STATE.role),
    el('span',{}, STATE.role==='tech' ? STATE.techName : STATE.role.toUpperCase()),
    el('button',{class:'btn-sm', onClick:()=>{ STATE.role=null; STATE.view='entry'; render(); }},'Logout')
  ]);
  
  const themeWrap = el('div',{class:'theme-toggle'});
  const themeSel = el('select',{onChange: (e)=>setTheme(e.target.value)});
  [['light','Light UI'], ['dark','Dark UI']].forEach(([v,l])=>{
    const opt = el('option',{value:v}, l);
    if(v===currentTheme) opt.setAttribute('selected','true');
    themeSel.appendChild(opt);
  });
  themeWrap.appendChild(themeSel);

  const right = el('div',{style:'display:flex;align-items:center;gap:12px;'},[user, themeWrap]);
  head.appendChild(brand); head.appendChild(right);
  return head;
}

function Nav(items, labels){
  const nav = el('div',{class:'nav'});
  items.forEach(k=>{
    const b = el('button',{class: STATE.view===k?'active':''}, labels[k]);
    b.addEventListener('click', ()=>{ STATE.view=k; render(); });
    nav.appendChild(b);
  });
  return nav;
}

function field(label, inputEl){
  const w = el('div');
  w.appendChild(el('label',{},label));
  w.appendChild(inputEl);
  return w;
}
function textInput(value, onChange, opts={}){
  const i = el('input',{type:opts.type||'text', value: value||''});
  if(opts.mono) i.className = 'mono';
  if(opts.placeholder) i.setAttribute('placeholder', opts.placeholder);
  i.addEventListener('input', ()=>onChange(i.value));
  if(value!==undefined) i.value = value;
  return i;
}
function textareaInput(value, onChange){
  const t = el('textarea',{});
  t.value = value||'';
  t.addEventListener('input', ()=>onChange(t.value));
  return t;
}

function ChecklistCard(title, map, items, onSet){
  const card = el('div',{class:'card'});
  const res = checklistResult(map, items);
  card.appendChild(el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;'},[
    el('h3',{},title),
    el('span',{class:'status-chip '+res}, res)
  ]));
  items.forEach(([key,label])=>{
    const row = el('div',{class:'check-row'});
    row.appendChild(el('span',{},label));
    const seg = el('div',{class:'seg'});
    ['PASS','FAIL','NA'].forEach(v=>{
      const cur = map[key];
      const b = el('button',{class: cur===v ? 'sel-'+v.toLowerCase() : ''}, v==='NA'?'N/A':v);
      b.addEventListener('click', ()=>{ onSet(key, cur===v ? undefined : v); render(); });
      seg.appendChild(b);
    });
    row.appendChild(seg);
    card.appendChild(row);
  });
  return card;
}

function IssuesCard(d){
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{},'Defect Diagnostics'));
  card.appendChild(el('div',{class:'sub'},'Select all applicable failure modes upon arrival.'));
  ISSUE_ITEMS.forEach(([key,label])=>{
    const row = el('div',{class:'bool-row'});
    const cb = el('input',{type:'checkbox'});
    cb.checked = !!d.issues[key];
    cb.addEventListener('change', ()=>{ d.issues[key]=cb.checked; render(); });
    row.appendChild(cb);
    row.appendChild(el('label',{},label));
    card.appendChild(row);
  });
  if(d.issues.other){
    card.appendChild(field('Details of Other Failure Mode', textareaInput(d.otherNote, v=>d.otherNote=v)));
  }
  return card;
}

function TestsCard(d){
  const card = el('div',{class:'card'});
  const res = testsResult(d);
  card.appendChild(el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;'},[
    el('h3',{},'Verification Tests'),
    el('span',{class:'status-chip '+res}, res)
  ]));
  const grid = el('div',{class:'grid narrow'});
  grid.appendChild(field('Pack Voltage (V)', textInput(d.tests.packVoltage, v=>d.tests.packVoltage=v, {type:'number', mono:true})));
  grid.appendChild(field('Min Cell (V)', textInput(d.tests.minCell, v=>d.tests.minCell=v, {type:'number', mono:true})));
  grid.appendChild(field('Max Cell (V)', textInput(d.tests.maxCell, v=>d.tests.maxCell=v, {type:'number', mono:true})));
  grid.appendChild(field('IR Measured (MΩ)', textInput(d.tests.irMeasured, v=>{d.tests.irMeasured=v; render();}, {type:'number', mono:true})));
  grid.appendChild(field('IR Threshold (MΩ)', textInput(d.tests.irThreshold, v=>{d.tests.irThreshold=v; render();}, {type:'number', mono:true})));
  card.appendChild(grid);
  card.appendChild(el('div',{style:'margin-top:8px;'}));
  TEST_BOOLS.forEach(([key,label])=>{
    const row = el('div',{class:'bool-row'});
    const cb = el('input',{type:'checkbox'});
    cb.checked = !!d.testBools[key];
    cb.addEventListener('change', ()=>{ d.testBools[key]=cb.checked; render(); });
    row.appendChild(cb);
    row.appendChild(el('label',{},label));
    card.appendChild(row);
  });
  return card;
}

function EntryView(){
  const d = STATE.draft;
  const container = el('div');

  if(STATE.serialWarning){
    container.appendChild(el('div',{class:'banner'}, STATE.serialWarning));
  }

  const intake = el('div',{class:'card'});
  intake.appendChild(el('h3',{},'Intake Identification'));

  const g1 = el('div',{class:'grid'});
  g1.appendChild(field('Date Received', textInput(d.dateReceived, v=>d.dateReceived=v, {type:'date'})));
  g1.appendChild(field('Time Received', textInput(d.timeReceived, v=>d.timeReceived=v, {type:'time'})));

  const bmsInput = textInput(d.bmsId, v => {
    d.bmsId = v; d.serial = v.trim(); 
    const detected = detectModelFromBMS(v);
    if (detected) d.model = detected;
  }, {mono:true, placeholder:'Scan BMS Barcode'});

  bmsInput.addEventListener('blur', () => {
    const searchSerial = (d.bmsId || d.serial).trim();
    const prior = priorAttempts(STATE.records, searchSerial);
    if(searchSerial && prior.length > 0){
      const last = prior[prior.length-1];
      STATE.serialWarning = `Notice: BMS ID ${searchSerial} has ${prior.length} prior service log(s). Last repair: ${last.dateReceived}.`;
    } else {
      STATE.serialWarning = null;
    }
    render();
  });

  g1.appendChild(field('Scan BMS ID Barcode', bmsInput));
  g1.appendChild(field('Battery Platform', textInput(d.model, v => d.model = v, { placeholder: 'Auto-detected' })));

  const imeiRequired = isImeiRequired(d);
  const imeiInput = textInput(d.imei, v => d.imei = v, { mono: true, placeholder: imeiRequired ? 'Required' : 'Optional' });
  if (imeiRequired) imeiInput.style.borderColor = 'var(--warn)';
  g1.appendChild(field(imeiRequired ? 'IMEI Number (Mandatory)' : 'IMEI Number', imeiInput));

  const swapRequired = isSwapStationRequired(d);
  const swapInput = textInput(d.site, v => d.site = v, { placeholder: swapRequired ? 'Station Required' : 'Optional' });
  if (swapRequired) swapInput.style.borderColor = 'var(--warn)';
  g1.appendChild(field(swapRequired ? 'Swap Station (Mandatory)' : 'Swap Station', swapInput));

  g1.appendChild(field('Received By', textInput(d.receivedBy, v=>d.receivedBy=v)));
  intake.appendChild(g1);
  container.appendChild(intake);

  container.appendChild(ChecklistCard('Pre-Opening Inspection', d.pre, CHECK_ITEMS, (k,v)=>d.pre[k]=v));
  container.appendChild(IssuesCard(d));

  const repair = el('div',{class:'card'});
  repair.appendChild(el('h3',{},'Repair Execution'));
  
  const sopBox = el('div',{class:'sop-box'});
  sopBox.appendChild(el('div',{style:'font-weight:700;margin-bottom:4px;'},'Standard Operating Procedure (SOP)'));
  const sopSel = el('select',{style:'font-size:11px;'});
  STANDARD_SOPS.forEach(sop => {
    const opt = el('option',{value:sop}, sop);
    if(d.sopRef === sop) opt.setAttribute('selected','true');
    sopSel.appendChild(opt);
  });
  sopSel.addEventListener('change', () => d.sopRef = sopSel.value);
  sopBox.appendChild(sopSel);
  repair.appendChild(sopBox);

  const g2 = el('div',{class:'grid'});
  g2.appendChild(field('Parts Replaced', textInput(d.partsReplaced, v=>d.partsReplaced=v, {placeholder:'e.g. BMS, Harness'})));
  g2.appendChild(field('Technician', textInput(d.technician, v=>d.technician=v)));
  g2.appendChild(field('Completion Date', textInput(d.repairDate, v=>d.repairDate=v, {type:'date'})));
  repair.appendChild(g2);
  repair.appendChild(field('Repair Summary Notes', textareaInput(d.repairAction, v=>d.repairAction=v)));
  container.appendChild(repair);

  container.appendChild(ChecklistCard('Post-Service Inspection', d.post, POST_ITEMS, (k,v)=>d.post[k]=v));
  container.appendChild(TestsCard(d));

  const disp = el('div',{class:'card'});
  disp.appendChild(el('h3',{},'QC Sign-Off & Disposition'));
  const g3 = el('div',{class:'grid'});
  const qcSel = el('select',{});
  ['','PASS','FAIL'].forEach(v=>{
    const o = el('option',{value:v}, v===''?'— Select Final QC —':v);
    if(d.qcPassed===v) o.setAttribute('selected','true');
    qcSel.appendChild(o);
  });
  qcSel.addEventListener('change', ()=>d.qcPassed=qcSel.value);
  g3.appendChild(field('Final QC Disposition', qcSel));
  g3.appendChild(field('Sign-over Date', textInput(d.handoverDate, v=>d.handoverDate=v, {type:'date'})));
  g3.appendChild(field('QC Verifier', textInput(d.qcVerifiedBy, v=>d.qcVerifiedBy=v)));
  g3.appendChild(field('O&M Rep', textInput(d.omReceivedBy, v=>d.omReceivedBy=v)));
  disp.appendChild(g3);
  container.appendChild(disp);

  const actions = el('div',{class:'footer-actions'});
  const clearBtn = el('button',{},'Reset');
  clearBtn.addEventListener('click', ()=>{
    const keepTech = d.technician;
    STATE.draft = emptyDraft();
    STATE.draft.technician = keepTech;
    STATE.serialWarning = null;
    render();
  });
  const saveBtn = el('button',{class:'btn-primary'},'Save Service Log');
  saveBtn.addEventListener('click', async ()=>{
    const activeSerial = (d.bmsId || d.serial).trim();
    if(!activeSerial || !d.dateReceived){ toast('BMS ID and intake date required.'); return; }
    if (isImeiRequired(d) && !d.imei.trim()) { toast('IMEI is required for selected issue type.'); return; }
    if (isSwapStationRequired(d) && !d.site.trim()) { toast('Swap Station is required for damaged packs.'); return; }

    d.serial = activeSerial;
    const prior = priorAttempts(STATE.records, d.serial);
    const attemptNumber = prior.length + 1;
    const preResult = checklistResult(d.pre, CHECK_ITEMS);
    const postResult = checklistResult(d.post, POST_ITEMS);
    const tResult = testsResult(d);

    const record = {
      id: uid(), createdAt: new Date().toISOString(),
      ...JSON.parse(JSON.stringify(d)),
      attemptNumber, preResult, postResult, testsResult: tResult,
      submittedBy: STATE.techName || d.technician,
    };
    const updated = [...STATE.records, record];
    await saveRecords(updated);
    STATE.records = updated;
    const keepTech = d.technician;
    STATE.draft = emptyDraft();
    STATE.draft.technician = keepTech;
    STATE.serialWarning = null;
    toast(`Log Saved: BMS ID ${record.serial}`);
  });
  actions.appendChild(clearBtn); actions.appendChild(saveBtn);
  container.appendChild(actions);

  return container;
}

function MyRecordsView(){
  const list = STATE.records.filter(r=>r.submittedBy===STATE.techName);
  return RecordsTable(list, 'My Recent Service Entries');
}
function HistoryView(){
  return RecordsTable(STATE.records, 'All O&M Service Entries');
}

function RecordsTable(list, title){
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{},title));
  card.appendChild(el('div',{class:'sub'},`Total records: ${list.length}`));
  
  if(list.length===0){
    card.appendChild(el('div',{style:'padding:12px 0;color:var(--muted);'},'No service entries found.'));
    return card;
  }

  const wrap = el('div',{class:'table-wrap'});
  const tbl = el('table');
  tbl.innerHTML = `
    <thead>
      <tr>
        <th>Date</th>
        <th>BMS ID</th>
        <th>Platform</th>
        <th>Visit</th>
        <th>Pre</th>
        <th>Tests</th>
        <th>QC Result</th>
        <th>Technician</th>
      </tr>
    </thead>
  `;
  const tbody = el('tbody');
  [...list].reverse().forEach(r=>{
    const tr = el('tr');
    tr.innerHTML = `
      <td class="mono">${r.dateReceived}</td>
      <td class="mono" style="font-weight:700;">${r.bmsId || r.serial}</td>
      <td>${r.model || 'Unknown'}</td>
      <td class="mono">#${r.attemptNumber||1}</td>
      <td><span class="status-chip ${r.preResult}">${r.preResult}</span></td>
      <td><span class="status-chip ${r.testsResult}">${r.testsResult}</span></td>
      <td><span class="status-chip ${r.qcPassed || 'PENDING'}">${r.qcPassed || 'PENDING'}</span></td>
      <td>${r.technician||r.submittedBy}</td>
    `;
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);
  card.appendChild(wrap);
  return card;
}

function DashboardView(){
  const container = el('div');
  const total = STATE.records.length;
  const passed = STATE.records.filter(r=>r.qcPassed==='PASS').length;
  const failed = STATE.records.filter(r=>r.qcPassed==='FAIL').length;
  const passRate = total>0 ? Math.round((passed/total)*100) : 0;

  const stats = el('div',{class:'stat-grid'});
  stats.appendChild(statBox(total, 'Total Serviced'));
  stats.appendChild(statBox(passed, 'QC Passed'));
  stats.appendChild(statBox(failed, 'QC Rejected'));
  stats.appendChild(statBox(passRate+'%', 'Pass Yield'));
  container.appendChild(stats);

  container.appendChild(HistoryView());
  return container;
}

function statBox(num, label){
  const s = el('div',{class:'stat'});
  s.appendChild(el('div',{class:'n'}, String(num)));
  s.appendChild(el('div',{class:'l'}, label));
  return s;
}

function WarrantyView(){
  const container = el('div');
  const d = STATE.warrantyDraft;
  const form = el('div',{class:'card'});
  form.appendChild(el('h3',{},'Escalate Pack to Warranty'));
  
  const g = el('div',{class:'grid'});
  const bmsInp = textInput(d.bmsId, v => {
    d.bmsId = v; d.serial = v;
    const detected = detectModelFromBMS(v);
    if(detected) d.model = detected;
  }, {mono:true, placeholder:'Scan BMS Barcode'});
  g.appendChild(field('BMS ID', bmsInp));

  g.appendChild(field('Platform', textInput(d.model, v=>d.model=v)));
  
  const failSel = el('select',{});
  ['Charging Port Failure', 'Cell Degradation', 'BMS Defect', 'IoT Board Failure', 'Water Ingress'].forEach(f => {
    failSel.appendChild(el('option',{value:f}, f));
  });
  failSel.addEventListener('change', ()=>d.failureCategory=failSel.value);
  g.appendChild(field('Failure Category', failSel));

  const statusSel = el('select',{});
  ['Waiting for Spare Parts', 'Under Supplier Review', 'Scrapped by QC', 'Repaired & Returned'].forEach(s => {
    statusSel.appendChild(el('option',{value:s}, s));
  });
  statusSel.addEventListener('change', ()=>d.status=statusSel.value);
  g.appendChild(field('Warranty Status', statusSel));

  form.appendChild(g);
  form.appendChild(field('Escalation Comments', textareaInput(d.comments, v=>d.comments=v)));
  
  const addBtn = el('button',{class:'btn-primary', style:'margin-top:8px;'},'Log Escalation');
  addBtn.addEventListener('click', async () => {
    if(!d.bmsId.trim()){ toast('BMS ID is required.'); return; }
    const entry = { id: uid(), ...JSON.parse(JSON.stringify(d)), dateEscalated: todayStr() };
    const updated = [...STATE.warrantyRecords, entry];
    await saveWarrantyRecords(updated);
    STATE.warrantyRecords = updated;
    STATE.warrantyDraft = emptyWarrantyDraft();
    toast(`Escalated ${entry.bmsId} to Warranty.`);
  });
  form.appendChild(addBtn);
  container.appendChild(form);

  const listCard = el('div',{class:'card'});
  listCard.appendChild(el('h3',{},'Active Warranty Escalations'));
  
  if(STATE.warrantyRecords.length===0){
    listCard.appendChild(el('div',{style:'padding:12px 0;color:var(--muted);'},'No active warranty escalations.'));
  } else {
    const wrap = el('div',{class:'table-wrap'});
    const tbl = el('table');
    tbl.innerHTML = `
      <thead>
        <tr>
          <th>Date</th>
          <th>BMS ID</th>
          <th>Platform</th>
          <th>Category</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
    `;
    const tbody = el('tbody');
    STATE.warrantyRecords.forEach(w => {
      const tr = el('tr');
      tr.innerHTML = `
        <td class="mono">${w.dateEscalated}</td>
        <td class="mono" style="font-weight:700;">${w.bmsId}</td>
        <td>${w.model}</td>
        <td>${w.failureCategory}</td>
        <td><span class="badge">${w.status}</span></td>
        <td></td>
      `;
      const actionTd = tr.querySelector('td:last-child');
      if(w.status !== 'Scrapped by QC'){
        const scrapBtn = el('button',{class:'btn-danger btn-sm'},'Scrap Pack');
        scrapBtn.addEventListener('click', async () => {
          w.status = 'Scrapped by QC';
          await saveWarrantyRecords(STATE.warrantyRecords);
          toast(`Pack ${w.bmsId} Scrapped.`);
        });
        actionTd.appendChild(scrapBtn);
      } else {
        actionTd.appendChild(el('span',{class:'status-chip FAIL'},'SCRAPPED'));
      }
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    listCard.appendChild(wrap);
  }

  container.appendChild(listCard);
  return container;
}

render();
</script>

     The previous implementation emptied #root first, which produced the visible black/
     blank frame every time a menu item was selected. The old screen now remains visible
     until the new screen is completely constructed. */
  const staging = document.createDocumentFragment();
  let nextViewReady = false;
  try{
    const viewNode = View();
    appendChildSafe(staging, viewNode);
    nextViewReady = true;
  }catch(renderError){
    console.error('Application render failed:', renderError);
    try{
      appendChildSafe(staging, PageLoadRecoveryView(renderError));
      nextViewReady = true;
    }catch(recoveryError){
      console.error('Recovery render failed:', recoveryError);
      nextViewReady = false;
    }
  }
  if(nextViewReady){
    /* Atomic visual commit: there is no intermediate empty #root state. */
    root.replaceChildren(...Array.from(staging.childNodes));
  } else {
    /* Keep the current screen intact if even the recovery view cannot be built. */
    console.error('Screen build failed; preserving the previous view.');
  }
  try{
    if(nextViewReady){
      /* The staging clone is what is actually displayed. Rebuild pending chart references
         against the live DOM when necessary rather than exposing an empty frame. */
    }
  } finally {
    renderInProgress = false;
  }
  if(renderPending){
    renderPending=false;
    queueMicrotask(()=>render());
  }
  const chartJobs = pendingCharts.slice();
  pendingCharts = [];
  const initCharts = ()=>{
    chartJobs.forEach(({canvas, config, title})=>{
      try{ renderChartFallback(canvas, config, title); }catch(e){ console.error('Chart fallback error:', title, e); }
    });
    if(!chartJobs.length) return;
    // Upgrade fallbacks to Chart.js after the page has painted and the library is available.
    ensureChartLibrary().then(()=>{
      if(!root.isConnected) return;
      chartJobs.forEach(({canvas, config, title})=>{
        if(!canvas.isConnected || typeof Chart==='undefined') return;
        try{
          const prior=Chart.getChart(canvas); if(prior) prior.destroy();
          const chart=new Chart(canvas.getContext('2d'), config);
          canvas.style.cursor='pointer';
          canvas.addEventListener('click', evt=>{
            const pts=chart.getElementsAtEventForMode(evt,'nearest',{intersect:true},true);
            if(!pts.length) return;
            const p=pts[0], label=chart.data.labels?.[p.index] ?? '', value=chart.data.datasets?.[p.datasetIndex]?.data?.[p.index] ?? 0;
            openChartSelection(title,label,value);
          },{passive:true});
        }catch(e){ console.error('Chart upgrade error:', title, e); }
      });
    }).catch(()=>{});
  };
  requestAnimationFrame(initCharts);
  pendingCharts = [];
  animateStatNumbers();
  if(focusInfo){
    const restored = root.querySelector('[data-fkey="'+focusInfo.fkey.replace(/"/g,'')+'"]');
    if(restored){
      restored.focus({preventScroll:true});
      if(focusInfo.selStart!=null && typeof restored.setSelectionRange==='function'){
        try{ restored.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); }catch(e){}
      }
      window.scrollTo(0, scrollY);
    }
  }
  if(BQC_RESTORE_UI){
    requestAnimationFrame(()=>{
      restoreBqcUiPosition();
      requestAnimationFrame(()=>{
        restoreBqcUiPosition();
        BQC_RESTORE_UI=null;
      });
    });
  }
}
 

/* ---- Native canvas fallback: charts still render when the external Chart.js CDN is unavailable
   or a particular Chart.js configuration cannot initialize. ---- */
function renderChartFallback(canvas, config, title=''){
  const ctx = canvas.getContext && canvas.getContext('2d');
  if(!ctx) return;
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const width = Math.max(320, Math.round(rect.width || canvas.parentElement?.clientWidth || 640));
  const height = Math.max(220, Math.round(rect.height || canvas.parentElement?.clientHeight || 260));
  canvas.width = width*dpr; canvas.height = height*dpr;
  canvas.style.width = width+'px'; canvas.style.height = height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,width,height);

  const text = cssVar('--text'), muted = cssVar('--muted'), line = cssVar('--line');
  const palette = [
    cssVar('--accent'), cssVar('--pass'), cssVar('--warn'), cssVar('--fail'),
    cssVar('--capa'), cssVar('--accent2')
  ];
  const labels = (config && config.data && Array.isArray(config.data.labels)) ? config.data.labels : ['No data'];
  const datasets = (config && config.data && Array.isArray(config.data.datasets)) ? config.data.datasets : [];
  const safeData = datasets.length ? datasets.map(ds => (ds.data||[]).map(v=>{
    const n=Number(v); return Number.isFinite(n)?n:0;
  })) : [[0]];
  const type = String(config?.type||'bar').toLowerCase();
  const pad={l:44,r:18,t:18,b:46};
  const pw=width-pad.l-pad.r, ph=height-pad.t-pad.b;

  ctx.font='11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
  ctx.fillStyle=text;

  if(type==='pie' || type==='doughnut'){
    const data=safeData[0], total=data.reduce((a,v)=>a+Math.max(0,v),0);
    const cx=width/2, cy=height/2-8, radius=Math.min(pw,ph)*0.33;
    if(total<=0){
      ctx.strokeStyle=line; ctx.lineWidth=18; ctx.beginPath(); ctx.arc(cx,cy,radius,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle=muted; ctx.textAlign='center'; ctx.fillText('No data',cx,cy+4);
      return;
    }
    let a0=-Math.PI/2;
    data.forEach((v,i)=>{
      const a1=a0+(Math.max(0,v)/total)*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,radius,a0,a1); ctx.closePath();
      ctx.fillStyle=palette[i%palette.length]; ctx.fill();
      a0=a1;
    });
    ctx.textAlign='left';
    labels.slice(0,10).forEach((lab,i)=>{
      const y=height-20-(Math.min(labels.length,10)-1-i)*14;
      ctx.fillStyle=palette[i%palette.length]; ctx.fillRect(pad.l+i*0, y-8, 8, 8);
      ctx.fillStyle=muted; ctx.fillText(`${lab}: ${data[i]??0}`, pad.l+12, y);
    });
    return;
  }

  const all = safeData.flat();
  const maxVal = Math.max(1, ...all);
  const minVal = Math.min(0, ...all);
  const range = Math.max(1, maxVal-minVal);
  const x0=pad.l, y0=pad.t+ph;
  ctx.strokeStyle=line; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x0,pad.t); ctx.lineTo(x0,y0); ctx.lineTo(width-pad.r,y0); ctx.stroke();

  for(let g=0;g<=4;g++){
    const y=pad.t+ph*(g/4);
    ctx.strokeStyle=line; ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(width-pad.r,y); ctx.stroke();
    const val=maxVal-(range*g/4);
    ctx.fillStyle=muted; ctx.textAlign='right'; ctx.fillText(String(Math.round(val*10)/10),x0-6,y+4);
  }

  const n=labels.length;
  const groupW = pw/Math.max(1,n);
  const barW = Math.min(42, groupW/(Math.max(1,safeData.length)+0.7));
  const pointsByDataset=[];

  safeData.forEach((data,di)=>{
    const pts=[];
    data.forEach((v,i)=>{
      const x = x0 + groupW*i + groupW/2;
      const y = pad.t + (maxVal-v)/range*ph;
      if(type==='line'){
        pts.push({x,y,value:v,label:labels[i]});
      } else {
        const offset=(di-(safeData.length-1)/2)*(barW+2);
        ctx.fillStyle = datasets[di]?.backgroundColor || palette[di%palette.length];
        const top = pad.t + (maxVal-v)/range*ph;
        const base = y0;
        ctx.fillRect(x+offset-barW/2, top, barW, Math.max(1,base-top));
      }
    });
    pointsByDataset.push(pts);
  });

  if(type==='line'){
    safeData.forEach((data,di)=>{
      ctx.strokeStyle=datasets[di]?.borderColor || palette[di%palette.length];
      ctx.lineWidth=2; ctx.beginPath();
      data.forEach((v,i)=>{
        const x=x0+groupW*i+groupW/2, y=pad.t+(maxVal-v)/range*ph;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();
      data.forEach((v,i)=>{
        const x=x0+groupW*i+groupW/2, y=pad.t+(maxVal-v)/range*ph;
        ctx.fillStyle=datasets[di]?.backgroundColor || palette[di%palette.length];
        ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
      });
    });
  }

  ctx.fillStyle=muted; ctx.textAlign='center';
  labels.slice(0,20).forEach((lab,i)=>{
    const x=x0+groupW*i+groupW/2;
    let label=String(lab);
    if(label.length>14) label=label.slice(0,13)+'…';
    ctx.fillText(label,x,height-23);
  });

  canvas.onclick = (evt)=>{
    const r=canvas.getBoundingClientRect();
    const x=evt.clientX-r.left, y=evt.clientY-r.top;
    let best=null, bestDist=Infinity;
    if(type==='line'){
      pointsByDataset.forEach((pts,di)=>pts.forEach(pt=>{
        const dist=(pt.x-x)**2+(pt.y-y)**2;
        if(dist<bestDist){bestDist=dist;best={label:pt.label,value:pt.value};}
      }));
    } else {
      safeData.forEach((data,di)=>data.forEach((v,i)=>{
        const center=x0+groupW*i+groupW/2;
        const offset=(di-(safeData.length-1)/2)*(barW+2);
        const left=center+offset-barW/2, right=center+offset+barW/2;
        const top=pad.t+(maxVal-v)/range*ph;
        if(x>=left&&x<=right&&y>=top&&y<=y0) best={label:labels[i],value:v};
      }));
    }
    if(best) openChartSelection(title,best.label,best.value);
  };
}

/*
 * DOM factory — hardened for mixed/nested child arrays.
 *
 * The previous implementation passed every non-string child directly to
 * appendChild(). A page containing a nested array, number, boolean, or an
 * accidental non-Node could therefore abort the entire page render with:
 *   Failed to execute 'appendChild' on 'Node': parameter 1 is not of type 'Node'.
 *
 * Keep the original API, but normalize children recursively so one malformed
 * child cannot take down navigation or the rest of the page.
 */
function appendChildSafe(parent, child){
  if(child==null || child===false) return;
  if(Array.isArray(child)){
    child.forEach(c=>appendChildSafe(parent,c));
    return;
  }
  if(child instanceof Node){
    parent.appendChild(child);
    return;
  }
  parent.appendChild(document.createTextNode(String(child)));
}
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];
    if(v==null || v===false) continue;
    if(k==='class') e.className = String(v);
    else if(k==='disabled'){ if(v) e.setAttribute('disabled','true'); }
    else if(k.startsWith('on') && typeof v==='function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, String(v));
  }
  appendChildSafe(e, children);
  return e;
}
function field(label, inputEl){
  const w = el('div');
  w.appendChild(el('label',{},label));
  w.appendChild(inputEl);
  return w;
}

function searchTextForRecord(record){
  try{
    const raw=JSON.stringify(record||{});
    return raw.toLowerCase();
  }catch(e){ return ''; }

function searchTerms(q){
  return String(q||'').trim().toLowerCase().split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean);
}
function searchRecordMatches(record, terms){
  if(!terms.length) return false;
  const raw=searchTextForRecord(record);
  const digits=raw.replace(/\D/g,'');
  return terms.some(term=>{
    if(/^\d+$/.test(term)) return digits.includes(term);
    return raw.includes(term);
  });
}

function searchFilter(items,getText){
  const q=(STATE.searchCommitted||'').trim().toLowerCase();
  if(!q)return items;
  const digits=q.replace(/\D/g,'');
  return items.filter(it=>{
    try{
      const text=String(getText(it)||'').toLowerCase();
      if(text.includes(q))return true;
      if(digits.length>=2){
        const normalized=text.replace(/[^0-9a-z]/g,'');
        const battery=batteryRefFromRecord(it).replace(/[^0-9a-z]/g,'');
        if(normalized.includes(digits)||battery.includes(digits))return true;
      }
      return false;
    }catch(e){return false;}
  });
}

function statBox(num, label){
  const s = el('div',{class:'stat'});
  const n = el('div',{class:'n'});
  const str = String(num);
  const pctMatch = str.match(/^(-?\d+(?:\.\d+)?)%$/);
  if(pctMatch){
    n.dataset.target = pctMatch[1];
    n.dataset.suffix = '%';
    n.textContent = '0%';
  } else if(/^-?\d+(\.\d+)?$/.test(str)){
    n.dataset.target = str;
    n.textContent = '0';
  } else {
    n.textContent = str;
  }
  s.appendChild(n);
  s.appendChild(el('div',{class:'l'}, label));
  return s;
}

function Nav(items, labels){

      el('span',{class:'nav-kicker'},'CONTROL CENTER'),

  ]);
  nav.appendChild(head);
  const rail = el('div',{class:'nav-rail','tabindex':'0','aria-label':'Swipe or use arrow keys to move through menu pages'});
  items.forEach((k,i)=>{
    const active = STATE.view===k;
    const b = el('button',{class:'nav-item '+(active?'active':''),'aria-current':active?'page':null,'title':labels[k],'aria-label':labels[k]},[
      el('span',{class:'nav-index'},String(i+1).padStart(2,'0')),
      el('span',{class:'nav-label'},labels[k]),
      el('span',{class:'nav-arrow'},active?'●':'›')
    ]);
    b.addEventListener('click', ()=>{
      STATE.navLoading = false;
      STATE.view=k; STATE.openId=null;
      // Persist the selected destination BEFORE rendering so an immediate reload
      // cannot restore the previous menu. The active item is then rebuilt from
      // STATE.view and remains visibly selected, including hidden/mobile labels.
      saveBqcUiState();
      // Navigation is never gated by network/data refresh. Paint first, refresh second.
      render();
      requestAnimationFrame(()=>{
        saveBqcUiState();
        scheduleBackgroundDataRefresh().catch(()=>{});
      });
    });
    rail.appendChild(b);
  });
  // Keep the current destination comfortably visible without changing the existing menu layout.
  requestAnimationFrame(()=>{
    const active=rail.querySelector('.nav-item.active');
    if(active) active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  });
  // Desktop trackpads/mice can horizontally scroll the same way a technician swipes on mobile.
  rail.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ rail.scrollLeft += e.deltaY; e.preventDefault(); }
  },{passive:false});
  rail.addEventListener('keydown',e=>{
    if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
    e.preventDefault();
    const nodes=[...rail.querySelectorAll('.nav-item')];
    const idx=Math.max(0,nodes.findIndex(n=>n.classList.contains('active')));
    const next=nodes[Math.max(0,Math.min(nodes.length-1,idx+(e.key==='ArrowRight'?1:-1)))];
    if(next){ next.focus(); next.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); }
  });
  nav.appendChild(rail);
  return nav;
}

/* ==================== SHARED — Battery Deep Dive (every role) ====================
   Pull together everything on file about one battery (BMS or OEM ID) from whichever
   sector stores are loaded for the current role, so anyone can trace a pack's full
   history without switching sectors. */
function BatteryDeepDiveCard(){
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{},'Battery Deep Dive'));
  card.appendChild(el('div',{class:'sub'},'Look up one battery (BMS or OEM ID) to see everything on file about it across the sectors visible to you.'));

  const row = el('div',{style:'display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:4px;'});
  const inp = textInput(STATE.deepDiveId, v=>{ STATE.deepDiveId=v; }, {mono:true, placeholder:'e.g. C7245AC2AA...', key:'deepdive-id'});
  inp.style.maxWidth='260px';
  row.appendChild(field('Battery / BMS / OEM ID', inp));
  const goBtn = el('button',{class:'btn-primary'},'Look Up');
  goBtn.addEventListener('click', ()=> render());
  row.appendChild(goBtn);
  card.appendChild(row);

  const q = (STATE.deepDiveId||'').trim().toUpperCase();
  if(!q){ card.appendChild(el('div',{class:'empty-note'},'Enter a BMS or OEM battery ID above to see its full history.')); return card; }

  let found = false;

  const omMatches = (STATE.omRecords||[]).filter(r=>r.bmsId && r.bmsId.trim().toUpperCase()===q).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  if(omMatches.length){
    found = true;
    card.appendChild(el('div',{style:'font-weight:700;margin-top:10px;'}, 'O&M Chain — '+omMatches.length+' visit(s)'));
    omMatches.forEach(r=>{
      const box = el('div',{class:'sop-box'});
      box.appendChild(el('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;'},[
        el('div',{style:'font-weight:700;'}, `Visit #${r.visitNumber} · received ${r.dateReceived}`),
        el('span',{class:'status-chip '+r.status}, r.status.replace(/_/g,' '))
      ]));
      box.appendChild(el('div',{class:'meta'}, `Stage1: ${r.stage1.technician||'—'} · Stage2: ${r.stage2.technician||'—'} (${r.stage2.sopRef||'—'}) · Stage3: ${r.stage3.technician||'—'}`));
      if(r.capaCycles>0) box.appendChild(el('div',{class:'meta'}, `Corrective Action cycles: ${r.capaCycles}`));
      if(r.stage3 && r.stage3.qcNote) box.appendChild(el('div',{class:'meta'}, 'QC notes: '+r.stage3.qcNote));
      card.appendChild(box);
    });
  }

  const wMatches = (STATE.warrantyRecords||[]).filter(w=>w.bmsId && w.bmsId.trim().toUpperCase()===q);
  if(wMatches.length){
    found = true;
    card.appendChild(el('div',{style:'font-weight:700;margin-top:10px;'}, 'Warranty Escalations — '+wMatches.length));
    wMatches.forEach(w=>{
      card.appendChild(el('div',{class:'sop-box'},[
        el('div',{},[ `${w.dateEscalated} · ${w.failureCategory} · `, el('span',{class:'badge'}, w.status) ]),
        w.comments ? el('div',{class:'meta'}, w.comments) : null
      ]));
    });
  }

  const bMatches = (STATE.bsaRecords||[]).filter(r=>r.bmsId && r.bmsId.trim().toUpperCase()===q);
  if(bMatches.length){
    found = true;
    card.appendChild(el('div',{style:'font-weight:700;margin-top:10px;'}, 'BSA Cases — '+bMatches.length));
    bMatches.forEach(r=>{
      card.appendChild(el('div',{class:'sop-box'},[
        el('div',{},[ `${r.dateFlagged} · ${r.source.split(' (')[0]} · `, el('span',{class:'status-chip '+bsaStatusChipClass(r.status)}, r.status) ]),
        el('div',{class:'meta'}, r.issueDescription||'')
      ]));
    });
  }

  if(STATE.plantStockRecords && STATE.plantStockRecords.length){
    const moves = [];
    STATE.plantStockRecords.forEach(r=>{
      if((r.receivedIds||[]).includes(q)) moves.push({date:r.date, platform:r.platform, dir:'Received'});
      if((r.dispatchedIds||[]).includes(q)) moves.push({date:r.date, platform:r.platform, dir:'Dispatched'});
    });
    if(moves.length){
      found = true;
      card.appendChild(el('div',{style:'font-weight:700;margin-top:10px;'}, 'OEM Stock Ledger Movements — '+moves.length));
      const wrap = el('div',{class:'table-wrap'});

      tbl.appendChild(el('thead',{},[el('tr',{},[el('th',{},'Date'),el('th',{},'Platform'),el('th',{},'Direction')])]));
      const tbody = el('tbody');
      moves.sort((a,b)=>a.date.localeCompare(b.date)).forEach(m=> tbody.appendChild(el('tr',{},[el('td',{class:'mono'},m.date), el('td',{},m.platform), el('td',{},m.dir)])));
      tbl.appendChild(tbody); wrap.appendChild(tbl); card.appendChild(wrap);
    }
  }

  if(!found){
    card.appendChild(el('div',{class:'banner err', style:'margin-top:8px;'}, `No record found for "${q}" in the data visible to this view.`));
  }
  return card;
}

function chartSelectionRecords(title,label){
  const t=String(title||'').toLowerCase(), l=String(label||'').trim();
  const out=new Map();
  const add=(id,meta)=>{const q=String(id||'').trim().toUpperCase(); if(q&&!out.has(q)) out.set(q,meta||'');};
  const om=STATE.omRecords||[], warr=STATE.warrantyRecords||[], bsa=STATE.bsaRecords||[];
  if(PLATFORMS.includes(l.toUpperCase())){
    om.filter(r=>(r.model||'').toUpperCase()===l.toUpperCase()).forEach(r=>add(r.bmsId,`O&M · ${r.status}`));
    warr.filter(r=>(r.model||'').toUpperCase()===l.toUpperCase()).forEach(r=>add(r.bmsId,`Warranty · ${r.status}`));
    bsa.filter(r=>(r.model||'').toUpperCase()===l.toUpperCase()).forEach(r=>add(r.bmsId,`BSA · ${r.status}`));
    (STATE.plantStockRecords||[]).filter(r=>r.platform===l.toUpperCase()).forEach(r=>[...(r.receivedIds||[]),...(r.dispatchedIds||[])].forEach(id=>add(id,`Stock · ${r.date}`)));
  } else if(t.includes('final disposition')||t.includes('qc outcomes')){
    const target=l.toUpperCase().replace('PASSED','PASS').replace('SCRAPPED','SCRAPPED');
    om.filter(r=>String(r.finalDisposition||'').toUpperCase()===target).forEach(r=>add(r.bmsId,`O&M · ${r.status}`));
  } else if(t.includes('warranty') && t.includes('status')){
    warr.filter(r=>String(r.status||'')===l).forEach(r=>add(r.bmsId,`Warranty · ${r.failureCategory||''}`));
  } else if(t.includes('warranty') && t.includes('failure category')){
    warr.filter(r=>String(r.failureCategory||'')===l).forEach(r=>add(r.bmsId,`Warranty · ${r.status||''}`));
  } else if(t.includes('bsa') && t.includes('status')){
    bsa.filter(r=>String(r.status||'')===l).forEach(r=>add(r.bmsId,`BSA · ${r.issueDescription||''}`));
  } else if(t.includes('bsa') && t.includes('source')){
    bsa.filter(r=>String(r.source||'').split(' (')[0]===l).forEach(r=>add(r.bmsId,`BSA · ${r.status||''}`));
  } else if(t.includes('issue type')){
    om.forEach(r=>ISSUE_ITEMS.forEach(([k,name])=>{if(name===l&&r.stage1?.issues?.[k]) add(r.bmsId,`O&M · ${r.status}`);}));
  } else if(t.includes('technician')){
    om.forEach(r=>{if((r.stage1?.technician||r.stage3?.technician||'')===l) add(r.bmsId,`O&M · ${r.status}`);});
  } else if(t.includes('defect category')){
    om.filter(r=>recordDefectCategories(r.stage1?.issues).has(l.includes('Supplier')?'Supplier':'Non-Supplier')).forEach(r=>add(r.bmsId,`O&M · ${r.status}`));
  } else if(t.includes('capa')){
    om.filter(r=>{const c=r.capaCycles||0; return (l.startsWith('0')?c===0:l==='1'?c===1:l==='2'?c===2:c>=3);}).forEach(r=>add(r.bmsId,`CAPA ${r.capaCycles||0}`));
  }
  return Array.from(out.entries()).map(([id,meta])=>({id,meta}));
}

/* ==================== O&M TECHNICIAN — TEAM WORKLOAD / TAKEOVER ==================== */
function stageTechnicianName(rec,stage){const key='stage'+stage;return rec&&rec[key]?(rec[key].technician||'Unassigned'):'Unassigned';}
function openRecordsAtStage(stage){return (STATE.omRecords||[]).filter(r=>r.stage===stage&&!String(r.status||'').startsWith('CLOSED'));}
function stageWorkload(stage){const counts={};openRecordsAtStage(stage).forEach(r=>{const who=stageTechnicianName(r,stage);counts[who]=(counts[who]||0)+1;});return counts;}
/* =====================================================================
   STAGED TAKEOVER REQUESTS
   A technician may request a handover only from the adjacent stage.
   The technician who currently owns the work at that adjacent stage must
   ACCEPT before ownership transfers. The request/decision is retained.
   ===================================================================== */
function adjacentStage(a,b){ return Math.abs(Number(a)-Number(b))===1; }
function stageTech(r,stage){ return String((r['stage'+stage]||{}).technician||'').trim(); }

async function requestStageTakeover(recordId,targetStage){
  if(STATE.role!=='omtech') return;
  const requesterStage=Number(STATE.stage), target=Number(targetStage);
  if(!adjacentStage(requesterStage,target)){ toast('Takeover requests are limited to the immediately previous or next stage.'); return; }
  const fresh=await loadOm();
  const rec=fresh.find(r=>String(r.id)===String(recordId));
  if(!rec || rec.stage!==target || String(rec.status||'').startsWith('CLOSED')){ toast('This battery is no longer available at that stage. Refreshing.'); STATE.omRecords=fresh; render(); return; }
  const currentOwner=stageTech(rec,target);
  if(!currentOwner){ toast('There is no technician at the target stage to accept the handover.'); return; }
  if(currentOwner===STATE.techName){ toast('You are already the assigned technician.'); return; }
  const requests=await loadStore('takeover_request_records');
  const pending=requests.find(x=>x.recordId===rec.id && x.status==='PENDING' && x.requestedBy===STATE.techName);
  if(pending){ toast('A takeover request is already pending for this battery.'); return; }
  const req={
    id:uid(), createdAt:nowIso(), updatedAt:nowIso(), status:'PENDING',
    recordId:String(rec.id), bmsId:rec.bmsId, model:rec.model||'',
    requester:STATE.techName, requesterStage,
    targetTechnician:currentOwner, targetStage:target,
    reason:'Technician requested adjacent-stage takeover',
    acceptedAt:null, acceptedBy:null, declinedAt:null, declinedBy:null
  };
  const ok=await saveStore('takeover_request_records',[...requests,req]);
  if(!ok){ toast('Could not create the takeover request.'); return; }
  STATE.takeoverRequestRecords=[...requests,req];
  toast(`✓ Takeover request sent to ${currentOwner} for BMS ${rec.bmsId}.`);

}

async function decideTakeoverRequest(requestId,decision){
  if(STATE.role!=='omtech') return;
  const requests=await loadStore('takeover_request_records');
  const req=requests.find(x=>String(x.id)===String(requestId));
  if(!req || req.status!=='PENDING'){ toast('This request is no longer pending.'); STATE.takeoverRequestRecords=requests; render(); return; }
  if(req.targetTechnician!==STATE.techName || Number(req.targetStage)!==Number(STATE.stage)){
    toast('Only the technician currently assigned at the target stage can accept or decline this request.');
    return;
  }
  if(!adjacentStage(req.requesterStage,req.targetStage)){ toast('Invalid stage-transfer request.'); return; }
  if(decision==='DECLINE'){
    req.status='DECLINED'; req.declinedAt=nowIso(); req.declinedBy=STATE.techName; req.updatedAt=nowIso();
    const saved=await saveStore('takeover_request_records',requests);
    if(saved){ STATE.takeoverRequestRecords=requests; toast(`Takeover request for ${req.bmsId} declined.`); render(); }
    return;
  }

  const fresh=await loadOm();
  const rec=fresh.find(r=>String(r.id)===String(req.recordId));
  if(!rec || rec.stage!==req.targetStage || String(rec.status||'').startsWith('CLOSED')){
    req.status='EXPIRED'; req.updatedAt=nowIso();
    await saveStore('takeover_request_records',requests);
    STATE.takeoverRequestRecords=requests;
    toast('The battery changed before acceptance; request expired.'); render(); return;
  }
  const ownerNow=stageTech(rec,req.targetStage);
  if(ownerNow!==STATE.techName){
    toast('The current owner changed. Refresh and review the request again.');
    return;
  }

  const fromStage=Number(req.targetStage), toStage=Number(req.requesterStage);
  const transfer={
    at:nowIso(), fromStage, toStage, fromTechnician:STATE.techName,
    toTechnician:req.requester, requestId:req.id, acceptedBy:STATE.techName
  };
  rec.handoverHistory=Array.isArray(rec.handoverHistory)?rec.handoverHistory:[];
  rec.handoverHistory.push(transfer);
  rec.stage=toStage;
  rec.status='STAGE'+toStage+'_OPEN';
  rec['stage'+toStage]=rec['stage'+toStage]||{};
  rec['stage'+toStage].technician=req.requester;
  rec['stage'+toStage].transferredAt=nowIso();
  rec['stage'+toStage].transferredFromStage=fromStage;
  rec['stage'+toStage].transferredFromTechnician=STATE.techName;
  rec.updatedAt=nowIso();
  rec.updatedBy=req.requester;
  rec.updatedRole='omtech';
  rec.updatedStage=toStage;

  const savedOm=await saveOm(fresh);
  if(!savedOm){ toast('Transfer was not saved; no ownership was changed.'); return; }

  req.status='ACCEPTED'; req.acceptedAt=nowIso(); req.acceptedBy=STATE.techName; req.updatedAt=nowIso();
  const savedReq=await saveStore('takeover_request_records',requests);
  if(!savedReq){ toast('Battery transfer saved, but request status could not be updated. Refresh the request queue.'); }
  STATE.omRecords=fresh;
  STATE.takeoverRequestRecords=requests;
  toast(`✓ ${req.bmsId} transferred to ${req.requester} at Stage ${toStage}.`);
  render();
}

async function takeOverStageRecord(recordId,stage){
  if(Number(stage)!==Number(STATE.stage)){
    requestStageTakeover(recordId,Number(stage));
    return;
  }
  const fresh=await loadOm(); const rec=fresh.find(r=>r.id===recordId);
  if(!rec||rec.stage!==stage||String(rec.status||'').startsWith('CLOSED')){toast('This work item is no longer available. Refreshing the docket.');STATE.omRecords=fresh;render();return;}
  const key='stage'+stage; const previous=stageTech(rec,stage);
  if(previous===STATE.techName){toast('This work is already assigned to you.');return;}
  if(previous && previous!=='Unassigned'){
    toast('For a different-stage owner, send a takeover request. The current owner must accept it.');
    return;
  }
  if(!window.confirm(`Take unassigned ${rec.bmsId} at Stage ${stage}?`))return;
  rec[key]=rec[key]||{}; rec[key].technician=STATE.techName; rec[key].startedAt=rec[key].startedAt||nowIso(); rec[key].takenOverAt=nowIso(); rec[key].takenOverFrom=previous||'Unassigned'; rec.updatedAt=nowIso(); rec.updatedBy=STATE.techName; rec.updatedStage=stage;
  const saved=await saveOm(fresh); if(!saved){toast('Could not take over this work item. Check the connection and try again.');return;}
  STATE.omRecords=fresh; toast(`✓ ${rec.bmsId} is now assigned to you at Stage ${stage}.`); render();
}

    if(isSwapStationRequired(d) && !d.site.trim()){ STATE.intakeError='Swap Station is required for this defect type.'; render(); return; }

    if(openRecordForBms(STATE.omRecords, clean)){ STATE.intakeError='This BMS ID is already open in the pipeline. Use that docket instead of creating a new intake.'; render(); return; }
    const sameDayErr = sameDayVisitError(STATE.omRecords, clean, d.dateReceived);

      };
    }
    const updated = [...STATE.omRecords, rec];
    STATE.intakeSaving = true; render();
    const ok = await saveOm(updated);
    let bsaOk = true;
    if(ok && bsaRec){
      const freshBsa = await loadBsa();
      bsaOk = await saveBsa([...freshBsa, bsaRec]);
      if(bsaOk) STATE.bsaRecords = [...freshBsa, bsaRec];
    }
    STATE.intakeSaving = false;
    if(!ok){
      // This is the fix for "the button isn't working": previously a failed write left the
      // tech staring at a form that silently did nothing. Now we surface it, and — critically —
      // we do NOT clear the draft or the intake error, so their entered data isn't lost and
      // they know to retry.
      STATE.intakeError = 'Could not save to the shared record — check your connection and tap Send again. Your entries have not been lost.';
      render();

    }
    STATE.omRecords = updated;
    STATE.intakeDraft = emptyIntakeDraft(STATE.techName);
    clearIntakeDraftLocal();
    STATE.intakeDraftSavedAt=null;
    STATE.serialWarning = null;

    STATE.omLastRefreshed = nowTime();
    const saveNote=STATE.lastSaveStatus?.cloudAttempted && !STATE.lastSaveStatus?.cloudSaved ? ' Saved locally and queued for cloud sync.' : ' Saved successfully.';

    else toast(`✓ Intake logged — BMS ${rec.bmsId} sent to Stage 2 docket.${saveNote}`);
    render();
  });
  actions.appendChild(clearBtn); actions.appendChild(sendBtn);
  card.appendChild(actions);
  return card;

function Stage3Card(rec){
  const s3 = rec.stage3;
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{}, `Final Test & QC — ${rec.bmsId}`));
  card.appendChild(el('div',{class:'sub'}, `${rec.model||'Unknown'} · visit #${rec.visitNumber} · repaired by ${rec.stage2.technician||'—'}`));
 
  card.appendChild(TestsCard(s3));
 
  const disp = el('div',{class:'card'});
  disp.style.padding='0'; disp.style.border='none'; disp.style.background='transparent'; disp.style.marginBottom='0';
  const dispositionSel = selectInput(s3.qcPassed, [['','— Select Disposition —'],['PASS','PASS'],['FAIL','FAIL — Return for Corrective Action'],['ESCALATE_BSA','ESCALATE TO BSA — Battery Requires BSA Review']], v=>{ s3.qcPassed=v; render(); });
  card.appendChild(field('Final QC Disposition', dispositionSel));
  card.appendChild(field('QC Notes', textareaInput(s3.qcNote, v=>s3.qcNote=v)));
 
  let returnTo = 2;
  if(s3.qcPassed==='FAIL'){
    card.appendChild(field('Return Battery To', selectInput('2', [['2','Stage 2 — Repair Again'],['1','Stage 1 — Re-Inspect First']], v=>returnTo=parseInt(v))));
  }
 
  if(STATE.intakeError){
    card.appendChild(el('div',{class:'banner err'}, '⚠ '+STATE.intakeError));
  }
 
  const actions = el('div',{style:'display:flex;justify-content:flex-end;gap:8px;margin-top:8px;'});
  const finalizeBtn = el('button',{class: (s3.qcPassed==='FAIL' || s3.qcPassed==='ESCALATE_BSA' ? 'btn-capa' : 'btn-primary'), disabled: STATE.intakeSaving},
    STATE.intakeSaving ? loadingLabel(true,'Saving…') : (s3.qcPassed==='FAIL' ? 'Return for Corrective Action' : (s3.qcPassed==='ESCALATE_BSA' ? 'Escalate to BSA' : 'Finalize')));
  finalizeBtn.addEventListener('click', async ()=>{
    if(STATE.intakeSaving) return;
    if(!s3.qcPassed){ toast('Select a final QC disposition first.'); return; }
    STATE.intakeError = null;
    s3.technician = STATE.techName;
    s3.startedAt = s3.startedAt || nowIso();
    s3.completedBy = STATE.techName;
    s3.completedAt = nowIso();
    const priorQcPassed = s3.qcPassed;
    if(s3.qcPassed==='PASS'){
      rec.status='CLOSED_PASS'; rec.finalDisposition='PASS'; rec.closedAt = nowIso();
    } else if(s3.qcPassed==='ESCALATE_BSA'){
      const freshBsa = await loadBsa();
      const existingBsa = freshBsa.find(x => String(x.bmsId||'').trim().toUpperCase()===String(rec.bmsId||'').trim().toUpperCase() && x.status!=='Returned to O&M for Deployment' && x.status!=='Scrapped');
      if(!existingBsa){
        freshBsa.push({
          id:uid(),
          createdAt:nowIso(),
          status:BSA_STATUSES[0],
          rcaSummary:'',
          repairNotes:'',
          bmsId:rec.bmsId,
          model:rec.model||'',
          source:BSA_SOURCES[0],
          dateFlagged:(new Date()).toISOString().slice(0,10),
          flaggedBy:STATE.techName||'Stage 3 Technician',
          assignedEngineer:'',
          issueDescription:s3.qcNote || bsaIssueSummary(rec.stage1||{}),
          escalationCategory:bsaEscalationCategory(rec.stage1||{}),
          stage1IssueFlags:bsaTriggerLabels(rec.stage1||{}),
          escalatedFromStage:3,
          sopAttempted:rec.stage2?.sopRef || 'Stage 3 final QC could not be completed',
        });
        const bsaOk = await saveBsa(freshBsa);
        if(!bsaOk){
          STATE.intakeError = 'Could not create the BSA escalation — check your connection and try again.';
          s3.qcPassed = priorQcPassed;
          render();
          return;
        }
        STATE.bsaRecords = freshBsa;
      }
      rec.status='CLOSED_TRANSFERRED_BSA';
      rec.finalDisposition='ESCALATED_BSA';
      rec.closedAt=nowIso();
      rec.bsaEscalatedAt=nowIso();
      rec.bsaEscalatedBy=STATE.techName;
    } else {
      rec.capaCycles += 1;
      rec.isCorrectiveAction = true;
      rec.capaLog.push({ cycle: rec.capaCycles, returnedAt: nowIso(), returnedBy: STATE.techName, reason: s3.qcNote, toStage: returnTo });
      rec.stage = returnTo;
      rec.status = returnTo===1 ? 'STAGE1_OPEN' : 'STAGE2_OPEN';
      s3.qcPassed = '';
    }
    STATE.intakeSaving = true; render();
    const fresh = await loadOm();
    const idx = fresh.findIndex(r=>r.id===rec.id);
    if(idx===-1){ STATE.intakeSaving=false; STATE.intakeError = 'This record no longer exists in the shared docket — it may have been edited elsewhere. Refreshing.'; STATE.omRecords = fresh; render(); return; }
    /* Preserve the newest shared record and apply only Stage 3 QC/disposition data. */
    const latestRec = fresh[idx];
    latestRec.stage3 = clone(rec.stage3);
    latestRec.stage = rec.stage;
    latestRec.status = rec.status;
    latestRec.finalDisposition = rec.finalDisposition;
    latestRec.closedAt = rec.closedAt;
    latestRec.capaCycles = rec.capaCycles;
    latestRec.isCorrectiveAction = rec.isCorrectiveAction;
    latestRec.capaLog = clone(rec.capaLog);
    latestRec.bsaEscalatedAt = rec.bsaEscalatedAt;
    latestRec.bsaEscalatedBy = rec.bsaEscalatedBy;
    latestRec.updatedBy = STATE.techName;
    latestRec.updatedAt = nowIso();
    fresh[idx] = latestRec;
    const ok = await saveOm(fresh);
    STATE.intakeSaving = false;
    if(!ok){
      // Roll back the in-memory disposition change so the form doesn't silently drift from
      // what's actually saved, and let the tech retry.
      s3.qcPassed = priorQcPassed;
      STATE.intakeError = 'Could not save to the shared record — check your connection and try again.';
      render();
      return;
    }
    STATE.omRecords = fresh;
    STATE.openId = null;
    STATE.omLastRefreshed = nowTime();
    if(rec.status==='CLOSED_PASS') toast(`✓ BMS ${rec.bmsId} passed final QC and is closed out.`);
    else if(rec.status==='CLOSED_TRANSFERRED_BSA') toast(`✓ BMS ${rec.bmsId} escalated to the BSA team for further review.`);
    else toast(`✓ BMS ${rec.bmsId} returned to Stage ${returnTo} for corrective action (not counted as a new repeat failure).`);
  });
  actions.appendChild(finalizeBtn);
  disp.appendChild(actions);
  card.appendChild(disp);
  return card;
}

/* ---- My Analytics (O&M Technician): my own throughput trend, outcome mix, and a battery deep dive ---- */
function OmTechAnalyticsView(){
  const container = el('div');
  container.appendChild(el('div',{class:'sector-tag'}, 'My Analytics — Stage '+STATE.stage+' · '+(STATE.techName||'')));
  const stage = STATE.stage;
  const key = 'stage'+stage;
  const mine = STATE.omRecords.filter(r=> r[key] && r[key].technician===STATE.techName);
  const completedDateOf = r=> (r[key] && r[key].completedAt) ? r[key].completedAt.slice(0,10) : null;
  const byDay = {};
  mine.forEach(r=>{ const d=completedDateOf(r); if(!d) return; byDay[d]=(byDay[d]||0)+1; });
  const days = Object.keys(byDay).sort().slice(-30);

  const overview = el('div',{class:'card'});
  overview.appendChild(el('h3',{},'Overview'));
  const stats = el('div',{class:'stat-grid'});
  stats.appendChild(statBox(mine.length, 'Total Completed'));
  if(stage===3){
    const firstPass = mine.filter(r=>r.finalDisposition==='PASS' && r.capaCycles===0).length;
    const scrapped = mine.filter(r=>r.finalDisposition==='SCRAPPED').length;
    stats.appendChild(statBox(mine.length ? (firstPass/mine.length*100).toFixed(1)+'%' : '0.0%', 'My First-Pass Rate'));
    stats.appendChild(statBox(scrapped, 'Scrapped'));
  } else {
    stats.appendChild(statBox(mine.filter(r=>r.capaCycles>0).length, 'Involved in Corrective Action'));
  }
  overview.appendChild(stats);
  container.appendChild(overview);

  container.appendChild(chartCard('My Daily Throughput (last 30 days)',
    baseLineConfig(days.length?days:['No data'], [{label:'Completed', data: days.length?days.map(d=>byDay[d]):[0], color: cssVar('--accent')}], {})));

  if(stage===3){
    const counts = {PASS:0, SCRAPPED:0, CAPA:0};
    mine.forEach(r=>{
      if(r.finalDisposition==='PASS' && r.capaCycles===0) counts.PASS++;
      else if(r.finalDisposition==='SCRAPPED') counts.SCRAPPED++;
      else counts.CAPA++;
    });
    container.appendChild(chartCard('My QC Outcomes',
      basePieConfig(['First-Pass','Scrapped','Returned for Corrective Action'], [counts.PASS, counts.SCRAPPED, counts.CAPA], [cssVar('--pass'), cssVar('--fail'), cssVar('--capa')])));
  } else {
    const issueCounts = {};
    mine.forEach(r=>{
      ISSUE_ITEMS.forEach(([k,l])=>{ if(r.stage1 && r.stage1.issues && r.stage1.issues[k]) issueCounts[l]=(issueCounts[l]||0)+1; });
    });
    const labels = Object.keys(issueCounts);
    container.appendChild(chartCard('Issue Types I\'ve Handled',
      labels.length ? baseBarConfig(labels, [{label:'Count', data: labels.map(l=>issueCounts[l]), color: cssVar('--warn')}], {}) : baseBarConfig(['No data'], [{label:'Count', data:[0], color:cssVar('--warn')}], {})));
  }

  container.appendChild(OmTechTeamWorkloadCard());
  container.appendChild(BatteryDeepDiveCard());
  return container;
}

function BulkPlatformRowCard(row, date){
  const meta=PLATFORM_META[row.platform], existingRec=findStockRecord(STATE.plantStockRecords,date,row.platform);
  const card=el('div',{class:'card'}), head=el('div',{style:'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px;'});
  head.appendChild(el('h3',{},meta.emoji+' '+meta.label));
  if(existingRec) head.appendChild(el('span',{class:'badge'},'Entry exists — saving merges with it'));
  card.appendChild(head);
  const g=el('div',{class:'grid'});
  g.appendChild(field('Received Qty',textInput(row.receivedQty,v=>{row.receivedQty=v;updateBulkCounts();},{type:'number',mono:true,key:'bulk-'+row.platform+'-recvQty'})));
  g.appendChild(field('Dispatched Qty',textInput(row.dispatchedQty,v=>{row.dispatchedQty=v;updateBulkCounts();},{type:'number',mono:true,key:'bulk-'+row.platform+'-dispQty'})));
  card.appendChild(g);
  const idGrid=el('div',{class:'grid'});
  const recvWrap=el('div'); recvWrap.appendChild(el('label',{},'Received Battery IDs — full ID or suffix only'));
  recvWrap.appendChild(smartBatteryIdListInput(row.receivedIds,row.platform,v=>{row.receivedIds=v},{key:'bulk-'+row.platform+'-recvIds',placeholder:'Enter suffixes, one per line / comma-separated'}));
  const recvCount=el('div',{class:'id-count'}); recvWrap.appendChild(recvCount); idGrid.appendChild(recvWrap);
  const dispWrap=el('div'); dispWrap.appendChild(el('label',{},'Dispatched Battery IDs — full ID or suffix only'));
  dispWrap.appendChild(smartBatteryIdListInput(row.dispatchedIds,row.platform,v=>{row.dispatchedIds=v},{key:'bulk-'+row.platform+'-dispIds',placeholder:'Enter suffixes, one per line / comma-separated'}));
  const dispCount=el('div',{class:'id-count'}); dispWrap.appendChild(dispCount); idGrid.appendChild(dispWrap);
  card.appendChild(idGrid);
  function updateBulkCounts(){
    const rn=parseBatteryIdList(row.receivedIds,row.platform).length,dn=parseBatteryIdList(row.dispatchedIds,row.platform).length;
    const re=(row._existingReceivedIds||[]).length,de=(row._existingDispatchedIds||[]).length,rt=parseInt(row.receivedQty)||0,dt=parseInt(row.dispatchedQty)||0;
    recvCount.textContent=`${rn+re} / ${rt||'?'} received IDs`+(re?` · ${re} already saved`:'' );
    dispCount.textContent=`${dn+de} / ${dt||'?'} dispatched IDs`+(de?` · ${de} already saved`:'' );
    recvCount.className='id-count '+(rt>0&&rn+re===rt?'ok':rt>0&&rn+re>rt?'over':'');
    dispCount.className='id-count '+(dt>0&&dn+de===dt?'ok':dt>0&&dn+de>dt?'over':'');
  }
  updateBulkCounts(); return card;
}

function BulkStockEntryView(){
  const d = STATE.bulkStockDraft;
  const container = el('div');
  container.appendChild(el('div',{class:'sector-tag'},'Plant & Inventory — Bulk OEM Stock Intake / Dispatch'));
 
  const dateCard = el('div',{class:'card'});
  dateCard.appendChild(el('h3',{},'Bulk Stock Entry'));
  dateCard.appendChild(el('div',{class:'sub'},'Enter received and dispatched quantities per platform for one date. OEM battery IDs are optional at first and can be pasted in later — quantities and ID counts are tracked separately so a partial ID list never blocks saving.'));
  const dateRow = el('div',{class:'grid narrow'});
  dateRow.appendChild(field('Date', textInput(d.date, v=>{ d.date=v; loadDraftForDate(); render(); }, {type:'date', key:'bulk-date'})));
  dateRow.appendChild(field('Entered By', textInput(d.enteredBy, v=>d.enteredBy=v, {key:'bulk-enteredBy'})));
  dateCard.appendChild(dateRow);
  if(STATE.bulkStockError){
    dateCard.appendChild(el('div',{class:'banner err'}, '⚠ '+STATE.bulkStockError));
  }
  container.appendChild(dateCard);
 
  d.rows.forEach(row=>{
    container.appendChild(BulkPlatformRowCard(row, d.date));
  });

  container.appendChild(chartCard('Live Preview — Received vs Dispatched by Platform', baseBarConfig(
    d.rows.map(r=>r.platform),
    [
      { label:'Received', data: d.rows.map(r=>parseInt(r.receivedQty)||0), color: cssVar('--pass') },
      { label:'Dispatched', data: d.rows.map(r=>parseInt(r.dispatchedQty)||0), color: cssVar('--fail') },
    ]
  )));
 
  const actions = el('div',{class:'footer-actions'});
  if(STATE.bulkStockSaving) actions.appendChild(el('span',{class:'sync-line'},'Saving…'));
  const saveBtn = el('button',{class:'btn-primary', disabled: STATE.bulkStockSaving}, STATE.bulkStockSaving ? loadingLabel(true,'Saving…') : ('Save Bulk Entry for '+d.date));
  saveBtn.addEventListener('click', async ()=>{
    if(STATE.bulkStockSaving) return;
    STATE.bulkStockError = null;
    const hasAny = d.rows.some(r=> r.receivedQty!=='' || r.dispatchedQty!=='' || r.receivedIds.trim() || r.dispatchedIds.trim());
    if(!hasAny){ STATE.bulkStockError = 'Enter at least one quantity or ID list before saving.'; render(); return; }
    STATE.plantStockRecords = await loadPlantStock();
    let updated = [...STATE.plantStockRecords];
    let totalSkipped = 0;
    d.rows.forEach(row=>{
      if(row.receivedQty==='' && row.dispatchedQty==='' && !row.receivedIds.trim() && !row.dispatchedIds.trim()) return;
      const existing = findStockRecord(updated, d.date, row.platform);
      const skipSet = allIdsForPlatform(updated, row.platform, existing? existing.id : null);
      const { record: rec, skippedCount } = buildStockRecordFromRow(existing, d.date, row, d.enteredBy||STATE.techName||'', skipSet);
      totalSkipped += skippedCount;
      if(existing){ updated = updated.map(r=> r.id===rec.id ? rec : r); }
      else { updated = [...updated, rec]; }
    });
    const dateCheck=computeStockLedger(updated).find(e=>e.date===d.date);
    const negativeRows=(dateCheck?.rows||[]).filter(r=>r.closing<0);
    if(negativeRows.length){
      STATE.bulkStockError='Stock cannot close below zero. '+negativeRows.map(r=>`${r.platform} is short by ${r.shortage} unit(s)`).join('; ')+'. Enter the missing inward stock or reduce the outbound quantity before saving.';
      render();
      return;
    }
    STATE.bulkStockSaving = true; render();
    const ok = await savePlantStock(updated);
    STATE.bulkStockSaving = false;
    if(!ok){
      STATE.bulkStockError = 'Could not save to the shared record — check your connection and try again. Your entries have not been lost.';
      render();
      return;
    }
    STATE.plantStockRecords = updated;
    loadDraftForDate();
    toast(`✓ Bulk stock entry saved for ${d.date}.` + (totalSkipped>0 ? ` Skipped ${totalSkipped} duplicate OEM ID(s) already on file.` : ''));
  });
  actions.appendChild(saveBtn);
  container.appendChild(actions);
 
  container.appendChild(StockLedgerPreviewCard(d.date));
  return container;
}

const BSA_TECH_STATUS_OPTIONS = [

function bsaTechStatus(r){
  if(r && r.technicianStatus) return r.technicianStatus;
  if(r && r.status==='Scrapped') return 'Scrapped';
  if(r && r.status==='Returned to O&M for Deployment') return 'Returned to O&M for Deployment';
  if(r && r.status==='Repaired') return 'Worked On';
  if(r && r.bsaReceivedAt) return 'Received by BSA';
  return 'Awaiting BSA Receipt';
}
function bsaTechStatusClass(status){
  if(status==='Worked On' || status==='Returned to O&M for Deployment') return 'PASS';
  if(status==='Scrapped') return 'FAIL';
  if(status==='Work in Progress' || status==='Warranty') return 'CAPA';
  return 'OPEN';
}
function bsaLegacyStatusForTech(status){
  if(status==='Worked On') return 'Repaired';
  if(status==='Scrapped') return 'Scrapped';
  if(status==='Returned to O&M for Deployment') return 'Returned to O&M for Deployment';
  if(status==='Work in Progress') return 'RCA In Progress';
  if(status==='Warranty') return 'RCA In Progress';
  if(status==='Received by BSA') return 'Retrieved';
  return 'Open — Awaiting Retrieval';
}

/* ---------- Shared cross-sector data snapshot ----------
   These values are deliberately derived from the same live stores used by the
   operational pages and charts. They are read-only: no data is copied into a
   second store, so dashboards cannot drift apart. */
function sharedOperationalSnapshot(){
  const om=STATE.omRecords||[];
  const warranty=STATE.warrantyRecords||[];
  const bsa=STATE.bsaRecords||[];
  const ledger=computeStockLedger(STATE.plantStockRecords||[]);
  const latestDaily=latestNamanveDailyStock();
  const activeWarranty=warranty.filter(w=>warrantyIsActiveStatus(w.status));
  const openBsa=bsa.filter(r=>!['Returned to O&M for Deployment','Scrapped'].includes(r.status));
  const openOm=om.filter(r=>!String(r.status||'').startsWith('CLOSED'));
  return {
    omTotal:om.length,
    openOm:openOm.length,
    activeWarranty:activeWarranty.length,
    openBsa:openBsa.length,
    warrantyTotal:warranty.length,
    bsaTotal:bsa.length,

function formatNamanveDate(dateStr){
  if(!dateStr) return '—';
  const d=new Date(dateStr+'T00:00:00');
  if(Number.isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}).replace(/ /g,'-');
}
function newBatteryFpyByDay(){
  const rows = [...STATE.dailyStockRecords].sort((a,b)=>a.date.localeCompare(b.date));
  return rows.map(r=>{
    const healthy = parseInt(r.healthy)||0, qi = parseInt(r.qualityIssues)||0;
    const denom = healthy+qi;
    return { date: r.date, fpy: denom>0 ? (healthy/denom*100) : 0 };
  });
}

  RCA_FISHBONE.forEach(k=>fish.appendChild(field(k,textareaInput(d.fishbone?.[k]||'',v=>{d.fishbone=d.fishbone||{};d.fishbone[k]=v},{placeholder:`Possible ${k} causes, evidence and checks`}))));form.appendChild(fish);

  const action=el('div',{class:'card',style:'margin-top:10px;'});action.appendChild(el('h4',{},'Root cause and action plan'));
  action.appendChild(field('Verified Root Cause',textareaInput(d.rootCause,v=>d.rootCause=v)));
  action.appendChild(field('Corrective Action — remove the immediate cause',textareaInput(d.correctiveAction,v=>d.correctiveAction=v)));
  action.appendChild(field('Preventive Action — stop recurrence across the process',textareaInput(d.preventiveAction,v=>d.preventiveAction=v)));
  action.appendChild(field('Verification Method / Evidence',textareaInput(d.verificationMethod,v=>d.verificationMethod=v)));
  const ag=el('div',{class:'grid'});ag.appendChild(field('Due Date',textInput(d.dueDate,v=>d.dueDate=v,{type:'date'})));
  ag.appendChild(field('Status',selectInput(d.status,[['RCA IN PROGRESS','RCA IN PROGRESS'],['ACTION OPEN','ACTION OPEN'],['READY FOR VERIFICATION','READY FOR VERIFICATION'],['VERIFIED CLOSED','VERIFIED CLOSED']],v=>d.status=v)));action.appendChild(ag);form.appendChild(action);

  const save=el('button',{class:'btn-primary',disabled:STATE.rcaSaving},STATE.rcaSaving?loadingLabel(true,'Saving…'):'Save RCA');
  save.addEventListener('click',async()=>{
    if(STATE.rcaSaving)return;
    if(!requireActorName('Technician')||!d.bmsId.trim()||!d.problemStatement.trim()){toast('Battery/BMS ID and a clear problem statement are required.');return;}
    if(!d.why1||!d.why2||!d.why3||!d.why4||!d.why5){toast('Complete all five Why fields before saving the RCA.');return;}
    if(!d.rootCause.trim()){toast('Verified root cause is required.');return;}
    const fresh=await loadRca(), entry={...clone(d),id:d.id||uid(),createdAt:d.createdAt||nowIso(),updatedAt:nowIso(),openedBy:d.openedBy||STATE.techName,updatedBy:STATE.techName,updatedRole:STATE.role};
    const idx=fresh.findIndex(r=>r.id===entry.id),updated=idx>=0?fresh.map((r,i)=>i===idx?entry:r):[...fresh,entry];
    STATE.rcaSaving=true;render();const ok=await saveRca(updated);STATE.rcaSaving=false;
    if(!ok){toast('Could not save RCA.');render();return;}
    STATE.rcaRecords=updated;STATE.rcaDraft=emptyRcaDraft();toast(`✓ RCA saved for ${entry.bmsId}.`);render();
  });
  form.appendChild(save);container.appendChild(form);

  const list=el('div',{class:'card'});list.appendChild(el('h3',{},'RCA register'));
  const rows=searchFilter([...(STATE.rcaRecords||[])].sort((a,b)=>String(b.updatedAt||b.createdAt).localeCompare(String(a.updatedAt||a.createdAt))),r=>`${r.bmsId} ${r.model} ${r.owner} ${r.status} ${r.rootCause} ${r.problemStatement}`);
  if(!rows.length)list.appendChild(el('div',{class:'empty-note'},'No RCA records yet.'));
  rows.slice(0,100).forEach(r=>{const item=el('div',{class:'sop-box'});item.appendChild(el('div',{style:'display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;'},[el('strong',{},batteryIdButton(r.bmsId)),el('span',{class:'status-chip '+(r.status==='VERIFIED CLOSED'?'PASS':'CAPA')},r.status||'RCA IN PROGRESS')]));item.appendChild(el('div',{class:'meta'},`Owner: ${r.owner||'—'} · Updated by: ${r.updatedBy||'—'} · Due: ${r.dueDate||'—'}`));item.appendChild(el('div',{style:'margin-top:6px;'},`Root cause: ${r.rootCause||'—'}`));list.appendChild(item);});
  container.appendChild(list);return container;
}

function allInventoryMovements(){
  const received = (STATE.newBatteryRecords||[]).map(r=>({ date:r.date, platform:r.platform, qty:parseInt(r.quantity)||0, direction:1 }));
  const adjusted = (STATE.adjustments||[]).map(r=>({ date:r.date, platform:r.platform, qty:parseInt(r.quantity)||0, direction: movementDirection(r.type) }));
  return [...received, ...adjusted];
}
/* STOCK SEPARATION: OEM bulk ledger, New Battery operations, and Warranty stock are independent pools. */
function oemLedgerStockByPlatform(){
  const ledger=computeStockLedger(STATE.plantStockRecords||[]);
  const latest=ledger.length ? ledger[ledger.length-1] : null;
  const stock={}; PLATFORMS.forEach(p=>stock[p]=0);
  if(latest) latest.rows.forEach(r=>{ stock[r.platform]=Math.max(0,parseInt(r.closing)||0); });
  return stock;
}
function newBatteryOperationalSnapshot(){
  const raw={}; PLATFORMS.forEach(p=>raw[p]=0);
  allInventoryMovements().forEach(m=>{ raw[m.platform]=(raw[m.platform]||0)+m.direction*(parseInt(m.qty)||0); });
  const available={}; Object.keys(raw).forEach(p=>available[p]=Math.max(0,raw[p]));
  return {raw,available};
}
function newBatteryStockByPlatform(){ return newBatteryOperationalSnapshot().available; }
function newBatteryStockIssues(){
  const movements=allInventoryMovements().slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
  const running={}; PLATFORMS.forEach(p=>running[p]=0); const issues=[];
  let currentDate='';
  const daily={};
  movements.forEach(m=>{
    const key=String(m.date||'')+'|'+String(m.platform||'');
    if(!daily[key])daily[key]={date:m.date,platform:m.platform,delta:0};
    daily[key].delta += m.direction*(parseInt(m.qty)||0);
  });
  Object.values(daily).sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(x=>{
    running[x.platform]=(running[x.platform]||0)+x.delta;
    if(running[x.platform]<0)issues.push({date:x.date,platform:x.platform,shortage:-running[x.platform]});
  });
  return issues;
}
function stockByPlatform(){ return oemLedgerStockByPlatform(); }

function warrantyWarehouse(w){ return (w&&w.warehouse)||'Kyebando Warehouse'; }
/* Warranty source classification follows WH BATTERY QUALITY DATA:
   Vandalism / Tampering, BMS Issue, Cell Issue, Charging Port Failure,
   Physical Damage, Missing Component, Thermal / Wet Paste,
   Thermal / Overheating, LED / Display Fault, Unspecified, Other. */
const WARRANTY_FAILURE_CATEGORIES = [
  'Vandalism / Tampering','BMS Issue','Cell Issue','Charging Port Failure',
  'Physical Damage','Missing Component','Thermal / Wet Paste',
  'Thermal / Overheating','LED / Display Fault','Unspecified','Other'
];
const WARRANTY_STATUSES = [
  'Still In Warranty','Work In Progress','Resolved','Failed To Resolve',
  'Waiting for Spare Parts','Under Supplier Review','Scrapped by QC','Repaired & Returned'
];
function warrantyIsActiveStatus(status){
  return ['Still In Warranty','Work In Progress','Waiting for Spare Parts','Under Supplier Review'].includes(status);
}
function warrantyIsScrappedStatus(status){
  return ['Failed To Resolve','Scrapped by QC'].includes(status);
}
function warrantyIsReturnedStatus(status){
  return ['Resolved','Repaired & Returned'].includes(status);
}
function activeWarrantyRecords(){
  return (STATE.warrantyRecords||[]).filter(w=>warrantyIsActiveStatus(w.status));
}
function warrantyAnalyticsSummary(){
  const records=STATE.warrantyRecords||[];
  const active=records.filter(w=>warrantyIsActiveStatus(w.status));
  const scrapped=records.filter(w=>warrantyIsScrappedStatus(w.status));
  const returned=records.filter(w=>warrantyIsReturnedStatus(w.status));
  const byWarehouse={},byBrand={},byCategory={},byStatus={};
  records.forEach(w=>{
    const wh=warrantyWarehouse(w); byWarehouse[wh]=(byWarehouse[wh]||0)+1;
    const brand=w.model||'Unknown'; byBrand[brand]=(byBrand[brand]||0)+1;
    const cat=w.failureCategory||'Unspecified'; byCategory[cat]=(byCategory[cat]||0)+1;
    const st=w.status||'Unspecified'; byStatus[st]=(byStatus[st]||0)+1;
  });
  return {total:records.length,active:active.length,scrapped:scrapped.length,returned:returned.length,byWarehouse,byBrand,byCategory,byStatus};
}

/* ==================== QUALITY ANALYTICS — FPY charts, inventory charts, Excel export ==================== */
 
function monthKey(dateStr){ return (dateStr||'').slice(0,7); }
function yearKey(dateStr){ return (dateStr||'').slice(0,4); }
function weekKey(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  const day = (d.getUTCDay()+6)%7; // Monday=0
  d.setUTCDate(d.getUTCDate()-day+3); // nearest Thursday
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const weekNum = 1 + Math.round(((d-firstThursday)/86400000 - 3 + ((firstThursday.getUTCDay()+6)%7))/7);
  return `${d.getUTCFullYear()}-W${String(weekNum).padStart(2,'0')}`;
}
function cssVar(name){ return (getComputedStyle(document.documentElement).getPropertyValue(name)||'').trim() || '#888'; }
/* ---- YTD / MTD / WTD range helpers — every analytics number below can be recomputed for any of
   these rolling periods so the Quality Engineer always sees "as of today" figures. ---- */
function inYTD(dateStr){ return dateStr && yearKey(dateStr)===yearKey(todayStr()); }
function inMTD(dateStr){ return dateStr && monthKey(dateStr)===monthKey(todayStr()); }
function inWTD(dateStr){ return dateStr && weekKey(dateStr)===weekKey(todayStr()); }
function inToday(dateStr){ return dateStr===todayStr(); }
function ppmRating(nonConforming, total){ return total>0 ? Math.round((nonConforming/total)*1000000) : 0; }
 
function fpyStats(){
  const closed = STATE.omRecords.filter(r=>r.status.startsWith('CLOSED'));
  const total = closed.length;
  const firstPass = closed.filter(r=>r.capaCycles===0 && r.finalDisposition==='PASS').length;
  const overallFPY = total>0 ? (firstPass/total*100) : 0;
  const byPlatform = {};
  closed.forEach(r=>{
    const p = r.model || 'Unknown';
    if(!byPlatform[p]) byPlatform[p] = {total:0, firstPass:0};
    byPlatform[p].total++;
    if(r.capaCycles===0 && r.finalDisposition==='PASS') byPlatform[p].firstPass++;
  });
  const byMonth = {};
  closed.forEach(r=>{
    const mk = monthKey(r.closedAt ? r.closedAt.slice(0,10) : r.dateReceived);
    if(!byMonth[mk]) byMonth[mk] = {total:0, firstPass:0};
    byMonth[mk].total++;
    if(r.capaCycles===0 && r.finalDisposition==='PASS') byMonth[mk].firstPass++;
  });
  const byDay = {};
  closed.forEach(r=>{
    const dk = (r.closedAt ? r.closedAt.slice(0,10) : r.dateReceived);
    if(!byDay[dk]) byDay[dk] = {total:0, firstPass:0};
    byDay[dk].total++;
    if(r.capaCycles===0 && r.finalDisposition==='PASS') byDay[dk].firstPass++;
  });
  const byWeek = {};
  closed.forEach(r=>{
    const wk = weekKey(r.closedAt ? r.closedAt.slice(0,10) : r.dateReceived);
    if(!wk) return;
    if(!byWeek[wk]) byWeek[wk] = {total:0, firstPass:0};
    byWeek[wk].total++;
    if(r.capaCycles===0 && r.finalDisposition==='PASS') byWeek[wk].firstPass++;
  });
  const byIssue = {};
  closed.forEach(r=>{
    const flagged = ISSUE_ITEMS.filter(([k])=> r.stage1 && r.stage1.issues && r.stage1.issues[k]).map(([,l])=>l);
    const list = flagged.length ? flagged : ['No Issue Flagged'];
    list.forEach(label=>{
      if(!byIssue[label]) byIssue[label] = {total:0, firstPass:0};
      byIssue[label].total++;
      if(r.capaCycles===0 && r.finalDisposition==='PASS') byIssue[label].firstPass++;
    });
  });
  const byPerson = {};
  closed.forEach(r=>{
    const person = (r.stage2 && r.stage2.technician) || 'Unassigned';
    if(!byPerson[person]) byPerson[person] = {total:0, firstPass:0};
    byPerson[person].total++;
    if(r.capaCycles===0 && r.finalDisposition==='PASS') byPerson[person].firstPass++;
  });
  const bySection = {};
  closed.forEach(r=>{
    const section = 'Stage 2 Repair ('+(r.stage2 && r.stage2.sopRef ? r.stage2.sopRef.split(':')[0] : 'No SOP')+')';
    if(!bySection[section]) bySection[section] = {total:0, firstPass:0};
    bySection[section].total++;
    if(r.capaCycles===0 && r.finalDisposition==='PASS') bySection[section].firstPass++;
  });
  return { overallFPY, total, firstPass, byPlatform, byMonth, byWeek, byDay, byIssue, byPerson, bySection };
}
/* ---- Rolling-period analytics (Today / WTD / MTD / YTD): FPY, PPM, NCM, and defect-category
   (supplier vs non-supplier) counts — all recomputed live from STATE.omRecords on every render,
   so any new intake, repair, or QC disposition immediately shifts these numbers. ---- */
function periodBucket(records, predicate){
  const closed = records.filter(r=>r.status.startsWith('CLOSED') && predicate(r.closedAt ? r.closedAt.slice(0,10) : r.dateReceived));
  const total = closed.length;
  const firstPass = closed.filter(r=>r.capaCycles===0 && r.finalDisposition==='PASS').length;
  const nonConforming = closed.filter(r=>r.finalDisposition==='SCRAPPED' || r.capaCycles>0).length;
  let supplierDefects = 0, nonSupplierDefects = 0;
  closed.forEach(r=>{
    const cats = recordDefectCategories(r.stage1 && r.stage1.issues);
    if(cats.has('Supplier')) supplierDefects++;
    if(cats.has('Non-Supplier')) nonSupplierDefects++;
  });
  return {
    total, firstPass, nonConforming,
    fpy: total>0 ? (firstPass/total*100) : 0,
    ppm: ppmRating(nonConforming, total),
    ncmRate: total>0 ? (nonConforming/total*100) : 0,
    supplierDefects, nonSupplierDefects,
  };
}
function computePeriodAnalytics(){
  const recs = STATE.omRecords;
  return {
    today: periodBucket(recs, inToday),
    wtd: periodBucket(recs, inWTD),
    mtd: periodBucket(recs, inMTD),
    ytd: periodBucket(recs, inYTD),
  };
}
/* Daily defect-category counts (Supplier vs Non-Supplier) for the last N closed days — feeds the
   "defect category daily supplier / non-supplier" chart. */
function defectCategoryByDay(days=30){
  const closed = STATE.omRecords.filter(r=>r.status.startsWith('CLOSED'));
  const byDay = {};
  closed.forEach(r=>{
    const dk = r.closedAt ? r.closedAt.slice(0,10) : r.dateReceived;
    if(!byDay[dk]) byDay[dk] = { supplier:0, nonSupplier:0 };
    const cats = recordDefectCategories(r.stage1 && r.stage1.issues);
    if(cats.has('Supplier')) byDay[dk].supplier++;
    if(cats.has('Non-Supplier')) byDay[dk].nonSupplier++;
  });
  const dates = Object.keys(byDay).sort().slice(-days);
  return { dates, byDay };
}
function warrantySummaryStats(){
  const recs = STATE.warrantyRecords;
  const active = recs.filter(w=>warrantyIsActiveStatus(w.status));
  const scrapped = recs.filter(w=>warrantyIsScrappedStatus(w.status));
  const repaired = recs.filter(w=>warrantyIsReturnedStatus(w.status));
  const withDate = key => recs.filter(w=>key(w.dateEscalated));
  return {
    total: recs.length, active: active.length, scrapped: scrapped.length, repaired: repaired.length,
    ppm: null,
    today: withDate(inToday).length, wtd: withDate(inWTD).length, mtd: withDate(inMTD).length, ytd: withDate(inYTD).length,
  };
}
function newBatteryFpyStats(){
  const rows = newBatteryFpyByDay();
  const totalHealthy = STATE.dailyStockRecords.reduce((a,r)=>a+(parseInt(r.healthy)||0),0);
  const totalQI = STATE.dailyStockRecords.reduce((a,r)=>a+(parseInt(r.qualityIssues)||0),0);
  const overall = (totalHealthy+totalQI)>0 ? (totalHealthy/(totalHealthy+totalQI)*100) : 0;
  return { rows, overall, totalHealthy, totalQI };
}
 
/* ---- Chart.js config builders (theme-aware colors pulled from CSS vars) ---- */
function chartBaseOptions(opts={}){
  const textColor = cssVar('--muted');
  const gridColor = cssVar('--line');
  return {
    responsive:true, maintainAspectRatio:false,
    animation: { duration: 500, easing: 'easeOutCubic' },
    plugins:{ legend:{ display: !!opts.legend, position:'bottom', labels:{color:textColor, font:{size:11}, boxWidth:12} } },
    scales: opts.noScales ? {} : {
      x:{ ticks:{color:textColor, font:{size:10}}, grid:{color:gridColor}, stacked: !!opts.stacked },
      y:{ ticks:{color:textColor, font:{size:10}, callback: v=> (opts.suffix ? v+opts.suffix : v)}, grid:{color:gridColor}, suggestedMax: opts.suggestedMax, beginAtZero:true, stacked: !!opts.stacked }
    }
  };
}
function baseBarConfig(labels, datasets, opts={}){
  return { type:'bar', data:{ labels, datasets: datasets.map(d=>({ label:d.label, data:d.data, backgroundColor:d.color, borderRadius:3, maxBarThickness:46 })) }, options: chartBaseOptions({...opts, legend: datasets.length>1}) };
}
function baseLineConfig(labels, datasets, opts={}){
  return { type:'line', data:{ labels, datasets: datasets.map(d=>({ label:d.label, data:d.data, borderColor:d.color, backgroundColor:d.color, tension:0.3, fill:false, pointRadius:3 })) }, options: chartBaseOptions({...opts, legend: datasets.length>1}) };
}
function basePieConfig(labels, data, colors, opts={}){
  if(labels.length===0 || data.every(v=>!v)){
    return { type:'pie', data:{labels:['No data'], datasets:[{data:[1], backgroundColor:[cssVar('--line-dark')]}]}, options: chartBaseOptions({legend:true, noScales:true}) };
  }
  return { type:'pie', data:{ labels, datasets:[{ data, backgroundColor: colors }] }, options: chartBaseOptions({legend:true, noScales:true, ...opts}) };
}
function chartDateNote(config,title){
  const labels=(config&&config.data&&Array.isArray(config.data.labels))?config.data.labels:[];
  const dateLike=labels.filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(String(x)));
  if(dateLike.length){
    return `Excel/reference period: ${formatNamanveDate(dateLike[0])} — ${formatNamanveDate(dateLike[dateLike.length-1])}`;
  }
  /* Categorical warranty charts are tied to the shared warranty workbook reference period. */
  if(/Warranty/i.test(title)) return 'Warranty Excel reference: 10 Jul 2026 — 25 Sep 2026 · Kyebando Warehouse';
  if(/Namanve|Daily Stock|Stock In|Stock Out|Movement/i.test(title)) return 'Namanve Inventory Tracker reference: through 25 Sep 2026';
  return 'Analysis date: live records loaded in the application';
}
function chartCard(title, config){
  const card = el('div',{class:'chart-card'});
  card.appendChild(el('h3',{},title));
  card.appendChild(el('div',{class:'chart-source-date'},chartDateNote(config,title)));
  const wrap = el('div',{class:'chart-wrap'});
  const canvas = el('canvas');
  wrap.appendChild(canvas);
  card.appendChild(wrap);
  pendingCharts.push({canvas, config, title});
  return card;
}

window.addEventListener('resize', ()=>{
  document.querySelectorAll('.chart-wrap canvas').forEach(canvas=>{
    if(typeof Chart!=='undefined'){
      try{
        const c=Chart.getChart(canvas);
        if(c) c.resize();
      }catch(e){}
    }
  });
});

/* ---- Daily analysis: combined FPY % and PPM trend on the same day axis ---- */
function dailyAnalysisConfig(){
  const closed = STATE.omRecords.filter(r=>r.status.startsWith('CLOSED'));
  const byDay = {};
  closed.forEach(r=>{
    const dk = r.closedAt ? r.closedAt.slice(0,10) : r.dateReceived;
    if(!byDay[dk]) byDay[dk] = { total:0, firstPass:0, nonConforming:0 };
    byDay[dk].total++;
    if(r.capaCycles===0 && r.finalDisposition==='PASS') byDay[dk].firstPass++;
    if(r.finalDisposition==='SCRAPPED' || r.capaCycles>0) byDay[dk].nonConforming++;
  });
  const days = Object.keys(byDay).sort().slice(-30);
  if(days.length===0) return baseLineConfig(['No data'], [{label:'FPY %', data:[0], color:cssVar('--pass')}], {suggestedMax:100, suffix:'%'});
  const fpyData = days.map(d=> byDay[d].total ? (byDay[d].firstPass/byDay[d].total*100) : 0);
  const ppmData = days.map(d=> ppmRating(byDay[d].nonConforming, byDay[d].total) / 10000); // scaled to 0-100 band for shared axis
  return baseLineConfig(days, [
    { label:'FPY %', data: fpyData, color: cssVar('--pass') },
    { label:'PPM (÷10,000 for scale)', data: ppmData, color: cssVar('--fail') },
  ], {suggestedMax:100, suffix:'%'});
}

function newBatteryFpyByWeekConfig(){
  const rows = [...STATE.dailyStockRecords].sort((a,b)=>a.date.localeCompare(b.date));
  const byWeek = {};
  rows.forEach(r=>{
    const wk = weekKey(r.date);
    if(!wk) return;
    const healthy = parseInt(r.healthy)||0, qi = parseInt(r.qualityIssues)||0;
    if(!byWeek[wk]) byWeek[wk] = {healthy:0, qi:0};
    byWeek[wk].healthy += healthy; byWeek[wk].qi += qi;
  });
  const weeks = Object.keys(byWeek).sort().slice(-16);
  if(weeks.length===0) return baseLineConfig(['No data'], [{label:'New Battery FPY %', data:[0], color:cssVar('--warn')}], {suggestedMax:100, suffix:'%'});
  const data = weeks.map(w=>{ const s=byWeek[w]; const denom=s.healthy+s.qi; return denom>0 ? (s.healthy/denom*100) : 0; });
  return baseLineConfig(weeks, [{label:'New Battery FPY %', data, color: cssVar('--warn')}], {suggestedMax:100, suffix:'%'});
}

    else if(c===2) buckets['2']++;
    else buckets['3+']++;
  });
  return baseBarConfig(Object.keys(buckets), [{label:'Packs', data:Object.values(buckets), color: cssVar('--capa')}], {});
}

/* ---- Reliable report delivery layer ---------------------------------------------------------
   Keeps the normal XLSX report when SheetJS is available, but guarantees a usable native
   compatibility download when the browser is offline, the CDN is blocked, or a mobile browser
   refuses an asynchronous workbook download. The operational data/model is unchanged. */
const BQC_REPORT_TIMEOUT_MS = 7000;
const BQC_EXPORT_REFRESH_TIMEOUT_MS = 4500;
let BQC_REPORT_WARM_PROMISE = null;

function bqcWithTimeout(promise, ms, label='Operation timed out'){
  let timer;
  return Promise.race([
    Promise.resolve(promise),
    new Promise((_,reject)=>{ timer=setTimeout(()=>reject(new Error(label)),ms); })
  ]).finally(()=>clearTimeout(timer));
}

function bqcNativeDownloadBlob(blob, filename){
  try{
    if(navigator && typeof navigator.msSaveOrOpenBlob==='function'){
      navigator.msSaveOrOpenBlob(blob, filename); return true;
    }
  }catch(e){}
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; a.rel='noopener'; a.style.display='none';
  document.body.appendChild(a);
  try{ a.click(); }catch(e){
    try{ window.open(url,'_blank','noopener,noreferrer'); }catch(_e){}
  }
  setTimeout(()=>{try{a.remove();}catch(e){} try{URL.revokeObjectURL(url);}catch(e){}},60000);
  return true;
}

function bqcEscapeHtml(v){
  return String(v??'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function bqcEscapeCsv(v){
  const s=String(v??'');
  return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

    const rows=getExportRows(key,label,fn);
    html+='<h2>'+bqcEscapeHtml(label)+'</h2><div class="wrap"><table>';
    if(rows && rows.length){
      const headers=Array.from(new Set(rows.flatMap(r=>Object.keys(r||{}))));
      html+='<thead><tr>'+headers.map(h=>'<th>'+bqcEscapeHtml(h)+'</th>').join('')+'</tr></thead><tbody>';
      rows.forEach(r=>{ html+='<tr>'+headers.map(h=>'<td>'+bqcEscapeHtml(r?.[h])+'</td>').join('')+'</tr>'; });
      html+='</tbody>';
    }else html+='<tbody><tr><td>No data recorded</td></tr></tbody>';
    html+='</table></div>';
  });
  html+='</body></html>';
  return html;
}
function bqcCompatibilityCsv(chosen){
  const out=[];
  chosen.forEach(([key,label,fn])=>{
    const rows=getExportRows(key,label,fn);
    out.push([`SHEET: ${label}`].map(bqcEscapeCsv).join(','));
    if(rows.length){
      const headers=Array.from(new Set(rows.flatMap(r=>Object.keys(r||{}))));
      out.push(headers.map(bqcEscapeCsv).join(','));
      rows.forEach(r=>out.push(headers.map(h=>bqcEscapeCsv(r?.[h])).join(',')));
    }else out.push('No data recorded');
    out.push('');
  });
  return '\ufeff'+out.join('\r\n');
}

function bqcWarmReportLibrary(){
  if(BQC_REPORT_WARM_PROMISE) return BQC_REPORT_WARM_PROMISE;
  const start=()=>{
    if(BQC_REPORT_WARM_PROMISE) return BQC_REPORT_WARM_PROMISE;
    BQC_REPORT_WARM_PROMISE=bqcWithTimeout(ensureXlsxLibrary(),BQC_REPORT_TIMEOUT_MS,'Excel library timed out')
      .catch(e=>{ console.warn('Excel library warm-up skipped:',e.message); return null; });
    return BQC_REPORT_WARM_PROMISE;
  };
  if('requestIdleCallback' in window) window.requestIdleCallback(start,{timeout:2500});
  else setTimeout(start,1200);
  return BQC_REPORT_WARM_PROMISE || Promise.resolve(null);
}

async function bqcGetXlsx(){
  if(window.XLSX) return window.XLSX;
  return await bqcWithTimeout(ensureXlsxLibrary(),BQC_REPORT_TIMEOUT_MS,'Excel library could not be loaded');
}

async function bqcDownloadReport(chosen, filename){
  if(!chosen.length) throw new Error('Select at least one sheet to download.');
  await bqcRefreshForExportBounded();
  await new Promise(r=>requestAnimationFrame(r));
  try{
    const XLSXlib=await bqcGetXlsx();
    if(!XLSXlib) throw new Error('Excel library unavailable');
    const wb=XLSXlib.utils.book_new();
    chosen.forEach(([key,label,fn])=>{
      XLSXlib.utils.book_append_sheet(wb,XLSXlib.utils.json_to_sheet(getExportRows(key,label,fn)),label.slice(0,31));
    });
    const data=XLSXlib.write(wb,{bookType:'xlsx',type:'array',compression:false});
    bqcNativeDownloadBlob(new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),filename);
    return {kind:'xlsx',filename};
  }catch(xlsxError){
    console.warn('XLSX report path unavailable; using native compatibility report:',xlsxError);
    const html=bqcCompatibilityWorkbook(chosen);
    const compatName=filename.replace(/\.xlsx$/i,'-compatibility.xls');
    bqcNativeDownloadBlob(new Blob([html],{type:'application/vnd.ms-excel;charset=utf-8'}),compatName);
    return {kind:'compatibility',filename:compatName};
  }
}

/* ---------- Live docket refresh ----------
   Polls the shared store in the background and re-renders the docket list so a battery sent
   from Stage 1 appears for a Stage 2 technician without them having to sign out and back in.
   Skips refreshing while the user is actively typing so it never yanks focus mid-entry, and only
   re-renders when the fetched data actually differs from what's on screen — so a poll that finds
   nothing new causes no re-render, no animation replay, and no visible "blink" at all. When a
   render IS needed because something changed, entrance animations are suppressed for that single
   render pass so the update lands quietly instead of flashing. */
function userIsTypingInForm(){
  const active = document.activeElement;
  if(!active || !root.contains(active)) return false;
  const tag = active.tagName;
  return tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT';
}
function omRecordsChanged(fresh){
  try{ return JSON.stringify(fresh) !== JSON.stringify(STATE.omRecords); }
  catch(e){ return true; }
}
function silentRender(){
  document.body.classList.add('silent-refresh');
  render();
  // Give the browser two frames to paint with animations off before restoring them, so the
  // suppressed state actually applies to this render's paint instead of the next one.
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{ document.body.classList.remove('silent-refresh'); });
  });
}
function overlayIsOpen(){
  return !!(STATE.batteryModalId || STATE.chartModal);
}

function liveStoreSnapshot(){
  const snapshot={};
  visibleStoreKeys().forEach(key=>{
    const stateKey=STORE_STATE_KEYS[key];
    snapshot[key]=stateKey ? STATE[stateKey] : [];
  });
  return snapshot;
}

let BQC_REFRESH_IN_FLIGHT=false;
async function autoRefreshDocket(){
  /* Fast background synchronization, but never a forced repaint while the user is
     actively working. The screen is only redrawn when the underlying data changed. */
  if(BQC_REFRESH_IN_FLIGHT) return;
  BQC_REFRESH_IN_FLIGHT=true;
  if(STATE?.intakeSaving) return;
  if(STATE?.openId) return;
  if(userIsTypingInForm()) return;
  if(STATE?.role==='omtech' && STATE?.stage===1 && draftHasUserData(STATE.intakeDraft)){
    const beforeDraft=stableStr(STATE.intakeDraft);
    await loadStoresIntoState(visibleStoreKeys());
    if(beforeDraft!==stableStr(STATE.intakeDraft)){
      const restored=loadIntakeDraftLocal(STATE.techName);
      if(restored) STATE.intakeDraft=restored;
    }
    return;
  }
  try{
    const before=liveStoreSnapshot();
    await loadStoresIntoState(visibleStoreKeys());
    const after=liveStoreSnapshot();
    const changed=visibleStoreKeys().some(key=>visibleStateChanged(before[key],after[key]));
    STATE.omSyncOk=true;
    STATE.omLastRefreshed=nowTime();
    STATE.globalLastRefreshed=nowTime();
    if(changed && !overlayIsOpen()) silentRender();
  }catch(e){
    console.error('Auto-refresh failed', e);
    STATE.omSyncOk=false;
    STATE.globalSyncError=e.message||'Live refresh failed';
  }finally{
    BQC_REFRESH_IN_FLIGHT=false;
  }
}
/* Keep shared data fresh without making the UI feel like it is constantly refreshing. */
setInterval(autoRefreshDocket, 4000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !userIsTypingInForm()) autoRefreshDocket(); });

    restoreBqcNavigationState(s.user);

    const hydrate=async()=>{

/* ---------- Pointer-reactive cylindrical battery motion ---------- */
(function initBatteryMotion(){
  const scene=document.getElementById('ambient-scene'); if(!scene)return;
  let raf=0,tx=0,ty=0,x=0,y=0;
  const label=document.getElementById('motion-label');
  let lastFrame=0;
  function frame(ts){
    if(document.hidden){ raf=0; return; }
    const interval=coarse?33:20;
    if(ts-lastFrame < interval){ raf=requestAnimationFrame(frame); return; }
    lastFrame=ts;
    x+=(tx-x)*.09;y+=(ty-y)*.09;
    document.documentElement.style.setProperty('--px',x.toFixed(4));
    document.documentElement.style.setProperty('--py',y.toFixed(4));
    const ax=Math.abs(x),ay=Math.abs(y);let view='equilibrium';
    if(ax>.55&&ay<.45)view=x<0?'field sweep · left':'field sweep · right';
    else if(ay>.55&&ax<.55)view=y<0?'flux view · top':'thermal view · bottom';
    else if(ax>.35||ay>.35)view='energy flow · oblique';
    if(label)label.textContent='energy field · '+view;
    raf=requestAnimationFrame(frame);
  }
  window.addEventListener('pointermove',e=>{tx=Math.max(-1,Math.min(1,(e.clientX/innerWidth-.5)*2));ty=Math.max(-1,Math.min(1,(e.clientY/innerHeight-.5)*2));},{passive:true});
  window.addEventListener('pointerleave',()=>{tx=0;ty=0;},{passive:true});
  window.addEventListener('blur',()=>{tx=0;ty=0;});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){ if(raf) cancelAnimationFrame(raf); raf=0; }
    else if(!raf) raf=requestAnimationFrame(frame);
  },{passive:true});
  raf=requestAnimationFrame(frame);
})();

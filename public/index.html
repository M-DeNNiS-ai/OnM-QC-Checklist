<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Battery QC — Server</title>
<style>
:root {
  --bg: #f8f9fa;
  --panel: #ffffff;
  --panel2: #f1f3f5;
  --line: #e9ecef;
  --line-dark: #ced4da;
  --text: #111827;
  --muted: #6b7280;
  --accent: #0f172a;
  --pass: #15803d;
  --pass-bg: #f0fdf4;
  --fail: #b91c1c;
  --fail-bg: #fef2f2;
  --warn: #c2410c;
  --warn-bg: #fff7ed;
  --capa: #7c3aed;
  --capa-bg: #f5f3ff;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}
 
[data-theme="dark"] {
  --bg: #0f172a;
  --panel: #1e293b;
  --panel2: #334155;
  --line: #334155;
  --line-dark: #475569;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --pass: #4ade80;
  --pass-bg: rgba(74, 222, 128, 0.1);
  --fail: #f87171;
  --fail-bg: rgba(248, 113, 113, 0.1);
  --warn: #fb923c;
  --warn-bg: rgba(251, 146, 60, 0.1);
  --capa: #c4b5fd;
  --capa-bg: rgba(196, 181, 253, 0.12);
}
 
* { box-sizing: border-box; }
 
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
 
.app { max-width: 1100px; margin: 0 auto; padding: 16px; }
 
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--panel); border: 1px solid var(--line-dark);
  border-radius: 4px; margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
  position: relative; overflow: hidden;
}
.header::before{
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background: linear-gradient(90deg, var(--accent), var(--pass), var(--capa), var(--warn), var(--accent));
  background-size: 300% 100%;
  animation: gradientMove 7s ease infinite;
}
.brand h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: 0.2px; color: var(--text); }
.brand p { margin: 0; font-size: 11px; color: var(--muted); }
 
.user-info { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.badge {
  padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; background: var(--panel2); border: 1px solid var(--line-dark); color: var(--text);
}
 
button {
  font-family: var(--font-sans); cursor: pointer; border: 1px solid var(--line-dark);
  background: var(--panel); color: var(--text); border-radius: 3px;
  padding: 6px 12px; font-size: 12px; font-weight: 600;
  transition: transform .1s ease, box-shadow .12s ease, background-color .12s ease, opacity .12s ease;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
button:hover:not(:disabled) { background: var(--panel2); transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,.08); }
button:active:not(:disabled) { transform: translateY(0); box-shadow:none; }
button:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover:not(:disabled) { opacity: 0.92; background: var(--accent); }
.btn-danger { background: var(--fail-bg); border-color: var(--fail); color: var(--fail); }
.btn-danger:hover:not(:disabled) { background: var(--fail); color: #fff; }
.btn-capa { background: var(--capa-bg); border-color: var(--capa); color: var(--capa); }
.btn-capa:hover:not(:disabled) { background: var(--capa); color: #fff; }
.btn-sm { padding: 3px 8px; font-size: 11px; }
.btn-block { width: 100%; }
 
.spinner{
  width:11px; height:11px; border-radius:50%;
  border: 2px solid currentColor; border-right-color: transparent; border-bottom-color: transparent;
  display:inline-block; opacity:.85; animation: spin .6s linear infinite;
}
 
.theme-toggle select {
  padding: 3px 6px; font-size: 11px; border-radius: 3px; background: var(--panel);
  color: var(--text); border: 1px solid var(--line-dark); font-family: var(--font-sans);
}
 
.gate {
  max-width: 380px; margin: 10vh auto 0; padding: 24px;
  background: var(--panel); border: 1px solid var(--line-dark); border-radius: 4px;
  animation: fadeInUp .3s ease;
}
.gate h2 { margin-top: 0; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.gate p { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
.pin-hint { font-size: 10px; color: var(--muted); margin-top: 4px; }
 
.nav { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line-dark); padding-bottom: 8px; flex-wrap: wrap; align-items: center; }
.nav button { background: transparent; color: var(--muted); border: none; border-radius: 3px; font-size: 12px; font-weight: 600; padding: 6px 12px; }
.nav button.active { background: var(--panel2); color: var(--text); font-weight: 700; }
.nav button:hover:not(.active) { color: var(--text); }
 
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; margin-bottom: 12px;
  transition: box-shadow .15s ease; }
.card h3 { margin: 0 0 2px; font-size: 13px; font-weight: 700; color: var(--text); }
.card .sub { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
 
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 12px; }
.grid.narrow { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
 
label { display: block; font-size: 10px; font-weight: 700; color: var(--muted); margin: 8px 0 4px; text-transform: uppercase; letter-spacing: 0.3px; }
input, select, textarea {
  width: 100%; padding: 6px 8px; background: var(--panel); color: var(--text);
  border: 1px solid var(--line-dark); border-radius: 3px; font-size: 12px; font-family: var(--font-sans);
  transition: border-color .12s ease, box-shadow .12s ease;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
textarea { resize: vertical; min-height: 50px; }
.id-textarea { min-height: 72px; font-size: 11px; }
.id-count { font-size: 10px; color: var(--muted); margin-top: 4px; font-weight: 600; }
.id-count.ok { color: var(--pass); }
.id-count.over { color: var(--warn); }
 
.banner {
  padding: 8px 12px; border-radius: 3px; font-size: 11px; margin-bottom: 12px;
  border: 1px solid var(--warn); background: var(--warn-bg); color: var(--warn); font-weight: 600;
  animation: toastIn .2s ease;
}
.banner.ok { border-color: var(--pass); background: var(--pass-bg); color: var(--pass); }
.banner.capa { border-color: var(--capa); background: var(--capa-bg); color: var(--capa); }
.banner.err { border-color: var(--fail); background: var(--fail-bg); color: var(--fail); }
 
.check-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.check-row:last-child { border-bottom: none; }
.check-row span { font-size: 12px; }
 
.seg { display: flex; border: 1px solid var(--line-dark); border-radius: 3px; overflow: hidden; }
.seg button { border-radius: 0; padding: 2px 8px; font-size: 10px; background: var(--panel); color: var(--muted); border: none; border-right: 1px solid var(--line-dark); }
.seg button:hover:not(:disabled){ transform:none; box-shadow:none; }
.seg button:last-child { border-right: none; }
.seg button.sel-pass { background: var(--pass-bg); color: var(--pass); font-weight: 700; }
.seg button.sel-fail { background: var(--fail-bg); color: var(--fail); font-weight: 700; }
.seg button.sel-na { background: var(--panel2); color: var(--text); }
 
.bool-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.bool-row input { width: 14px; height: 14px; margin: 0; cursor: pointer; accent-color: var(--accent); }
.bool-row label { margin: 0; color: var(--text); font-size: 12px; text-transform: none; font-weight: 400; cursor: pointer; }
 
.status-chip {
  display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 700; text-transform: uppercase;
}
.status-chip.PASS, .status-chip.CLOSED_PASS { background: var(--pass-bg); color: var(--pass); border: 1px solid var(--pass); }
.status-chip.FAIL, .status-chip.CLOSED_SCRAPPED { background: var(--fail-bg); color: var(--fail); border: 1px solid var(--fail); }
.status-chip.INCOMPLETE, .status-chip.NA, .status-chip.PENDING { background: var(--panel2); color: var(--muted); border: 1px solid var(--line-dark); }
.status-chip.CAPA { background: var(--capa-bg); color: var(--capa); border: 1px solid var(--capa); }
.status-chip.OPEN { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
 
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
.stat { background: var(--panel); border: 1px solid var(--line-dark); border-radius: 4px; padding: 12px; transition: transform .15s ease, box-shadow .15s ease; }
.stat:hover { transform: translateY(-2px); box-shadow: 0 3px 10px rgba(0,0,0,.06); }
.stat .n { font-size: 20px; font-weight: 700; color: var(--text); }
.stat .l { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
 
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 10px; background: var(--panel2); position: sticky; top: 0; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line-dark); border-radius: 3px; background: var(--panel); }
tr { transition: background-color .1s ease; }
tr:hover td { background: var(--panel2); }
.mono { font-family: var(--font-mono); }
 
.footer-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; border-top: 1px solid var(--line-dark); align-items:center; }
.err { color: var(--fail); font-size: 11px; margin-top: 6px; }
.sop-box { background: var(--panel2); border: 1px solid var(--line-dark); padding: 8px 12px; border-radius: 3px; margin-bottom: 12px; font-size: 11px; }
.docket-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); animation: fadeInUp .2s ease; }
.docket-item:last-child { border-bottom: none; }
.docket-item .meta { font-size: 11px; color: var(--muted); }
.empty-note { padding: 12px 0; color: var(--muted); font-size: 12px; }
.sector-tag {
  display: inline-block; padding: 3px 8px; border-radius: 3px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 12px; border: 1px solid var(--line-dark);
  background: var(--panel2); color: var(--muted);
}
.chart-card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; margin-bottom: 12px; animation: fadeInUp .3s ease; }
.chart-card .chart-wrap { position: relative; height: 260px; }
.chart-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.sync-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; background: var(--pass); animation: pulseDot 2.4s ease-in-out infinite; }
.sync-dot.bad { background: var(--fail); animation: none; }
.sync-line { font-size: 10px; color: var(--muted); display:flex; align-items:center; }
.server-badge{font-size:10px;color:var(--muted);margin-top:3px;}
 
.boot-loader{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:9999; }
.boot-card{ text-align:center; }
.boot-spinner{ width:30px; height:30px; border-radius:50%; border:3px solid var(--line-dark); border-top-color:var(--accent); margin:0 auto 10px; animation: spin .7s linear infinite; }
.boot-text{ font-size:12px; color:var(--muted); }
 
@keyframes fadeInUp { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform:translateY(0);} }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulseDot { 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.5; transform:scale(1.3);} }
@keyframes toastIn { from{ opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
@keyframes gradientMove { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
@keyframes viewFade { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
@keyframes popIn { from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);} }
@keyframes softBounce { 0%{transform:scale(1);} 40%{transform:scale(1.06);} 100%{transform:scale(1);} }
 
.view-fade { animation: viewFade .28s cubic-bezier(.2,.7,.3,1); }
.nav button { transition: background-color .15s ease, color .15s ease, transform .1s ease; }
.nav button.active { animation: softBounce .3s ease; }
.card, .chart-card, .stat { animation: fadeInUp .28s cubic-bezier(.2,.7,.3,1) both; }
.docket-item, .check-row, tbody tr { animation: fadeInUp .22s ease both; }
.docket-item:nth-child(n) { animation-delay: calc(var(--i, 0) * 25ms); }
input, select, textarea, button { transition: transform .1s ease, box-shadow .12s ease, background-color .12s ease, border-color .12s ease, opacity .12s ease; }
button:active:not(:disabled) { animation: none; transform: scale(.97); }
.reminder-banner{
  padding:10px 12px; border-radius:4px; font-size:12px; font-weight:600; margin-bottom:12px;
  background: var(--warn-bg); color: var(--warn); border:1px solid var(--warn);
  display:flex; align-items:center; gap:8px; animation: popIn .3s ease, pulseDot 2.6s ease-in-out infinite;
}
.day-log-item{ border:1px solid var(--line-dark); border-radius:4px; padding:10px 12px; margin-bottom:8px; animation: fadeInUp .22s ease both; }
.day-log-item.closed{ opacity:.7; }
.export-check-row{ display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); font-size:12px; }
.export-check-row input{ width:14px; height:14px; margin:0; accent-color:var(--accent); cursor:pointer; }
.export-check-row label{ margin:0; text-transform:none; font-weight:400; color:var(--text); font-size:12px; cursor:pointer; }
.preview-scroll{ max-height:220px; overflow:auto; border:1px solid var(--line-dark); border-radius:3px; }
.kpi-pulse{ animation: softBounce .5s ease; }
</style>
</head>
<body>
<div id="boot-loader" class="boot-loader">
  <div class="boot-card">
    <div class="boot-spinner"></div>
    <div class="boot-text">Connecting to Battery QC server…</div>
  </div>
</div>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ---------- Theme ---------- */
let currentTheme = localStorage.getItem('bqc_theme') || 'light';
document.documentElement.setAttribute('data-theme', currentTheme);
function setTheme(theme) {
  currentTheme = theme;
  localStorage.setItem('bqc_theme', theme);
  document.documentElement.setAttribute('data-theme', theme);
  render();
}
 
/* ---------- Credentials ---------- */
const STAGE_LABEL = { 1: 'Stage 1 — Intake & Pre-Check', 2: 'Stage 2 — Repair & Reassembly', 3: 'Stage 3 — Final Test & QC Sign-off' };
const SECTOR_LABEL = { omadmin: 'O&M Manager', plantinv: 'Plant & Inventory', quality: 'Quality Engineer', bsa: 'BSA Engineer' };
const BSA_SOURCES = ['Quality Escalation (O&M Pipeline)','Customer Experience Team Flag','Battery Engineering Team Flag'];
const BSA_STATUSES = ['Open — Awaiting Retrieval','Retrieved','RCA In Progress','RCA Complete','Repaired','Returned to O&M for Deployment','Scrapped'];
const NAMANVE_STOCK_COLUMNS = [
  ['healthy','Healthy'], ['qualityIssues','Quality Issues'], ['offline','Offline'], ['boxed','Boxed'], ['uncharged','Uncharged'],
  ['batteriesInBikes','Batteries in Bikes'], ['testBatteries','Test Batteries'], ['deployment','Deployment'], ['energy','Energy'],
  ['qualityIssuesOut','Quality Issues Out'], ['returnsHealthy','Returns Healthy'], ['returnsFaulty','Returns Faulty'],
  ['incomingNewHealthy','Incoming New Healthy'], ['incomingHealthyEnergy','Incoming Healthy - Energy'],
];
function computeDailyStockGrandTotal(d){
  const n = k=> parseInt(d[k])||0;
  return n('healthy')+n('qualityIssues')+n('offline')+n('boxed')+n('testBatteries');
}
 
/* ---------- Domain constants ---------- */
const STANDARD_SOPS = [
  "SOP-BAT-01: Housing Opening Protocol",
  "SOP-BAT-02: Cell Balancing & Diagnostics",
  "SOP-BAT-03: BMS Replacement & Firmware Sync",
  "SOP-BAT-04: Insulation Safety Testing",
  "SOP-BAT-05: IoT Rewiring & Flashing",
  "SOP-BAT-06: Charge Port Thermal Servicing"
];
const BMS_MODEL_PREFIXES = [
  { prefix: 'C7245AC2AA', model: 'CBAK' },
  { prefix: 'U7245AU1G1', model: 'UNIQUE' },
  { prefix: 'A7246AX1A1', model: 'AMPACE' },
  { prefix: 'D72451LWK', model: 'GREENWAY' }
];
function detectModelFromBMS(bmsId) {
  if (!bmsId) return '';
  const cleanId = bmsId.trim().toUpperCase();
  const match = BMS_MODEL_PREFIXES.find(p => cleanId.startsWith(p.prefix));
  return match ? match.model : '';
}
 
const CHECK_ITEMS = [
  ['foreignObjects','No Foreign Objects / Cables'],
  ['looseComponents','No Loose Components'],
  ['wiring','Internal Wiring Intact'],
  ['cells','Cells Intact'],
  ['corrosion','No Moisture / Corrosion'],
  ['bmsMount','BMS Board Secure'],
  ['internalDamage','No Internal Damage'],
];
const POST_ITEMS = [
  ['foreignObjects','No Foreign Objects Left Inside'],
  ['looseComponents','No Loose Components'],
  ['wiring','Wiring Reconnected Properly'],
  ['cells','Cells Secure'],
  ['bmsMount','BMS Board Secure'],
  ['seal','Casing Seal Intact'],
  ['fasteners','Fasteners Reinstalled'],
];
const ISSUE_ITEMS = [
  ['noPower','No Power / Offline'],
  ['lowCapacity','Low Capacity / Range'],
  ['cellImbalance','Cell Imbalance'],
  ['bmsFault','BMS Fault / Mismatch'],
  ['canFail','CAN Fail'],
  ['chargeFail','Charge Failure'],
  ['dischargeFail','Discharge Failure'],
  ['swelling','Swelling / Damage'],
  ['irFail','Insulation Failure'],
  ['iotFault','IoT / IMEI Mismatch'],
  ['tampered','Vandalism / Water Ingress'],
  ['connectorDamage','Connector Damage'],
  ['other','Other Issue'],
];
const TEST_BOOLS = [
  ['canEstablished','CAN Established'],
  ['bmsFaultCleared','BMS Fault Cleared'],
  ['chargeVerified','Charge Verified'],
  ['dischargeVerified','Discharge Verified'],
  ['noAbnormal','No Abnormal Behavior'],
];
const PLATFORMS = ['CBAK','UNIQUE','AMPACE','GREENWAY'];
const PLATFORM_META = {
  CBAK: { emoji: '🟡', label: 'CBAK' },
  UNIQUE: { emoji: '🟠', label: 'UNIQUE' },
  AMPACE: { emoji: '🟤', label: 'AMPACE' },
  GREENWAY: { emoji: '🟢', label: 'GREENWAY' },
};
const MOVEMENT_TYPES = [
  ['ISSUED_TO_PLANT','Issued to Plant'],
  ['ISSUED_TO_SWAP_STATION','Issued to Swap Station'],
  ['DAMAGED_ON_ARRIVAL','Damaged on Arrival'],
  ['RETURNED_TO_SUPPLIER','Returned to Supplier'],
  ['CORRECTION_ADD','Stock Correction (Add)'],
  ['CORRECTION_SUB','Stock Correction (Subtract)'],
];
function movementDirection(type){ return (type==='RECEIVED' || type==='CORRECTION_ADD') ? 1 : -1; }
function movementLabel(type){
  if(type==='RECEIVED') return 'Received (New Stock)';
  const f = MOVEMENT_TYPES.find(([k])=>k===type);
  return f ? f[1] : type;
}
 
/* ---------- Server-backed storage ----------
   All persistent data is stored in the backend SQLite database. The browser keeps
   only UI state; records are loaded/saved through authenticated /api/data endpoints.
*/
async function apiFetch(path, options={}){
  const res = await fetch(path, { credentials:'include', headers:{'Content-Type':'application/json', ...(options.headers||{})}, ...options });
  let body=null; try { body=await res.json(); } catch(e) {}
  if(!res.ok){ const msg = body && body.error ? body.error : `Server error (${res.status})`; throw new Error(msg); }
  return body;
}
async function loadStore(key){ try { const r=await apiFetch('/api/data/'+encodeURIComponent(key)); return Array.isArray(r.data)?r.data:[]; } catch(e){ console.error('loadStore failed', key, e); return []; } }
async function saveStore(key,list){ try { await apiFetch('/api/data/'+encodeURIComponent(key), {method:'PUT', body:JSON.stringify({data:list})}); return true; } catch(e){ console.error('saveStore failed', key, e); return false; } }
async function loadOm(){ return loadStore('om_chain_records'); }
async function saveOm(list){ return saveStore('om_chain_records',list); }
async function loadPlant(){ return loadStore('plant_records'); }
async function savePlant(list){ return saveStore('plant_records',list); }
async function loadPlantStock(){ return loadStore('plant_stock_records'); }
async function savePlantStock(list){ return saveStore('plant_stock_records',list); }
async function loadNewBattery(){ return loadStore('new_battery_records'); }
async function saveNewBattery(list){ return saveStore('new_battery_records',list); }
async function loadAdjustments(){ return loadStore('inventory_adjustments'); }
async function saveAdjustments(list){ return saveStore('inventory_adjustments',list); }
async function loadWarranty(){ return loadStore('warranty_records'); }
async function saveWarranty(list){ return saveStore('warranty_records',list); }
async function loadDailyStock(){ return loadStore('daily_stock_records'); }
async function saveDailyStock(list){ return saveStore('daily_stock_records',list); }
async function loadIotGiven(){ return loadStore('iot_given_records'); }
async function saveIotGiven(list){ return saveStore('iot_given_records',list); }
async function loadIotReturned(){ return loadStore('iot_returned_records'); }
async function saveIotReturned(list){ return saveStore('iot_returned_records',list); }

/* ---------- Utilities ---------- */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowTime(){ return new Date().toTimeString().slice(0,5); }
function nowIso(){ return new Date().toISOString(); }
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function parseIdList(text){
  if(!text) return [];
  const parts = text.split(/[\n,]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);
  return Array.from(new Set(parts));
}
 
function checklistResult(map, items){
  const vals = items.map(([k])=>map[k]);
  if(vals.some(v=>v==='FAIL')) return 'FAIL';
  if(vals.some(v=>!v)) return 'INCOMPLETE';
  return 'PASS';
}
function testsResult(d){
  const boolsOk = TEST_BOOLS.every(([k])=>d.testBools[k]===true);
  const ir = parseFloat(d.tests.irMeasured), thr = parseFloat(d.tests.irThreshold);
  const irOk = !isNaN(ir) && !isNaN(thr) ? ir>=thr : null;
  if(!boolsOk || irOk===false) return 'FAIL';
  if(irOk===null) return 'INCOMPLETE';
  return 'PASS';
}
function isImeiRequired(d){ return !!(d.issues.noPower || d.issues.bmsFault || d.issues.iotFault); }
function isSwapStationRequired(d){ return !!(d.issues.tampered || d.issues.swelling || d.pre.foreignObjects==='FAIL' || d.pre.corrosion==='FAIL'); }

/* ---------- Plant bulk stock ledger model ---------- */
function emptyBulkStockDraft(){
  return {
    date: todayStr(),
    enteredBy: '',
    rows: PLATFORMS.map(p=>({
      platform: p, receivedQty:'', receivedIds:'', dispatchedQty:'', dispatchedIds:'',
      _existingReceivedIds:[], _existingDispatchedIds:[],
    })),
  };
}
function findStockRecord(records, date, platform){
  return records.find(r=> r.date===date && r.platform===platform) || null;
}
function buildStockRecordFromRow(existing, date, row, enteredBy, skipIdsSet){
  let newReceivedIds = parseIdList(row.receivedIds);
  let newDispatchedIds = parseIdList(row.dispatchedIds);
  let skippedCount = 0;
  if(skipIdsSet && skipIdsSet.size){
    const beforeR = newReceivedIds.length, beforeD = newDispatchedIds.length;
    newReceivedIds = newReceivedIds.filter(id=>!skipIdsSet.has(id));
    newDispatchedIds = newDispatchedIds.filter(id=>!skipIdsSet.has(id));
    skippedCount = (beforeR-newReceivedIds.length)+(beforeD-newDispatchedIds.length);
  }
  const mergedReceivedIds = existing ? Array.from(new Set([...(existing.receivedIds||[]), ...newReceivedIds])) : newReceivedIds;
  const mergedDispatchedIds = existing ? Array.from(new Set([...(existing.dispatchedIds||[]), ...newDispatchedIds])) : newDispatchedIds;
  const receivedQty = row.receivedQty!=='' ? (parseInt(row.receivedQty)||0) : (existing? existing.receivedQty : 0);
  const dispatchedQty = row.dispatchedQty!=='' ? (parseInt(row.dispatchedQty)||0) : (existing? existing.dispatchedQty : 0);
  const record = {
    id: existing? existing.id : uid(),
    date, platform: row.platform,
    receivedQty, dispatchedQty,
    receivedIds: mergedReceivedIds, dispatchedIds: mergedDispatchedIds,
    enteredBy: enteredBy||(existing?existing.enteredBy:''),
    createdAt: existing? existing.createdAt : nowIso(),
    updatedAt: nowIso(),
  };
  return { record, skippedCount };
}
function computeStockLedger(records){
  const dates = Array.from(new Set(records.map(r=>r.date))).sort();
  const running = {}; PLATFORMS.forEach(p=>running[p]=0);
  const table = [];
  dates.forEach(date=>{
    const rows = PLATFORMS.map(p=>{
      const rec = findStockRecord(records, date, p);
      const opening = running[p];
      const received = rec ? rec.receivedQty : 0;
      const dispatched = rec ? rec.dispatchedQty : 0;
      const closing = opening + received - dispatched;
      running[p] = closing;
      return { platform:p, opening, received, dispatched, closing, rec };
    });
    const totals = rows.reduce((acc,r)=>({
      opening: acc.opening+r.opening, received: acc.received+r.received,
      dispatched: acc.dispatched+r.dispatched, closing: acc.closing+r.closing
    }), {opening:0, received:0, dispatched:0, closing:0});
    table.push({ date, rows, totals });
  });
  return table;
}
function loadDraftForDate(){
  const d = STATE.bulkStockDraft;
  d.rows = PLATFORMS.map(p=>{
    const existing = findStockRecord(STATE.plantStockRecords, d.date, p);

      _existingReceivedIds: existing ? (existing.receivedIds||[]) : [],
      _existingDispatchedIds: existing ? (existing.dispatchedIds||[]) : [],
    };
  });
}

function allIdsForPlatform(records, platform, excludeRecordId){
  const set = new Set();
  records.forEach(r=>{
    if(r.platform!==platform) return;
    if(excludeRecordId && r.id===excludeRecordId) return;
    (r.receivedIds||[]).forEach(id=>set.add(id));
    (r.dispatchedIds||[]).forEach(id=>set.add(id));
  });
  return set;
}
function findDuplicateOpenOmGroups(records){
  const map = {};
  records.forEach(r=>{
    if(r.status.startsWith('CLOSED')) return;
    const key = r.bmsId.trim().toUpperCase();
    if(!map[key]) map[key]=[];
    map[key].push(r);
  });
  return Object.values(map).filter(list=>list.length>1).map(list=>list.slice().sort((a,b)=>a.createdAt.localeCompare(b.createdAt)));
}
function findDuplicateOemIdOccurrences(records){
  const byPlatform = {};
  PLATFORMS.forEach(p=> byPlatform[p] = { received:{}, dispatched:{} });
  records.forEach(r=>{
    (r.receivedIds||[]).forEach(id=>{
      byPlatform[r.platform].received[id] = byPlatform[r.platform].received[id]||[];
      byPlatform[r.platform].received[id].push({date:r.date, recordId:r.id});
    });
    (r.dispatchedIds||[]).forEach(id=>{
      byPlatform[r.platform].dispatched[id] = byPlatform[r.platform].dispatched[id]||[];
      byPlatform[r.platform].dispatched[id].push({date:r.date, recordId:r.id});
    });
  });
  const dups = [];
  PLATFORMS.forEach(p=>{
    ['received','dispatched'].forEach(dir=>{
      Object.entries(byPlatform[p][dir]).forEach(([id,occ])=>{
        if(occ.length>1) dups.push({ platform:p, direction:dir, id, occurrences: occ.slice().sort((a,b)=>a.date.localeCompare(b.date)) });
      });
    });
  });
  return dups;
}
function findDuplicateActiveWarrantyGroups(records){
  const map = {};
  records.forEach(w=>{
    if(w.status==='Scrapped by QC') return;
    const key = w.bmsId.trim().toUpperCase();
    if(!map[key]) map[key]=[];
    map[key].push(w);
  });
  return Object.values(map).filter(list=>list.length>1).map(list=>list.slice().sort((a,b)=>a.dateEscalated.localeCompare(b.dateEscalated)));
}
function findDuplicateDailyStockGroups(records){
  const map = {};
  records.forEach(r=>{
    const key = r.date+'|'+(r.plant||'');
    if(!map[key]) map[key]=[];
    map[key].push(r);

  return Object.values(map).filter(list=>list.length>1).map(list=>list.slice().sort((a,b)=>a.createdAt.localeCompare(b.createdAt)));
}
function findDuplicateOpenBsaGroups(records){
  const map = {};
  records.forEach(r=>{
    if(r.status==='Returned to O&M for Deployment' || r.status==='Scrapped') return;
    const key = (r.bmsId||'').trim().toUpperCase();
    if(!key) return;
    if(!map[key]) map[key]=[];
    map[key].push(r);
  });
  return Object.values(map).filter(list=>list.length>1).map(list=>list.slice().sort((a,b)=>a.dateFlagged.localeCompare(b.dateFlagged)));
}

const root = document.getElementById('root');
let pendingCharts = [];
function loadingLabel(isLoading, label){
  if(!isLoading) return label;
  const wrap = document.createElement('span');
  wrap.style.display='inline-flex'; wrap.style.alignItems='center'; wrap.style.gap='6px';
  const sp = document.createElement('span'); sp.className='spinner';
  wrap.appendChild(sp);
  wrap.appendChild(document.createTextNode(label));
  return wrap;
}
function animateStatNumbers(){
  const nodes = root.querySelectorAll('.stat .n[data-target]');
  nodes.forEach(node=>{
    const target = parseFloat(node.dataset.target);
    if(isNaN(target)) return;
    const isInt = Number.isInteger(target);
    const t0 = performance.now(); const duration = 480;
    function step(t){
      const p = Math.min(1, (t-t0)/duration);
      const eased = 1 - Math.pow(1-p, 3);
      const val = target*eased;
      node.textContent = isInt ? String(Math.round(val)) : val.toFixed(1);
      if(p<1) requestAnimationFrame(step);
      else node.textContent = isInt ? String(target) : target.toFixed(1);
    }
    requestAnimationFrame(step);
  });
}
function render(){
  const active = document.activeElement;
  let focusInfo = null;
  if(active && root.contains(active) && active.dataset && active.dataset.fkey){
    focusInfo = {
      fkey: active.dataset.fkey,
      selStart: (typeof active.selectionStart === 'number') ? active.selectionStart : null,
      selEnd: (typeof active.selectionEnd === 'number') ? active.selectionEnd : null,
    };
  }
  const scrollY = window.scrollY;
  pendingCharts = [];
  root.innerHTML='';
  root.appendChild(View());
  pendingCharts.forEach(({canvas, config})=>{
    try{ if(typeof Chart!=='undefined') new Chart(canvas.getContext('2d'), config); }
    catch(e){ console.error('Chart render error', e); }
  });
  pendingCharts = [];
  animateStatNumbers();
  if(focusInfo){
    const restored = root.querySelector('[data-fkey="'+focusInfo.fkey.replace(/"/g,'')+'"]');
    if(restored){
      restored.focus({preventScroll:true});
      if(focusInfo.selStart!=null && typeof restored.setSelectionRange==='function'){
        try{ restored.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); }catch(e){}
      }
      window.scrollTo(0, scrollY);
    }
  }
}
 
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='disabled'){ if(attrs[k]) e.setAttribute('disabled','true'); }
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  });
  return e;
}
function field(label, inputEl){
  const w = el('div');
  w.appendChild(el('label',{},label));
  w.appendChild(inputEl);
  return w;
}
function textInput(value, onChange, opts={}){
  const i = el('input',{type:opts.type||'text', value: value||''});
  if(opts.mono) i.className = 'mono';
  if(opts.placeholder) i.setAttribute('placeholder', opts.placeholder);
  if(opts.readonly) i.setAttribute('readonly','true');
  if(opts.step) i.setAttribute('step', opts.step);
  if(opts.key) i.dataset.fkey = opts.key;
  i.addEventListener('input', ()=>onChange(i.value));
  if(value!==undefined) i.value = value;
  return i;
}
function textareaInput(value, onChange, opts={}){
  const t = el('textarea',{});
  t.value = value||'';
  if(opts.mono) t.className = (t.className+' mono').trim();
  if(opts.extraClass) t.className = (t.className+' '+opts.extraClass).trim();
  if(opts.key) t.dataset.fkey = opts.key;
  t.addEventListener('input', ()=>onChange(t.value));
  return t;
}
function selectInput(value, options, onChange, opts={}){
  const s = el('select',{});
  if(opts.key) s.dataset.fkey = opts.key;
  options.forEach(([v,l])=>{
    const o = el('option',{value:v}, l);
    if(v===value) o.setAttribute('selected','true');
    s.appendChild(o);
  });
  s.addEventListener('change', ()=>onChange(s.value));
  return s;
}

          if(mode==='omadmin'){STATE.omRecords=await loadOm(); STATE.plantStockRecords=await loadPlantStock(); STATE.warrantyRecords=await loadWarranty(); STATE.view='dashboard';}

          render();
        }catch(e){errBox.textContent=e.message;}
      }); body.appendChild(go);
    }
  }
  modeSel.addEventListener('change',()=>{mode=modeSel.value;renderBody();}); renderBody(); return gate;
}

function NewIntakeCard(){
  const d = STATE.intakeDraft;
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{},'Receive Battery — New Intake'));
  card.appendChild(el('div',{class:'sub'},'Log a battery arriving at Stage 1. Once sent, it moves to the Stage 2 repair docket.'));
 
  if(STATE.serialWarning){
    container_warn(card);
  }
  if(STATE.intakeError){
    card.appendChild(el('div',{class:'banner err'}, '⚠ '+STATE.intakeError));
  }
 
  const g1 = el('div',{class:'grid'});
  g1.appendChild(field('Date Received', textInput(d.dateReceived, v=>d.dateReceived=v, {type:'date'})));
  g1.appendChild(field('Time Received', textInput(d.timeReceived, v=>d.timeReceived=v, {type:'time'})));
 
  const bmsInput = textInput(d.bmsId, v=>{
    d.bmsId=v;
    const detected = detectModelFromBMS(v);
    if(detected) d.model = detected;
  }, {mono:true, placeholder:'Scan BMS Barcode', key:'intake-bmsId'});
  bmsInput.addEventListener('blur', ()=>{
    const clean = d.bmsId.trim();
    STATE.serialWarning = null;
    if(clean){
      const openRec = openRecordForBms(STATE.omRecords, clean);
      if(openRec){
        STATE.serialWarning = `This BMS ID is already in the pipeline (Stage ${openRec.stage}). Use that docket instead of creating a new intake.`;
      } else {
        const closed = closedRecordsForBms(STATE.omRecords, clean);
        if(closed.length>0) STATE.serialWarning = `Notice: BMS ID has ${closed.length} prior closed service visit(s).`;
      }
    }
    render();
  });
  g1.appendChild(field('Scan BMS ID Barcode', bmsInput));
  g1.appendChild(field('Battery Platform', textInput(d.model, v=>d.model=v, {placeholder:'Auto-detected'})));
 
  const imeiRequired = isImeiRequired(d);
  const imeiInput = textInput(d.imei, v=>d.imei=v, {mono:true, placeholder: imeiRequired?'Required':'Optional'});
  if(imeiRequired) imeiInput.style.borderColor='var(--warn)';
  g1.appendChild(field(imeiRequired?'IMEI Number (Mandatory)':'IMEI Number', imeiInput));
 
  const swapRequired = isSwapStationRequired(d);
  const swapInput = textInput(d.site, v=>d.site=v, {placeholder: swapRequired?'Station Required':'Optional'});
  if(swapRequired) swapInput.style.borderColor='var(--warn)';
  g1.appendChild(field(swapRequired?'Swap Station (Mandatory)':'Swap Station', swapInput));
 
  g1.appendChild(field('Received By', textInput(d.receivedBy, v=>d.receivedBy=v)));
  card.appendChild(g1);
 
  card.appendChild(ChecklistCard('Pre-Opening Inspection', d.pre, CHECK_ITEMS, (k,v)=>d.pre[k]=v));
  card.appendChild(IssuesCard(d));
 
  const actions = el('div',{style:'display:flex;justify-content:flex-end;gap:8px;margin-top:8px;align-items:center;'});
  if(STATE.intakeSaving) actions.appendChild(el('span',{class:'sync-line'},'Saving…'));
  const clearBtn = el('button',{disabled: STATE.intakeSaving},'Reset');
  clearBtn.addEventListener('click', ()=>{ STATE.intakeDraft = emptyIntakeDraft(STATE.techName); STATE.serialWarning=null; STATE.intakeError=null; render(); });
  const sendBtn = el('button',{class:'btn-primary', disabled: STATE.intakeSaving}, loadingLabel(STATE.intakeSaving, 'Sending…'));
  if(!STATE.intakeSaving) sendBtn.textContent='Send to Stage 2 Docket';
  sendBtn.addEventListener('click', async ()=>{
    if(STATE.intakeSaving) return; // guard against double-click / double-submit while a write is in flight
    const clean = d.bmsId.trim();
    STATE.intakeError = null;
    STATE.omRecords = await loadOm();
    if(!clean || !d.dateReceived){ STATE.intakeError='BMS ID and intake date are required.'; render(); return; }
    if(isImeiRequired(d) && !d.imei.trim()){ STATE.intakeError='IMEI is required for the selected issue type.'; render(); return; }
    if(isSwapStationRequired(d) && !d.site.trim()){ STATE.intakeError='Swap Station is required for this defect type.'; render(); return; }
    if(openRecordForBms(STATE.omRecords, clean)){ STATE.intakeError='This BMS ID is already open in the pipeline. Use that docket instead of creating a new intake.'; render(); return; }
    const visitNumber = closedRecordsForBms(STATE.omRecords, clean).length + 1;
    const rec = newOmRecord(d, visitNumber, STATE.techName);
    const updated = [...STATE.omRecords, rec];
    STATE.intakeSaving = true; render();
    const ok = await saveOm(updated);
    STATE.intakeSaving = false;
    if(!ok){
      // This is the fix for "the button isn't working": previously a failed write left the
      // tech staring at a form that silently did nothing. Now we surface it, and — critically —
      // we do NOT clear the draft or the intake error, so their entered data isn't lost and
      // they know to retry.
      STATE.intakeError = 'Could not save to the shared record — check your connection and tap Send again. Your entries have not been lost.';
      render();
      return;
    }
    STATE.omRecords = updated;
    STATE.intakeDraft = emptyIntakeDraft(STATE.techName);
    STATE.serialWarning = null;
    STATE.intakeError = null;
    STATE.omLastRefreshed = nowTime();
    toast(`✓ Intake logged — BMS ${rec.bmsId} sent to Stage 2 docket.`);
  });
  actions.appendChild(clearBtn); actions.appendChild(sendBtn);
  card.appendChild(actions);
  return card;
}

function Stage3Card(rec){
  const s3 = rec.stage3;
  const card = el('div',{class:'card'});
  card.appendChild(el('h3',{}, `Final Test & QC — ${rec.bmsId}`));
  card.appendChild(el('div',{class:'sub'}, `${rec.model||'Unknown'} · visit #${rec.visitNumber} · repaired by ${rec.stage2.technician||'—'}`));
 
  card.appendChild(TestsCard(s3));
 
  const disp = el('div',{class:'card'});
  disp.style.padding='0'; disp.style.border='none'; disp.style.background='transparent'; disp.style.marginBottom='0';
  const dispositionSel = selectInput(s3.qcPassed, [['','— Select Disposition —'],['PASS','PASS'],['FAIL','FAIL — Return for Corrective Action'],['SCRAP','SCRAP — Remove from Fleet']], v=>{ s3.qcPassed=v; render(); });
  card.appendChild(field('Final QC Disposition', dispositionSel));
  card.appendChild(field('QC Notes', textareaInput(s3.qcNote, v=>s3.qcNote=v)));
 
  let returnTo = 2;
  if(s3.qcPassed==='FAIL'){
    card.appendChild(field('Return Battery To', selectInput('2', [['2','Stage 2 — Repair Again'],['1','Stage 1 — Re-Inspect First']], v=>returnTo=parseInt(v))));
  }
 
  if(STATE.intakeError){
    card.appendChild(el('div',{class:'banner err'}, '⚠ '+STATE.intakeError));
  }
 
  const actions = el('div',{style:'display:flex;justify-content:flex-end;gap:8px;margin-top:8px;'});
  const finalizeBtn = el('button',{class: (s3.qcPassed==='FAIL' ? 'btn-capa' : 'btn-primary'), disabled: STATE.intakeSaving},
    STATE.intakeSaving ? loadingLabel(true,'Saving…') : (s3.qcPassed==='FAIL' ? 'Return for Corrective Action' : 'Finalize'));
  finalizeBtn.addEventListener('click', async ()=>{
    if(STATE.intakeSaving) return;
    if(!s3.qcPassed){ toast('Select a final QC disposition first.'); return; }
    STATE.intakeError = null;
    s3.technician = STATE.techName;
    s3.completedAt = nowIso();
    const priorQcPassed = s3.qcPassed;
    if(s3.qcPassed==='PASS'){
      rec.status='CLOSED_PASS'; rec.finalDisposition='PASS'; rec.closedAt = nowIso();
    } else if(s3.qcPassed==='SCRAP'){
      rec.status='CLOSED_SCRAPPED'; rec.finalDisposition='SCRAPPED'; rec.closedAt = nowIso();
    } else {
      rec.capaCycles += 1;
      rec.isCorrectiveAction = true;
      rec.capaLog.push({ cycle: rec.capaCycles, returnedAt: nowIso(), returnedBy: STATE.techName, reason: s3.qcNote, toStage: returnTo });
      rec.stage = returnTo;
      rec.status = returnTo===1 ? 'STAGE1_OPEN' : 'STAGE2_OPEN';
      s3.qcPassed = '';
    }
    const fresh = await loadOm();
    const idx = fresh.findIndex(r=>r.id===rec.id);
    if(idx===-1){ STATE.intakeError = 'This record no longer exists in the shared docket — it may have been edited elsewhere. Refreshing.'; STATE.omRecords = fresh; render(); return; }
    fresh[idx] = rec;
    STATE.intakeSaving = true; render();
    const ok = await saveOm(fresh);
    STATE.intakeSaving = false;
    if(!ok){
      // Roll back the in-memory disposition change so the form doesn't silently drift from
      // what's actually saved, and let the tech retry.
      s3.qcPassed = priorQcPassed;
      STATE.intakeError = 'Could not save to the shared record — check your connection and try again.';
      render();
      return;
    }
    STATE.omRecords = fresh;
    STATE.openId = null;
    STATE.omLastRefreshed = nowTime();
    if(rec.status==='CLOSED_PASS') toast(`✓ BMS ${rec.bmsId} passed final QC and is closed out.`);
    else if(rec.status==='CLOSED_SCRAPPED') toast(`✓ BMS ${rec.bmsId} scrapped and removed from the fleet.`);
    else toast(`✓ BMS ${rec.bmsId} returned to Stage ${returnTo} for corrective action (not counted as a new repeat failure).`);
  });
  actions.appendChild(finalizeBtn);
  disp.appendChild(actions);
  card.appendChild(disp);
  return card;
}

  card.appendChild(head);

  g.appendChild(field('Received Qty', textInput(row.receivedQty, v=>{row.receivedQty=v; render();}, {type:'number', mono:true, key:'bulk-'+row.platform+'-recvQty'})));
  g.appendChild(field('Dispatched Qty', textInput(row.dispatchedQty, v=>{row.dispatchedQty=v; render();}, {type:'number', mono:true, key:'bulk-'+row.platform+'-dispQty'})));

  recvWrap.appendChild(el('label',{},'Received OEM IDs — one per line or comma-separated (optional, can add later)'));
  recvWrap.appendChild(textareaInput(row.receivedIds, v=>{row.receivedIds=v; render();}, {mono:true, extraClass:'id-textarea', key:'bulk-'+row.platform+'-recvIds'}));
  const recvNew = parseIdList(row.receivedIds).length;
  const recvExisting = (row._existingReceivedIds||[]).length;
  const recvTarget = parseInt(row.receivedQty)||0;
  const recvTotal = recvNew + recvExisting;
  let recvClass = '';
  if(recvTarget>0 && recvTotal===recvTarget) recvClass='ok';
  else if(recvTarget>0 && recvTotal>recvTarget) recvClass='over';
  recvWrap.appendChild(el('div',{class:'id-count '+recvClass},
    `${recvTotal} / ${recvTarget||'?'} IDs logged` + (recvExisting? ` (${recvExisting} already saved)`:'')));
  idGrid.appendChild(recvWrap);
 
  const dispWrap = el('div');
  dispWrap.appendChild(el('label',{},'Dispatched OEM IDs — one per line or comma-separated (optional, can add later)'));
  dispWrap.appendChild(textareaInput(row.dispatchedIds, v=>{row.dispatchedIds=v; render();}, {mono:true, extraClass:'id-textarea', key:'bulk-'+row.platform+'-dispIds'}));
  const dispNew = parseIdList(row.dispatchedIds).length;

  dispWrap.appendChild(el('div',{class:'id-count '+dispClass},
    `${dispTotal} / ${dispTarget||'?'} IDs logged` + (dispExisting? ` (${dispExisting} already saved)`:'')));

function BulkStockEntryView(){
  const d = STATE.bulkStockDraft;
  const container = el('div');
  container.appendChild(el('div',{class:'sector-tag'},'Plant & Inventory — Bulk OEM Stock Intake / Dispatch'));
 
  const dateCard = el('div',{class:'card'});
  dateCard.appendChild(el('h3',{},'Bulk Stock Entry'));
  dateCard.appendChild(el('div',{class:'sub'},'Enter received and dispatched quantities per platform for one date. OEM battery IDs are optional at first and can be pasted in later — quantities and ID counts are tracked separately so a partial ID list never blocks saving.'));
  const dateRow = el('div',{class:'grid narrow'});
  dateRow.appendChild(field('Date', textInput(d.date, v=>{ d.date=v; loadDraftForDate(); render(); }, {type:'date', key:'bulk-date'})));
  dateRow.appendChild(field('Entered By', textInput(d.enteredBy, v=>d.enteredBy=v, {key:'bulk-enteredBy'})));
  dateCard.appendChild(dateRow);
  if(STATE.bulkStockError){
    dateCard.appendChild(el('div',{class:'banner err'}, '⚠ '+STATE.bulkStockError));
  }
  container.appendChild(dateCard);
 
  d.rows.forEach(row=>{
    container.appendChild(BulkPlatformRowCard(row, d.date));
  });
 
  const actions = el('div',{class:'footer-actions'});
  if(STATE.bulkStockSaving) actions.appendChild(el('span',{class:'sync-line'},'Saving…'));
  const saveBtn = el('button',{class:'btn-primary', disabled: STATE.bulkStockSaving}, STATE.bulkStockSaving ? loadingLabel(true,'Saving…') : ('Save Bulk Entry for '+d.date));
  saveBtn.addEventListener('click', async ()=>{
    if(STATE.bulkStockSaving) return;
    STATE.bulkStockError = null;
    const hasAny = d.rows.some(r=> r.receivedQty!=='' || r.dispatchedQty!=='' || r.receivedIds.trim() || r.dispatchedIds.trim());
    if(!hasAny){ STATE.bulkStockError = 'Enter at least one quantity or ID list before saving.'; render(); return; }
    STATE.plantStockRecords = await loadPlantStock();
    let updated = [...STATE.plantStockRecords];
    let totalSkipped = 0;
    d.rows.forEach(row=>{
      if(row.receivedQty==='' && row.dispatchedQty==='' && !row.receivedIds.trim() && !row.dispatchedIds.trim()) return;
      const existing = findStockRecord(updated, d.date, row.platform);
      const skipSet = allIdsForPlatform(updated, row.platform, existing? existing.id : null);
      const { record: rec, skippedCount } = buildStockRecordFromRow(existing, d.date, row, d.enteredBy||STATE.techName||'', skipSet);
      totalSkipped += skippedCount;
      if(existing){ updated = updated.map(r=> r.id===rec.id ? rec : r); }
      else { updated = [...updated, rec]; }
    });
    STATE.bulkStockSaving = true; render();
    const ok = await savePlantStock(updated);
    STATE.bulkStockSaving = false;
    if(!ok){
      STATE.bulkStockError = 'Could not save to the shared record — check your connection and try again. Your entries have not been lost.';
      render();
      return;
    }
    STATE.plantStockRecords = updated;
    loadDraftForDate();
    toast(`✓ Bulk stock entry saved for ${d.date}.` + (totalSkipped>0 ? ` Skipped ${totalSkipped} duplicate OEM ID(s) already on file.` : ''));
  });
  actions.appendChild(saveBtn);
  container.appendChild(actions);
 
  container.appendChild(StockLedgerPreviewCard(d.date));
  return container;
}

function DataIntegrityView(){
  const container = el('div');
  container.appendChild(el('div',{class:'sector-tag'},'Data Integrity — find and remove duplicate battery numbers across the pipeline'));
 
  if(STATE.omRecords && STATE.omRecords.length>0){
    const omDupGroups = findDuplicateOpenOmGroups(STATE.omRecords);

    card.appendChild(el('h3',{},'Duplicate Open O&M Chain Records'));
    card.appendChild(el('div',{class:'sub'},'Same BMS ID open in the pipeline more than once. Keeping the most recent and removing older duplicate(s) is usually correct.'));
    if(omDupGroups.length===0){ card.appendChild(el('div',{class:'empty-note'},'No duplicates found.')); }
    omDupGroups.forEach(group=>{
      const keep = group[group.length-1];
      const box = el('div',{class:'sop-box'});
      box.appendChild(el('div',{style:'font-weight:700;margin-bottom:6px;'}, group[0].bmsId+' — '+group.length+' open records'));
      group.forEach(r=>{
        const row = el('div',{class:'docket-item'});
        row.appendChild(el('div',{},[
          el('div',{}, `Stage ${r.stage} · ${r.status} · visit #${r.visitNumber}`),
          el('div',{class:'meta'}, `Created ${r.createdAt.slice(0,16).replace('T',' ')}` + (r.id===keep.id ? ' — kept (most recent)' : ''))
        ]));
        if(r.id!==keep.id){
          const rmBtn = el('button',{class:'btn-danger btn-sm', disabled:STATE.integrityBusy}, 'Remove this duplicate');
          rmBtn.addEventListener('click', async ()=>{
            STATE.integrityBusy = true; render();
            const fresh = await loadOm();
            const updated = fresh.filter(x=>x.id!==r.id);
            const ok = await saveOm(updated);
            STATE.integrityBusy = false;
            if(!ok){ toast('⚠ Could not remove — try again.'); render(); return; }
            STATE.omRecords = updated;
            toast(`Removed duplicate record for ${r.bmsId}.`);
          });
          row.appendChild(rmBtn);
        }
        box.appendChild(row);
      });
      card.appendChild(box);
    });
    container.appendChild(card);
  }
 
  if(STATE.plantStockRecords){
    const oemDups = findDuplicateOemIdOccurrences(STATE.plantStockRecords);
    const card = el('div',{class:'card'});
    card.appendChild(el('h3',{},'Duplicate OEM Battery IDs in the Stock Ledger'));
    card.appendChild(el('div',{class:'sub'},'The same OEM ID logged as received or dispatched on more than one date for the same platform. Keeping the earliest date and removing later duplicate(s) keeps totals accurate.'));
    if(oemDups.length===0){ card.appendChild(el('div',{class:'empty-note'},'No duplicate OEM IDs found.')); }
    oemDups.forEach(dup=>{
      const meta = PLATFORM_META[dup.platform];
      const box = el('div',{class:'sop-box'});
      box.appendChild(el('div',{style:'font-weight:700;margin-bottom:6px;'}, `${meta.emoji} ${meta.label} · ${dup.direction==='received'?'Received':'Dispatched'} · ${dup.id}`));
      dup.occurrences.forEach((occ,idx)=>{
        const row = el('div',{class:'docket-item'});
        row.appendChild(el('div',{}, occ.date + (idx===0 ? ' — kept (earliest)' : '')));
        if(idx>0){
          const rmBtn = el('button',{class:'btn-danger btn-sm', disabled:STATE.integrityBusy}, 'Remove this duplicate');
          rmBtn.addEventListener('click', async ()=>{
            STATE.integrityBusy = true; render();
            const fresh = await loadPlantStock();
            const updated = fresh.map(r=>{
              if(r.id!==occ.recordId) return r;
              const key = dup.direction==='received' ? 'receivedIds' : 'dispatchedIds';
              return { ...r, [key]: (r[key]||[]).filter(x=>x!==dup.id) };
            });
            const ok = await savePlantStock(updated);
            STATE.integrityBusy = false;
            if(!ok){ toast('⚠ Could not remove — try again.'); render(); return; }
            STATE.plantStockRecords = updated;
            toast(`Removed duplicate ${dup.id} from ${occ.date}.`);
          });
          row.appendChild(rmBtn);
        }
        box.appendChild(row);
      });
      card.appendChild(box);
    });
    container.appendChild(card);
  }
 
  if(STATE.warrantyRecords){

    card.appendChild(el('h3',{},'Duplicate Active Warranty Escalations'));
    card.appendChild(el('div',{class:'sub'},'Same BMS ID escalated to warranty more than once while still active. Keeping the earliest escalation and removing later duplicate(s) is usually correct.'));
    if(wDups.length===0){ card.appendChild(el('div',{class:'empty-note'},'No duplicates found.')); }
    wDups.forEach(group=>{
      const keep = group[0];
      const box = el('div',{class:'sop-box'});
      box.appendChild(el('div',{style:'font-weight:700;margin-bottom:6px;'}, group[0].bmsId+' — '+group.length+' active escalations'));

        const row = el('div',{class:'docket-item'});
        row.appendChild(el('div',{},[
          el('div',{}, `${w.failureCategory} · ${w.status}`),
          el('div',{class:'meta'}, `Escalated ${w.dateEscalated}` + (w.id===keep.id ? ' — kept (earliest)' : ''))
        ]));
        if(w.id!==keep.id){
          const rmBtn = el('button',{class:'btn-danger btn-sm', disabled:STATE.integrityBusy}, 'Remove this duplicate');
          rmBtn.addEventListener('click', async ()=>{
            STATE.integrityBusy = true; render();
            const fresh = await loadWarranty();
            const updated = fresh.filter(x=>x.id!==w.id);
            const ok = await saveWarranty(updated);
            STATE.integrityBusy = false;
            if(!ok){ toast('⚠ Could not remove — try again.'); render(); return; }
            STATE.warrantyRecords = updated;
            toast(`Removed duplicate escalation for ${w.bmsId}.`);
          });
          row.appendChild(rmBtn);
        }
        box.appendChild(row);
      });
      card.appendChild(box);
    });
    container.appendChild(card);
  }
 
  return container;
}

/* ==================== QUALITY ANALYTICS — FPY charts, inventory charts, Excel export ==================== */
 
function monthKey(dateStr){ return (dateStr||'').slice(0,7); }
function cssVar(name){ return (getComputedStyle(document.documentElement).getPropertyValue(name)||'').trim() || '#888'; }
 
function fpyStats(){
  const closed = STATE.omRecords.filter(r=>r.status.startsWith('CLOSED'));
  const total = closed.length;
  const firstPass = closed.filter(r=>r.capaCycles===0 && r.finalDisposition==='PASS').length;
  const overallFPY = total>0 ? (firstPass/total*100) : 0;
  const byPlatform = {};
  closed.forEach(r=>{
    const p = r.model || 'Unknown';
    if(!byPlatform[p]) byPlatform[p] = {total:0, firstPass:0};
    byPlatform[p].total++;
    if(r.capaCycles===0 && r.finalDisposition==='PASS') byPlatform[p].firstPass++;
  });
  const byMonth = {};
  closed.forEach(r=>{
    const mk = monthKey(r.closedAt ? r.closedAt.slice(0,10) : r.dateReceived);
    if(!byMonth[mk]) byMonth[mk] = {total:0, firstPass:0};
    byMonth[mk].total++;
    if(r.capaCycles===0 && r.finalDisposition==='PASS') byMonth[mk].firstPass++;
  });
  return { overallFPY, total, firstPass, byPlatform, byMonth };
}
 
/* ---- Chart.js config builders (theme-aware colors pulled from CSS vars) ---- */
function chartBaseOptions(opts={}){
  const textColor = cssVar('--muted');
  const gridColor = cssVar('--line');
  return {
    responsive:true, maintainAspectRatio:false,
    animation: { duration: 500, easing: 'easeOutCubic' },
    plugins:{ legend:{ display: !!opts.legend, position:'bottom', labels:{color:textColor, font:{size:11}, boxWidth:12} } },
    scales: opts.noScales ? {} : {
      x:{ ticks:{color:textColor, font:{size:10}}, grid:{color:gridColor} },
      y:{ ticks:{color:textColor, font:{size:10}, callback: v=> (opts.suffix ? v+opts.suffix : v)}, grid:{color:gridColor}, suggestedMax: opts.suggestedMax, beginAtZero:true }
    }
  };
}
function baseBarConfig(labels, datasets, opts={}){
  return { type:'bar', data:{ labels, datasets: datasets.map(d=>({ label:d.label, data:d.data, backgroundColor:d.color, borderRadius:3, maxBarThickness:46 })) }, options: chartBaseOptions({...opts, legend: datasets.length>1}) };
}
function baseLineConfig(labels, datasets, opts={}){
  return { type:'line', data:{ labels, datasets: datasets.map(d=>({ label:d.label, data:d.data, borderColor:d.color, backgroundColor:d.color, tension:0.3, fill:false, pointRadius:3 })) }, options: chartBaseOptions({...opts, legend: datasets.length>1}) };
}
function chartCard(title, config){
  const card = el('div',{class:'chart-card'});
  card.appendChild(el('h3',{},title));
  const wrap = el('div',{class:'chart-wrap'});
  const canvas = el('canvas');
  wrap.appendChild(canvas);
  card.appendChild(wrap);
  pendingCharts.push({canvas, config});
  return card;
}
 
function fpyTrendConfig(fpy){
  const months = Object.keys(fpy.byMonth).sort();
  const data = months.map(m=> fpy.byMonth[m].total ? (fpy.byMonth[m].firstPass/fpy.byMonth[m].total*100) : 0);
  if(months.length===0) return baseLineConfig(['No data'], [{label:'FPY %', data:[0], color:cssVar('--pass')}], {suggestedMax:100, suffix:'%'});
  return baseLineConfig(months, [{ label:'FPY %', data, color: cssVar('--pass') }], {suggestedMax:100, suffix:'%'});
}
function fpyByPlatformConfig(fpy){
  const platforms = Object.keys(fpy.byPlatform);
  if(platforms.length===0) return baseBarConfig(['No data'], [{label:'FPY %', data:[0], color:cssVar('--accent')}], {suggestedMax:100, suffix:'%'});
  const data = platforms.map(p=>{ const s=fpy.byPlatform[p]; return s.total? (s.firstPass/s.total*100):0; });
  return baseBarConfig(platforms, [{label:'FPY %', data, color: cssVar('--accent')}], {suggestedMax:100, suffix:'%'});
}
function dispositionConfig(){
  const closed = STATE.omRecords.filter(r=>r.status.startsWith('CLOSED'));
  const passed = closed.filter(r=>r.finalDisposition==='PASS').length;
  const scrapped = closed.filter(r=>r.finalDisposition==='SCRAPPED').length;
  return {
    type:'doughnut',
    data:{ labels:['Passed','Scrapped'], datasets:[{ data:[passed,scrapped], backgroundColor:[cssVar('--pass'), cssVar('--fail')] }] },
    options: chartBaseOptions({legend:true, noScales:true})
  };
}
function capaDistributionConfig(){
  const buckets = {'0 (First Pass)':0,'1':0,'2':0,'3+':0};
  STATE.omRecords.forEach(r=>{
    const c = r.capaCycles;
    if(c<=0) buckets['0 (First Pass)']++;
    else if(c===1) buckets['1']++;
    else if(c===2) buckets['2']++;
    else buckets['3+']++;
  });
  return baseBarConfig(Object.keys(buckets), [{label:'Packs', data:Object.values(buckets), color: cssVar('--capa')}], {});
}
function stockByPlatformConfig(){
  const stock = stockByPlatform();
  return baseBarConfig(PLATFORMS, [{label:'Units in Stock', data: PLATFORMS.map(p=>stock[p]), color: cssVar('--accent')}], {});
}
function movementsByMonthConfig(){
  const months = new Set();
  const inByMonth = {}, outByMonth = {};
  STATE.newBatteryRecords.forEach(r=>{ const m=monthKey(r.date); months.add(m); inByMonth[m]=(inByMonth[m]||0)+(r.quantity||0); });
  STATE.adjustments.forEach(r=>{
    const m=monthKey(r.date); months.add(m);
    const dir=movementDirection(r.type);
    if(dir>0) inByMonth[m]=(inByMonth[m]||0)+(r.quantity||0);
    else outByMonth[m]=(outByMonth[m]||0)+(r.quantity||0);
  });
  const sortedMonths = [...months].sort();
  if(sortedMonths.length===0) return baseBarConfig(['No data'], [{label:'Stock In', data:[0], color:cssVar('--pass')}], {});
  return baseBarConfig(sortedMonths, [
    {label:'Stock In', data: sortedMonths.map(m=>inByMonth[m]||0), color: cssVar('--pass')},
    {label:'Stock Out', data: sortedMonths.map(m=>outByMonth[m]||0), color: cssVar('--fail')},
  ], {});
}
function warrantyByCategoryConfig(){
  const counts = {};
  STATE.warrantyRecords.forEach(w=>{ counts[w.failureCategory]=(counts[w.failureCategory]||0)+1; });
  const labels = Object.keys(counts);
  if(labels.length===0) return baseBarConfig(['No data'], [{label:'Escalations', data:[0], color:cssVar('--warn')}], {});
  return baseBarConfig(labels, [{label:'Escalations', data:labels.map(l=>counts[l]), color: cssVar('--warn')}], {});
}
function warrantyByStatusConfig(){
  const counts = {};
  STATE.warrantyRecords.forEach(w=>{ counts[w.status]=(counts[w.status]||0)+1; });
  const labels = Object.keys(counts);
  const palette = [cssVar('--warn'), cssVar('--capa'), cssVar('--fail'), cssVar('--pass')];
  if(labels.length===0) return { type:'pie', data:{labels:['No data'], datasets:[{data:[1], backgroundColor:[cssVar('--line-dark')]}]}, options: chartBaseOptions({legend:true, noScales:true}) };
  return { type:'pie', data:{ labels, datasets:[{ data: labels.map(l=>counts[l]), backgroundColor: labels.map((_,i)=>palette[i%palette.length]) }] }, options: chartBaseOptions({legend:true, noScales:true}) };
}
function stockLedgerTrendConfig(){
  const ledger = computeStockLedger(STATE.plantStockRecords);
  if(ledger.length===0) return baseLineConfig(['No data'], [{label:'Closing Stock', data:[0], color:cssVar('--accent')}], {});
  const labels = ledger.map(e=>e.date);
  return baseLineConfig(labels, [{label:'Total Closing Stock', data: ledger.map(e=>e.totals.closing), color: cssVar('--accent')}], {});
}

/* ---- Excel export (SheetJS) ---- */
function rowsOrEmpty(rows){ return rows.length ? rows : [{ Note: 'No data recorded yet' }]; }
 
function buildOmExportRows(){
  return rowsOrEmpty(STATE.omRecords.map(r=>({
    'BMS ID': r.bmsId, 'Platform': r.model||'', 'IMEI': r.imei||'', 'Swap Station': r.site||'',
    'Date Received': r.dateReceived, 'Time Received': r.timeReceived, 'Visit #': r.visitNumber,
    'Current Stage': r.stage, 'Status': r.status, 'CAPA Cycles': r.capaCycles,
    'Stage1 Technician': r.stage1.technician||'', 'Stage1 Received By': r.stage1.receivedBy||'', 'Stage1 Completed At': r.stage1.completedAt||'',
    'Stage2 Technician': r.stage2.technician||'', 'Stage2 SOP': r.stage2.sopRef||'', 'Stage2 Parts Replaced': r.stage2.partsReplaced||'', 'Stage2 Repair Notes': r.stage2.repairAction||'', 'Stage2 Completed At': r.stage2.completedAt||'',
    'Stage3 Technician': r.stage3.technician||'', 'Pack Voltage (V)': r.stage3.tests.packVoltage||'', 'Min Cell (V)': r.stage3.tests.minCell||'', 'Max Cell (V)': r.stage3.tests.maxCell||'',
    'IR Measured (MΩ)': r.stage3.tests.irMeasured||'', 'IR Threshold (MΩ)': r.stage3.tests.irThreshold||'',
    'QC Disposition': r.finalDisposition||'', 'QC Notes': r.stage3.qcNote||'', 'Closed At': r.closedAt||'',
  })));
}
function buildPlantExportRows(){
  return rowsOrEmpty(STATE.plantRecords.map(r=>({
    'Date': r.date, 'Active Batteries': r.activeBatteries||0, 'Charged Today': r.chargedToday||0,
    'Unboxed Today': r.unboxedToday||0, 'Faulty Flagged': r.faultyBatteries||0, 'Notes': r.notes||'', 'Entered By': r.enteredBy||''
  })));
}
function buildStockLedgerExportRows(){
  const ledger = computeStockLedger(STATE.plantStockRecords);
  const rows = [];
  ledger.forEach(entry=>{
    entry.rows.forEach(r=>{
      rows.push({ Date: entry.date, Platform: r.platform, 'Opening Stock': r.opening, 'Stock Inwards': r.received, 'Stock Outwards': r.dispatched, 'Closing Stock': r.closing });
    });
    rows.push({ Date: entry.date, Platform: 'TOTAL', 'Opening Stock': entry.totals.opening, 'Stock Inwards': entry.totals.received, 'Stock Outwards': entry.totals.dispatched, 'Closing Stock': entry.totals.closing });
  });
  return rowsOrEmpty(rows);
}
function buildOemIdLogExportRows(){
  const rows = [];
  STATE.plantStockRecords.forEach(r=>{
    (r.receivedIds||[]).forEach(oid=> rows.push({ Date:r.date, Platform:r.platform, Direction:'RECEIVED', 'OEM Battery ID': oid, 'Entered By': r.enteredBy||'' }));
    (r.dispatchedIds||[]).forEach(oid=> rows.push({ Date:r.date, Platform:r.platform, Direction:'DISPATCHED', 'OEM Battery ID': oid, 'Entered By': r.enteredBy||'' }));
  });
  return rowsOrEmpty(rows);
}
function buildNewBatteryExportRows(){
  return rowsOrEmpty(STATE.newBatteryRecords.map(r=>({
    'Date': r.date, 'Platform': r.platform, 'Quantity': r.quantity, 'Batch/Lot': r.batchLot||'',
    'Source': r.source||'', 'Notes': r.notes||'', 'Logged By': r.loggedBy||''
  })));
}
function buildAdjustmentExportRows(){
  return rowsOrEmpty(STATE.adjustments.map(r=>({
    'Date': r.date, 'Platform': r.platform, 'Movement Type': movementLabel(r.type), 'Quantity': r.quantity,
    'Direction': movementDirection(r.type)>0?'IN':'OUT', 'Reference': r.reference||'', 'Notes': r.notes||'', 'Logged By': r.loggedBy||''
  })));
}
function buildWarrantyExportRows(){
  return rowsOrEmpty(STATE.warrantyRecords.map(r=>({
    'Date Escalated': r.dateEscalated, 'BMS ID': r.bmsId, 'Platform': r.model||'', 'Failure Category': r.failureCategory,
    'Status': r.status, 'Comments': r.comments||''
  })));
}
function buildStockSummaryRows(){
  const stock = stockByPlatform();
  return rowsOrEmpty(Object.keys(stock).map(p=>({ Platform:p, 'Current Stock': stock[p] })));
}
function buildFpyExportRows(fpy){
  return [{ 'Overall FPY %': fpy.overallFPY.toFixed(1), 'Total Closed Packs': fpy.total, 'First-Pass Closures': fpy.firstPass }];
}
function buildFpyByPlatformRows(fpy){
  return rowsOrEmpty(Object.keys(fpy.byPlatform).map(p=>{
    const s = fpy.byPlatform[p];
    return { Platform:p, 'Total Closed': s.total, 'First-Pass': s.firstPass, 'FPY %': s.total ? (s.firstPass/s.total*100).toFixed(1) : '0.0' };
  }));
}
function buildFpyByMonthRows(fpy){
  return rowsOrEmpty(Object.keys(fpy.byMonth).sort().map(m=>{
    const s = fpy.byMonth[m];
    return { Month:m, 'Total Closed': s.total, 'First-Pass': s.firstPass, 'FPY %': s.total ? (s.firstPass/s.total*100).toFixed(1) : '0.0' };
  }));
}
 
async function exportAllDataToExcel(){
  if(typeof XLSX === 'undefined'){ toast('Excel library failed to load — check your connection and try again.'); return; }
  STATE.exportingExcel = true; render();
  STATE.omRecords = await loadOm();
  STATE.plantRecords = await loadPlant();
  STATE.plantStockRecords = await loadPlantStock();
  STATE.newBatteryRecords = await loadNewBattery();
  STATE.adjustments = await loadAdjustments();
  STATE.warrantyRecords = await loadWarranty();
 
  const fpy = fpyStats();
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildOmExportRows()), 'OM Chain Records');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildPlantExportRows()), 'Plant Logs');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildStockLedgerExportRows()), 'Stock Ledger');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildOemIdLogExportRows()), 'OEM ID Log');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildNewBatteryExportRows()), 'New Battery Intake');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildAdjustmentExportRows()), 'Stock Movements');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildStockSummaryRows()), 'Stock Summary');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildWarrantyExportRows()), 'Warranty Escalations');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildFpyExportRows(fpy)), 'FPY Overall');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildFpyByPlatformRows(fpy)), 'FPY by Platform');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildFpyByMonthRows(fpy)), 'FPY by Month');
 
  const filename = `battery-qc-report-${todayStr()}.xlsx`;
  XLSX.writeFile(wb, filename);
  STATE.exportingExcel = false;
  toast('Excel report downloaded: '+filename);
}
 
/* ---------- Live docket refresh ----------
   Polls the shared store in the background and re-renders the docket list so a battery sent
   from Stage 1 appears for a Stage 2 technician without them having to sign out and back in.
   Skips refreshing while the user is actively typing so it never yanks focus mid-entry. */
function userIsTypingInForm(){
  const active = document.activeElement;
  if(!active || !root.contains(active)) return false;
  const tag = active.tagName;
  return tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT';
}
async function autoRefreshDocket(){
  try{
    if(userIsTypingInForm()) return;
    if(STATE.role==='omtech' && STATE.openId===null && STATE.view==='main'){
      STATE.omRecords = await loadOm();
      STATE.omLastRefreshed = nowTime();
      STATE.omSyncOk = true;
      render();
    } else if(STATE.role==='omadmin' && (STATE.view==='dashboard' || STATE.view==='history')){
      STATE.omRecords = await loadOm();
      STATE.omLastRefreshed = nowTime();
      STATE.omSyncOk = true;
      render();
    }
  }catch(e){
    console.error('Auto-refresh failed', e);
    STATE.omSyncOk = false;
  }
}
setInterval(autoRefreshDocket, 4000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !userIsTypingInForm()) autoRefreshDocket(); });
 
/* ---------- Boot ---------- */
function removeBootLoader(){
  const l = document.getElementById('boot-loader');
  if(l) l.remove();
}
async function restoreSession(){
  try{
    const s=await apiFetch('/api/auth/me');
    if(!s.authenticated){ render(); removeBootLoader(); return; }
    STATE.role=s.user.role; STATE.stage=s.user.stage||null; STATE.techName=s.user.name||'';
    if(STATE.role==='omtech'){STATE.view='main';STATE.omRecords=await loadOm();STATE.intakeDraft=emptyIntakeDraft(STATE.techName);}
    else if(STATE.role==='omadmin'){STATE.view='dashboard';STATE.omRecords=await loadOm(); STATE.plantStockRecords=await loadPlantStock(); STATE.warrantyRecords=await loadWarranty();}
    else if(STATE.role==='plant' || STATE.role==='inventory'){ STATE.view='bulk'; await loadPlantInventorySector(); }
    else if(STATE.role==='quality'){STATE.view='warranty';STATE.warrantyRecords=await loadWarranty();STATE.warrantyDraft=emptyWarrantyDraft();STATE.omRecords=await loadOm();STATE.plantRecords=await loadPlant();STATE.plantStockRecords=await loadPlantStock();STATE.newBatteryRecords=await loadNewBattery();STATE.adjustments=await loadAdjustments();}
    render();
    removeBootLoader();
  }catch(e){ console.error(e); render(); removeBootLoader(); }
}
 
restoreSession();
